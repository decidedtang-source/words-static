参考</a></div></main></div><script>
const cards=[{"w":{"id":"V20261012-001","date":"2026-10-12","term":"scope","ipa":"skoʊp","pos":"n.","meaning":"项目包含和不包含的工作范围","chunk":"define the scope","example":"We need to define the scope before estimating the cost.","level":"核心","gloss":"范围","explanation":"项目包含和不包含的工作范围","examples":[{"en":"We need to define the scope before estimating the cost.","zh":"估算成本前，我们需要界定范围。"},{"en":"The scope excludes staff training.","zh":"范围不包括员工培训。"}]},"a":{"context":{"text":"We need to define the scope before estimating the cost.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想成给项目画边界：框里要做、框外暂不做。这是记忆类比。读到 define the scope，就联系会议里先列清交付项和排除项；否则同一份报价，双方可能想的是两套工作。","sourceIds":["lexical","method"],"sources":[["SCOPE — Collins English Dictionary","https://www.collinsdictionary.com/dictionary/english/scope"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g2","title":"句法与概念","text":"define 的宾语是 the scope，before estimating the cost 表示先后次序，省略的估算者仍是 we。本句把界定范围设为估价前的步骤；并没有说范围从此永久不能调整。","sourceIds":["lexical"],"sources":[["SCOPE — Collins English Dictionary","https://www.collinsdictionary.com/dictionary/english/scope"]]},{"id":"g3","title":"辨析与英文邻居","text":"scope 关注包含哪些工作；objective 关注要达到什么目的。做一份测试报告可以在范围内，降低返工率则可能是目标。常用 in scope / out of scope，分别指出边界内外。","sourceIds":["lexical","method"],"sources":[["SCOPE — Collins English Dictionary","https://www.collinsdictionary.com/dictionary/english/scope"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g4","title":"这句话在做什么","text":"报价讨论若先卡在数字上，本句把下一步拉回工作边界，用 need 表明必要性。自编回应：Does the scope include training?（范围包括培训吗？）先澄清这一项，再估算对应工时。","sourceIds":["lexical","method","communication"],"sources":[["SCOPE — Collins English Dictionary","https://www.collinsdictionary.com/dictionary/english/scope"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Could we confirm what is out of scope?（我们能确认哪些工作不在范围内吗？）需求说明已有清单、但排除项不清时使用；比笼统要求把范围写清楚更容易得到具体答复。","sourceIds":["lexical","method","communication"],"sources":[["SCOPE — Collins English Dictionary","https://www.collinsdictionary.com/dictionary/english/scope"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"范围","focused":[{"entry":{"lemma":"scope","pos":"n.","senses":[{"id":"trial:V20261012-001:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-001:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project"}}],"allEntries":[{"lemma":"scope","pos":"n.","senses":[{"id":"trial:V20261012-001:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project"}],"source":"来源支持的教学转述"}],"contextTakeaway":"先说清做哪些工作，再估算费用。"},"x":{"short":"范围","cue":"当前用法","b":"这里的 scope 指项目包含和不包含的工作范围。","quote":"","source":"释义为原创教学转述，依据 HarperCollins；来源见下方五区。","url":"https://www.collinsdictionary.com/dictionary/english/scope","c":[]}},{"w":{"id":"V20261012-002","date":"2026-10-12","term":"objective","ipa":"əbˈdʒek.tɪv","pos":"n.","meaning":"希望达成的具体目标","chunk":"a clear objective","example":"Our objective is to reduce the time spent on approvals.","level":"核心","gloss":"目标","explanation":"希望达成的具体目标","examples":[{"en":"Our objective is to reduce the time spent on approvals.","zh":"我们的目标是减少审批所用的时间。"},{"en":"Each phase has a measurable objective.","zh":"每个阶段都有可衡量的目标。"}]},"a":{"context":{"text":"Our objective is to reduce the time spent on approvals.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可把 objective 记成工作完成后希望看到的变化，不只是今天做的动作。发出一份表单是行动，减少等待审批的时间才是本句目标。这个联系帮助你从任务清单回到做事的目的。","sourceIds":["lexical"],"sources":[["OBJECTIVE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/objective"]]},{"id":"g2","title":"句法与概念","text":"Our objective 是主语，is 后的 to reduce 说明目标内容。the time spent on approvals 中 spent 修饰 time，意思是花在审批上的时间；不是缩短批准的有效期，也不是减少审批人数。","sourceIds":["lexical"],"sources":[["OBJECTIVE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/objective"]]},{"id":"g3","title":"辨析与英文邻居","text":"objective 与 goal 都可以表示目标，前者常见于较正式的工作计划，不必硬分为永远具体与永远宽泛。deliverable 则是交出的成果；表单可以交付，审批效率的改善需要另行观察。","sourceIds":["lexical"],"sources":[["OBJECTIVE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/objective"]]},{"id":"g4","title":"这句话在做什么","text":"本句在给改进讨论定方向：评估方案时，要看它能否减少审批耗时。自编回应：How will we measure that time?（我们如何测量这段时间？）把方向接成可核实指标，而非立刻承诺某个降幅。","sourceIds":["lexical","method"],"sources":[["OBJECTIVE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/objective"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Our objective is to cut the review time by one day.（我们的目标是把评审时间缩短一天。）适合已有测量口径、正在讨论改进目标时；一天是示例目标，不能读成已经实现的结果。","sourceIds":["lexical","method"],"sources":[["OBJECTIVE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/objective"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"目标","focused":[{"entry":{"lemma":"objective","pos":"n.","senses":[{"id":"trial:V20261012-002:current","glossZh":"希望达成的具体目标","definitionEn":"a result that you want to achieve"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-002:current","glossZh":"希望达成的具体目标","definitionEn":"a result that you want to achieve"}}],"allEntries":[{"lemma":"objective","pos":"n.","senses":[{"id":"trial:V20261012-002:current","glossZh":"希望达成的具体目标","definitionEn":"a result that you want to achieve"}],"source":"来源支持的教学转述"}],"contextTakeaway":"目标是减少审批耗时。"},"x":{"short":"目标","cue":"当前用法","b":"这里的 objective 指希望达成的具体目标。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/objective","c":[]}},{"w":{"id":"V20261012-003","date":"2026-10-12","term":"deliverable","ipa":"dɪˈlɪv.ɚ.ə.bəl","pos":"n.","meaning":"项目需要交付的成果或文件","chunk":"agree on the deliverables","example":"Please list the deliverables for the first phase.","level":"提升","gloss":"交付成果","explanation":"项目需要交付的成果或文件","examples":[{"en":"Please list the deliverables for the first phase.","zh":"请列出第一阶段的交付成果。"},{"en":"The final deliverable is a test report.","zh":"最终交付成果是一份测试报告。"}]},"a":{"context":{"text":"Please list the deliverables for the first phase.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住“交得出、能检查”的成果，而不是只记做过多少事。开三次会通常是活动，交出会议决定形成的方案才可能是 deliverable；具体交什么，还得看项目约定，未必都是纸质文件。","sourceIds":["lexical","method"],"sources":[["DELIVERABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/deliverable"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g2","title":"句法与概念","text":"Please list 是请对方列清单，deliverables 用复数，说明可能不止一项；for the first phase 把清单限定为第一阶段。句子要求说清成果，不是要求今天把第一阶段所有工作都做完。","sourceIds":["lexical"],"sources":[["DELIVERABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/deliverable"]]},{"id":"g3","title":"辨析与英文邻居","text":"deliverable 是交付的东西或成果；task 是为了产生成果而做的任务。撰写、检查、修改是任务，完成的报告是成果。与 milestone 相比，前者回答交什么，后者强调进度上的重要节点。","sourceIds":["lexical","method"],"sources":[["DELIVERABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/deliverable"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g4","title":"这句话在做什么","text":"如果大家只说“第一阶段推进中”，本句要求拿出可核对的成果清单。自编回应：The first deliverable is a draft report.（第一项交付成果是报告初稿。）随后可确认版本、接收者和验收要求。","sourceIds":["lexical","method","communication"],"sources":[["DELIVERABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/deliverable"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Can we agree on the deliverables for this phase?（我们能商定这一阶段的交付成果吗？）适合分工前确认要交什么；agree on 邀请共同确定，不能把提议当作已经获得对方验收。","sourceIds":["lexical","method","communication"],"sources":[["DELIVERABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/deliverable"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"交付成果","focused":[{"entry":{"lemma":"deliverable","pos":"n.","senses":[{"id":"trial:V20261012-003:current","glossZh":"项目需要交付的成果或文件","definitionEn":"an agreed result that a project must provide"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-003:current","glossZh":"项目需要交付的成果或文件","definitionEn":"an agreed result that a project must provide"}}],"allEntries":[{"lemma":"deliverable","pos":"n.","senses":[{"id":"trial:V20261012-003:current","glossZh":"项目需要交付的成果或文件","definitionEn":"an agreed result that a project must provide"}],"source":"来源支持的教学转述"}],"contextTakeaway":"列的是第一阶段要交出的成果。"},"x":{"short":"交付成果","cue":"当前用法","b":"这里的 deliverable 指项目需要交付的成果或文件。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/deliverable","c":[]}},{"w":{"id":"V20261012-004","date":"2026-10-12","term":"milestone","ipa":"ˈmaɪl.stoʊn","pos":"n.","meaning":"标志阶段成果达成的重要节点","chunk":"reach a milestone","example":"We reached the first milestone after the review.","level":"核心","gloss":"里程碑","explanation":"标志阶段成果达成的重要节点","examples":[{"en":"We reached the first milestone after the review.","zh":"评审后，我们达成了第一个里程碑。"},{"en":"The pilot launch is our next milestone.","zh":"试点启动是我们的下一个里程碑。"}]},"a":{"context":{"text":"We reached the first milestone after the review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可以用旅程中的路标帮助记忆：它告诉你走到哪里，而不是替你完成路程。这是类比。本句的 first milestone 表示第一个重要节点，记住 reach a milestone 这个搭配即可。","sourceIds":["lexical","method"],"sources":[["MILESTONE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/milestone"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g2","title":"句法与概念","text":"reached 是过去式，表示说话者报告节点已达成；after the review 说明时间在评审之后。仅凭 after 不能断言评审本身就是节点，也不能推断评审已批准整项项目。","sourceIds":["lexical"],"sources":[["MILESTONE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/milestone"]]},{"id":"g3","title":"辨析与英文邻居","text":"milestone 看阶段进展，deadline 看最晚完成时间。某个节点可以有自己的截止日，但两者不是同一件事。deliverable 是应交成果，节点则可用成果被接受等事件来定义，须按实际计划判断。","sourceIds":["lexical","method"],"sources":[["MILESTONE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/milestone"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g4","title":"这句话在做什么","text":"本句用于进度汇报，把状态从尚在推进更新为首个节点已到达。自编回应：What is the next milestone?（下一个里程碑是什么？）讨论于是从确认当前进展转向下一段，而非默认整个项目完工。","sourceIds":["lexical","method","communication"],"sources":[["MILESTONE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/milestone"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：We expect to reach the next milestone in June.（我们预计六月达成下一个里程碑。）适合汇报预测；expect 保留了估计性质，应再说明具体节点是什么，避免只用月份代替完成标准。","sourceIds":["lexical","method","communication"],"sources":[["MILESTONE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/milestone"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"里程碑","focused":[{"entry":{"lemma":"milestone","pos":"n.","senses":[{"id":"trial:V20261012-004:current","glossZh":"标志阶段成果达成的重要节点","definitionEn":"an important point that shows progress in a project"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-004:current","glossZh":"标志阶段成果达成的重要节点","definitionEn":"an important point that shows progress in a project"}}],"allEntries":[{"lemma":"milestone","pos":"n.","senses":[{"id":"trial:V20261012-004:current","glossZh":"标志阶段成果达成的重要节点","definitionEn":"an important point that shows progress in a project"}],"source":"来源支持的教学转述"}],"contextTakeaway":"首个重要进度节点已经达成。"},"x":{"short":"里程碑","cue":"当前用法","b":"这里的 milestone 指标志阶段成果达成的重要节点。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/milestone","c":[]}},{"w":{"id":"V20261012-005","date":"2026-10-12","term":"priority","ipa":"praɪˈɔːr.ə.t̬i","pos":"n.","meaning":"需要优先处理的事项或优先程度","chunk":"set priorities","example":"We need to set priorities for the remaining work.","level":"核心","gloss":"优先事项；优先级","explanation":"需要优先处理的事项或优先程度","examples":[{"en":"We need to set priorities for the remaining work.","zh":"我们需要为剩余工作设定优先级。"},{"en":"Safety remains our top priority.","zh":"安全仍是我们的首要任务。"}]},"a":{"context":{"text":"We need to set priorities for the remaining work.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 priority 和排队联系起来：时间有限时，哪些事先得到注意和资源？这个记忆画面强调取舍。本句不是说剩余工作都不重要，而是要把先处理什么讲清楚，避免所有事都同时排第一。","sourceIds":["lexical","method"],"sources":[["PRIORITY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/priority"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"set priorities 中 priorities 是复数，指为多项工作确定优先安排；for the remaining work 限定比较对象。We need to 提出当前需要的行动，还没有宣布哪项已经获得最高优先级。","sourceIds":["lexical"],"sources":[["PRIORITY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/priority"]]},{"id":"g3","title":"辨析与英文邻居","text":"priority 说重要性或优先处理的地位，sequence 说先后步骤。某个检查即使不是最重要的目标，也可能必须先做，才能开始下一步。top priority 比一般的 important 更明确地表达优先取舍。","sourceIds":["lexical","method"],"sources":[["PRIORITY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/priority"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句把“还有很多事”转成“先做哪几件”的讨论。自编回应：Can we put the safety review first?（我们能先做安全评审吗？）对方提出排序供商议，接下来应比较影响和限制，而非把建议当决定。","sourceIds":["lexical","method","communication"],"sources":[["PRIORITY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/priority"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Which task should take priority this week?（本周哪项任务应该优先？）适合两项任务竞争同一人力时使用；问题要求明确取舍，若各方答案不同，可继续说明各自的理由和延迟影响。","sourceIds":["lexical","method","communication"],"sources":[["PRIORITY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/priority"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"优先事项；优先级","focused":[{"entry":{"lemma":"priority","pos":"n.","senses":[{"id":"trial:V20261012-005:current","glossZh":"需要优先处理的事项或优先程度","definitionEn":"something important enough to be dealt with before other work"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-005:current","glossZh":"需要优先处理的事项或优先程度","definitionEn":"something important enough to be dealt with before other work"}}],"allEntries":[{"lemma":"priority","pos":"n.","senses":[{"id":"trial:V20261012-005:current","glossZh":"需要优先处理的事项或优先程度","definitionEn":"something important enough to be dealt with before other work"}],"source":"来源支持的教学转述"}],"contextTakeaway":"要为剩余工作确定优先安排。"},"x":{"short":"优先事项；优先级","cue":"当前用法","b":"这里的 priority 指需要优先处理的事项或优先程度。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/priority","c":[]}},{"w":{"id":"V20261012-006","date":"2026-10-12","term":"constraint","ipa":"kənˈstreɪnt","pos":"n.","meaning":"限制可选方案的条件","chunk":"a resource constraint","example":"The main constraint is the number of available reviewers.","level":"提升","gloss":"限制条件","explanation":"限制可选方案的条件","examples":[{"en":"The main constraint is the number of available reviewers.","zh":"主要限制是可用评审人员的数量。"},{"en":"Space is a serious constraint here.","zh":"这里的空间限制很大。"}]},"a":{"context":{"text":"The main constraint is the number of available reviewers.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可把 constraint 记成方案必须绕着走的限制：不只是不方便，而是它会缩小可选空间。本句提到评审人数，提醒你即使工作量已知，还要看有多少人能够投入评审。","sourceIds":["lexical","method"],"sources":[["CONSTRAINT — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/constraint"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"The main constraint is 后面给出限制来源：the number of available reviewers。核心是 number，即可用人数；available 修饰 reviewers。它没有说这些人水平不足，也没有给出每人的具体工时。","sourceIds":["lexical"],"sources":[["CONSTRAINT — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/constraint"]]},{"id":"g3","title":"辨析与英文邻居","text":"constraint 是限制条件；risk 是可能出现的不确定影响。现有评审人数不足可作为当前限制，评审人员未来可能请假则可成为风险。limited resources 与 resource constraint 是相邻的常见说法。","sourceIds":["lexical","method"],"sources":[["CONSTRAINT — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/constraint"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句解释计划为何受限，把讨论焦点放到评审人力。自编回应：Could we stagger the reviews?（我们可以错开评审时间吗？）这提供一个待评估方案，让讨论从催促速度转向能否重新安排资源。","sourceIds":["lexical","method","communication"],"sources":[["CONSTRAINT — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/constraint"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：We need a plan that works within our budget constraints.（我们需要一个在预算限制内可行的计划。）适合比较方案时先说明边界；within 表示在限制内工作，并不是请求对方自动提高预算。","sourceIds":["lexical","method","communication"],"sources":[["CONSTRAINT — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/constraint"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"限制条件","focused":[{"entry":{"lemma":"constraint","pos":"n.","senses":[{"id":"trial:V20261012-006:current","glossZh":"限制可选方案的条件","definitionEn":"a condition that limits the available choices"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-006:current","glossZh":"限制可选方案的条件","definitionEn":"a condition that limits the available choices"}}],"allEntries":[{"lemma":"constraint","pos":"n.","senses":[{"id":"trial:V20261012-006:current","glossZh":"限制可选方案的条件","definitionEn":"a condition that limits the available choices"}],"source":"来源支持的教学转述"}],"contextTakeaway":"当前主要限制是可用的评审人数。"},"x":{"short":"限制条件","cue":"当前用法","b":"这里的 constraint 指限制可选方案的条件。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/constraint","c":[]}},{"w":{"id":"V20261012-007","date":"2026-10-12","term":"dependency","ipa":"dɪˈpen.dən.si","pos":"n.","meaning":"一项工作对另一项工作或条件的依赖","chunk":"identify dependencies","example":"Please identify dependencies before finalizing the schedule.","level":"提升","gloss":"依赖关系","explanation":"一项工作对另一项工作或条件的依赖","examples":[{"en":"Please identify dependencies before finalizing the schedule.","zh":"确定日程前，请识别各项依赖关系。"},{"en":"This dependency could delay testing.","zh":"这项依赖关系可能延误测试。"}]},"a":{"context":{"text":"Please identify dependencies before finalizing the schedule.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“A要等B”来记最容易，但也要知道依赖不一定都是等上一项结束才开始。这里先把需要的前置成果和相互影响找出来，才能判断哪段日程不能只凭自己团队的速度决定。","sourceIds":["lexical","method"],"sources":[["DEPENDENCY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/dependency"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g2","title":"句法与概念","text":"identify 的宾语是 dependencies；before finalizing the schedule 表明要先识别，再定稿日程。复数表示需要检查多项关系。它请求的是查清依赖，并未说明这些依赖全是问题或一定会延期。","sourceIds":["lexical"],"sources":[["DEPENDENCY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/dependency"]]},{"id":"g3","title":"辨析与英文邻居","text":"dependency 解释任务为何相连，sequence 描述做事顺序；顺序也可能只是管理安排，不一定代表硬性依赖。blocker 则强调当前已经挡住进展的事项，不能把所有正常依赖都叫阻塞。","sourceIds":["lexical","method"],"sources":[["DEPENDENCY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/dependency"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g4","title":"这句话在做什么","text":"排期若只看每项要几天，容易漏掉等待条件。本句要求先检查这些关系。自编回应：Testing depends on the prototype being ready.（测试要等原型准备好。）下一步便可确认原型何时可用。","sourceIds":["lexical","method","communication"],"sources":[["DEPENDENCY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/dependency"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Is there a dependency on the supplier's test report?（这项工作是否依赖供应商的测试报告？）适合确认外部输入时；问清依赖对象之后，还应核对需要的版本与日期，不能只记录供应商名称。","sourceIds":["lexical","method","communication"],"sources":[["DEPENDENCY — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/dependency"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"依赖关系","focused":[{"entry":{"lemma":"dependency","pos":"n.","senses":[{"id":"trial:V20261012-007:current","glossZh":"一项工作对另一项工作或条件的依赖","definitionEn":"a link in which one activity relies on another"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-007:current","glossZh":"一项工作对另一项工作或条件的依赖","definitionEn":"a link in which one activity relies on another"}}],"allEntries":[{"lemma":"dependency","pos":"n.","senses":[{"id":"trial:V20261012-007:current","glossZh":"一项工作对另一项工作或条件的依赖","definitionEn":"a link in which one activity relies on another"}],"source":"来源支持的教学转述"}],"contextTakeaway":"日程定稿前先查清活动之间的依赖。"},"x":{"short":"依赖关系","cue":"当前用法","b":"这里的 dependency 指一项工作对另一项工作或条件的依赖。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/dependency","c":[]}},{"w":{"id":"V20261012-008","date":"2026-10-12","term":"assumption","ipa":"əˈsʌmp.ʃən","pos":"n.","meaning":"尚未证实但暂时作为规划基础的条件","chunk":"check an assumption","example":"This assumption needs to be checked with the supplier.","level":"核心","gloss":"假设","explanation":"尚未证实但暂时作为规划基础的条件","examples":[{"en":"This assumption needs to be checked with the supplier.","zh":"这项假设需要与供应商核实。"},{"en":"Our estimate rests on that assumption.","zh":"我们的估算基于那项假设。"}]},"a":{"context":{"text":"This assumption needs to be checked with the supplier.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 assumption 想成计划暂时站着的一块垫板：先借它继续推算，但还要检查稳不稳。这是记忆类比。称它为假设不是说它必然错误，而是提醒人不要把尚未核实的条件当成事实。","sourceIds":["lexical","method"],"sources":[["ASSUMPTION — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/assumption"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g2","title":"句法与概念","text":"This assumption 是被检查的对象，needs to be checked 用被动式突出核实动作；with the supplier 指向核实的沟通对象。句子并未说供应商已经认同，也未指定究竟由谁负责联系。","sourceIds":["lexical"],"sources":[["ASSUMPTION — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/assumption"]]},{"id":"g3","title":"辨析与英文邻居","text":"assumption 是暂时接受的前提，fact 是已有依据支持的事实；estimate 则是对数量或时间的估计。估算可以依赖假设，例如交期估计基于材料届时可用，不能把三者混成一项已确认承诺。","sourceIds":["lexical","method"],"sources":[["ASSUMPTION — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/assumption"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句给讨论加一道核实步骤，避免直接按未经证实的前提继续承诺。自编回应：I'll ask the supplier to confirm it.（我会请供应商确认。）回应接下核实动作，之后还需回报答案和计划影响。","sourceIds":["lexical","method","communication"],"sources":[["ASSUMPTION — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/assumption"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Our estimate is based on the assumption that the parts arrive on Monday.（我们的估算以零件周一到货为前提。）适合解释估算依据；应让听者知道日期尚属假设，而不是把到货说成已确认事实。","sourceIds":["lexical","method","communication"],"sources":[["ASSUMPTION — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/assumption"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"假设","focused":[{"entry":{"lemma":"assumption","pos":"n.","senses":[{"id":"trial:V20261012-008:current","glossZh":"尚未证实但暂时作为规划基础的条件","definitionEn":"something treated as true before it has been verified"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-008:current","glossZh":"尚未证实但暂时作为规划基础的条件","definitionEn":"something treated as true before it has been verified"}}],"allEntries":[{"lemma":"assumption","pos":"n.","senses":[{"id":"trial:V20261012-008:current","glossZh":"尚未证实但暂时作为规划基础的条件","definitionEn":"something treated as true before it has been verified"}],"source":"来源支持的教学转述"}],"contextTakeaway":"这项规划前提仍须向供应商核实。"},"x":{"short":"假设","cue":"当前用法","b":"这里的 assumption 指尚未证实但暂时作为规划基础的条件。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/assumption","c":[]}},{"w":{"id":"V20261012-009","date":"2026-10-12","term":"baseline","ipa":"ˈbeɪs.laɪn","pos":"n.","meaning":"用于比较后续变化的基准","chunk":"establish a baseline","example":"We need a baseline before measuring the improvement.","level":"提升","gloss":"基准","explanation":"用于比较后续变化的基准","examples":[{"en":"We need a baseline before measuring the improvement.","zh":"衡量改进前，我们需要一个基准。"},{"en":"Last month's output provides a baseline.","zh":"上个月的产量提供了一个基准。"}]},"a":{"context":{"text":"We need a baseline before measuring the improvement.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想到称重前先记下起始读数：以后说变多或变少，必须知道和什么比。这是记忆类比。本句的 baseline 用作改进前的参照，不要求它本身优秀，也不表示它就是最终目标。","sourceIds":["lexical"],"sources":[["BASELINE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/baseline"]]},{"id":"g2","title":"句法与概念","text":"We need a baseline 表明缺少比较起点；before measuring the improvement 说明先建立基准再测改进。measurement 的对象是 improvement。整句谈比较条件，不是在保证后面一定会得到正向改善。","sourceIds":["lexical"],"sources":[["BASELINE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/baseline"]]},{"id":"g3","title":"辨析与英文邻居","text":"baseline 是起始参照，target 是希望达到的值。benchmark 也可作比较标准，常用于对照其他表现，但并不永远代表行业最佳。看本句的 before measuring，最合适的是先有改进前的记录。","sourceIds":["lexical"],"sources":[["BASELINE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/baseline"]]},{"id":"g4","title":"这句话在做什么","text":"大家若已经说效率提高，本句追问比较依据。自编回应：Let's use last month's average review time.（我们用上个月的平均评审时间吧。）这提出可讨论的基准，再确认数据口径是否一致。","sourceIds":["lexical","method"],"sources":[["BASELINE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/baseline"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Let's record the current error rate as our baseline.（我们把当前错误率记作基准吧。）适合启动改进试验前使用；同时说明统计期间和错误定义，才能让之后的数字有可比较的含义。","sourceIds":["lexical","method"],"sources":[["BASELINE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/baseline"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"基准","focused":[{"entry":{"lemma":"baseline","pos":"n.","senses":[{"id":"trial:V20261012-009:current","glossZh":"用于比较后续变化的基准","definitionEn":"a starting value used to compare later results"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-009:current","glossZh":"用于比较后续变化的基准","definitionEn":"a starting value used to compare later results"}}],"allEntries":[{"lemma":"baseline","pos":"n.","senses":[{"id":"trial:V20261012-009:current","glossZh":"用于比较后续变化的基准","definitionEn":"a starting value used to compare later results"}],"source":"来源支持的教学转述"}],"contextTakeaway":"先有比较基准，才能衡量变化。"},"x":{"short":"基准","cue":"当前用法","b":"这里的 baseline 指用于比较后续变化的基准。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/baseline","c":[]}},{"w":{"id":"V20261012-010","date":"2026-10-12","term":"buffer","ipa":"ˈbʌf.ɚ","pos":"n.","meaning":"为应对不确定性预留的时间或资源","chunk":"a time buffer","example":"The plan includes a two-day buffer for review.","level":"提升","gloss":"缓冲时间或资源","explanation":"为应对不确定性预留的时间或资源","examples":[{"en":"The plan includes a two-day buffer for review.","zh":"计划为评审预留了两天缓冲时间。"},{"en":"Keep a small buffer for unexpected costs.","zh":"为意外费用预留少量缓冲资金。"}]},"a":{"context":{"text":"The plan includes a two-day buffer for review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 buffer 想成两件物体之间的一层软垫：多出来的一点空间承接冲击。这是类比。在计划中，时间或资源也能起这种作用；这里预留两天，是给评审的不确定性留余量。","sourceIds":["lexical"],"sources":[["BUFFER — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/buffer"]]},{"id":"g2","title":"句法与概念","text":"includes 表示缓冲已经列在计划里；a two-day buffer 是一个两天的缓冲，two-day 作前置修饰时 day 不加复数。for review 说明用途，不等于评审所有正常工作只需要两天。","sourceIds":["lexical"],"sources":[["BUFFER — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/buffer"]]},{"id":"g3","title":"辨析与英文邻居","text":"buffer 是事先预留的余量，delay 是实际发生的延误。留两天缓冲并不说明已经延期。extra time 可以泛指多一些时间，而 buffer 更突出它用来应对变化或防止影响继续扩散。","sourceIds":["lexical"],"sources":[["BUFFER — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/buffer"]]},{"id":"g4","title":"这句话在做什么","text":"本句向听者说明日程中的两天为何存在，使预留时间有可理解的用途。自编回应：Is that buffer included in the final date?（最终日期里已经算入这段缓冲了吗？）回应帮助避免重复加时。","sourceIds":["lexical","method"],"sources":[["BUFFER — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/buffer"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Could we keep a one-day buffer before shipment?（我们能在发货前保留一天缓冲吗？）适合讨论日程余量；这是请求保留准备空间，并不表示发货日期可自行推迟，也不是对风险的保证。","sourceIds":["lexical","method"],"sources":[["BUFFER — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/buffer"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"缓冲时间或资源","focused":[{"entry":{"lemma":"buffer","pos":"n.","senses":[{"id":"trial:V20261012-010:current","glossZh":"为应对不确定性预留的时间或资源","definitionEn":"extra time or resources kept to absorb unexpected problems"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-010:current","glossZh":"为应对不确定性预留的时间或资源","definitionEn":"extra time or resources kept to absorb unexpected problems"}}],"allEntries":[{"lemma":"buffer","pos":"n.","senses":[{"id":"trial:V20261012-010:current","glossZh":"为应对不确定性预留的时间或资源","definitionEn":"extra time or resources kept to absorb unexpected problems"}],"source":"来源支持的教学转述"}],"contextTakeaway":"计划为评审预留了两天余量。"},"x":{"short":"缓冲时间或资源","cue":"当前用法","b":"这里的 buffer 指为应对不确定性预留的时间或资源。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/buffer","c":[]}},{"w":{"id":"V20261012-011","date":"2026-10-12","term":"sequence","ipa":"ˈsiː.kwəns","pos":"n.","meaning":"行动或步骤的先后顺序","chunk":"the correct sequence","example":"Let's agree on the sequence of the remaining activities.","level":"核心","gloss":"顺序","explanation":"行动或步骤的先后顺序","examples":[{"en":"Let's agree on the sequence of the remaining activities.","zh":"我们来商定剩余活动的先后顺序。"},{"en":"The assembly sequence has changed.","zh":"装配顺序已经改变。"}]},"a":{"context":{"text":"Let's agree on the sequence of the remaining activities.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 sequence 记成步骤编号：同样几件事，换个顺序可能就做不下去。先装零件还是先检验，影响的是过程安排。本句要商定剩余活动的衔接，而不是重新决定项目究竟要交付什么。","sourceIds":["lexical","method"],"sources":[["SEQUENCE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/sequence"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g2","title":"句法与概念","text":"Let's agree on 是提议一起商定，on 后接 the sequence；of the remaining activities 说明哪些活动的顺序。Let's 通常把说话者包含在内，但是否真的共同决策仍取决于实际场合与权限。","sourceIds":["lexical"],"sources":[["SEQUENCE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/sequence"]]},{"id":"g3","title":"辨析与英文邻居","text":"sequence 侧重前后排列，schedule 还包含何时做、多久完成。priority 侧重先重视什么，未必等同实际执行顺序。自然搭配有 in sequence 与 a sequence of steps，帮助你识别步骤的连接。","sourceIds":["lexical","method"],"sources":[["SEQUENCE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/sequence"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"]]},{"id":"g4","title":"这句话在做什么","text":"大家若各自开始剩余工作，衔接可能未被确认。本句邀请先把顺序对齐。自编回应：Should we inspect the parts before assembly?（我们应该先检查零件再装配吗？）回应提出一个具体先后关系供确认。","sourceIds":["lexical","method","communication"],"sources":[["SEQUENCE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/sequence"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Could you walk me through the assembly sequence?（你能给我讲一下装配顺序吗？）适合交接或学习流程时；walk me through 请求逐步说明，方便你确认每一步接什么，而不只拿到任务名称。","sourceIds":["lexical","method","communication"],"sources":[["SEQUENCE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/sequence"],["Project management Glossary","https://www.apm.org.uk/resources/glossary/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"顺序","focused":[{"entry":{"lemma":"sequence","pos":"n.","senses":[{"id":"trial:V20261012-011:current","glossZh":"行动或步骤的先后顺序","definitionEn":"the order in which related actions happen"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-011:current","glossZh":"行动或步骤的先后顺序","definitionEn":"the order in which related actions happen"}}],"allEntries":[{"lemma":"sequence","pos":"n.","senses":[{"id":"trial:V20261012-011:current","glossZh":"行动或步骤的先后顺序","definitionEn":"the order in which related actions happen"}],"source":"来源支持的教学转述"}],"contextTakeaway":"共同商定剩余活动的先后顺序。"},"x":{"short":"顺序","cue":"当前用法","b":"这里的 sequence 指行动或步骤的先后顺序。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/sequence","c":[]}},{"w":{"id":"V20261012-012","date":"2026-10-12","term":"capacity","ipa":"kəˈpæs.ə.t̬i","pos":"n.","meaning":"团队或系统能够承担工作的能力与数量","chunk":"available capacity","example":"We do not have enough capacity to start both projects.","level":"核心","gloss":"承载能力；产能","explanation":"团队或系统能够承担工作的能力与数量","examples":[{"en":"We do not have enough capacity to start both projects.","zh":"我们没有足够能力同时启动两个项目。"},{"en":"The plant is operating at full capacity.","zh":"工厂正满负荷运转。"}]},"a":{"context":{"text":"We do not have enough capacity to start both projects.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用容器容量来联系团队工作量：会做不等于还能再接。这个类比帮助你理解，本句可能是在说可投入的人员与时间不够；要进一步追问瓶颈，不能据此给团队能力差下结论。","sourceIds":["lexical","method"],"sources":[["CAPACITY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/capacity"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"do not have enough capacity 是否定足够的承载量，to start both projects 说明拟承担的动作。both 指两个项目都启动。它不表示两个项目一个也不能做，也没有说以后永远不能同时开展。","sourceIds":["lexical"],"sources":[["CAPACITY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/capacity"]]},{"id":"g3","title":"辨析与英文邻居","text":"capacity 在此强调能承接多少工作；capability 常用于说明有没有完成某类工作的能力，两者语义仍会重叠。busy 是笼统地忙，available capacity 则有助于具体谈还能分配多少人时。","sourceIds":["lexical","method"],"sources":[["CAPACITY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/capacity"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句对同时启动两项的安排提出资源限制，让对方考虑排序或调整。自编回应：Which project should we start first?（我们应该先启动哪一个？）这是一个推进选择的回应，不替管理者决定优先级。","sourceIds":["lexical","method","communication"],"sources":[["CAPACITY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/capacity"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Do we have capacity for another review this week?（本周我们还有能力再安排一次评审吗？）适合接受新任务前核实负荷；说明 this week 把问题限定到当前时段，避免变成对团队总体能力的评价。","sourceIds":["lexical","method","communication"],"sources":[["CAPACITY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/capacity"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"承载能力；产能","focused":[{"entry":{"lemma":"capacity","pos":"n.","senses":[{"id":"trial:V20261012-012:current","glossZh":"团队或系统能够承担工作的能力与数量","definitionEn":"the amount of work a team can take on"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-012:current","glossZh":"团队或系统能够承担工作的能力与数量","definitionEn":"the amount of work a team can take on"}}],"allEntries":[{"lemma":"capacity","pos":"n.","senses":[{"id":"trial:V20261012-012:current","glossZh":"团队或系统能够承担工作的能力与数量","definitionEn":"the amount of work a team can take on"}],"source":"来源支持的教学转述"}],"contextTakeaway":"现有承载量不足以同时启动两项。"},"x":{"short":"承载能力；产能","cue":"当前用法","b":"这里的 capacity 指团队或系统能够承担工作的能力与数量。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/capacity","c":[]}},{"w":{"id":"V20261012-013","date":"2026-10-12","term":"allocate","ipa":"ˈæl.ə.keɪt","pos":"v.","meaning":"把时间、人员或资源分配给某项工作","chunk":"allocate resources","example":"We should allocate more time to the initial review.","level":"提升","gloss":"分配","explanation":"把时间、人员或资源分配给某项工作","examples":[{"en":"We should allocate more time to the initial review.","zh":"我们应给初步评审分配更多时间。"},{"en":"Allocate two engineers to the trial.","zh":"为试验分配两名工程师。"}]},"a":{"context":{"text":"We should allocate more time to the initial review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 allocate 记成给时间、资金或人员划份额：总量有限，就要说明哪一部分留给哪项工作。本句说给初步评审更多时间，是资源安排的建议，不只是提醒大家更认真地评审。","sourceIds":["lexical","method"],"sources":[["ALLOCATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/allocate"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"should allocate 表示建议，allocate 的宾语是 more time，to the initial review 指分配去向。more 是相对原安排增加多少，但句中未给具体数值；initial review 指初步评审而非最后验收。","sourceIds":["lexical"],"sources":[["ALLOCATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/allocate"]]},{"id":"g3","title":"辨析与英文邻居","text":"allocate 强调把资源配置到某处，spend 强调资源被花掉。可以先 allocate time，再实际 spend time；前者并不保证后者已发生。assign 常用于分派任务，而 allocate time 更清楚地谈时间份额。","sourceIds":["lexical","method"],"sources":[["ALLOCATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/allocate"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句在调整计划：初步评审可能需要更大的时间份额。自编回应：How much extra time do you suggest?（你建议再增加多少时间？）回应把方向变成可排期的数值，之后还需看其他活动的影响。","sourceIds":["lexical","method","communication"],"sources":[["ALLOCATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/allocate"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Can we allocate two hours to the design review?（我们能给设计评审安排两小时吗？）适合排会议或工作计划时；把时长与用途一起说出，便于对方核对可用时间并作出明确答复。","sourceIds":["lexical","method","communication"],"sources":[["ALLOCATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/allocate"],["What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"分配","focused":[{"entry":{"lemma":"allocate","pos":"v.","senses":[{"id":"trial:V20261012-013:current","glossZh":"把时间、人员或资源分配给某项工作","definitionEn":"to assign part of the available resources to a purpose"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-013:current","glossZh":"把时间、人员或资源分配给某项工作","definitionEn":"to assign part of the available resources to a purpose"}}],"allEntries":[{"lemma":"allocate","pos":"v.","senses":[{"id":"trial:V20261012-013:current","glossZh":"把时间、人员或资源分配给某项工作","definitionEn":"to assign part of the available resources to a purpose"}],"source":"来源支持的教学转述"}],"contextTakeaway":"建议给初步评审增加时间份额。"},"x":{"short":"分配","cue":"当前用法","b":"这里的 allocate 指把时间、人员或资源分配给某项工作。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/allocate","c":[]}},{"w":{"id":"V20261012-014","date":"2026-10-12","term":"delegate","ipa":"ˈdel.ə.ɡeɪt","pos":"v.","meaning":"把具体任务及适当权限交给别人","chunk":"delegate a task","example":"You can delegate the data collection to another team member.","level":"提升","gloss":"委派","explanation":"把具体任务及适当权限交给别人","examples":[{"en":"You can delegate the data collection to another team member.","zh":"你可以把数据收集委派给另一位团队成员。"},{"en":"Managers should delegate routine approvals.","zh":"经理应委派常规审批工作。"}]},"a":{"context":{"text":"You can delegate the data collection to another team member.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记成把一块明确的工作交给合适的人处理。这里交出去的是数据收集，不是把整个项目丢给别人；记住“交什么、交给谁”，再在实际分工里确认完成标准和需要的权限。","sourceIds":["lexical","method"],"sources":[["DELEGATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/delegate"],["Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g2","title":"句法与概念","text":"can delegate 表示可以采取的做法；the data collection 是委派的任务，to another team member 指接收者。本句用 delegate 作动词，不是会议代表这个名词义，也没有直接宣布某位同事已接手。","sourceIds":["lexical"],"sources":[["DELEGATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/delegate"]]},{"id":"g3","title":"辨析与英文邻居","text":"delegate 强调由别人代为承担任务或职责；allocate 更强调分配资源份额。给某人两天时间可说 allocate time，把数据收集工作交给某人可说 delegate the task；别只给任务而漏了必要说明。","sourceIds":["lexical","method"],"sources":[["DELEGATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/delegate"],["Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g4","title":"这句话在做什么","text":"本句给任务集中在一人手上的情况提出分工选项。自编回应：Can I delegate it to Mei after confirming her availability?（确认梅有空后，我可以交给她吗？）接下来核实人选、要求和汇报方式。","sourceIds":["lexical","method","communication"],"sources":[["DELEGATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/delegate"],["Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：I'd like to delegate the weekly data check to you.（我想把每周的数据检查委派给你。）适合有相应分工权限时开启交接；随后应说明检查范围、完成时间和遇到问题向谁反馈，而非只说这一句。","sourceIds":["lexical","method","communication"],"sources":[["DELEGATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/delegate"],["Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"委派","focused":[{"entry":{"lemma":"delegate","pos":"v.","senses":[{"id":"trial:V20261012-014:current","glossZh":"把具体任务及适当权限交给别人","definitionEn":"to give another person a task or responsibility to perform"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-014:current","glossZh":"把具体任务及适当权限交给别人","definitionEn":"to give another person a task or responsibility to perform"}}],"allEntries":[{"lemma":"delegate","pos":"v.","senses":[{"id":"trial:V20261012-014:current","glossZh":"把具体任务及适当权限交给别人","definitionEn":"to give another person a task or responsibility to perform"}],"source":"来源支持的教学转述"}],"contextTakeaway":"可以把数据收集工作交给其他同事。"},"x":{"short":"委派","cue":"当前用法","b":"这里的 delegate 指把具体任务及适当权限交给别人。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/delegate","c":[]}},{"w":{"id":"V20261012-015","date":"2026-10-12","term":"ownership","ipa":"ˈoʊ.nɚ.ʃɪp","pos":"n.","meaning":"对事项负责并推动到结果的责任归属","chunk":"take ownership","example":"Who will take ownership of this open item?","level":"核心","gloss":"责任归属","explanation":"对事项负责并推动到结果的责任归属","examples":[{"en":"Who will take ownership of this open item?","zh":"谁来负责推进这项未结事项？"},{"en":"Clear ownership prevents duplicated work.","zh":"明确责任归属可避免重复工作。"}]},"a":{"context":{"text":"Who will take ownership of this open item?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 take ownership 联系到“这件事由我跟进”，就能从财产所有权切到工作责任。本句的 open item 是尚未结清的事项；需要有人推动和协调，不等于此人必须独自完成每一个动作。","sourceIds":["lexical","method"],"sources":[["OWNERSHIP — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/ownership"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"]]},{"id":"g2","title":"句法与概念","text":"Who will take ownership of ...? 询问未来由谁承担责任；of 后接 this open item，明确负责对象。ownership 在这里是不可数名词。问句尚未指定负责人，不能读成已经把任务交给听话的人。","sourceIds":["lexical"],"sources":[["OWNERSHIP — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/ownership"]]},{"id":"g3","title":"辨析与英文邻居","text":"ownership 突出主动接住并跟进事项，accountability 突出需要对行动或结果作出解释。实际组织可能另有角色定义；不要只凭 ownership 这个词就推断此人拥有预算、审批或最终签字权限。","sourceIds":["lexical","method"],"sources":[["OWNERSHIP — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/ownership"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"]]},{"id":"g4","title":"这句话在做什么","text":"事项还没有明确跟进人时，本句邀请指定或认领责任，让讨论从“有人该处理”变成“谁来推进”。自编回应：I'll take ownership and report back tomorrow.（我来跟进，明天回报。）这明确了人和反馈时间。","sourceIds":["lexical","method","communication"],"sources":[["OWNERSHIP — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/ownership"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Could we clarify ownership of the testing issues?（我们能明确一下测试问题由谁负责跟进吗？）适合多人参与却无人统筹时；clarify 先要求说清职责，可随后逐项确认，而不是暗中指责某人失职。","sourceIds":["lexical","method","communication"],"sources":[["OWNERSHIP — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/ownership"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"责任归属","focused":[{"entry":{"lemma":"ownership","pos":"n.","senses":[{"id":"trial:V20261012-015:current","glossZh":"对事项负责并推动到结果的责任归属","definitionEn":"responsibility for seeing an issue or piece of work through"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-015:current","glossZh":"对事项负责并推动到结果的责任归属","definitionEn":"responsibility for seeing an issue or piece of work through"}}],"allEntries":[{"lemma":"ownership","pos":"n.","senses":[{"id":"trial:V20261012-015:current","glossZh":"对事项负责并推动到结果的责任归属","definitionEn":"responsibility for seeing an issue or piece of work through"}],"source":"来源支持的教学转述"}],"contextTakeaway":"要明确谁跟进这项未结事项。"},"x":{"short":"责任归属","cue":"当前用法","b":"这里的 ownership 指对事项负责并推动到结果的责任归属。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/ownership","c":[]}},{"w":{"id":"V20261012-016","date":"2026-10-12","term":"accountable","ipa":"əˈkaʊn.t̬ə.bəl","pos":"adj.","meaning":"需要对最终结果作出解释并承担责任的","chunk":"accountable for the outcome","example":"One person must be accountable for the final decision.","level":"提升","gloss":"须对结果负责的","explanation":"需要对最终结果作出解释并承担责任的","examples":[{"en":"One person must be accountable for the final decision.","zh":"必须有一个人对最终决定负责。"},{"en":"The director is accountable for quality.","zh":"总监须对质量负责。"}]},"a":{"context":{"text":"One person must be accountable for the final decision.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 accountable 和“需要说得清为什么”联系起来：不只接任务，还要能解释自己的行动或决定。本句谈最终决定的责任归属，不是在说负责人必须亲手完成所有准备工作。","sourceIds":["lexical","method"],"sources":[["ACCOUNTABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/accountable"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"]]},{"id":"g2","title":"句法与概念","text":"must be accountable 中 accountable 是形容词；for the final decision 表示对什么负责。accountable to someone 则说明向谁交代。One person 来自本句具体要求，不能扩张成任何组织都只能一人负责。","sourceIds":["lexical"],"sources":[["ACCOUNTABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/accountable"]]},{"id":"g3","title":"辨析与英文邻居","text":"responsible 与 accountable 在日常英语中可重叠，后者更突出解释与问责。RACI 等管理方法会另作角色区分，但不能把某一套规则当所有场合的词义。answerable 是表达向人交代的相邻词。","sourceIds":["lexical","method"],"sources":[["ACCOUNTABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/accountable"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"]]},{"id":"g4","title":"这句话在做什么","text":"本句要求把最终决定的责任明确下来，避免多人参与却无人能说明结果。自编回应：Who has the authority to make that decision?（谁有权作出这个决定？）接着核对责任和决策权限是否对应。","sourceIds":["lexical","method","communication"],"sources":[["ACCOUNTABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/accountable"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Who is accountable for approving the final version?（谁须对最终版本的批准负责？）适合确认审批职责；for 后接 approving 可自然表达对某项行动负责，不能凭这句询问就认定已获批准。","sourceIds":["lexical","method","communication"],"sources":[["ACCOUNTABLE — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/accountable"],["Setting up for success","https://www.apm.org.uk/resources/find-a-resource/competence-framework/overview/setting-up-for-success/"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"须对结果负责的","focused":[{"entry":{"lemma":"accountable","pos":"adj.","senses":[{"id":"trial:V20261012-016:current","glossZh":"需要对最终结果作出解释并承担责任的","definitionEn":"responsible for an action or result and required to explain it"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-016:current","glossZh":"需要对最终结果作出解释并承担责任的","definitionEn":"responsible for an action or result and required to explain it"}}],"allEntries":[{"lemma":"accountable","pos":"adj.","senses":[{"id":"trial:V20261012-016:current","glossZh":"需要对最终结果作出解释并承担责任的","definitionEn":"responsible for an action or result and required to explain it"}],"source":"来源支持的教学转述"}],"contextTakeaway":"最终决定需要有明确的负责者。"},"x":{"short":"须对结果负责的","cue":"当前用法","b":"这里的 accountable 指需要对最终结果作出解释并承担责任的。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/accountable","c":[]}},{"w":{"id":"V20261012-017","date":"2026-10-12","term":"deadline","ipa":"ˈded.laɪn","pos":"n.","meaning":"必须完成某事的最后期限","chunk":"meet a deadline","example":"We need a decision today to meet the deadline.","level":"核心","gloss":"截止期限","explanation":"必须完成某事的最后期限","examples":[{"en":"We need a decision today to meet the deadline.","zh":"为赶上截止期限，我们今天需要作出决定。"},{"en":"The submission deadline is Monday.","zh":"提交截止日期是周一。"}]},"a":{"context":{"text":"We need a decision today to meet the deadline.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 deadline 记成日历上最后可接受的完成点，常连着 meet 或 miss 一起学。本句把今天的决定与之后按期完成连起来，提醒人当前决定有时间影响，并没有交代最终截止是哪一天。","sourceIds":["lexical"],"sources":[["DEADLINE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/deadline"]]},{"id":"g2","title":"句法与概念","text":"We need a decision today 是主要要求；to meet the deadline 说明为何今天需要决定。meet 在这里是按期达到要求，不是与期限见面。today 修饰需要决定的时间，不能直接当作最终项目截止日。","sourceIds":["lexical"],"sources":[["DEADLINE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/deadline"]]},{"id":"g3","title":"辨析与英文邻居","text":"deadline 是最晚期限，target date 可表示计划争取的日期，约束程度要看具体约定。milestone 强调重要进度节点，也可配截止日。把期限与节点名称一起说，通常比孤立报一个日期更清楚。","sourceIds":["lexical"],"sources":[["DEADLINE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/deadline"]]},{"id":"g4","title":"这句话在做什么","text":"决定迟迟未定时，本句给出现在需要答复的理由，以免拖累后续工作。自编回应：What decision do you need from us today?（今天需要我们作出什么决定？）回应把催促转成明确的待决事项。","sourceIds":["lexical","method"],"sources":[["DEADLINE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/deadline"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：Could we confirm the deadline for submitting the report?（我们能确认报告提交的截止期限吗？）适合接下任务时使用；若跨时区或有具体收件时间，再确认日期和时间，避免双方理解成不同的截止点。","sourceIds":["lexical","method"],"sources":[["DEADLINE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/deadline"],["What is project communication?","https://www.apm.org.uk/resources/what-is-project-management/what-is-project-communication/"]]}]},"p":{"displayGloss":"截止期限","focused":[{"entry":{"lemma":"deadline","pos":"n.","senses":[{"id":"trial:V20261012-017:current","glossZh":"必须完成某事的最后期限","definitionEn":"the latest time by which something must be completed"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-017:current","glossZh":"必须完成某事的最后期限","definitionEn":"the latest time by which something must be completed"}}],"allEntries":[{"lemma":"deadline","pos":"n.","senses":[{"id":"trial:V20261012-017:current","glossZh":"必须完成某事的最后期限","definitionEn":"the latest time by which something must be completed"}],"source":"来源支持的教学转述"}],"contextTakeaway":"今天作决定，是为了后续能按期完成。"},"x":{"short":"截止期限","cue":"当前用法","b":"这里的 deadline 指必须完成某事的最后期限。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press；来源见下方五区。","url":"https://dictionary.cambridge.org/us/dictionary/english/deadline","c":[]}},{"w":{"id":"V20261012-018","date":"2026-10-12","term":"commitment","ipa":"kəˈmɪt.mənt","pos":"n.","meaning":"对具体行动或交付作出的明确承诺","chunk":"make a commitment","example":"Please confirm the conditions behind this commitment.","level":"核心","gloss":"承诺","explanation":"对具体行动或交付作出的明确承诺","examples":[{"en":"Please confirm the conditions behind this commitment.","zh":"请确认这项承诺所依据的条件。"},{"en":"Do not make a commitment without approval.","zh":"未经批准不要作出承诺。"}]},"a":{"context":{"text":"Please confirm the conditions behind this commitment.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 make a commitment 和“答应后要兑现”连起来记。它还可表示投入，但 this commitment 指一项具体承诺。记忆时抓住承诺的对象和行动，比只记“很认真”更能读懂本句；这不是在评价某人的工作态度。","sourceIds":["lex-commitment"],"sources":[["COMMITMENT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/commitment"]]},{"id":"g2","title":"句法与概念","text":"confirm 后的宾语是 conditions，behind this commitment 修饰这些条件。behind 在这里表示背后的依据，不是空间位置。概念上，句子要求核对承诺依赖什么条件，而没有直接宣告承诺已经可以无条件执行。","sourceIds":["lex-commitment"],"sources":[["COMMITMENT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/commitment"]]},{"id":"g3","title":"辨析与英文邻居","text":"promise 是容易理解的英文邻居；commitment 在此同样指明确答应承担事情。intention 只说打算做，不能自动当成承诺。记 make a commitment 和 honour a commitment，分别对应作出承诺与履行承诺。","sourceIds":["lex-commitment","lex-intention"],"sources":[["COMMITMENT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/commitment"],["INTENTION — Collins English Dictionary","https://www.collinsdictionary.com/us/dictionary/english/intention"]]},{"id":"g4","title":"这句话在做什么","text":"本句把讨论从“已经答应了”推进到“凭哪些条件能兑现”。自编接话：“It depends on final approval.”（这取决于最终批准。）下一步可列出批准条件；这句话本身不是批准通知，也不保证承诺一定履行。","sourceIds":["lex-commitment","method-meeting"],"sources":[["COMMITMENT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/commitment"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“We cannot make a commitment until the scope is clear.”（范围明确前，我们无法作出承诺。）在对方要求确定交付、但关键边界尚未说明时用；把缺少的条件说出来，便于对方补充后再谈承诺。","sourceIds":["lex-commitment","method-meeting"],"sources":[["COMMITMENT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/commitment"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]}]},"p":{"displayGloss":"承诺","focused":[{"entry":{"lemma":"commitment","pos":"n.","senses":[{"id":"trial:V20261012-018:current","glossZh":"对具体行动或交付作出的明确承诺","definitionEn":"a firm promise to take an action"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-018:current","glossZh":"对具体行动或交付作出的明确承诺","definitionEn":"a firm promise to take an action"}}],"allEntries":[{"lemma":"commitment","pos":"n.","senses":[{"id":"trial:V20261012-018:current","glossZh":"对具体行动或交付作出的明确承诺","definitionEn":"a firm promise to take an action"}],"source":"来源支持的教学转述"}],"contextTakeaway":"这里问的是承诺成立的条件。"},"x":{"short":"承诺","cue":"当前用法","b":"这里问的是承诺成立的条件。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press & Assessment；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/commitment","c":[]}},{"w":{"id":"V20261012-019","date":"2026-10-12","term":"contingency","ipa":"kənˈtɪn.dʒən.si","pos":"n.","meaning":"可能发生且需要预先准备的意外情况","chunk":"a contingency plan","example":"We need a contingency plan if the reviewer is unavailable.","level":"挑战","gloss":"意外情况","explanation":"可能发生且需要预先准备的意外情况","examples":[{"en":"We need a contingency plan if the reviewer is unavailable.","zh":"如果评审人员无法参与，我们需要应急计划。"},{"en":"The budget covers this contingency.","zh":"预算涵盖了这项意外情况。"}]},"a":{"context":{"text":"We need a contingency plan if the reviewer is unavailable.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可以用“如果出状况，备用安排怎么办”来记 contingency。词典里的情况是可能发生、往往会带来麻烦的事，不等于已经发生的事故。把 contingency plan 整块记成应急预案，就能接上本句的评审安排。","sourceIds":["lex-contingency"],"sources":[["CONTINGENCY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/contingency"]]},{"id":"g2","title":"句法与概念","text":"contingency 在这里放在 plan 前，限定计划的用途；整组才是“应急计划”。if 引出要预防的情况，is unavailable 表示评审人不能参与。need 表示说话者认为有必要准备，并没有断言那个人一定缺席。","sourceIds":["lex-contingency"],"sources":[["CONTINGENCY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/contingency"]]},{"id":"g3","title":"辨析与英文邻居","text":"contingency 是要防备的可能情况；contingency plan 才是应对安排。backup plan 是易懂的邻居，侧重备选办法。不要把 risk 和 plan 混为一谈：前者讨论不利情况，后者说明发生时如何处理。","sourceIds":["lex-contingency"],"sources":[["CONTINGENCY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/contingency"]]},{"id":"g4","title":"这句话在做什么","text":"本句要求提前准备评审人无法参与时的替代办法，并未断言评审人一定缺席。自编回应：“I can check whether another reviewer is available.”（我可以确认是否有其他评审人。）接下来核对替补人员，而不是把假设写成已发生的事实。","sourceIds":["lex-contingency","method-meeting"],"sources":[["CONTINGENCY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/contingency"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“What is our contingency plan if the system goes down?”（如果系统宕机，我们的应急计划是什么？）在上线前讨论准备是否充分时用；具体写出 if 后的情况，让问题落到可检查的备用安排。","sourceIds":["lex-contingency","method-meeting"],"sources":[["CONTINGENCY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/contingency"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]}]},"p":{"displayGloss":"意外情况","focused":[{"entry":{"lemma":"contingency","pos":"n.","senses":[{"id":"trial:V20261012-019:current","glossZh":"可能发生且需要预先准备的意外情况","definitionEn":"a possible future problem that needs preparation"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-019:current","glossZh":"可能发生且需要预先准备的意外情况","definitionEn":"a possible future problem that needs preparation"}}],"allEntries":[{"lemma":"contingency","pos":"n.","senses":[{"id":"trial:V20261012-019:current","glossZh":"可能发生且需要预先准备的意外情况","definitionEn":"a possible future problem that needs preparation"}],"source":"来源支持的教学转述"}],"contextTakeaway":"评审人缺席是预先准备的可能情况。"},"x":{"short":"意外情况","cue":"当前用法","b":"评审人缺席是预先准备的可能情况。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press & Assessment；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/contingency","c":[]}},{"w":{"id":"V20261012-020","date":"2026-10-12","term":"trade-off","ipa":"ˈtreɪd.ɑːf","pos":"n.","meaning":"获得一项优势时需要付出的另一项代价","chunk":"a trade-off between speed and cost","example":"There is a trade-off between a faster delivery and a lower cost.","level":"提升","gloss":"取舍；权衡","explanation":"获得一项优势时需要付出的另一项代价","examples":[{"en":"There is a trade-off between a faster delivery and a lower cost.","zh":"更快交付与更低成本之间存在取舍。"},{"en":"Every design involves a trade-off.","zh":"每项设计都涉及取舍。"}]},"a":{"context":{"text":"There is a trade-off between a faster delivery and a lower cost.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“两项都想要，却不能都拿满”的画面记 trade-off，这是教学类比。重点是取得某个好处时要让出另一项好处。回到本句，速度和成本是同时想优化的两端；并不是所有选择都自动构成这种取舍。","sourceIds":["lex-trade-off"],"sources":[["TRADE-OFF — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/tradeoff"]]},{"id":"g2","title":"句法与概念","text":"There is 引出存在的情况；a trade-off 是名词核心，between A and B 列出两端。faster 与 lower 都在作比较。句子报告两项目标之间的限制，但没有告诉我们最终选哪一端，也没有给出具体价格差。","sourceIds":["lex-trade-off"],"sources":[["TRADE-OFF — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/tradeoff"]]},{"id":"g3","title":"辨析与英文邻居","text":"choice 只是选择；trade-off 还指出选择伴随的损失。compromise 可作英文邻居，但本句重点不是双方各让一步，而是快与便宜难以兼得。谈取舍时把两端说全，比单说“有代价”更容易判断。","sourceIds":["lex-trade-off"],"sources":[["TRADE-OFF — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/tradeoff"]]},{"id":"g4","title":"这句话在做什么","text":"本句纠正“既要更快又要更便宜”的期待，邀请团队讨论优先级。自编回应：“How much extra would faster delivery cost?”（更快交付要多花多少钱？）这样把抽象取舍转成具体比较，之后才可能选择方案。","sourceIds":["lex-trade-off","method-agree"],"sources":[["TRADE-OFF — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/tradeoff"],["Agreeing and disagreeing","https://learnenglish.britishcouncil.org/free-resources/speaking/b1/agreeing-disagreeing"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“What trade-offs are we accepting with this design?”（采用这个设计，我们接受了哪些取舍？）用于方案评审中追问得到与放弃的东西；请对方说明收益和代价，不能仅凭 trade-off 一词认定方案值得。","sourceIds":["lex-trade-off","method-agree"],"sources":[["TRADE-OFF — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/tradeoff"],["Agreeing and disagreeing","https://learnenglish.britishcouncil.org/free-resources/speaking/b1/agreeing-disagreeing"]]}]},"p":{"displayGloss":"取舍；权衡","focused":[{"entry":{"lemma":"trade-off","pos":"n.","senses":[{"id":"trial:V20261012-020:current","glossZh":"获得一项优势时需要付出的另一项代价","definitionEn":"a situation where gaining one benefit means giving up another"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-020:current","glossZh":"获得一项优势时需要付出的另一项代价","definitionEn":"a situation where gaining one benefit means giving up another"}}],"allEntries":[{"lemma":"trade-off","pos":"n.","senses":[{"id":"trial:V20261012-020:current","glossZh":"获得一项优势时需要付出的另一项代价","definitionEn":"a situation where gaining one benefit means giving up another"}],"source":"来源支持的教学转述"}],"contextTakeaway":"更快交付与更低成本难以同时兼得。"},"x":{"short":"取舍；权衡","cue":"当前用法","b":"更快交付与更低成本难以同时兼得。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press & Assessment；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/tradeoff","c":[]}},{"w":{"id":"V20261012-041","date":"2026-10-12","term":"agenda","ipa":"əˈdʒen.də","pos":"n.","meaning":"会议准备讨论的事项清单","chunk":"agree on the agenda","example":"Please send the agenda before the meeting.","level":"核心","gloss":"议程","explanation":"会议准备讨论的事项清单","examples":[{"en":"Please send the agenda before the meeting.","zh":"请在会议前发送议程。"},{"en":"Add staffing to tomorrow's agenda.","zh":"把人员配置加入明天的议程。"}]},"a":{"context":{"text":"Please send the agenda before the meeting.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想到开会前先看“今天谈哪几件事”，就能记住 agenda 的本句义。清单中的一项可叫 an item on the agenda。它还可以指更广泛的目标，但 meeting 已把这里限定为会议议程，不必猜测隐藏动机。","sourceIds":["lex-agenda"],"sources":[["Working in English — Business English Vocabulary Online, Unit 20","https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm"]]},{"id":"g2","title":"句法与概念","text":"send 的宾语是 the agenda，表示双方能识别的那份议程；before the meeting 修饰发送时间。句子要求先发清单，再开会。它没有指定必须提前几天，所以需要明确截止时间时，应在后续沟通中补上。","sourceIds":["lex-agenda"],"sources":[["Working in English — Business English Vocabulary Online, Unit 20","https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm"]]},{"id":"g3","title":"辨析与英文邻居","text":"agenda 告诉人们准备讨论什么；schedule 更侧重时间安排。minutes 则记录会议经过或结果。把这三个词放在同一次会议里比较：会前看议程，按时间表进行，会后读纪要，就不容易混用。","sourceIds":["lex-agenda","lex-schedule","lex-minutes"],"sources":[["Working in English — Business English Vocabulary Online, Unit 20","https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm"],["SCHEDULE — Dictionary.com","https://www.dictionary.com/browse/schedule"],["minutes — The People’s Law Dictionary","https://dictionary.law.com/Default.aspx?selected=1254"]]},{"id":"g4","title":"这句话在做什么","text":"本句在安排会前准备，避免参会者到场才知道主题。自编回应：“I’ll send it this afternoon.”（我今天下午发。）回应补上可执行的时间，随后发送议程；不能仅从原句认定议程已写好或对方已接受。","sourceIds":["lex-agenda","method-agenda"],"sources":[["Working in English — Business English Vocabulary Online, Unit 20","https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm"],["Talking Business — Meetings: Agenda setting","https://downloads.bbc.co.uk/worldservice/learningenglish/business/talkingbusiness/pdfs/2.1_agenda.pdf"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“Could we add the staffing issue to the agenda?”（我们能把人员配置问题加入议程吗？）当你希望正式安排一个讨论主题时用；它是在申请加入清单，是否排入仍需主持人或团队确认。","sourceIds":["lex-agenda","method-agenda"],"sources":[["Working in English — Business English Vocabulary Online, Unit 20","https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm"],["Talking Business — Meetings: Agenda setting","https://downloads.bbc.co.uk/worldservice/learningenglish/business/talkingbusiness/pdfs/2.1_agenda.pdf"]]}]},"p":{"displayGloss":"议程","focused":[{"entry":{"lemma":"agenda","pos":"n.","senses":[{"id":"trial:V20261012-041:current","glossZh":"会议准备讨论的事项清单","definitionEn":"a list of topics planned for a meeting"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-041:current","glossZh":"会议准备讨论的事项清单","definitionEn":"a list of topics planned for a meeting"}}],"allEntries":[{"lemma":"agenda","pos":"n.","senses":[{"id":"trial:V20261012-041:current","glossZh":"会议准备讨论的事项清单","definitionEn":"a list of topics planned for a meeting"}],"source":"来源支持的教学转述"}],"contextTakeaway":"会前发送要讨论的事项清单。"},"x":{"short":"议程","cue":"当前用法","b":"会前发送要讨论的事项清单。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press & Assessment；来源见下方五区。","url":"https://www.cambridge.org/elt/workinginenglish/vocabonline/unit20.htm","c":[]}},{"w":{"id":"V20261012-042","date":"2026-10-12","term":"context","ipa":"ˈkɑːn.tekst","pos":"n.","meaning":"理解当前事项所需的背景","chunk":"provide context","example":"Let me provide some context before we discuss the options.","level":"核心","gloss":"背景","explanation":"理解当前事项所需的背景","examples":[{"en":"Let me provide some context before we discuss the options.","zh":"讨论选项前，让我先提供一些背景。"},{"en":"The chart needs more context.","zh":"这张图需要更多背景信息。"}]},"a":{"context":{"text":"Let me provide some context before we discuss the options.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可把 context 想成照片外的环境，这是帮助记忆的类比：单看一个数字可能不明白，知道它产生时的情况才容易理解。这里的背景服务于后面的选项讨论，不是要求把所有历史资料从头讲一遍。","sourceIds":["lex-context"],"sources":[["CONTEXT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/context"]]},{"id":"g2","title":"句法与概念","text":"Let me 后接动词原形 provide，表示说话者要先做一件事；some context 是补充的信息，before 从句标出先后关系。概念上，是先提供共同理解所需的背景，再讨论选项，而非已经替大家选好方案。","sourceIds":["lex-context"],"sources":[["CONTEXT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/context"]]},{"id":"g3","title":"辨析与英文邻居","text":"background 是本句接近的英文邻居。context 更突出周围情况如何影响理解；detail 则可能只是某个具体细节，不一定解释背景。还可记 in context：把信息放回相关情境后理解，避免孤立解读。","sourceIds":["lex-context"],"sources":[["CONTEXT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/context"]]},{"id":"g4","title":"这句话在做什么","text":"本句暂缓进入选项比较，为听者补齐理解起点。自编接话：“Please explain what changed.”（请说明发生了什么变化。）接下来先听变化背景，再评估方案；这只是话题安排，不代表听者必然接受说话者的判断。","sourceIds":["lex-context","method-meeting"],"sources":[["CONTEXT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/context"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“For context, the estimate assumes a two-week review.”（补充一下背景，这份估算假设评审需要两周。）在读者容易误解数字时用，说明与解读直接有关的前提；这里是自编示例，并非真实评审安排。","sourceIds":["lex-context","method-meeting"],"sources":[["CONTEXT — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/context"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]}]},"p":{"displayGloss":"背景","focused":[{"entry":{"lemma":"context","pos":"n.","senses":[{"id":"trial:V20261012-042:current","glossZh":"理解当前事项所需的背景","definitionEn":"background circumstances that help explain something"}],"source":"来源支持的教学转述"},"sense":{"id":"trial:V20261012-042:current","glossZh":"理解当前事项所需的背景","definitionEn":"background circumstances that help explain something"}}],"allEntries":[{"lemma":"context","pos":"n.","senses":[{"id":"trial:V20261012-042:current","glossZh":"理解当前事项所需的背景","definitionEn":"background circumstances that help explain something"}],"source":"来源支持的教学转述"}],"contextTakeaway":"先补背景，再比较选项。"},"x":{"short":"背景","cue":"当前用法","b":"先补背景，再比较选项。","quote":"","source":"释义为原创教学转述，依据 Cambridge University Press & Assessment；来源见下方五区。","url":"https://dictionary.cambridge.org/dictionary/english/context","c":[]}},{"w":{"id":"V20261012-043","date":"2026-10-12","term":"clarify","ipa":"ˈkler.ə.faɪ","pos":"v.","meaning":"把含糊的意思、范围或要求讲清楚","chunk":"clarify a requirement","example":"Could you clarify what is included in this request?","level":"核心","gloss":"澄清","explanation":"把含糊的意思、范围或要求讲清楚","examples":[{"en":"Could you clarify what is included in this request?","zh":"你能澄清这项请求包含什么吗？"},{"en":"Please clarify the payment terms.","zh":"请澄清付款条件。"}]},"a":{"context":{"text":"Could you clarify what is included in this request?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记 clear 与 clarify 的意义联系：原来模糊的内容，经解释后变清楚。这里的学习重点是“哪里不清楚”，不是要求对方说得越长越好。把 clarify the scope 当作练习搭配，便于想到范围澄清的场景。","sourceIds":["lex-clarify"],"sources":[["CLARIFY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/clarify"]]},{"id":"g2","title":"句法与概念","text":"Could you 构成请求；clarify 后接 what is included in this request，整个从句是要澄清的内容。what 从句保持陈述结构，不再写成疑问句倒装。概念重点是请求范围，尤其哪些项目包含在内。","sourceIds":["lex-clarify"],"sources":[["CLARIFY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/clarify"]]},{"id":"g3","title":"辨析与英文邻居","text":"clarify 针对模糊之处；confirm 针对已有信息是否属实或确定；elaborate 则展开更多细节。三者可能出现在同一讨论，但任务不同。若你连范围都不明白，先求澄清比直接要求确认更准确。","sourceIds":["lex-clarify","lex-confirm","lex-elaborate"],"sources":[["CLARIFY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/clarify"],["CONFIRM — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/confirm"],["ELABORATE — Cambridge Dictionary","https://dictionary.cambridge.org/us/dictionary/english/elaborate"]]},{"id":"g4","title":"这句话在做什么","text":"本句把沟通卡点定位到范围，而不是笼统地说没听懂。自编回应：“It includes testing, but not installation.”（包括测试，但不包括安装。）这样回应给出边界，下一步才能判断工作量；此范围仅属自编教学情境。","sourceIds":["lex-clarify","method-meeting"],"sources":[["CLARIFY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/clarify"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]},{"id":"g5","title":"工作中可以这样说","text":"自编：“Could you clarify whether training is included?”（你能说明培训是否包含在内吗？）当报价或请求中某项服务的边界不清时用。把不确定的项目放进 whether 从句，让对方能直接回答，而不用重述整份方案。","sourceIds":["lex-clarify","method-meeting"],"sources":[["CLARIFY — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/clarify"],["Attending a Business Meeting – Video","https://www.oxfordonlineenglish.com/attending-business-meeting"]]}]},"p":{"displayGloss":"澄清","focused":[{"entry":{"lemma":"clarify","pos":"v.","senses":[{"id":"trial:V20261012-043:current","glossZh":"把含糊的意思、范围或要求讲清楚","definitionEn":"to make a meaning or issue easier to understand"}],"source"
