.（我们的估算以零件周一到货为前提。","boundary":"）that后写具体条件；若已得到确认，应另外说明确认依据，而不只重复“假设”。"},"sources":[["Oxford — assumption","https://www.oxfordlearnersdictionaries.com/definition/english/assumption"]]}]},"p":{"displayGloss":"假设","focused":[{"entry":{"lemma":"assumption","pos":"n.","senses":[{"id":"V20261012-008:current","glossZh":"尚未证实但暂时作为规划基础的条件","definitionEn":"something treated as true before it has been verified","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-008:current","glossZh":"尚未证实但暂时作为规划基础的条件","definitionEn":"something treated as true before it has been verified","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"assumption","pos":"名词·正式","senses":[{"id":"V20261012-008:extra","glossZh":"开始承担责任或取得权力","definitionEn":"the act of taking on responsibility or power","sourceIds":["lexical"]}]}],"contextTakeaway":"这项规划前提仍须向供应商核实。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-008\">\u003ch3>assumption · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"assumption-learner-1\">\u003cstrong>1. 尚未得到充分证实却被认为是真的看法或前提。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：make an assumption; the assumption that\u003cbr>\u003cspan class=\"en\" lang=\"en\">We booked two rooms on the assumption that everyone would come.\u003c/span>\u003cbr>我们假定大家都会来，因此订了两个房间。\u003c/p>\u003cp data-learner-sense=\"assumption-learner-2\">\u003cstrong>2. 开始取得或承担权力、责任、控制等。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数，正式〕\u003c/small>\u003cbr>用法：the assumption of power / responsibility\u003cbr>\u003cspan class=\"en\" lang=\"en\">The agreement marked her assumption of full responsibility.\u003c/span>\u003cbr>这项协议标志着她开始承担全部责任。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/assumption\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>assumption \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/assumption\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /əˈsʌmp.ʃən/\u003c/p>\u003cp data-dictionary-sense=\"assumption%1:10:00::\">\u003cstrong>1. 被当作真的、可据以推出结论的陈述；前提\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a statement that is assumed to be true and from which a conclusion can be drawn\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：on the assumption that he has been injured, we can infer that he will not play\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"assumption%1:09:00::\">\u003cstrong>2. 被视为理所当然的假设\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a hypothesis that is taken for granted\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：any society is built upon certain assumptions\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"assumption%1:04:00::\">\u003cstrong>3. 取得某事物的占有权或控制权的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of taking possession of or power over something\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：his assumption of office coincided with the trouble in Cuba\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the Nazi assumption of power in 1934\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he acquired all the company&#39;s assets for ten million dollars and the assumption of the company&#39;s debts\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"assumption%1:07:00::\">\u003cstrong>4. 无权如此却表现出的大胆甚至傲慢行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">audacious (even arrogant) behavior that you have no right to\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he despised them for their presumptuousness\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"assumption%1:04:01::\">\u003cstrong>5. 假定或将某事视为当然的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of assuming or taking for granted\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：your assumption that I would agree was unwarranted\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"假设","cue":"当前用法","b":"assumption是暂时接受、但还需要依据的前提。本句提醒先向供应商核实这个条件；如果答案不同，建立在它上面的估算或安排也可能要调整。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","assumption经法语或拉丁语与“接受、拿起来承担”相连。英语后来用它指先当作成立的前提；同一个词今天仍可在assumption of responsibility里表示承担责任，和本句的假设义不同。","https://www.etymonline.com/word/assumption"],["帮助理解的现代联系","把一项条件暂时“拿来当基础”，就能继续估算。例如暂按周一到货来排计划，是作了假设；这说明计算从哪里出发，并不表示到货已经被证实。","https://www.oxfordlearnersdictionaries.com/definition/english/assumption"],["回到当前用法","assumption是暂时接受、但还需要依据的前提。本句提醒先向供应商核实这个条件；如果答案不同，建立在它上面的估算或安排也可能要调整。","https://www.oxfordlearnersdictionaries.com/definition/english/assumption"]]}},{"w":{"id":"V20261012-009","date":"2026-10-12","term":"baseline","ipa":"ˈbeɪslaɪn","pos":"n.","meaning":"用于比较后续变化的基准","chunk":"establish a baseline","example":"We need a baseline before measuring the improvement.","level":"提升","gloss":"基准","explanation":"用于比较后续变化的基准","examples":[{"en":"We need a baseline before measuring the improvement.","zh":"衡量改进前，我们需要一个基准。"},{"en":"Last month's output provides a baseline.","zh":"上个月的产量提供了一个基准。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We need a baseline before measuring the improvement.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想到称重前先记下起始读数：以后说变多或变少，必须知道和什么比。这是记忆类比。本句的 baseline 用作改进前的参照，不要求它本身优秀，也不表示它就是最终目标。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"想到称重前先记下起始读数：以后说变多或变少，必须知道和什么比。","explanation":"这是记忆类比。","example":"本句的 baseline 用作改进前的参照，不要求它本身优秀，也不表示它就是最终目标。","boundary":"本句的 baseline 用作改进前的参照，不要求它本身优秀，也不表示它就是最终目标。"},"sources":[["Oxford — baseline","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]},{"id":"g2","title":"句法与概念","text":"We need a baseline先提出需要比较基准；before measuring the improvement说明要在测量改进前建立它。measuring的对象是the improvement。读这句要抓“先确定参照，再测变化”，而不是直接把baseline当作目标值。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"We need a baseline先提出需要比较基准；before measuring the improvement说明要在测量改进前建立它。","explanation":"measuring的对象是the improvement。","example":"We need a baseline先提出需要比较基准；before measuring the improvement说明要在测量改进前建立它。","boundary":"读这句要抓“先确定参照，再测变化”，而不是直接把baseline当作目标值。"},"sources":[["Oxford — baseline","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]},{"id":"g3","title":"辨析与英文邻居","text":"baseline 是起始参照，target 是希望达到的值。benchmark 也可作比较标准，常用于对照其他表现，但并不永远代表行业最佳。看本句的 before measuring，最合适的是先有改进前的记录。","sourceIds":["lexical"],"claimIds":["c4"],"requirements":{"anchor":"baseline 是起始参照，target 是希望达到的值。","explanation":"benchmark 也可作比较标准，常用于对照其他表现，但并不永远代表行业最佳。","example":"baseline 是起始参照，target 是希望达到的值。","boundary":"看本句的 before measuring，最合适的是先有改进前的记录。"},"sources":[["Oxford — baseline","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]},{"id":"g4","title":"这句话在做什么","text":"本句在提醒比较需要一个起点。need提出必要条件，before measuring把建立基准放到测量之前。自编回应：Let’s use last month’s average review time.（我们用上个月的平均评审时间吧。）这提出一个候选参照，再核对统计口径。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"本句在提醒比较需要一个起点。","explanation":"need提出必要条件，before measuring把建立基准放到测量之前。","example":"need提出必要条件，before measuring把建立基准放到测量之前。","boundary":"）这提出一个候选参照，再核对统计口径。"},"sources":[["Oxford — baseline","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]},{"id":"g5","title":"工作中可以这样说","text":"启动改进试验前，可以说：Let’s record the current error rate as our baseline.（我们把当前错误率记作基准吧。自编。）把error rate换成review time，可用于评审耗时；同时注明统计期间，后面的比较才有共同依据。","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"启动改进试验前，可以说：Let’s record the current error rate as our baseline.（我们把当前错误率记作基准吧。","explanation":"自编。","example":"启动改进试验前，可以说：Let’s record the current error rate as our baseline.（我们把当前错误率记作基准吧。","boundary":"）把error rate换成review time，可用于评审耗时；同时注明统计期间，后面的比较才有共同依据。"},"sources":[["Oxford — baseline","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]}]},"p":{"displayGloss":"基准","focused":[{"entry":{"lemma":"baseline","pos":"n.","senses":[{"id":"V20261012-009:current","glossZh":"用于比较后续变化的基准","definitionEn":"a starting value used to compare later results","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-009:current","glossZh":"用于比较后续变化的基准","definitionEn":"a starting value used to compare later results","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"baseline","pos":"名词·体育","senses":[{"id":"V20261012-009:extra","glossZh":"网球场底线等场地边界线","definitionEn":"a boundary line at the end of a tennis court","sourceIds":["lexical"]}]}],"contextTakeaway":"先有比较基准，才能衡量变化。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-009\">\u003ch3>baseline · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"baseline-learner-1\">\u003cstrong>1. 用来衡量后来变化的起点、数据或比较标准。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，通常单数〕\u003c/small>\u003cbr>用法：establish a baseline; a baseline for comparison\u003cbr>\u003cspan class=\"en\" lang=\"en\">We recorded the initial temperature as a baseline.\u003c/span>\u003cbr>我们记录初始温度，作为后续比较的基准。\u003c/p>\u003cp data-learner-sense=\"baseline-learner-2\">\u003cstrong>2. 网球等场地的底线，或棒球跑垒的垒线。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，体育〕\u003c/small>\u003cbr>用法：behind the baseline\u003cbr>\u003cspan class=\"en\" lang=\"en\">The tennis player waited just behind the baseline.\u003c/span>\u003cbr>那名网球选手在底线后方等候。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/baseline\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>baseline \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/baseline\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈbeɪslaɪn/\u003c/p>\u003cp data-dictionary-sense=\"baseline%1:24:00::\">\u003cstrong>1. 用于测量或比较的假想线或标准；基线\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an imaginary line or standard by which things are measured or compared\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：they established a baseline for the budget\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"baseline%1:15:01::\">\u003cstrong>2. 网球或手球场两端的底线，发球者发球时不得越线\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the back line bounding each end of a tennis or handball court; when serving the server must not step over this line\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"baseline%1:15:00::\">\u003cstrong>3. 棒球运动员跑垒时必须遵循的垒线\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the lines a baseball player must follow while running the bases\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"基准","cue":"当前用法","b":"baseline回答“和什么相比”。要说审批变快，先要知道原来的耗时；这个起始记录是baseline，希望降到的耗时才是target。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","baseline由base和line组成，早期用于测量，指其他测量所依据的线。后来有球场底线等用法。今天比较改进时的baseline仍强调“作为参照”，不必是一条看得见的线。","https://www.etymonline.com/word/baseline"],["帮助理解的现代联系","先记下开始时的读数，再看后来改变多少，就是容易理解的基准思路。参照本身可以好也可以差；关键是比较双方采用相同的口径。","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"],["回到当前用法","baseline回答“和什么相比”。要说审批变快，先要知道原来的耗时；这个起始记录是baseline，希望降到的耗时才是target。","https://www.oxfordlearnersdictionaries.com/definition/english/baseline"]]}},{"w":{"id":"V20261012-010","date":"2026-10-12","term":"buffer","ipa":"ˈbʌfə(r)","pos":"n.","meaning":"为应对不确定性预留的时间或资源","chunk":"a time buffer","example":"The plan includes a two-day buffer for review.","level":"提升","gloss":"缓冲时间或资源","explanation":"为应对不确定性预留的时间或资源","examples":[{"en":"The plan includes a two-day buffer for review.","zh":"计划为评审预留了两天缓冲时间。"},{"en":"Keep a small buffer for unexpected costs.","zh":"为意外费用预留少量缓冲资金。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"The plan includes a two-day buffer for review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 buffer 想成两件物体之间的一层软垫：多出来的一点空间承接冲击。这是类比。在计划中，时间或资源也能起这种作用；这里预留两天，是给评审的不确定性留余量。","sourceIds":["lexical","method"],"claimIds":["c2"],"requirements":{"anchor":"把 buffer 想成两件物体之间的一层软垫：多出来的一点空间承接冲击。","explanation":"这是类比。","example":"把 buffer 想成两件物体之间的一层软垫：多出来的一点空间承接冲击。","boundary":"在计划中，时间或资源也能起这种作用；这里预留两天，是给评审的不确定性留余量。"},"sources":[["Oxford — buffer","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g2","title":"句法与概念","text":"includes 表示缓冲已经列在计划里；a two-day buffer 是一个两天的缓冲，two-day 作前置修饰时 day 不加复数。for review 说明用途，不等于评审所有正常工作只需要两天。","sourceIds":["lexical","method"],"claimIds":["c3"],"requirements":{"anchor":"includes 表示缓冲已经列在计划里；a two-day buffer 是一个两天的缓冲，two-day 作前置修饰时 day 不加复数。","explanation":"for review 说明用途，不等于评审所有正常工作只需要两天。","example":"includes 表示缓冲已经列在计划里；a two-day buffer 是一个两天的缓冲，two-day 作前置修饰时 day 不加复数。","boundary":"for review 说明用途，不等于评审所有正常工作只需要两天。"},"sources":[["Oxford — buffer","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g3","title":"辨析与英文邻居","text":"buffer 是事先预留的余量，delay 是实际发生的延误。留两天缓冲并不说明已经延期。extra time 可以泛指多一些时间，而 buffer 更突出它用来应对变化或防止影响继续扩散。","sourceIds":["lexical","method"],"claimIds":["c4"],"requirements":{"anchor":"buffer 是事先预留的余量，delay 是实际发生的延误。","explanation":"留两天缓冲并不说明已经延期。","example":"buffer 是事先预留的余量，delay 是实际发生的延误。","boundary":"extra time 可以泛指多一些时间，而 buffer 更突出它用来应对变化或防止影响继续扩散。"},"sources":[["Oxford — buffer","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g4","title":"这句话在做什么","text":"这句话在说明计划里两天余量的用途。includes表明已经计入计划，for review指出留给评审。自编回应：Is that buffer included in the final date?（最终日期里已经算入这段缓冲了吗？）这样可确认大家是否按同一份时间安排理解。","sourceIds":["lexical","method"],"claimIds":["c5"],"requirements":{"anchor":"这句话在说明计划里两天余量的用途。","explanation":"includes表明已经计入计划，for review指出留给评审。","example":"includes表明已经计入计划，for review指出留给评审。","boundary":"自编回应：Is that buffer included in the final date?（最终日期里已经算入这段缓冲了吗？）这样可确认大家是否按同一份时间安排理解。"},"sources":[["Oxford — buffer","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"安排发货前的余量时，可以问：Could we keep a one-day buffer before shipment?（我们能在发货前保留一天缓冲吗？自编。）one-day可换成two-day；这里是在建议预留空间，不是报告已经延期。","sourceIds":["lexical","method"],"claimIds":["c6"],"requirements":{"anchor":"安排发货前的余量时，可以问：Could we keep a one-day buffer before shipment?（我们能在发货前保留一天缓冲吗？自编。","explanation":"）one-day可换成two-day；这里是在建议预留空间，不是报告已经延期。","example":"安排发货前的余量时，可以问：Could we keep a one-day buffer before shipment?（我们能在发货前保留一天缓冲吗？自编。","boundary":"）one-day可换成two-day；这里是在建议预留空间，不是报告已经延期。"},"sources":[["Oxford — buffer","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]}]},"p":{"displayGloss":"缓冲时间或资源","focused":[{"entry":{"lemma":"buffer","pos":"n.","senses":[{"id":"V20261012-010:current","glossZh":"为应对不确定性预留的时间或资源","definitionEn":"extra time or resources kept to absorb unexpected problems","sourceIds":["lexical","method"]}]},"sense":{"id":"V20261012-010:current","glossZh":"为应对不确定性预留的时间或资源","definitionEn":"extra time or resources kept to absorb unexpected problems","sourceIds":["lexical","method"]}}],"allEntries":[{"lemma":"buffer","pos":"名词·计算机","senses":[{"id":"V20261012-010:extra","glossZh":"暂存数据的缓冲区","definitionEn":"a memory area that holds data temporarily","sourceIds":["lexical"]}]}],"contextTakeaway":"计划为评审预留了两天余量。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-010\">\u003ch3>buffer · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"buffer-learner-1\">\u003cstrong>1. 减轻冲击、风险或困难的保护因素，也可指预留的钱或时间。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a buffer against; a buffer between\u003cbr>\u003cspan class=\"en\" lang=\"en\">We keep some savings as a buffer against unexpected expenses.\u003c/span>\u003cbr>我们留些积蓄，以应付意外开支。\u003c/p>\u003cp data-learner-sense=\"buffer-learner-2\">\u003cstrong>2. 隔开事物并减少碰撞的空间或缓冲装置。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a buffer zone; a buffer between\u003cbr>\u003cspan class=\"en\" lang=\"en\">A strip of trees forms a buffer between the houses and the road.\u003c/span>\u003cbr>一排树在房屋和道路之间形成缓冲带。\u003c/p>\u003cp data-learner-sense=\"buffer-learner-3\">\u003cstrong>3. 数据继续传送前暂时存放的缓冲区。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，计算机〕\u003c/small>\u003cbr>用法：a memory buffer\u003cbr>\u003cspan class=\"en\" lang=\"en\">The data stays in a buffer before it is printed.\u003c/span>\u003cbr>数据打印前会暂存在缓冲区中。\u003c/p>\u003cp data-learner-sense=\"buffer-learner-4\">\u003cstrong>4. 保护某人或某物，使其少受不利影响。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：buffer someone/something against / from\u003cbr>\u003cspan class=\"en\" lang=\"en\">The thick walls buffer the rooms against traffic noise.\u003c/span>\u003cbr>厚墙减弱了房间受到的交通噪声干扰。\u003c/p>\u003cp data-learner-sense=\"buffer-learner-5\">\u003cstrong>5. 先暂存数据，再进行播放、处理或传输。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，计算机〕\u003c/small>\u003cbr>用法：buffer data / video\u003cbr>\u003cspan class=\"en\" lang=\"en\">The player buffers the video before playback starts.\u003c/span>\u003cbr>播放器在开始播放前先缓冲视频数据。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/buffer_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>buffer \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/buffer\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈbʌfə(ɹ)/ · US /ˈbʌfɚ/ · AU /ˈbafə(ɹ)/\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:27:00::\">\u003cstrong>1. 化学：能抵抗自身pH变化的离子化合物；缓冲物质\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：chemistry / chemical science\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(chemistry) an ionic compound that resists changes in its pH\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:15:00::\">\u003cstrong>2. 为降低冲突风险而在两个敌对势力之间设立的中立缓冲区\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a neutral zone between two rival powers that is created in order to diminish the danger of conflict\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:06:02::\">\u003cstrong>3. 机车前端用于清除轨道障碍的倾斜金属架；排障器\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an inclined metal frame at the front of a locomotive to clear the track\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:06:03::\">\u003cstrong>4. 计算机：暂存待传送数据的内存区，用来补偿部件间数据流速差异\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：computer science / computing\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(computer science) a part of RAM used for temporary storage of data that is waiting to be sent to a device; used to compensate for differences in the rate of flow of data between components of a computer system\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:06:01::\">\u003cstrong>5. 用于抛光表面的电动工具\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a power tool used to buff surfaces\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:06:00::\">\u003cstrong>6. 减少撞击冲击的垫状装置；缓冲器\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a cushion-like device that reduces shock due to an impact\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%1:06:04::\">\u003cstrong>7. 软材料装在块体上、用于美甲等抛光的工具\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an implement consisting of soft material mounted on a block; used for polishing (as in manicuring)\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>buffer \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/buffer\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈbʌfə(ɹ)/ · US /ˈbʌfɚ/ · AU /ˈbafə(ɹ)/\u003c/p>\u003cp data-dictionary-sense=\"buffer%2:30:00::\">\u003cstrong>1. 加入缓冲液\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">add a buffer (a solution)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：buffered saline solution for the eyes\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"buffer%2:35:00::\">\u003cstrong>2. 保护，使免受冲击\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">protect from impact\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：cushion the blow\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":9},"x":{"short":"缓冲时间或资源","cue":"当前用法","b":"buffer是预留来应对变化的余量。这里的两天不是已经发生的延期，而是计划里给评审留出的弹性；还应分清正常评审时长和额外缓冲。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","buffer的缓冲义早期指吸收碰撞、减轻冲击的装置，后来也用于能缓和冲击的事物。计划中的时间余量可以承担相似作用；这不是说每一份时间缓冲都源于某一种机器。","https://www.etymonline.com/word/buffer"],["帮助理解的现代联系","用软垫承接冲击来联想：小变化先落在余量里，不必立刻挤到后面的工作。这个图像解释缓冲的用途，却不保证任何大小的变化都能被它吸收。","https://www.oxfordlearnersdictionaries.com/definition/english/buffer_1"],["回到当前用法","buffer是预留来应对变化的余量。这里的两天不是已经发生的延期，而是计划里给评审留出的弹性；还应分清正常评审时长和额外缓冲。","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]}},{"w":{"id":"V20261012-011","date":"2026-10-12","term":"sequence","ipa":"ˈsiːkwəns","pos":"n.","meaning":"行动或步骤的先后顺序","chunk":"the correct sequence","example":"Let's agree on the sequence of the remaining activities.","level":"核心","gloss":"顺序","explanation":"行动或步骤的先后顺序","examples":[{"en":"Let's agree on the sequence of the remaining activities.","zh":"我们来商定剩余活动的先后顺序。"},{"en":"The assembly sequence has changed.","zh":"装配顺序已经改变。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Let's agree on the sequence of the remaining activities.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 sequence 记成步骤编号：同样几件事，换个顺序可能就做不下去。先装零件还是先检验，影响的是过程安排。本句要商定剩余活动的衔接，而不是重新决定项目究竟要交付什么。","sourceIds":["lexical","method"],"claimIds":["c2"],"requirements":{"anchor":"把 sequence 记成步骤编号：同样几件事，换个顺序可能就做不下去。","explanation":"先装零件还是先检验，影响的是过程安排。","example":"把 sequence 记成步骤编号：同样几件事，换个顺序可能就做不下去。","boundary":"本句要商定剩余活动的衔接，而不是重新决定项目究竟要交付什么。"},"sources":[["Oxford — sequence","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g2","title":"句法与概念","text":"Let's agree on 是提议一起商定，on 后接 the sequence；of the remaining activities 说明哪些活动的顺序。Let's 通常把说话者包含在内，但是否真的共同决策仍取决于实际场合与权限。","sourceIds":["lexical","method"],"claimIds":["c3"],"requirements":{"anchor":"Let's agree on 是提议一起商定，on 后接 the sequence；of the remaining activities 说明哪些活动的顺序。","explanation":"Let's 通常把说话者包含在内，但是否真的共同决策仍取决于实际场合与权限。","example":"Let's agree on 是提议一起商定，on 后接 the sequence；of the remaining activities 说明哪些活动的顺序。","boundary":"Let's 通常把说话者包含在内，但是否真的共同决策仍取决于实际场合与权限。"},"sources":[["Oxford — sequence","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g3","title":"辨析与英文邻居","text":"sequence 侧重前后排列，schedule 还包含何时做、多久完成。priority 侧重先重视什么，未必等同实际执行顺序。自然搭配有 in sequence 与 a sequence of steps，帮助你识别步骤的连接。","sourceIds":["lexical","method"],"claimIds":["c4"],"requirements":{"anchor":"sequence 侧重前后排列，schedule 还包含何时做、多久完成。","explanation":"priority 侧重先重视什么，未必等同实际执行顺序。","example":"sequence 侧重前后排列，schedule 还包含何时做、多久完成。","boundary":"自然搭配有 in sequence 与 a sequence of steps，帮助你识别步骤的连接。"},"sources":[["Oxford — sequence","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g4","title":"这句话在做什么","text":"说话者在邀请大家把剩余工作的顺序商定下来。Let’s agree on提出共同讨论，remaining限定还没做完的活动。自编回应：Should we inspect the parts before assembly?（我们应该先检查零件再装配吗？）回应提出一个具体顺序供确认。","sourceIds":["lexical","method"],"claimIds":["c5"],"requirements":{"anchor":"说话者在邀请大家把剩余工作的顺序商定下来。","explanation":"Let’s agree on提出共同讨论，remaining限定还没做完的活动。","example":"Let’s agree on提出共同讨论，remaining限定还没做完的活动。","boundary":"自编回应：Should we inspect the parts before assembly?（我们应该先检查零件再装配吗？）回应提出一个具体顺序供确认。"},"sources":[["Oxford — sequence","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"交接流程时，可以问：Could you walk me through the assembly sequence?（你能给我讲一下装配顺序吗？自编。）把assembly换成testing，就在问测试步骤；walk me through请对方一步步说明，不只给出几个任务名称。","sourceIds":["lexical","method"],"claimIds":["c6"],"requirements":{"anchor":"交接流程时，可以问：Could you walk me through the assembly sequence?（你能给我讲一下装配顺序吗？自编。","explanation":"）把assembly换成testing，就在问测试步骤；walk me through请对方一步步说明，不只给出几个任务名称。","example":"交接流程时，可以问：Could you walk me through the assembly sequence?（你能给我讲一下装配顺序吗？自编。","boundary":"）把assembly换成testing，就在问测试步骤；walk me through请对方一步步说明，不只给出几个任务名称。"},"sources":[["Oxford — sequence","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["APM — Scheduling in project management","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]}]},"p":{"displayGloss":"顺序","focused":[{"entry":{"lemma":"sequence","pos":"n.","senses":[{"id":"V20261012-011:current","glossZh":"行动或步骤的先后顺序","definitionEn":"the order in which related actions happen","sourceIds":["lexical","method"]}]},"sense":{"id":"V20261012-011:current","glossZh":"行动或步骤的先后顺序","definitionEn":"the order in which related actions happen","sourceIds":["lexical","method"]}}],"allEntries":[{"lemma":"sequence","pos":"可数名词","senses":[{"id":"V20261012-011:extra","glossZh":"按特定次序排列的一组事物或事件","definitionEn":"an ordered series of events, actions or numbers","sourceIds":["lexical"]}]}],"contextTakeaway":"共同商定剩余活动的先后顺序。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-011\">\u003ch3>sequence · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"sequence-learner-1\">\u003cstrong>1. 按某种顺序发生或排列的一连串事物。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a sequence of events\u003cbr>\u003cspan class=\"en\" lang=\"en\">A sequence of small mistakes caused the failure.\u003c/span>\u003cbr>一连串小错误导致了这次失败。\u003c/p>\u003cp data-learner-sense=\"sequence-learner-2\">\u003cstrong>2. 事物先后排列的顺序。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：in sequence; in the correct sequence\u003cbr>\u003cspan class=\"en\" lang=\"en\">Put the photographs in chronological sequence.\u003c/span>\u003cbr>把这些照片按时间顺序排列。\u003c/p>\u003cp data-learner-sense=\"sequence-learner-3\">\u003cstrong>3. 围绕同一事件或主题的一段连续镜头。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，影视〕\u003c/small>\u003cbr>用法：an opening / action sequence\u003cbr>\u003cspan class=\"en\" lang=\"en\">The film opens with a short dream sequence.\u003c/span>\u003cbr>电影以一小段梦境镜头开场。\u003c/p>\u003cp data-learner-sense=\"sequence-learner-4\">\u003cstrong>4. 给事物排序；在科学中也指测定成分的先后次序。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：sequence activities; sequence DNA\u003cbr>\u003cspan class=\"en\" lang=\"en\">The researchers sequenced the DNA sample.\u003c/span>\u003cbr>研究人员对这份DNA样本进行了测序。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/sequence_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>sequence \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/sequence\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈsiːkwəns/\u003c/p>\u003cp data-dictionary-sense=\"sequence%1:14:00::\">\u003cstrong>1. 按逻辑顺序或重复规律排列的序列\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">serial arrangement in which things follow in logical order or a recurrent pattern\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the sequence of names was alphabetical\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he invented a technique to determine the sequence of base pairs in DNA\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"sequence%1:07:00::\">\u003cstrong>2. 时间上一件接着一件的先后次序\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a following of one thing after another in time\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the doctor saw a sequence of patients\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"sequence%1:06:00::\">\u003cstrong>3. 电影中围绕同一主题的一组连续相关镜头\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">film consisting of a succession of related shots that develop a given subject in a movie\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"sequence%1:04:00::\">\u003cstrong>4. 依次跟随的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the action of following in order\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he played the trumps in sequence\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"sequence%1:11:00::\">\u003cstrong>5. 音乐：同一旋律乐句在不同调上重复数次；模进\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">several repetitions of a melodic phrase in different keys\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>sequence \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/sequence\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈsiːkwəns/\u003c/p>\u003cp data-dictionary-sense=\"sequence%2:31:00::\">\u003cstrong>1. 按顺序排列\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">arrange in a sequence\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"sequence%2:32:00::\">\u003cstrong>2. 确定组成成分的顺序；测序\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">determine the order of constituents in\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：They sequenced the human genome\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":7},"x":{"short":"顺序","cue":"当前用法","b":"sequence强调先后衔接。原句不是重新列出还有什么工作，而是要商定剩下这些活动按什么次序进行；日期和持续多久则还需要另行排程。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","sequence与拉丁语sequi“跟随”一族有关，早期英语有宗教音乐用法，后来泛指按次序跟在一起的一系列事物。如今既可指一串步骤，也可强调这些步骤的排列次序。","https://www.etymonline.com/word/sequence"],["帮助理解的现代联系","把步骤排成1、2、3：每一步跟在哪一步后面？同样一组任务，排列不同，过程也可能不同。这个编号联系帮助记忆，不要求每个sequence都写成数字清单。","https://www.oxfordlearnersdictionaries.com/definition/english/sequence_1"],["回到当前用法","sequence强调先后衔接。原句不是重新列出还有什么工作，而是要商定剩下这些活动按什么次序进行；日期和持续多久则还需要另行排程。","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]}},{"w":{"id":"V20261012-012","date":"2026-10-12","term":"capacity","ipa":"kəˈpæsəti","pos":"n.","meaning":"团队或系统能够承担工作的能力与数量","chunk":"available capacity","example":"We do not have enough capacity to start both projects.","level":"核心","gloss":"承载能力；产能","explanation":"团队或系统能够承担工作的能力与数量","examples":[{"en":"We do not have enough capacity to start both projects.","zh":"我们没有足够资源和余力同时启动两个项目。"},{"en":"The plant is operating at full capacity.","zh":"工厂正满负荷运转。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We do not have enough capacity to start both projects.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用容器容量来联系团队工作量：会做不等于还能再接。这个类比帮助你理解，本句可能是在说可投入的人员与时间不够；要进一步追问瓶颈，不能据此给团队能力差下结论。","sourceIds":["lexical","method"],"claimIds":["c2"],"requirements":{"anchor":"用容器容量来联系团队工作量：会做不等于还能再接。","explanation":"这个类比帮助你理解，本句可能是在说可投入的人员与时间不够；要进一步追问瓶颈，不能据此给团队能力差下结论。","example":"这个类比帮助你理解，本句可能是在说可投入的人员与时间不够；要进一步追问瓶颈，不能据此给团队能力差下结论。","boundary":"这个类比帮助你理解，本句可能是在说可投入的人员与时间不够；要进一步追问瓶颈，不能据此给团队能力差下结论。"},"sources":[["Oxford — capacity","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"do not have enough capacity 是否定足够的承载量，to start both projects 说明拟承担的动作。both 指两个项目都启动。它不表示两个项目一个也不能做，也没有说以后永远不能同时开展。","sourceIds":["lexical","method"],"claimIds":["c3"],"requirements":{"anchor":"do not have enough capacity 是否定足够的承载量，to start both projects 说明拟承担的动作。","explanation":"both 指两个项目都启动。","example":"do not have enough capacity 是否定足够的承载量，to start both projects 说明拟承担的动作。","boundary":"它不表示两个项目一个也不能做，也没有说以后永远不能同时开展。"},"sources":[["Oxford — capacity","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g3","title":"辨析与英文邻居","text":"capacity 在此强调能承接多少工作；capability 常用于说明有没有完成某类工作的能力，两者语义仍会重叠。busy 是笼统地忙，available capacity 则有助于具体谈还能分配多少人时。","sourceIds":["lexical","method"],"claimIds":["c4"],"requirements":{"anchor":"capacity 在此强调能承接多少工作；capability 常用于说明有没有完成某类工作的能力，两者语义仍会重叠。","explanation":"busy 是笼统地忙，available capacity 则有助于具体谈还能分配多少人时。","example":"capacity 在此强调能承接多少工作；capability 常用于说明有没有完成某类工作的能力，两者语义仍会重叠。","boundary":"busy 是笼统地忙，available capacity 则有助于具体谈还能分配多少人时。"},"sources":[["Oxford — capacity","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句在对同时启动两个项目提出资源方面的异议。not enough表明数量不够，both把要求限定为两个都启动。自编回应：Which project should we start first?（我们应先启动哪一个？）这样可把讨论转向先后安排，或再寻找可增加的资源。","sourceIds":["lexical","method"],"claimIds":["c5"],"requirements":{"anchor":"本句在对同时启动两个项目提出资源方面的异议。","explanation":"not enough表明数量不够，both把要求限定为两个都启动。","example":"not enough表明数量不够，both把要求限定为两个都启动。","boundary":"自编回应：Which project should we start first?（我们应先启动哪一个？）这样可把讨论转向先后安排，或再寻找可增加的资源。"},"sources":[["Oxford — capacity","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"接受额外任务前，可以问：Do we have capacity for another review this week?（本周我们还有余力再安排一次评审吗？自编。）for后说拟增加的工作，this week限定当前时段；这是核实负荷，不是笼统评价团队强弱。","sourceIds":["lexical","method"],"claimIds":["c6"],"requirements":{"anchor":"接受额外任务前，可以问：Do we have capacity for another review this week?（本周我们还有余力再安排一次评审吗？自编。","explanation":"）for后说拟增加的工作，this week限定当前时段；这是核实负荷，不是笼统评价团队强弱。","example":"接受额外任务前，可以问：Do we have capacity for another review this week?（本周我们还有余力再安排一次评审吗？自编。","boundary":"）for后说拟增加的工作，this week限定当前时段；这是核实负荷，不是笼统评价团队强弱。"},"sources":[["Oxford — capacity","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]}]},"p":{"displayGloss":"承载能力；产能","focused":[{"entry":{"lemma":"capacity","pos":"n.","senses":[{"id":"V20261012-012:current","glossZh":"团队或系统能够承担工作的能力与数量","definitionEn":"the amount of work a team can take on","sourceIds":["lexical","method"]}]},"sense":{"id":"V20261012-012:current","glossZh":"团队或系统能够承担工作的能力与数量","definitionEn":"the amount of work a team can take on","sourceIds":["lexical","method"]}}],"allEntries":[{"lemma":"capacity","pos":"名词","senses":[{"id":"V20261012-012:extra","glossZh":"容器或空间能够容纳的量","definitionEn":"the amount a container or space can hold","sourceIds":["lexical"]}]}],"contextTakeaway":"现有承载量不足以同时启动两项。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-012\">\u003ch3>capacity · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"capacity-learner-1\">\u003cstrong>1. 容器或场所能容纳的数量。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：a capacity of; at full capacity\u003cbr>\u003cspan class=\"en\" lang=\"en\">The hall has a capacity of three hundred people.\u003c/span>\u003cbr>大厅可容纳三百人。\u003c/p>\u003cp data-learner-sense=\"capacity-learner-2\">\u003cstrong>2. 在一定条件下能生产或承接的最大工作量。\u003c/strong>\u003cbr>\u003csmall>名词〔通常不可数〕\u003c/small>\u003cbr>用法：production capacity; capacity to do\u003cbr>\u003cspan class=\"en\" lang=\"en\">The factory lacks the capacity to meet the new demand.\u003c/span>\u003cbr>工厂的产能不足以满足新增需求。\u003c/p>\u003cp data-learner-sense=\"capacity-learner-3\">\u003cstrong>3. 做某事、理解某事或感受某事的能力。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：a capacity for; the capacity to learn\u003cbr>\u003cspan class=\"en\" lang=\"en\">Children have a remarkable capacity to learn languages.\u003c/span>\u003cbr>儿童学习语言的能力很强。\u003c/p>\u003cp data-learner-sense=\"capacity-learner-4\">\u003cstrong>4. 某人所具有的身份或承担的职能。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，正式〕\u003c/small>\u003cbr>用法：in a personal / official capacity; in one&#39;s capacity as\u003cbr>\u003cspan class=\"en\" lang=\"en\">She attended in her capacity as chair of the committee.\u003c/span>\u003cbr>她以委员会主席的身份出席。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/capacity\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>capacity \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/capacity\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /kəˈpæsɪti/\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:07:00::\">\u003cstrong>1. 执行或生产的能力\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">capability to perform or produce\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：among his gifts is his capacity for true altruism\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：limited runway capacity\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a great capacity for growth\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:26:00::\">\u003cstrong>2. 某物接受特定处理的可能性或易受影响程度\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the susceptibility of something to a particular treatment\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the capability of a metal to be fused\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:23:00::\">\u003cstrong>3. 可以容纳的数量；容量\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the amount that can be contained\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the gas tank has a capacity of 12 gallons\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:04:00::\">\u003cstrong>4. 可能达到的最高产量；产能\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the maximum production possible\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the plant is working at 80 per cent capacity\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:04:01::\">\u003cstrong>5. 特定职能或身份\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a specified function\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he was employed in the capacity of director\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he should be retained in his present capacity at a higher salary\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:23:01::\">\u003cstrong>6. 计算机：磁盘驱动器可存储的信息量，以字节计\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：computer science / computing\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(computer science) the amount of information (in bytes) that can be stored on a disk drive\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the capacity of a hard disk drive is usually expressed in megabytes\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:19:00::\">\u003cstrong>7. 储存电荷的电学现象；电容\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an electrical phenomenon whereby an electric charge is stored\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:09:00::\">\u003cstrong>8. 学习或记忆知识的能力；法律上理解自己行为的事实与意义的能力\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the power to learn or retain knowledge; in law, the ability to understand the facts and significance of your behavior\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"capacity%1:07:01::\">\u003cstrong>9. 对酒精的耐受力；酒量\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">tolerance for alcohol\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he had drunk beyond his capacity\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":9},"x":{"short":"承载能力；产能","cue":"当前用法","b":"capacity在这里谈团队能承接多少工作。原句说不足以启动两个项目，可能涉及人力、时间或其他资源；需要问清哪部分不足，而不是立刻判断团队技术差。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","capacity经法语与拉丁语中“能够容纳”的词相连，英语早期也有能力方面的用法。现代既谈容器装得下多少，也谈人或系统能做多少；不能把工作中的capacity只译成物理体积。","https://www.etymonline.com/word/capacity"],["帮助理解的现代联系","把团队可用时间想成能装工作的空间：会做某件事，不等于还有余量同时再接一件。这个容量类比帮助区分“有没有能力做”和“当前还能承担多少”。","https://www.oxfordlearnersdictionaries.com/definition/english/capacity"],["回到当前用法","capacity在这里谈团队能承接多少工作。原句说不足以启动两个项目，可能涉及人力、时间或其他资源；需要问清哪部分不足，而不是立刻判断团队技术差。","https://www.apm.org.uk/blog/what-is-resource-management/"]]}},{"w":{"id":"V20261012-013","date":"2026-10-12","term":"allocate","ipa":"ˈæləkeɪt","pos":"v.","meaning":"把时间、人员或资源分配给某项工作","chunk":"allocate resources","example":"We should allocate more time to the initial review.","level":"提升","gloss":"分配","explanation":"把时间、人员或资源分配给某项工作","examples":[{"en":"We should allocate more time to the initial review.","zh":"我们应给初步评审分配更多时间。"},{"en":"Allocate two engineers to the trial.","zh":"为试验分配两名工程师。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We should allocate more time to the initial review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 allocate 记成给时间、资金或人员划份额：总量有限，就要说明哪一部分留给哪项工作。本句说给初步评审更多时间，是资源安排的建议，不只是提醒大家更认真地评审。","sourceIds":["lexical","method"],"claimIds":["c2"],"requirements":{"anchor":"把 allocate 记成给时间、资金或人员划份额：总量有限，就要说明哪一部分留给哪项工作。","explanation":"本句说给初步评审更多时间，是资源安排的建议，不只是提醒大家更认真地评审。","example":"把 allocate 记成给时间、资金或人员划份额：总量有限，就要说明哪一部分留给哪项工作。","boundary":"本句说给初步评审更多时间，是资源安排的建议，不只是提醒大家更认真地评审。"},"sources":[["Oxford — allocate","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g2","title":"句法与概念","text":"should allocate 表示建议，allocate 的宾语是 more time，to the initial review 指分配去向。more 是相对原安排增加多少，但句中未给具体数值；initial review 指初步评审而非最后验收。","sourceIds":["lexical","method"],"claimIds":["c3"],"requirements":{"anchor":"should allocate 表示建议，allocate 的宾语是 more time，to the initial review 指分配去向。","explanation":"more 是相对原安排增加多少，但句中未给具体数值；initial review 指初步评审而非最后验收。","example":"should allocate 表示建议，allocate 的宾语是 more time，to the initial review 指分配去向。","boundary":"more 是相对原安排增加多少，但句中未给具体数值；initial review 指初步评审而非最后验收。"},"sources":[["Oxford — allocate","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g3","title":"辨析与英文邻居","text":"allocate 强调把资源配置到某处，spend 强调资源被花掉。可以先 allocate time，再实际 spend time；前者并不保证后者已发生。assign 常用于分派任务，而 allocate time 更清楚地谈时间份额。","sourceIds":["lexical","method"],"claimIds":["c4"],"requirements":{"anchor":"allocate 强调把资源配置到某处，spend 强调资源被花掉。","explanation":"可以先 allocate time，再实际 spend time；前者并不保证后者已发生。","example":"allocate 强调把资源配置到某处，spend 强调资源被花掉。","boundary":"assign 常用于分派任务，而 allocate time 更清楚地谈时间份额。"},"sources":[["Oxford — allocate","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g4","title":"这句话在做什么","text":"本句是在建议调整时间分配。should表明建议，more time指出增加哪种资源，to说明用途。自编回应：How much extra time do you suggest?（你建议再增加多少时间？）回应把方向变成具体数字，便于重新排计划。","sourceIds":["lexical","method"],"claimIds":["c5"],"requirements":{"anchor":"本句是在建议调整时间分配。","explanation":"should表明建议，more time指出增加哪种资源，to说明用途。","example":"should表明建议，more time指出增加哪种资源，to说明用途。","boundary":"自编回应：How much extra time do you suggest?（你建议再增加多少时间？）回应把方向变成具体数字，便于重新排计划。"},"sources":[["Oxford — allocate","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"排评审时间时，可以问：Can we allocate two hours to the design review?（我们能给设计评审安排两小时吗？自编。）把two hours换成half a day，便能提出另一份额；to后写具体用途，让人容易核对安排。","sourceIds":["lexical","method"],"claimIds":["c6"],"requirements":{"anchor":"排评审时间时，可以问：Can we allocate two hours to the design review?（我们能给设计评审安排两小时吗？自编。","explanation":"）把two hours换成half a day，便能提出另一份额；to后写具体用途，让人容易核对安排。","example":"排评审时间时，可以问：Can we allocate two hours to the design review?（我们能给设计评审安排两小时吗？自编。","boundary":"）把two hours换成half a day，便能提出另一份额；to后写具体用途，让人容易核对安排。"},"sources":[["Oxford — allocate","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["APM — What is resource management?","https://www.apm.org.uk/blog/what-is-resource-management/"]]}]},"p":{"displayGloss":"分配","focused":[{"entry":{"lemma":"allocate","pos":"v.","senses":[{"id":"V20261012-013:current","glossZh":"把时间、人员或资源分配给某项工作","definitionEn":"to assign part of the available resources to a purpose","sourceIds":["lexical","method"]}]},"sense":{"id":"V20261012-013:current","glossZh":"把时间、人员或资源分配给某项工作","definitionEn":"to assign part of the available resources to a purpose","sourceIds":["lexical","method"]}}],"allEntries":[{"lemma":"allocation","pos":"同族名词","senses":[{"id":"V20261012-013:extra","glossZh":"为特定用途分配的份额；分配行为","definitionEn":"an assigned share of resources, or the act of assigning it","sourceIds":["extra"]}]}],"contextTakeaway":"建议给初步评审增加时间份额。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-013\">\u003ch3>allocate · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"allocate-learner-1\">\u003cstrong>1. 把资金、时间、空间等分给特定的人或用途。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：allocate something to someone; allocate someone something; allocate something for something\u003cbr>\u003cspan class=\"en\" lang=\"en\">The school allocated extra funds to the library.\u003c/span>\u003cbr>学校给图书馆增拨了经费。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/allocate\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>allocate \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/allocate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈæl.ə.keɪt/\u003c/p>\u003cp data-dictionary-sense=\"allocate%2:40:00::\">\u003cstrong>1. 按计划分配，或拨出作特定用途\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">distribute according to a plan or set apart for a special purpose\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They allocate the money to them\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They allocate them the money\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：I am allocating a loaf of bread to everyone on a daily basis\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：I&#39;m allocating the rations for the camping trip\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Somebody ----s something to somebody\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":1},"x":{"short":"分配","cue":"当前用法","b":"allocate着重资源安排：把多少时间、资金或人员分给哪项工作。原句建议给初步评审增加时间份额，下一步应把“更多”说成具体时长。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","allocate与拉丁语allocare“分配、安排”相连，其构成包含“放置”的词根。可以理解它有把某份资源安排到某个用途的历史联系；现代用法仍要说明分配什么、分给哪里。","https://www.etymonline.com/word/allocate"],["帮助理解的现代联系","想象把有限时间分成几份，给评审留出其中一份。allocate说明资源被安排到某个用途，和之后是否已经实际花掉这些时间是两件事。","https://www.oxfordlearnersdictionaries.com/definition/english/allocate"],["回到当前用法","allocate着重资源安排：把多少时间、资金或人员分给哪项工作。原句建议给初步评审增加时间份额，下一步应把“更多”说成具体时长。","https://www.apm.org.uk/blog/what-is-resource-management/"]]}},{"w":{"id":"V20261012-014","date":"2026-10-12","term":"delegate","ipa":"ˈdelɪɡeɪt","pos":"v.","meaning":"把具体任务及适当权限交给别人","chunk":"delegate a task","example":"You can delegate the data collection to another team member.","level":"提升","gloss":"委派","explanation":"把具体任务及适当权限交给别人","examples":[{"en":"You can delegate the data collection to another team member.","zh":"你可以把数据收集委派给另一位团队成员。"},{"en":"Managers should delegate routine approvals.","zh":"经理应委派常规审批工作。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"You can delegate the data collection to another team member.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记成把一块明确的工作交给合适的人处理。这里交出去的是数据收集，不是把整个项目丢给别人；记住“交什么、交给谁”，再在实际分工里确认完成标准和需要的权限。","sourceIds":["lexical","method"],"claimIds":["c2"],"requirements":{"anchor":"记成把一块明确的工作交给合适的人处理。","explanation":"这里交出去的是数据收集，不是把整个项目丢给别人；记住“交什么、交给谁”，再在实际分工里确认完成标准和需要的权限。","example":"这里交出去的是数据收集，不是把整个项目丢给别人；记住“交什么、交给谁”，再在实际分工里确认完成标准和需要的权限。","boundary":"这里交出去的是数据收集，不是把整个项目丢给别人；记住“交什么、交给谁”，再在实际分工里确认完成标准和需要的权限。"},"sources":[["Oxford — delegate","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["APM — Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g2","title":"句法与概念","text":"can delegate 表示可以采取的做法；the data collection 是委派的任务，to another team member 指接收者。本句用 delegate 作动词，不是会议代表这个名词义，也没有直接宣布某位同事已接手。","sourceIds":["lexical","method"],"claimIds":["c3"],"requirements":{"anchor":"can delegate 表示可以采取的做法；the data collection 是委派的任务，to another team member 指接收者。","explanation":"本句用 delegate 作动词，不是会议代表这个名词义，也没有直接宣布某位同事已接手。","example":"can delegate 表示可以采取的做法；the data collection 是委派的任务，to another team member 指接收者。","boundary":"本句用 delegate 作动词，不是会议代表这个名词义，也没有直接宣布某位同事已接手。"},"sources":[["Oxford — delegate","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["APM — Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g3","title":"辨析与英文邻居","text":"delegate 强调由别人代为承担任务或职责；allocate 更强调分配资源份额。给某人两天时间可说 allocate time，把数据收集工作交给某人可说 delegate the task；别只给任务而漏了必要说明。","sourceIds":["lexical","method"],"claimIds":["c4"],"requirements":{"anchor":"delegate 强调由别人代为承担任务或职责；allocate 更强调分配资源份额。","explanation":"给某人两天时间可说 allocate time，把数据收集工作交给某人可说 delegate the task；别只给任务而漏了必要说明。","example":"delegate 强调由别人代为承担任务或职责；allocate 更强调分配资源份额。","boundary":"给某人两天时间可说 allocate time，把数据收集工作交给某人可说 delegate the task；别只给任务而漏了必要说明。"},"sources":[["Oxford — delegate","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["APM — Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g4","title":"这句话在做什么","text":"说话者在提供分工选项。You can表示可以这样做，to another team member给出接手者范围。自编回应：Can I delegate it to Mei after checking her availability?（确认梅有空后，我可以交给她吗？）下一步是确认人选和任务要求。","sourceIds":["lexical","method"],"claimIds":["c5"],"requirements":{"anchor":"说话者在提供分工选项。","explanation":"You can表示可以这样做，to another team member给出接手者范围。","example":"You can表示可以这样做，to another team member给出接手者范围。","boundary":"自编回应：Can I delegate it to Mei after checking her availability?（确认梅有空后，我可以交给她吗？）下一步是确认人选和任务要求。"},"sources":[["Oxford — delegate","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["APM — Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]},{"id":"g5","title":"工作中可以这样说","text":"开启交接时，可以说：I’d like to delegate the weekly data check to you.（我想把每周的数据检查委派给你。自编。）把the weekly data check换成另一具体任务；随后说明需要检查什么和何时反馈，而不是只留下这一句。","sourceIds":["lexical","method"],"claimIds":["c6"],"requirements":{"anchor":"开启交接时，可以说：I’d like to delegate the weekly data check to you.（我想把每周的数据检查委派给你。","explanation":"自编。","example":"开启交接时，可以说：I’d like to delegate the weekly data check to you.（我想把每周的数据检查委派给你。","boundary":"）把the weekly data check换成另一具体任务；随后说明需要检查什么和何时反馈，而不是只留下这一句。"},"sources":[["Oxford — delegate","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["APM — Seven tips on how to delegate effectively","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]}]},"p":{"displayGloss":"委派","focused":[{"entry":{"lemma":"delegate","pos":"v.","senses":[{"id":"V20261012-014:current","glossZh":"把具体任务及适当权限交给别人","definitionEn":"to give another person a task or responsibility to perform","sourceIds":["lexical","method"]}]},"sense":{"id":"V20261012-014:current","glossZh":"把具体任务及适当权限交给别人","definitionEn":"to give another person a task or responsibility to perform","sourceIds":["lexical","method"]}}],"allEntries":[{"lemma":"delegate","pos":"动词·常用被动式","senses":[{"id":"V20261012-014:extra","glossZh":"选派某人做某事","definitionEn":"choose someone to carry out a task","sourceIds":["lexical"]}]}],"contextTakeaway":"可以把数据收集工作交给其他同事。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-014\">\u003ch3>delegate · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"delegate-learner-1\">\u003cstrong>1. 把职责、任务或权力交给他人代为承担。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：delegate something to someone; learn to delegate\u003cbr>\u003cspan class=\"en\" lang=\"en\">She delegated the booking arrangements to her assistant.\u003c/span>\u003cbr>她把预订安排交给了助理。\u003c/p>\u003cp data-learner-sense=\"delegate-learner-2\">\u003cstrong>2. 委派某人代表他人执行一项工作。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，通常被动〕\u003c/small>\u003cbr>用法：be delegated to do something\u003cbr>\u003cspan class=\"en\" lang=\"en\">Two members were delegated to inspect the site.\u003c/span>\u003cbr>两名成员被委派去检查现场。\u003c/p>\u003cp data-learner-sense=\"delegate-learner-3\">\u003cstrong>3. 被选出或派出代表他人参加会议等的代表。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a conference delegate; 名词末尾读/ɡət/，动词读/ɡeɪt/\u003cbr>\u003cspan class=\"en\" lang=\"en\">Each school sent two delegates to the conference.\u003c/span>\u003cbr>每所学校派了两名代表参会。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/delegate_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>delegate \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/delegate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈdɛlɪɡət/\u003c/p>\u003cp data-dictionary-sense=\"delegate%1:18:00::\">\u003cstrong>1. 经任命或选举代表他人的代表\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a person appointed or elected to represent others\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>delegate \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/delegate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈdɛlɪɡət/\u003c/p>\u003cp data-dictionary-sense=\"delegate%2:41:01::\">\u003cstrong>1. 把权力授予他人\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">transfer power to someone\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something to somebody\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"delegate%2:41:00::\">\u003cstrong>2. 指派某人担任职务或执行任务\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">give an assignment to (a person) to a post, or assign a task to (a person)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They delegate him to write the letter\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody something / Somebody ----s somebody PP / Somebody ----s something to somebody\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"委派","cue":"当前用法","b":"delegate说明由别人代为承担部分工作或职责。原句提出把数据收集交给另一位成员；要让交接可执行，还需说清范围、完成时间和遇到问题找谁。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","delegate与拉丁语“派作代表”的表达有关，英语动词早期也有授权代表处理事务的意思。今天把工作交给别人时仍带有托付任务或职责的联系，不只是把文件发送出去。","https://www.etymonline.com/word/delegate"],["帮助理解的现代联系","可以记成“交一块工作给别人负责处理”。被交出去的是任务，也往往需要相应的说明和权限；名词delegate还可指代表，但本句使用的是动词。","https://www.oxfordlearnersdictionaries.com/definition/english/delegate_2"],["回到当前用法","delegate说明由别人代为承担部分工作或职责。原句提出把数据收集交给另一位成员；要让交接可执行，还需说清范围、完成时间和遇到问题找谁。","https://www.apm.org.uk/blog/seven-tips-on-how-to-delegate-effectively/"]]}},{"w":{"id":"V20261012-015","date":"2026-10-12","term":"ownership","ipa":"ˈəʊnəʃɪp","pos":"n.","meaning":"对事项负责并推动到结果的责任归属","chunk":"take ownership","example":"Who will take ownership of this open item?","level":"核心","gloss":"责任归属","explanation":"对事项负责并推动到结果的责任归属","examples":[{"en":"Who will take ownership of this open item?","zh":"谁来负责推进这项未结事项？"},{"en":"Clear ownership prevents duplicated work.","zh":"明确责任归属可避免重复工作。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Who will take ownership of this open item?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 take ownership 联系到“这件事由我跟进”，就能从财产所有权切到工作责任。本句的 open item 是尚未结清的事项；需要有人推动和协调，不等于此人必须独自完成每一个动作。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"把 take ownership 联系到“这件事由我跟进”，就能从财产所有权切到工作责任。","explanation":"本句的 open item 是尚未结清的事项；需要有人推动和协调，不等于此人必须独自完成每一个动作。","example":"把 take ownership 联系到“这件事由我跟进”，就能从财产所有权切到工作责任。","boundary":"本句的 open item 是尚未结清的事项；需要有人推动和协调，不等于此人必须独自完成每一个动作。"},"sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]},{"id":"g2","title":"句法与概念","text":"Who will take ownership of ...? 询问未来由谁承担责任；of 后接 this open item，明确负责对象。ownership 在这里是不可数名词。问句尚未指定负责人，不能读成已经把任务交给听话的人。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"Who will take ownership of ...? 询问未来由谁承担责任；of 后接 this open com/definition/english/ownership"]]}]},"p":{"displayGloss":"责任归属","focused":[{"entry":{"lemma":"ownership","pos":"n.","senses":[{"id":"V20261012-015:current","glossZh":"对事项负责并推动到结果的责任归属","definitionEn":"responsibility for seeing an issue or piece of work through","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-015:current","glossZh":"对事项负责并推动到结果的责任归属","definitionEn":"responsibility for seeing an issue or piece of work through","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"ownership","pos":"不可数名词","senses":[{"id":"V20261012-015:extra","glossZh":"对财产或事物的所有权","definitionEn":"the state of legally owning something","sourceIds":["lexical"]}]}],"contextTakeaway":"要明确谁跟进这项未结事项。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-015\">\u003ch3>ownership · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"ownership-learner-1\">\u003cstrong>1. 拥有某项财产或事物的状态或权利。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数〕\u003c/small>\u003cbr>用法：ownership of; transfer ownership\u003cbr>\u003cspan class=\"en\" lang=\"en\">Ownership of the building changed last year.\u003c/span>\u003cbr>这栋楼的所有权去年发生了变更。\u003c/p>\u003cp data-learner-sense=\"ownership-learner-2\">\u003cstrong>2. 对某项工作或问题承担责任并主动推动处理。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数，工作用语〕\u003c/small>\u003cbr>用法：take ownership of\u003cbr>\u003cspan class=\"en\" lang=\"en\">The new manager took ownership of the unresolved complaints.\u003c/span>\u003cbr>新经理接手负责处理尚未解决的投诉。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/ownership\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>ownership \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/ownership\">Open English WordNet 2025／Princeton  includes explaining actions and results","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"最终决定需要有明确的负责者。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-016\">\u003ch3>accountable · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"accountable-learner-1\">\u003cstrong>1. 必须对自己的决定或行为作出说明并承担责任的。\u003c/strong>\u003cbr>\u003csmall>形容词〔通常不直接放在名词前〕\u003c/small>\u003cbr>用法：accountable to someone for something; hold someone accountable\u003cbr>\u003cspan class=\"en\" lang=\"en\">The director is accountable to the board for the budget.\u003c/span>\u003cbr>主任须就预算向董事会负责。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/accountable\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/a\">\u003ch3>accountable \u003csmall>形容词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/accountable\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /əˈkaʊntəbl̩/\u003c/p>\u003cp data-dictionary-sense=\"accountable%5:00:00:responsible:00\">\u003cstrong>1. 有义务说明自己的行为并为之负责的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">liable to account for one&#39;s actions\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：governments must be accountable to someone beside themselves\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：fully accountable for what they did\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the court held the parents answerable for their minor child&#39;s acts of vandalism\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he was answerable to no one\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":1},"x":{"short":"须对结果负责的","cue":"当前用法","b":"重点不只是“有人做了”，而是“谁需要交代这个决定及其理由”。别人问起为何这样决定时，被指定 accountable 的人要能说明。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源：能够被要求交代","accountable 来自古法语 acontable，早期已有“须作交代”的意思。相关的 account 不只涉及计算，也涉及把受托财物的情况说明清楚；因此“负责”和“作解释”在这个词里联系很紧。","https://www.etymonline.com/word/accountable"],["现代联系：把理由交代清楚","可以联想有人问：“这件事为什么这样处理？”accountable 的人需要回答并承担责任。这里的“交代”帮助记住词义，不是说每次都在查账，也不必先发生错误才会谈责任。","https://www.oxfordlearnersdictionaries.com/definition/english/accountable"],["回到本句：最终决定找谁负责","accountable for the final decision 说的是对最终决定负责；accountable to someone 则说向谁交代。本句用 One person must，要求把责任落到一个明确的人身上，而不是只说大家都参与过。","https://www.oxfordlearnersdictionaries.com/definition/english/accountable"]]}},{"w":{"id":"V20261012-017","date":"2026-10-12","term":"deadline","ipa":"ˈdedlaɪn","pos":"n.","meaning":"必须完成某事的最后期限","chunk":"meet a deadline","example":"We need a decision today to meet the deadline.","level":"核心","gloss":"截止期限","explanation":"必须完成某事的最后期限","examples":[{"en":"We need a decision today to meet the deadline.","zh":"为赶上截止期限，我们今天需要作出决定。"},{"en":"The submission deadline is Monday.","zh":"提交截止日期是周一。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We need a decision today to meet the deadline.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 deadline 记成日历上最后可接受的完成点，常连着 meet 或 miss 一起学。本句把今天的决定与之后按期完成连起来，提醒人当前决定有时间影响，并没有交代最终截止是哪一天。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"把 deadline 记成日历上最后可接受的完成点，常连着 meet 或 miss 一起学。","explanation":"本句把今天的决定与之后按期完成连起来，提醒人当前决定有时间影响，并没有交代最终截止是哪一天。","example":"把 deadline 记成日历上最后可接受的完成点，常连着 meet 或 miss 一起学。","boundary":"本句把今天的决定与之后按期完成连起来，提醒人当前决定有时间影响，并没有交代最终截止是哪一天。"},"sources":[["Oxford — deadline","https://www.oxfordlearnersdictionaries.com/definition/english/deadline"]]},{"id":"g2","title":"句法与概念","text":"We need a decision today 是主要要求；to meet the deadline 说明为何今天需要决定。meet 在这里是按期达到要求，不是与期限见面。today 修饰需要决定的时间，不能直接当作最终项目截止日。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"We need a decision today 是主要要求；to meet the deadline 说明为何今天需要决定。","explanation":"meet 在这里是按期达到要求，不是与期限见面。","example":"We need a decision today 是主要要求；to meet the deadline 说明为何今天需要决定。","boundary":"today 修饰需要决定的时间，不能直接当作最终项目截止日。"},"sources":[["Oxford — deadline","https://www.oxfordlearnersdictionaries.com/definition/english/deadline"]]},{"id":"g3","title":"辨析与英文邻居","text":"deadline 是最晚期限，target date 可表示计划争取的日期，约束程度要看具体约定。milestone 强调重要进度节点，也可配截止日。把期限与节点名称一起说，通常比孤立报一个日期更清楚。","sourceIds":["lexical"],"claimIds":["c4"],"requirements":{"anchor":"deadline 是最晚期限，target date 可表示计划争取的日期，约束程度要看具体约定。","explanation":"milestone 强调重要进度节点，也可配截止日。","example":"deadline 是最晚期限，target date 可表示计划争取的日期，约束程度要看具体约定。","boundary":"把期限与节点名称一起说，通常比孤立报一个日期更清楚。"},"sources":[["Oxford — deadline","https://www.oxfordlearnersdictionaries.com/definition/english/deadline"]]},{"id":"g4","title":"这句话在做什么","text":"本句在要求今天作出决定，并给出时间理由。need a decision提出需要的答复，to meet the deadline解释目的。自编回应：What decision do you need from us today?（今天需要我们作出什么决定？）先明确待决事项，才能给出有效答复。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"本句在要求今天作出决定，并给出时间理由。","explanation":"need a decision提出需要的答复，to meet the deadline解释目的。","example":"need a decision提出需要的答复，to meet the deadline解释目的。","boundary":"自编回应：What decision do you need from us today?（今天需要我们作出什么决定？）先明确待决事项，才能给出有效答复。"},"sources":[["Oxford — deadline","https://www.oxfordlearnersdictionaries.com/definition/english/deadline"]]},{"id":"g5","title":"工作中可以这样说","text":"接下报告任务时，可以问：Could we confirm the deadline for submitting the report?（我们能确认报告提交的截止期限吗？自编。）for后写具体任务；如果日期还不够明确，可再问What time on Monday?（周一几点？）","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"接下报告任务时，可以问：Could we confirm the deadline for submitting the report?（我们能确认报告提交的截止期限吗？自编。","explanation":"）for后写具体任务；如果日期还不够明确，可再问What time on Monday?（周一几点？）。","example":"接下报告任务时，可以问：Could we confirm the deadline for submitting the report?（我们能确认报告提交的截止期限吗？自编。","boundary":"）for后写具体任务；如果日期还不够明确，可再问What time on Monday?（周一几点？）。"},"sources":[["Oxford — deadline","https://www.oxfordlearnersdictionaries.com/definition/english/deadline"]]}]},"p":{"displayGloss":"截止期限","focused":[{"entry":{"lemma":"deadline","pos":"n.","senses":[{"id":"V20261012-017:current","glossZh":"必须完成某事的最后期限","definitionEn":"the latest time by which something must be completed","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-017:current","glossZh":"必须完成某事的最后期限","definitionEn":"the latest time by which something must be completed","sourceIds":["lexical"]}}],"allEntries":[],"contextTakeaway":"今天作决定，是为了后续能按期完成。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-017\">\u003ch3>deadline · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"deadline-learner-1\">\u003cstrong>1. 某事必须完成或提交的最晚时间。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：meet / miss / extend a deadline; a deadline for\u003cbr>\u003cspan class=\"en\" lang=\"en\">The deadline for applications is next Friday.\u003c/span>\u003cbr>申请截止时间是下周五。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/deadline\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>deadline \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" hre irm the conditions behind this commitment.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 make a commitment 和“答应后要兑现”连起来记。它还可表示投入，但 this commitment 指一项具体承诺。记忆时抓住承诺的对象和行动，比只记“很认真”更能读懂本句；这不是在评价某人的工作态度。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"把 make a commitment 和“答应后要兑现”连起来记。","explanation":"它还可表示投入，但 this commitment 指一项具体承诺。记忆时抓住承诺的对象和行动，比只记“很认真”更能读懂本句；这不是在评价某人的工作态度。","example":"把 make a commitment 和“答应后要兑现”连起来记。它还可表示投入，但 this commitment 指一项具体承诺。记忆时抓住承诺的对象和行动，比只记“很认真”更能读懂本句；这不是在评价某人的工作态度。","boundary":"记忆时抓住承诺的对象和行动，比只记“很认真”更能读懂本句；这不是在评价某人的工作态度。"},"sources":[["Oxford Learner’s Dictionaries · commitment","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]},{"id":"g2","title":"句法与概念","text":"confirm 后的宾语是 conditions，behind this commitment 修饰这些条件。behind 在这里表示背后的依据，不是空间位置。概念上，句子要求核对承诺依赖什么条件，而没有直接宣告承诺已经可以无条件执行。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"confirm 后的宾语是 conditions，behind this commitment 修饰这些条件。","explanation":"behind 在这里表示背后的依据，不是空间位置。概念上，句子要求核对承诺依赖什么条件，而没有直接宣告承诺已经可以无条件执行。","example":"Please confirm the conditions behind this commitment. / 请确认这项承诺所依据的条件。","boundary":"概念上，句子要求核对承诺依赖什么条件，而没有直接宣告承诺已经可以无条件执行。"},"sources":[["Oxford Learner’s Dictionaries · commitment","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]},{"id":"g3","title":"辨析与英文邻居","text":"promise 是容易理解的英文邻居；commitment 在此同样指明确答应承担事情。intention 只说打算做，不能自动当成承诺。记 make a commitment 和 honour a commitment，分别对应作出承诺与履行承诺。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"promise 是容易理解的英文邻居；commitment 在此同样指明确答应承担事情。","explanation":"intention 只说打算做，不能自动当成承诺。记 make a commitment 和 honour a commitment，分别对应作出承诺与履行承诺。","example":"promise 是容易理解的英文邻居；commitment 在此同样指明确答应承担事情。intention 只说打算做，不能自动当成承诺。记 make a commitment 和 honour a commitment，分别对应作出承诺与履行承诺。","boundary":"记 make a commitment 和 honour a commitment，分别对应作出承诺与履行承诺。"},"sources":[["Oxford Learner’s Dictionaries · commitment","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]},{"id":"g4","title":"这句话在做什么","text":"句中的 confirm 要求核实，conditions 把问题收窄到承诺成立的前提。自编接话：Delivery depends on receiving the parts by Friday.（交付的前提是周五前收到零件。）这样就能继续核对零件日期，必要时修改交期；只重复我们已经承诺了，没有回答条件是什么。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"句中的 confirm 要求核实，conditions 把问题收窄到承诺成立的前提。","explanation":"这样就能继续核对零件日期，必要时修改交期；只重复我们已经承诺了，没有回答条件是什么。","example":"自编接话：Delivery depends on receiving the parts by Friday.（交付的前提是周五前收到零件。）","boundary":"这样就能继续核对零件日期，必要时修改交期；只重复我们已经承诺了，没有回答条件是什么。"},"sources":[["Oxford Learner’s Dictionaries · commitment","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：We cannot make a commitment until the scope is clear.（范围明确前，我们无法作出承诺。）对方要求承诺交期、但工作范围未清时用。把 the scope is clear 换成 the parts arrive，就能说明另一个前提。接着说清缺少哪些范围信息，避免只给一句不能答应。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"对方要求承诺交期、但工作范围未清时用。把 the scope is clear 换成 the parts arrive，就能说明另一个前提。","explanation":"接着说清缺少哪些范围信息，避免只给一句不能答应。","example":"We cannot make a commitment until the scope is clear. / 范围明确前，我们无法作出承诺。","boundary":"接着说清缺少哪些范围信息，避免只给一句不能答应。"},"sources":[["Oxford Learner’s Dictionaries · commitment","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]}]},"p":{"displayGloss":"承诺","focused":[{"entry":{"lemma":"commitment","pos":"n.","senses":[{"id":"current","glossZh":"对具体行动或交付作出的明确承诺","definitionEn":"a firm promise to take an action","sourceIds":["lex"]},{"id":"additional","glossZh":"投入；献身","definitionEn":"the willingness to devote effort and time to something","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"对具体行动或交付作出的明确承诺","definitionEn":"a firm promise to take an action","sourceIds":["lex"]}}],"allEntries":[{"lemma":"commitment","pos":"n.","senses":[{"id":"additional","glossZh":"投入；献身","defi
