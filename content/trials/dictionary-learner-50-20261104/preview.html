"boundary":"本句对齐的是大家对优先级的理解，避免各自按不同顺序安排任务。"},"sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g2","title":"句法与概念","text":"need to align 表示有必要协调；on priorities 给出要达成一致的议题。before assigning the work 表示在分工之前，assigning 跟在介词 before 后。句子规定讨论先后，尚未说明团队已经达成一致。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"need to align 表示有必要协调；on priorities 给出要达成一致的议题。","explanation":"before assigning the work 表示在分工之前，assigning 跟在介词 before 后。句子规定讨论先后，尚未说明团队已经达成一致。","example":"We need to align on priorities before assigning the work. / 分配工作前，我们需要就优先级达成一致。","boundary":"句子规定讨论先后，尚未说明团队已经达成一致。"},"sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g3","title":"辨析与英文邻居","text":"agree 表示同意，align 在本句强调把大家的优先顺序协调到一致。换一个结构，align the plan with the resources 是让计划与资源相匹配。on 后是讨论议题，with 后是参照对象，不宜只记一个含糊的“对齐”。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"agree 表示同意，align 在本句强调把大家的优先顺序协调到一致。","explanation":"换一个结构，align the plan with the resources 是让计划与资源相匹配。on 后是讨论议题，with 后是参照对象，不宜只记一个含糊的“对齐”。","example":"agree 表示同意，align 在本句强调把大家的优先顺序协调到一致。换一个结构，align the plan with the resources 是让计划与资源相匹配。on 后是讨论议题，with 后是参照对象，不宜只记一个含糊的“对齐”。","boundary":"on 后是讨论议题，with 后是参照对象，不宜只记一个含糊的“对齐”。"},"sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g4","title":"这句话在做什么","text":"before assigning the work 明确了先后：先商定排序，再分工。自编接话：Let’s decide whether testing or redesign comes first.（先决定测试还是重新设计优先吧。）把含糊的对齐变成可回答的问题，再按共同排序分配任务；说 align 并不会自动消除分歧。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"before assigning the work 明确了先后：先商定排序，再分工。","explanation":"把含糊的对齐变成可回答的问题，再按共同排序分配任务；说 align 并不会自动消除分歧。","example":"自编接话：Let’s decide whether testing or redesign comes first.（先决定测试还是重新设计优先吧。）","boundary":"把含糊的对齐变成可回答的问题，再按共同排序分配任务；说 align 并不会自动消除分歧。"},"sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：We need to align the plan with the available resources.（我们需要让计划与可用资源相匹配。）目标与人力、设备条件不相符时用。保留 align A with B，把 A 换成 forecast、B 换成 actual orders，可讨论预测与订单的匹配。明确以什么为参照，比只说需要对齐更容易执行。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"目标与人力、设备条件不相符时用。保留 align A with B，把 A 换成 forecast、B 换成 actual orders，可讨论预测与订单的匹配。","explanation":"明确以什么为参照，比只说需要对齐更容易执行。","example":"We need to align the plan with the available resources. / 我们需要让计划与可用资源相匹配。","boundary":"明确以什么为参照，比只说需要对齐更容易执行。"},"sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]}]},"p":{"displayGloss":"使一致；协调","focused":[{"entry":{"lemma":"align","pos":"v.","senses":[{"id":"current","glossZh":"使目标、理解或安排彼此一致","definitionEn":"to bring plans or views into agreement","sourceIds":["lex"]},{"id":"additional","glossZh":"排成一线；对齐","definitionEn":"to place things in a straight line or in matching positions","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"使目标、理解或安排彼此一致","definitionEn":"to bring plans or views into agreement","sourceIds":["lex"]}}],"allEntries":[{"lemma":"align","pos":"v.","senses":[{"id":"additional","glossZh":"排成一线；对齐","definitionEn":"to place things in a straight line or in matching positions","sourceIds":["lex"]}]}],"contextTakeaway":"先统一优先级，再分配工作。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-049\">\u003ch3>align · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"align-learner-1\">\u003cstrong>1. 排成直线，或调整到正确的相对位置。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：align A with B; align the wheels\u003cbr>\u003cspan class=\"en\" lang=\"en\">Align the edge of the paper with the guide.\u003c/span>\u003cbr>把纸的边缘与导向标记对齐。\u003c/p>\u003cp data-learner-sense=\"align-learner-2\">\u003cstrong>2. 使目标、做法等相互一致或协调。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：align something with; be aligned with\u003cbr>\u003cspan class=\"en\" lang=\"en\">The course content is aligned with the exam requirements.\u003c/span>\u003cbr>课程内容与考试要求相一致。\u003c/p>\u003cp data-learner-sense=\"align-learner-3\">\u003cstrong>3. 公开支持某一群体或立场，与其站在一起。\u003c/strong>\u003cbr>\u003csmall>动词\u003c/small>\u003cbr>用法：align oneself with\u003cbr>\u003cspan class=\"en\" lang=\"en\">He refused to align himself with either faction.\u003c/span>\u003cbr>他拒绝加入任何一派。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/align\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/align-yourself-with\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>align \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/align\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /əˈlaɪn/\u003c/p>\u003cp data-dictionary-sense=\"align%2:30:00::\">\u003cstrong>1. 排成一直线，或调整成平行、笔直的状态\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">place in a line or arrange so as to be parallel or straight\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the car with the curb\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the sheets of paper on the table\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:42:00::\">\u003cstrong>2. 与某事物相适应或相吻合\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">be or come into adjustment with\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something is ----ing PP\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:31:00::\">\u003cstrong>3. 使自己与某个群体或思想方式站在一起\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">align oneself with a group or a way of thinking\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:30:01::\">\u003cstrong>4. 使部件或部分达到适当的协调关系\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">bring (components or parts) into proper or desirable coordination correlation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the wheels of my car\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：ordinate similar parts\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":4},"x":{"short":"使一致；协调","cue":"当前用法","b":"先让大家对先做什么有一致理解，再分任务。否则有人先赶测试，有人先改设计，各自很忙却可能互相卡住。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","align 来自法语表示排成一线的词形，词根与 ligne、拉丁语 linea（线）有关。实体对齐是历史线索，工作上的目标一致则需要依据现代用法理解。","https://www.etymonline.com/word/align"],["联系今天的意思","从把几列对齐，联想到让几个人采用同一优先顺序。这是从实体到工作安排的学习联系；人有不同意见，不能像移动图形一样自动对齐。","https://www.oxfordlearnersdictionaries.com/definition/english/align"],["回到本句","先统一优先级，再分配工作。before assigning the work 明确了先后：先商定排序，再分工。","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]}},{"w":{"id":"V20261012-050","date":"2026-10-12","term":"consensus","ipa":"/kənˈsensəs/","pos":"n.","meaning":"团队对某个方向形成的普遍共识","chunk":"reach a consensus","example":"We reached a consensus on the main objective.","level":"提升","gloss":"共识","explanation":"团队对某个方向形成的普遍共识","examples":[{"en":"We reached a consensus on the main objective.","zh":"我们就主要目标达成了共识。"},{"en":"There is no consensus on pricing.","zh":"定价问题尚无共识。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We reached a consensus on the main objective.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可以记 reach a consensus 为“讨论后走到共同接受的位置”，这是教学类比。重点是群体广泛接受某个看法，不必把它想成每个人的每个细节都完全相同。本句只谈主要目标，不能扩展成全部事项一致。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"可以记 reach a consensus 为“讨论后走到共同接受的位置”，这是教学类比。","explanation":"重点是群体广泛接受某个看法，不必把它想成每个人的每个细节都完全相同。本句只谈主要目标，不能扩展成全部事项一致。","example":"可以记 reach a consensus 为“讨论后走到共同接受的位置”，这是教学类比。重点是群体广泛接受某个看法，不必把它想成每个人的每个细节都完全相同。本句只谈主要目标，不能扩展成全部事项一致。","boundary":"本句只谈主要目标，不能扩展成全部事项一致。"},"sources":[["Oxford Learner’s Dictionaries · consensus","https://www.oxfordlearnersdictionaries.com/definition/english/consensus"]]},{"id":"g2","title":"句法与概念","text":"reached 是过去式，报告形成了共识；on the main objective 限定共识涉及什么。a consensus 在此指一次共同意见的形成。句子没有交代采用了投票、逐人确认还是其他程序，也不能据此认定所有方案已批准。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"reached 是过去式，报告形成了共识；on the main objective 限定共识涉及什么。","explanation":"a consensus 在此指一次共同意见的形成。句子没有交代采用了投票、逐人确认还是其他程序，也不能据此认定所有方案已批准。","example":"We reached a consensus on the main objective. / 我们就主要目标达成了共识。","boundary":"句子没有交代采用了投票、逐人确认还是其他程序，也不能据此认定所有方案已批准。"},"sources":[["Oxford Learner’s Dictionaries · consensus","https://www.oxfordlearnersdictionaries.com/definition/english/consensus"]]},{"id":"g3","title":"辨析与英文邻居","text":"agreement可指意见一致或具体约定，consensus更突出群体的共同意见。自编同场景：你和同事约好周五开会，可说an agreement to meet on Friday；团队讨论后普遍支持周五开会，可说a consensus on meeting on Friday。这里是侧重点不同，不是说agreement只能用于两个人。常见reach agreement / reach a consensus。","sourceIds":["lex","agreement"],"claimIds":["lexical","g3"],"requirements":{"anchor":"agreement可指意见一致或具体约定，consensus更突出群体的共同意见。","explanation":"两种说法放在同一个开会场景里，区别具体约定与群体共同意见。","example":"an agreement to meet on Friday；a consensus on meeting on Friday","boundary":"agreement也可用于群体；这里是侧重点不同而非绝对人数规则。"},"sources":[["Oxford Learner’s Dictionaries · consensus","https://www.oxfordlearnersdictionaries.com/definition/english/consensus"],["Oxford — agreement","https://www.oxfordlearnersdictionaries.com/definition/english/agreement"]]},{"id":"g4","title":"这句话在做什么","text":"reached 报告已经形成共识，on the main objective 则限制共识的范围。自编接话：Can we write down the agreed objective?（我们能把共同确认的目标写下来吗？）固定目标表述后，再讨论怎么实现。原句没有交代采用何种表决程序，也没说全部细节一致。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"reached 报告已经形成共识，on the main objective 则限制共识的范围。","explanation":"固定目标表述后，再讨论怎么实现。原句没有交代采用何种表决程序，也没说全部细节一致。","example":"自编接话：Can we write down the agreed objective?（我们能把共同确认的目标写下来吗？）","boundary":"固定目标表述后，再讨论怎么实现。原句没有交代采用何种表决程序，也没说全部细节一致。"},"sources":[["Oxford Learner’s Dictionaries · consensus","https://www.oxfordlearnersdictionaries.com/definition/english/consensus"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：We have a consensus on the goal, but not on the timeline.（我们对目标有共识，但对时间表还没有。）汇报讨论进度时用，一次说清共同点与分歧。把 goal 和 timeline 换成其他实际议题即可。不要省掉 but 后的部分，否则听者容易误以为全部已经谈妥。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"汇报讨论进度时用，一次说清共同点与分歧。把 goal 和 timeline 换成其他实际议题即可。","explanation":"不要省掉 but 后的部分，否则听者容易误以为全部已经谈妥。","example":"We have a consensus on the goal, but not on the timeline. / 我们对目标有共识，但对时间表还没有。","boundary":"不要省掉 but 后的部分，否则听者容易误以为全部已经谈妥。"},"sources":[["Oxford Learner’s Dictionaries · consensus","https://www.oxfordlearnersdictionaries.com/definition/english/consensus"]]}]},"p":{"display /small>\u003cbr>用法：concern about / over; express concern\u003cbr>\u003cspan class=\"en\" lang=\"en\">There is growing concern about water quality.\u003c/span>\u003cbr>人们对水质越来越担忧。\u003c/p>\u003cp data-learner-sense=\"concern-learner-2\">\u003cstrong>2. 使人担忧的问题或关注的重要事项。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a major concern; one&#39;s main concern\u003cbr>\u003cspan class=\"en\" lang=\"en\">The cost of repairs is my main concern.\u003c/span>\u003cbr>维修费用是我最担心的问题。\u003c/p>\u003cp data-learner-sense=\"concern-learner-3\">\u003cstrong>3. 对他人的关心。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数〕\u003c/small>\u003cbr>用法：concern for someone\u003cbr>\u003cspan class=\"en\" lang=\"en\">She showed real concern for her neighbours.\u003c/span>\u003cbr>她真心关心邻居。\u003c/p>\u003cp data-learner-sense=\"concern-learner-4\">\u003cstrong>4. 与某人有关或由某人负责的事情。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：none of someone&#39;s concern; someone&#39;s concern\u003cbr>\u003cspan class=\"en\" lang=\"en\">The arrangements are my concern, so I will handle them.\u003c/span>\u003cbr>这些安排由我负责，我来处理。\u003c/p>\u003cp data-learner-sense=\"concern-learner-5\">\u003cstrong>5. 商业公司或企业。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a business concern; a going concern\u003cbr>\u003cspan class=\"en\" lang=\"en\">The company is a small family concern.\u003c/span>\u003cbr>这是一家小型家族企业。\u003c/p>\u003cp data-learner-sense=\"concern-learner-6\">\u003cstrong>6. 与某人或某事有关、涉及；也可指内容主要谈论什么。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：concern someone/something; be concerned with; concern itself with\u003cbr>\u003cspan class=\"en\" lang=\"en\">The announcement concerns all passengers.\u003c/span>\u003cbr>这则通知涉及所有乘客。\u003c/p>\u003cp data-learner-sense=\"concern-learner-7\">\u003cstrong>7. 使人担忧。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：something concerns someone; it concerns me that\u003cbr>\u003cspan class=\"en\" lang=\"en\">The sudden change in his behaviour concerns me.\u003c/span>\u003cbr>他行为的突然变化让我担心。\u003c/p>\u003cp data-learner-sense=\"concern-learner-8\">\u003cstrong>8. 关注某件事，或把精力用于考虑、处理它。\u003c/strong>\u003cbr>\u003csmall>动词〔反身结构〕\u003c/small>\u003cbr>用法：concern yourself with / about something\u003cbr>\u003cspan class=\"en\" lang=\"en\">She concerns herself with the practical details of the project.\u003c/span>\u003cbr>她关注并处理项目的实际细节。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/concern_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/concern_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>concern \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/concern\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：US /kənˈsɝn/ · GB /kənˈsɜːn/\u003c/p>\u003cp data-dictionary-sense=\"concern%1:09:00::\">\u003cstrong>1. 因重要或影响自己而关注的事物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something that interests you because it is important or affects you\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the safety of the ship is the captain&#39;s concern\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"concern%1:12:01::\">\u003cstrong>2. 焦虑、担心的感觉\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an anxious feeling\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：care had aged him\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：they hushed it up out of fear of public reaction\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"concern%1:12:00::\">\u003cstrong>3. 对某人或某事的同情、关心\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a feeling of sympathy for someone or something\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：She felt strong concern for those less fortunate\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"concern%1:09:01::\">\u003cstrong>4. 引起焦虑或不快的人或事物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something or someone that causes anxiety; a source of unhappiness\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：New York traffic is a constant concern\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：it&#39;s a major worry\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"concern%1:14:00::\">\u003cstrong>5. 商业或工业企业及其人员\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：commercial enterprise / business enterprise / business\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a commercial or industrial enterprise and the people who constitute it\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he bought his brother&#39;s business\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a small mom-and-pop business\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a racially integrated business concern\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>concern \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/concern\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：US /kənˈsɝn/ · GB /kənˈsɜːn/\u003c/p>\u003cp data-dictionary-sense=\"concern%2:42:00::\">\u003cstrong>1. 与……有关\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">be relevant to\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：There were lots of questions referring to her talk\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：My remark pertained to your earlier comments\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something ----s somebody / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"concern%2:42:01::\">\u003cstrong>2. 使某人挂心、担忧\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">be on the mind of\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：The bad news will concern him\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：I worry about the second Germanic consonant shift\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Something ----s somebody\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":7},"x":{"short":"担忧；关注事项","cue":"当前用法","b":"说话者先指出最放心不下的一点：留给评审的时间。先把这个问题放到桌面上，还不是宣布整个方案必须作废。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","concern 的历史用法与涉及、关系到某事相连，后来也用于引起关切、担忧。词源更早的拉丁语线索不能机械地拿来翻译今天每一个 concern。","https://www.etymonline.com/word/concern"],["联系今天的意思","与我有关、值得注意的事，可能进一步成为让我担心的事，这个联系有助记住本句义。它是词义联系，不能推出所有关注都包含焦虑。","https://www.oxfordlearnersdictionaries.com/definition/english/concern_2"],["回到本句","主要担心评审可用时间不足。My main concern 把最值得回应的问题摆出来，is 后面指出是评审时间。","https://www.oxfordlearnersdictionaries.com/definition/english/concern_2"]]}},{"w":{"id":"V20261012-052","date":"2026-10-12","term":"objection","ipa":"/əbˈdʒekʃn/","pos":"n.","meaning":"对提议明确表示反对的理由或意见","chunk":"raise an objection","example":"Does anyone have an objection to the revised sequence?","level":"提升","gloss":"反对意见","explanation":"对提议明确表示反对的理由或意见","examples":[{"en":"Does anyone have an objection to the revised sequence?","zh":"有人反对调整后的顺序吗？"},{"en":"The supplier raised an objection.","zh":"供应商提出了反对意见。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Does anyone have an objection to the revised sequence?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 objection 和“我不赞成这一点”联系起来。它可以是反对的表达，也可以是反对理由，不只是心里不放心。记 have an objection 与 raise an objection，分别帮助你表达持有和提出异议的动作。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"把 objection 和“我不赞成这一点”联系起来。","explanation":"它可以是反对的表达，也可以是反对理由，不只是心里不放心。记 have an objection 与 raise an objection，分别帮助你表达持有和提出异议的动作。","example":"把 objection 和“我不赞成这一点”联系起来。它可以是反对的表达，也可以是反对理由，不只是心里不放心。记 have an objection 与 raise an objection，分别帮助你表达持有和提出异议的动作。","boundary":"记 have an objection 与 raise an objection，分别帮助你表达持有和提出异议的动作。"},"sources":[["Oxford Learner’s Dictionaries · objection","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]},{"id":"g2","title":"句法与概念","text":"Does anyone have 构成询问；an objection 是宾语，to the revised sequence 说明反对对象。这里 to 是介词；若后面换成动作，要用动名词。revised 说明顺序经过调整，但没有说明是谁调整或已经获批。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"Does anyone have 构成询问；an objection 是宾语，to the revised sequence 说明反对对象。","explanation":"这里 to 是介词；若后面换成动作，要用动名词。revised 说明顺序经过调整，但没有说明是谁调整或已经获批。","example":"Does anyone have an objection to the revised sequence? / 有人反对调整后的顺序吗？","boundary":"revised 说明顺序经过调整，但没有说明是谁调整或已经获批。"},"sources":[["Oxford Learner’s Dictionaries · objection","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]},{"id":"g3","title":"辨析与英文邻居","text":"concern 提出担忧，reservation 表示尚不能完全接受，objection 则更明确地反对。它们可能围绕同一方案出现，但不要机械地排成固定情绪等级。raise an objection 是提出异议，仍应说明具体理由。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"concern 提出担忧，reservation 表示尚不能完全接受，objection 则更明确地反对。","explanation":"它们可能围绕同一方案出现，但不要机械地排成固定情绪等级。raise an objection 是提出异议，仍应说明具体理由。","example":"concern 提出担忧，reservation 表示尚不能完全接受，objection 则更明确地反对。它们可能围绕同一方案出现，但不要机械地排成固定情绪等级。raise an objection 是提出异议，仍应说明具体理由。","boundary":"raise an objection 是提出异议，仍应说明具体理由。"},"sources":[["Oxford Learner’s Dictionaries · objection","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]},{"id":"g4","title":"这句话在做什么","text":"Does anyone… 给大家提出异议的机会，to the revised sequence 指定要评议的对象。自编接话：Yes. The new order leaves too little time for testing.（有。新顺序给测试留的时间太少。）先核对这个影响，再调整顺序或说明理由。没人立即发言，并不能单凭本句判定已完成正式批准。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Does anyone… 给大家提出异议的机会，to the revised sequence 指定要评议的对象。","explanation":"先核对这个影响，再调整顺序或说明理由。没人立即发言，并不能单凭本句判定已完成正式批准。","example":"自编接话：Yes. The new order leaves too little time for testing.（有。新顺序给测试留的时间太少。）","boundary":"先核对这个影响，再调整顺序或说明理由。没人立即发言，并不能单凭本句判定已完成正式批准。"},"sources":[["Oxford Learner’s Dictionaries · objection","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：My objection is to the timing, not the proposal itself.（我反对的是时机，而不是提案本身。）担心对方把局部反对听成全面否定时用。把 timing 换成 cost，就能限定成本争议。再说明为何反对这个部分；只圈定范围，还没有给出理由。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"担心对方把局部反对听成全面否定时用。把 timing 换成 cost，就能限定成本争议。","explanation":"再说明为何反对这个部分；只圈定范围，还没有给出理由。","example":"My objection is to the timing, not the proposal itself. / 我反对的是时机，而不是提案本身。","boundary":"再说明为何反对这个部分；只圈定范围，还没有给出理由。"},"sources":[["Oxford Learner’s Dictionaries · objection","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]}]},"p":{"displayGloss":"反对意见","focused":[{"entry":{"lemma":"objection","pos":"n.","senses":[{"id":"current","glossZh":"对提议明确表示反对的理由或意见","definitionEn":"an expression or reason for opposing something","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"对提议明确表示反对的理由或意见","definitionEn":"an expression or reason for opposing something","sourceIds":["lex"]}}],"allEntries":[{"lemma":"object","pos":"v.","senses":[{"id":"additional","glossZh":"反对；提出异议","definitionEn":"to say that one disagrees with or opposes something","sourceIds":["family"]}]}],"contextTakeaway":"在采用调整后的顺序前征询反对意见。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-052\">\u003ch3>objection · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"objection-learner-1\">\u003cstrong>1. 对某事表示反对，或反对的理由；法庭上也可指正式异议。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：an objection to something / doing; raise an objection\u003cbr>\u003cspan class=\"en\" lang=\"en\">Do you have any objection to us opening the window?\u003c/span>\u003cbr>你介意我们打开窗户吗？\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/objection\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>objection \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/objection\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /əbˈdʒɛkʃən/\u003c/p>\u003cp data-dictionary-sense=\"objection%1:10:01::\">\u003cstrong>1. 表达强烈反对或抗议的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of expressing earnest opposition or protest\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objection%1:10:00::\">\u003cstrong>2. 提出异议这一言语行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the speech act of objecting\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objection%1:04:01::\">\u003cstrong>3. 公开表达不赞同的抗议行为，常有组织地进行\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of protesting; a public (often organized) manifestation of dissent\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objection%1:04:00::\">\u003cstrong>4. 法律：诉讼一方认为提问、证人、证据等不当，要求停止并请法院裁定其不当或违法性的程序\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：law / jurisprudence\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(law) a procedure whereby a party to a suit says that a particular line of questioning or a particular witness or a piece of evidence or other matter is improper and should not be continued and asks the court to rule on its impropriety or illegality\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":4},"x":{"short":"反对意见","cue":"当前用法","b":"顺序已经调整过，现在给大家一个明确提出反对的机会。回答时最好指出哪一步有问题，以及新顺序为什么不合适。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","objection 经法语来自后期拉丁语，词源涉及把东西摆到前面、提出反对，与 obicere 相连。现代英语的异议是表达反对或反对理由，不是字面扔东西。","https://www.etymonline.com/word/objection"],["联系今天的意思","可以把异议想作摆在方案前、需要回应的一条理由。这个画面是记忆辅助；实际使用时说明反对哪一点，比只说不喜欢更清楚。","https://www.oxfordlearnersdictionaries.com/definition/english/objection"],["回到本句","在采用调整后的顺序前征询反对意见。Does anyone… 给大家提出异议的机会，to the revised sequence 指定要评议的对象。","https://www.oxfordlearnersdictionaries.com/definition/english/objection"]]}},{"w":{"id":"V20261012-053","date":"2026-10-12","term":"reservation","ipa":"/ˌrezəˈveɪʃn/","pos":"n.","meaning":"尚未消除的保留意见或疑虑","chunk":"have reservations about","example":"I have reservations about committing before the review.","level":"提升","gloss":"保留意见；疑虑","explanation":"尚未消除的保留意见或疑虑","examples":[{"en":"I have reservations about committing before the review.","zh":"在评审前作出承诺，我有保留意见。"},{"en":"She expressed reservations about the estimate.","zh":"她对估算表达了疑虑。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"I have reservations about committing before the review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"先辨认搭配：酒店里 make a reservation 是预订，讨论方案时 have reservations about 是有保留意见。这里后面谈提前承诺，所以应选疑虑义。把“还没能完全点头”作为记忆画面，比只背“保留”更直接。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"先辨认搭配：酒店里 make a reservation 是预订，讨论方案时 have reservations about 是有保留意见。","explanation":"这里后面谈提前承诺，所以应选疑虑义。把“还没能完全点头”作为记忆画面，比只背“保留”更直接。","example":"先辨认搭配：酒店里 make a reservation 是预订，讨论方案时 have reservations about 是有保留意见。这里后面谈提前承诺，所以应选疑虑义。把“还没能完全点头”作为记忆画面，比只背“保留”更直接。","boundary":"把“还没能完全点头”作为记忆画面，比只背“保留”更直接。"},"sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g2","title":"句法与概念","text":"have reservations about 后接 committing，about 是介词，所以用动名词；before the review 说明承诺的时间。句子指出保留意见针对评审前承诺，并没有直接说评审后一定同意，更不是报告已经作出承诺。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"have reservations about 后接 committing，about 是介词，所以用动名词；before the review 说明承诺的时间。","explanation":"句子指出保留意见针对评审前承诺，并没有直接说评审后一定同意，更不是报告已经作出承诺。","example":"I have reservations about committing before the review. / 在评审前作出承诺，我有保留意见。","boundary":"句子指出保留意见针对评审前承诺，并没有直接说评审后一定同意，更不是报告已经作出承诺。"},"sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g3","title":"辨析与英文邻居","text":"reservation 在此说明尚不能完全接受；objection 更直接表达反对。doubt 是接近的英文邻居。复数 reservations 在疑虑义中常见，不能看到复数就误判成多次酒店预订，仍要看 about 后面的内容。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"reservation 在此说明尚不能完全接受；objection 更直接表达反对。","explanation":"doubt 是接近的英文邻居。复数 reservations 在疑虑义中常见，不能看到复数就误判成多次酒店预订，仍要看 about 后面的内容。","example":"reservation 在此说明尚不能完全接受；objection 更直接表达反对。doubt 是接近的英文邻居。复数 reservations 在疑虑义中常见，不能看到复数就误判成多次酒店预订，仍要看 about 后面的内容。","boundary":"复数 reservations 在疑虑义中常见，不能看到复数就误判成多次酒店预订，仍要看 about 后面的内容。"},"sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g4","title":"这句话在做什么","text":"have reservations 表明支持仍有保留，about committing before the review 指明疑虑所在。自编接话：What would you need to know before committing?（承诺前你还需要了解什么？）把缺少的信息找出来，才能继续谈能否承诺。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"have reservations 表明支持仍有保留，about committing before the review 指明疑虑所在。","explanation":"把缺少的信息找出来，才能继续谈能否承诺。","example":"自编接话：What would you need to know before committing?（承诺前你还需要了解什么？）","boundary":"把缺少的信息找出来，才能继续谈能否承诺。"},"sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：I still have reservations about the cost estimate.（我对这份成本估算仍有疑虑。）愿意继续讨论、但尚不能完全接受时用。把 cost estimate 换成 implementation plan，可表达对实施计划的保留。后接具体不确定项，例如假设或数据，才能让对方有针对性地补充。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"愿意继续讨论、但尚不能完全接受时用。把 cost estimate 换成 implementation plan，可表达对实施计划的保留。","explanation":"后接具体不确定项，例如假设或数据，才能让对方有针对性地补充。","example":"I still have reservations about the cost estimate. / 我对这份成本估算仍有疑虑。","boundary":"后接具体不确定项，例如假设或数据，才能让对方有针对性地补充。"},"sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]}]},"p":{"displayGloss":"保留意见；疑虑","focused":[{"entry":{"lemma":"reservation","pos":"n.","senses":[{"id":"current","glossZh":"尚未消除的保留意见或疑虑","definitionEn":"a doubt that prevents complete acceptance","sourceIds":["lex"]},{"id":"additional","glossZh":"预订；预约","definitionEn":"an arrangement to keep a seat, room or place available for someone","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"尚未消除的保留意见或疑虑","definitionEn":"a doubt that prevents complete acceptance","sourceIds":["lex"]}}],"allEntries":[{"lemma":"reservation","pos":"n.","senses":[{"id":"additional","glossZh":"预订；预约","definitionEn":"an arrangement to keep a seat, room or place available for someone","sourceIds":["lex"]}]}],"contextTakeaway":"对评审前承诺仍有疑虑。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-053\">\u003ch3>reservation · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"reservation-learner-1\">\u003cstrong>1. 为住宿、座位等提前作出的预订。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：make / cancel a reservation\u003cbr>\u003cspan class=\"en\" lang=\"en\">I made a reservation for two at seven o’clock.\u003c/span>\u003cbr>我预订了七点的两人位。\u003c/p>\u003cp data-learner-sense=\"reservation-learner-2\">\u003cstrong>2. 使人不能完全接受某事的疑虑或保留意见。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数；可数时通常用复数〕\u003c/small>\u003cbr>用法：have reservations about; without reservation\u003cbr>\u003cspan class=\"en\" lang=\"en\">She has reservations about moving so far away.\u003c/span>\u003cbr>她对搬到那么远的地方有所顾虑。\u003c/p>\u003cp data-learner-sense=\"reservation-learner-3\">\u003cstrong>3. 美国为原住民保留的地区。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，美国用法〕\u003c/small>\u003cbr>用法：a reservation; a Native American reservation\u003cbr>\u003cspan class=\"en\" lang=\"en\">The museum explains the history of the reservation.\u003c/span>\u003cbr>博物馆介绍了这片原住民保留地的历史。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/reservation\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>reservation \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/reservation\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˌɹɛzəˈveɪʃən/ · US /ˌɹɛzɚˈveɪʃən/\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:15:00::\">\u003cstrong>1. 划作特定用途的地区；保留地\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a district that is reserved for particular purpose\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:10:00::\">\u003cstrong>2. 限制某项主张适用范围的声明；保留条款\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a statement that limits or restricts some claim\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he recommended her without any reservations\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:09:00::\">\u003cstrong>3. 使人无法全心接受某事、尚未说出的疑虑\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an unstated doubt that prevents you from accepting something wholeheartedly\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:04:01::\">\u003cstrong>4. 预订位置、旅程或人员服务的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of reserving (a place or passage) or engaging the services of (a person or group)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：wondered who had made the booking\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:10:01::\">\u003cstrong>5. 保证预先安排住宿等事项的书面记录或承诺\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the written record or promise of an arrangement by which accommodations are secured in advance\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:09:01::\">\u003cstrong>6. 事先订妥的住宿、机位等\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something reserved in advance (as a hotel accommodation or a seat on a plane etc.)\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:04:00::\">\u003cstrong>7. 为将来某个场合保留或留出某物的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of keeping back or setting aside for some future occasion\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":7},"x":{"short":"保留意见；疑虑","cue":"当前用法","b":"说话者暂时不能完全接受在评审前就作出承诺。疑虑针对这个时间点；你需要继续问原因，而不是直接把他算成赞成者。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","reservation 的词源与拉丁语 reservare（留住、保留）相连。保留条件或疑虑与预订都是历史中记录的用法，不能把疑虑义说成由酒店预订直接产生。","https://www.etymonline.com/word/reservation"],["联系今天的意思","可以用尚未完全交出同意来联想有保留意见；这只是记忆画面。酒店预订则是真的保留一个位置，遇到词时还要看搭配决定用哪一义。","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"],["回到本句","对评审前承诺仍有疑虑。have reservations 表明支持仍有保留，about committing before the review 指明疑虑所在。","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]}},{"w":{"id":"V20261012-054","date":"2026-10-12","term":"rationale","ipa":"/ˌræʃəˈnɑːl/","pos":"n.","meaning":"某项决定或方案背后的理由","chunk":"explain the rationale","example":"Could you explain the rationale for changing the priority?","level":"挑战","gloss":"理由；依据","explanation":"某项决定或方案背后的理由","examples":[{"en":"Could you explain the rationale for changing the priority?","zh":"你能解释改变优先级的理由吗？"},{"en":"Record the rationale for each exception.","zh":"记录每项例外的理由。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Could you explain the rationale for changing the priority?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 rationale 连到“为什么这样决定”来记，不必硬拆拼写。它常指支撑行动或决定的一组理由，而不只是一句随口解释。本句问改变优先级的依据；知道谁作决定还不等于知道为什么作这个决定。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"把 rationale 连到“为什么这样决定”来记，不必硬拆拼写。","explanation":"它常指支撑行动或决定的一组理由，而不只是一句随口解释。本句问改变优先级的依据；知道谁作决定还不等于知道为什么作这个决定。","example":"把 rationale 连到“为什么这样决定”来记，不必硬拆拼写。它常指支撑行动或决定的一组理由，而不只是一句随口解释。本句问改变优先级的依据；知道谁作决定还不等于知道为什么作这个决定。","boundary":"本句问改变优先级的依据；知道谁作决定还不等于知道为什么作这个决定。"},"sources":[["Oxford Learner’s Dictionaries · rationale","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]},{"id":"g2","title":"句法与概念","text":"explain 后接 the rationale，for changing the priority 说明这组理由对应什么行动。for 是介词，后接 changing。句子请求解释改变的依据，并未断言改变不合理，也未表示说话者已经接受新的优先顺序。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"explain 后接 the rationale，for changing the priority 说明这组理由对应什么行动。","explanation":"for 是介词，后接 changing。句子请求解释改变的依据，并未断言改变不合理，也未表示说话者已经接受新的优先顺序。","example":"Could you explain the rationale for changing the priority? / 你能解释改变优先级的理由吗？","boundary":"句子请求解释改变的依据，并未断言改变不合理，也未表示说话者已经接受新的优先顺序。"},"sources":[["Oxford Learner’s Dictionaries · rationale","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]},{"id":"g3","title":"辨析与英文邻居","text":"reason 是更常见、更宽泛的英文邻居；rationale 突出用于解释某项决定的依据。evidence 是支持判断的证据，不能直接等同理由：证据可以构成理由的一部分，仍需说明它怎样支持这项选择。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"reason 是更常见、更宽泛的英文邻居；rationale 突出用于解释某项决定的依据。","explanation":"evidence 是支持判断的证据，不能直接等同理由：证据可以构成理由的一部分，仍需说明它怎样支持这项选择。","example":"reason 是更常见、更宽泛的英文邻居；rationale 突出用于解释某项决定的依据。evidence 是支持判断的证据，不能直接等同理由：证据可以构成理由的一部分，仍需说明它怎样支持这项选择。","boundary":"evidence 是支持判断的证据，不能直接等同理由：证据可以构成理由的一部分，仍需说明它怎样支持这项选择。"},"sources":[["Oxford Learner’s Dictionaries · rationale","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]},{"id":"g4","title":"这句话在做什么","text":"Could you explain 是请求说明，rationale 把问题从改了什么转到为何这样改。自编接话：The customer moved the deadline forward, so this task is now more urgent.（客户提前了期限，所以这项任务现在更紧急。）这把新信息与决定连起来了。接下来可核对期限及影响，而不是只凭有理由就认定选择正确。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Could you explain 是请求说明，rationale 把问题从改了什么转到为何这样改。","explanation":"这把新信息与决定连起来了。接下来可核对期限及影响，而不是只凭有理由就认定选择正确。","example":"自编接话：The customer moved the deadline forward, so this task is now more urgent.（客户提前了期限，所以这项任务现在更紧急。）","boundary":"这把新信息与决定连起来了。接下来可核对期限及影响，而不是只凭有理由就认定选择正确。"},"sources":[["Oxford Learner’s Dictionaries · rationale","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Please include the rationale for each proposed change.（请附上每项拟议变更的理由。）收集评审资料时用，让改什么与为何改对应起来。把 proposed change 换成 exception，可要求记录例外的理由。理由若依赖数字或事实，再附相应依据，便于评审者检查推理。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"收集评审资料时用，让改什么与为何改对应起来。把 proposed change 换成 exception，可要求记录例外的理由。","explanation":"理由若依赖数字或事实，再附相应依据，便于评审者检查推理。","example":"Please include the rationale for each proposed change. / 请附上每项拟议变更的理由。","boundary":"理由若依赖数字或事实，再附相应依据，便于评审者检查推理。"},"sources":[["Oxford Learner’s Dictionaries · rationale","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]}]},"p":{"displayGloss":"理由；依据","focused":[{"entry":{"lemma":"rationale","pos":"n.","senses":[{"id":"current","glossZh":"某项决定或方案背后的理由","definitionEn":"the reasons used to explain a decision or action","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"某项决定或方案背后的理由","definitionEn":"the reasons used to explain a decision or action","sourceIds":["lex"]}}],"allEntries":[{"lemma":"rational","pos":"adj.","senses":[{"id":"additional","glossZh":"理性的；合乎理据的","definitionEn":"based on reason rather than emotion alone","sourceIds":["family"]}]}],"contextTakeaway":"追问更改优先级背后的理由。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-054\">\u003ch3>rationale · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"rationale-learner-1\">\u003cstrong>1. 某个决定、方法或信念背后的理由及其逻辑依据。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，正式〕\u003c/small>\u003cbr>用法：the rationale for / behind\u003cbr>\u003cspan class=\"en\" lang=\"en\">The teacher explained the rationale for the new marking system.\u003c/span>\u003cbr>老师解释了采用新评分制度的理由。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/rationale\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>rationale \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/rationale\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"rationale%1:09:00::\">\u003cstrong>1. 对根本原因的说明，尤其是依自然规律解释某种装置如何运作；原文附有法律领域标记\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：law / jurisprudence\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(law) an explanation of the fundamental reasons (especially an explanation of the working of some device in terms of laws of nature)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the rationale for capital punishment\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the principles of internal-combustion engines\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":1},"x":{"short":"理由；依据","cue":"当前用法","b":"已经知道优先级变了，现在问的是为什么要改。对方应解释新信息或限制怎样导致这个决定，而不只是再说一次新的排序。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","rationale 来自后期拉丁语，与 rationalis（与理性、理由有关）相连。英语用它表示对原则或理由的说明；相关词 rational 是形容词，不能与这个名词互换。","https://www.etymonline.com/word/rationale"],["联系今天的意思","用 rational（有理据的）联系 rationale（给决定提供的理据）。这个词帮助追问为什么这样做；给出了理由，还需要看理由是否站得住脚。","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"],["回到本句","追问更改优先级背后的理由。Could you explain 是请求说明，rationale 把问题从改了什么转到为何这样改。","https://www.oxfordlearnersdictionaries.com/definition/english/rationale"]]}},{"w":{"id":"V20261012-055","date":"2026-10-12","term":"proposal","ipa":"prəˈpəʊzl","pos":"n.（本句可数）","meaning":"供他人讨论或批准的建议方案","chunk":"review a proposal","example":"Please review the proposal before tomorrow's discussion.","level":"核心","gloss":"提案；建议方案","explanation":"供他人讨论或批准的建议方案","examples":[{"en":"Please review the proposal before tomorrow's discussion.","zh":"请在明天讨论前审阅提案。"},{"en":"The proposal includes a training budget.","zh":"提案包含培训预算。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please review the proposal before tomorrow's discussion.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住“把方案摆到桌上，让别人考虑”。propose 是提出，proposal 是提出的建议或方案；工作中连着记 review a proposal（审阅提案）。摆到桌上的东西还要讨论，所以 proposal 本身不表示大家已经同意。","requirements":{"anchor":"把方案摆到桌上","explanation":"让别人考虑","example":"review a proposal","boundary":"不表示大家已经同意"},"claimIds":["lexical","connection"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g2","title":"句法与概念","text":"Please review the proposal 是“请审阅这份方案”，review 是要做的动作，the proposal 是对象。before tomorrow’s discussion 给出时间要求：审阅应在明天讨论前完成。读这句时抓“做什么＋什么时候”，就不会只看到 proposal 而漏掉会前准备。","requirements":{"anchor":"做什么＋什么时候","explanation":"审阅应在明天讨论前完成","example":"Please review the proposal","boundary":"漏掉会前准备"},"claimIds":["lexical","syntax"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g3","title":"辨析与英文邻居","text":"proposal 与 suggestion 都能表示建议。比如“改在周五开会”可以是一条 suggestion；把调整后的会议安排及理由整理给大家考虑，就常称 a proposal。区别是这里 proposal 更让人想到可审阅的方案，不是 suggestion 一定随意或 proposal 必须写成长文。常见搭配：submit a proposal（提交方案）。","requirements":{"anchor":"都能表示建议","explanation":"更让人想到可审阅的方案","example":"改在周五开会","boundary":"proposal 必须写成长文"},"claimIds":["lexical","contrast"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g4","title":"这句话在做什么","text":"明天要讨论这份方案，说话者希望大家先看过再来。Please review 是请对方审阅，before tomorrow’s discussion 把时间要求说清楚；这句话是在安排会前准备。自编回应：I’ll read it tonight and bring my questions tomorrow.（我今晚看，明天带着问题来。）这样既接下任务，也说明准备如何完成。","requirements":{"anchor":"明天要讨论这份方案","explanation":"安排会前准备","example":"I’ll read it tonight and bring my questions tomorrow.","boundary":"自编回应"},"claimIds":["lexical","action"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g5","title":"工作中可以这样说","text":"方案只有做法、没有理由时，可以请对方补充依据。自编：Could you add the reasons for this change to the proposal?（你能把这次改动的理由补进方案吗？）需要费用信息时，把 the reasons for this change 换成 the estimated cost；明确缺哪项信息，别人更容易补齐。","requirements":{"anchor":"方案只有做法、没有理由","explanation":"请对方补充依据","example":"Could you add the reasons for this change to the proposal?","boundary":"把 the reasons for this change 换成"},"claimIds":["lexical","use"],"sourceIds":["lex","lesson"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"],["Complete Advanced — Writing Part 2: A proposal","https://www.cambridge.org/sites/default/files/media/documents/Complete%20Advanced%203rd%20Ed%20Unit%205%20Sample.pdf"]]}]},"p":{"displayGloss":"提案；建议方案","focused":[{"entry":{"lemma":"proposal","pos":"n.","senses":[{"id":"proposal:current","glossZh":"供他人考虑的建议或方案","definitionEn":"an idea or plan offered for others to consider","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"proposal:current","glossZh":"供他人考虑的建议或方案","definitionEn":"an idea or plan offered for others to consider","sourceIds":["lex"]}}],"allEntries":[{"lemma":"proposal","pos":"名词","senses":[{"id":"proposal:marriage","glossZh":"求婚；提出结婚的请求","definitionEn":"a request asking someone to marry you","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"提案还在讨论阶段，审阅不等于批准。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-055\">\u003ch3>proposal · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"proposal-learner-1\">\u003cstrong>1. 提交给他人考虑的建议、方案，或提出建议这一行为。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：a proposal for; a proposal to do\u003cbr>\u003cspan class=\"en\" lang=\"en\">The council approved a proposal to build a new park.\u003c/span>\u003cbr>市政委员会批准了建设新公园的提案。\u003c/p>\u003cp data-learner-sense=\"proposal-learner-2\">\u003cstrong>2. 求婚。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a marriage proposal; accept a proposal\u003cbr>\u003cspan class=\"en\" lang=\"en\">She accepted his marriage proposal.\u003c/span>\u003cbr>她答应了他的求婚。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/proposal\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>proposal \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/proposal\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：US /pɹəˈpoʊzəl/ · GB /pɹəˈpəʊzəl/\u003c/p>\u003cp data-dictionary-sense=\"proposal%1:10:00::\">\u003cstrong>1. 提出的计划、假设等建议\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something proposed (such as a plan or assumption)\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"proposal%1:10:02::\">\u003cstrong>2. 求婚\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an offer of marriage\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"proposal%1:10:01::\">\u003cstrong>3. 提出建议的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of making a proposal\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：they listened to her proposal\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"提案；建议方案","cue":"当前用法","b":"在工作讨论里，proposal 是拿出来请别人考虑的方案。它通常不只说“我有个想法”，还会说明准备做什么、为什么值得做，让别人有内容可以审阅和讨论。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源：把想法提出供人考虑","proposal 由 propose 加名词后缀 -al 构成。propose 的来历与“向前放、提出”有关，英语中形成了把计划拿出来供人考虑的用法。这里的 -al 构成名词，并非所有以 -al 结尾的词都按同一方式拆解。","https://www.etymonline.com/word/proposal"],["现代联系：摆出来的方案","可以把 proposal 想成摆到讨论桌上的方案：别人可以查看、提出问题、接受或拒绝。重点在于供人考虑，不在纸张厚薄；一句口头建议也可能叫 proposal，不一定是一份长文档。","https://www.oxfordlearnersdictionaries.com/definition/english/proposal"],["回到本句：先审阅，再讨论","review a proposal 是审阅方案。原句要求在明天讨论前看过它，让后面的交流有具体内容可谈。review 说的是阅读和评估，不能仅凭这个动作就当成已经 approve，批准。","https://www.oxfordlearnersdictionaries.com/definition/english/proposal"]]}},{"w":{"id":"V20261012-056","date":"2026-10-12","term":"alternative","ipa":"ɔːlˈtɜːnətɪv","pos":"n.","meaning":"可替代当前方案的另一种选择","chunk":"consider an alternative","example":"We should consider an alternative if the date is too tight.","level":"核心","gloss":"替代方案","explanation":"可替代当前方案的另一种选择","examples":[{"en":"We should consider an alternative if the date is too tight.","zh":"如果日期过紧，我们应考虑替代方案。"},{"en":"We need a cheaper alternative.","zh":"我们需要一个成本更低的替代方案。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We should consider an alternative if the date is too tight.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“眼前这条路走不通，还有另一条吗”作记忆提示。这是学习联想，不是词源。记住 an alternative to the current plan：替代的是当前计划；并不自动表示新选择更好或已经被选定。","sourceIds":["lex"],"claimIds":["lexical","connection"],"requirements":{"anchor":"用“眼前这条路走不通，还有另一条吗”作记忆提示。","explanation":"这是学习联想，不是词源。","example":"an alternative to the current plan","boundary":"并不自动表示新选择更好或已经被选定。"},"sources":[["Oxford · alternative","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]},{"id":"g2","title":"句法与概念","text":"should consider 表示建议考虑，an alternative 是考虑的对象；if 引出“日期太紧”这一条件：在这种情况下，建议考虑另一个选择。alternative 此处作可数名词；整句没有指定要换日期、换资源还是换方案，不能替它补定。","sourceIds":["lex"],"claimIds":["syntax"],"requirements":{"anchor":"should consider 表示建议考虑，an alternative 是考虑的对象；","explanation":"if 引出“日期太紧”这一条件：在这种情况下，建议考虑另一个选择。","example":"should consider ","boundary":"整句没有指定要换日期、换资源还是换方案，不能替它补定。"},"sources":[["Oxford · alternative","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"option 泛指可以选的项目，alternative 在这里更突出“换掉眼前安排的另一选择”。例如周三和周五都可以是 options；如果周三已经排定，周五就可以作为 an alternative。常用 alternative to，后面接被替代的安排。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"option 泛指可以选的项目，alternative 在这里更突出“换掉眼前安排的另一选择”。","explanation":"例如周三和周五都可以是 options；","example":"option ","boundary":"常用 alternative to，后面接被替代的安排。"},"sources":[["Oxford · alternative","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]},{"id":"g4","title":"这句话在做什么","text":"这句话把日期过紧的担忧转成寻找别的选择。should consider 提出建议，if 指出在日期太紧的情况下提出这项建议，并未排除其他需要另找选择的情况。自编回应：Could Friday work instead?（改到周五可行吗？）回应提出可比较的候选日期，而没有替大家作最终决定。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"这句话把日期过紧的担忧转成寻找别的选择。","explanation":"should consider 提出建议，if 指出在日期太紧的情况下提出这项建议，并未排除其他需要另找选择的情况。","example":"should consider ","boundary":"自编回应：Could Friday work instead?（改到周五可行吗？）回应提出可比较的候选日期，而没有替大家作最终决定。"},"sources":[["Oxford · alternative","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：Do we have an alternative to this supplier?（我们有可替代这家供应商的选择吗？）适合想先摸清备用选项时。问到 alternative 后仍应核对质量、交期等条件，不能把“有替代”说成“能直接替换”。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：Do we have an alternative to this supplier?（我们有可替代这家供应商的选择吗？）适合想先摸清备用选项时。","explanation":"问到 alternative 后仍应核对质量、交期等条件，不能把“有替代”说成“能直接替换”。","example":"Do we have an alternative to this supplier","boundary":"问到 alternative 后仍应核对质量、交期等条件，不能把“有替代”说成“能直接替换”。"},"sources":[["Oxford · alternative","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]}]},"p":{"displayGloss":"替代方案","focused":[{"entry":{"lemma":"alternative","pos":"n.","senses":[{"id":"alternative:current","glossZh":"可替代目前选择的另一个选项","definitionEn":"another choice that can replace the current one","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"alternative:current","glossZh":"可替代目前选择的另一个选项","definitionEn":"another choice that can replace the current one","sourceIds":["lex"]}}],"allEntries":[{"lemma":"alternative","pos":"adj.","senses":[{"id":"alternative:extra","glossZh":"非传统的；不同于通常做法的","definitionEn":"different from the usual or conventional approach","sourceIds":["extra"]}],"source":"有据原创教学转述"}],"contextTakeaway":"日期太紧时，应考虑另一个方案。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-056\">\u003ch3>alternative · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"alternative-learner-1\">\u003cstrong>1. 可以取代当前选择的另一种选择。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：an alternative to; have no alternative but to\u003cbr>\u003cspan class=\"en\" lang=\"en\">Cycling is a cheap alternative to driving.\u003c/span>\u003cbr>骑车是比开车便宜的替代出行方式。\u003c/p>\u003cp data-learner-sense=\"alternative-learner-2\">\u003cstrong>2. 可用来替代另一事物的。\u003c/strong>\u003cbr>\u003csmall>形容词〔此义通常用于名词前〕\u003c/small>\u003cbr>用法：an alternative route / method\u003cbr>\u003cspan class=\"en\" lang=\"en\">We found an alternative route through the village.\u003c/span>\u003cbr>我们找到了一条穿过村庄的替代路线。\u003c/p>\u003cp data-learner-sense=\"alternative-learner-3\">\u003cstrong>3. 不同于主流或传统方式的。\u003c/strong>\u003cbr>\u003csmall>形容词\u003c/small>\u003cbr>用法：alternative medicine / lifestyles\u003cbr>\u003cspan class=\"en\" lang=\"en\">The article discusses alternative forms of education.\u003c/span>\u003cbr>这篇文章讨论非传统的教育形式。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/alternative_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/a\">\u003ch3>alternative \u003csmall>形容词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/alternative\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ɒl.ˈtɜː(ɹ).nə.tɪv/ · US /ɔl.ˈtɝ.nə.tɪv/\u003c/p>\u003cp data-dictionary-sense=\"alternative%5:00:00:secondary:01\">\u003cstrong>1. 用来替代另一事物的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">serving or used in place of another\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：an alternative plan\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"alternative%5:00:00:disjunctive:00\">\u003cstrong>2. 要求在互不相容的可能性之间作出选择的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">necessitating a choice between mutually exclusive possibilities\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：alternative possibilities were neutrality or war\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"alternative%5:00:00:unconventional:01\">\u003cstrong>3. 与非传统选择有关的；另类的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">pertaining to unconventional choices\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：an alternative life style\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>alternative \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/alternative\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ɒl.ˈtɜː(ɹ).nə.tɪv/ · US /ɔl.ˈtɝ.nə.tɪv/\u003c/p>\u003cp data-dictionary-sense=\"alternative%1:09:00::\">\u003cstrong>1. 多个选项中只能选取其一的备选事物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">one of a number of things from which only one can be chosen\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：what option did I have?\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：there is no other alternative\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：my only choice is to refuse\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":4},"x":{"short":"替代方案","cue":"当前用法","b":"当前安排太紧时，alternative 是另一个可考虑的选择。比如原日期做不到，可以考虑别的日期，也可以另拟做法；这个词没有替你决定具体换哪一项。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","alternative 经中世纪拉丁语而来，相关的 alter 表示“另一个”，alternare 涉及交替。英语后来用名词 alternative 谈可选择的另一条行动路线；今天并不限于恰好两个选项。","https://www.etymonline.com/word/alternative"],["用现代联系帮助理解","把它和“还有另一条路吗？”联系起来。另一条路可以替代当前安排，但有没有更便宜、更快，需要继续比较；alternative 本身只告诉我们有另一个可选方向。","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"],["回到当前句子","当前安排太紧时，alternative 是另一个可考虑的选择。比如原日期做不到，可以考虑别的日期，也可以另拟做法；这个词没有替你决定具体换哪一项。","https://www.oxfordlearnersdictionaries.com/definition/english/alternative_1"]]}},{"w":{"id":"V20261012-057","date":"2026-10-12","term":"compromise","ipa":"ˈkɒmprəmaɪz","pos":"n.","meaning":"双方各作一些让步后达成的安排","chunk":"reach a compromise","example":"We reached a compromise on the review schedule.","level":"提升","gloss":"妥协；折中方案","explanation":"双方各作一些让步后达成的安排","examples":[{"en":"We reached a compromise on the review schedule.","zh":"我们就评审时间表达成了折中方案。"},{"en":"The compromise satisfied both departments.","zh":"折中方案让两个部门都满意。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We reached a compromise on the review schedule.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住“各让一点，找到能接受的安排”。把 reach a compromise（达成折中）和 compromise on the date（在日期上作妥协）联系起来。这里记的是共同安排，不是只让一方放弃要求。","sourceIds":["lex"],"claimIds":["lexical","connection"],"requirements":{"anchor":"记住“各让一点，找到能接受的安排”。","explanation":"把 reach a compromise（达成折中）和 compromise on the date（在日期上作妥协）联系起来。","example":"reach a compromise","boundary":"这里记的是共同安排，不是只让一方放弃要求。"},"sources":[["Oxford · compromise","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]},{"id":"g2","title":"句法与概念","text":"reached 是过去式，a compromise 是达成的结果；on the review schedule 指明谈妥的议题。句子只报告排期这一项取得折中，不保证预算、人员等其他问题也已解决，更没有交代让步细节。","sourceIds":["lex"],"claimIds":["syntax"],"requirements":{"anchor":"reached 是过去式，a compromise 是达成的结果；","explanation":"on the review schedule 指明谈妥的议题。","example":"reached ","boundary":"句子只报告排期这一项取得折中，不保证预算、人员等其他问题也已解决，更没有交代让步细节。"},"sources":[["Oxford · compromise","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"agreement 泛指达成一致；compromise 进一步说明一致通常来自让步。例如双方一开始就都选周三，是 agreement；原本各有坚持、调整后选周三，才更像 compromise。常见 acceptable compromise，强调这个折中能被接受。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"agreement 泛指达成一致；","explanation":"compromise 进一步说明一致通常来自让步。","example":"agreement ","boundary":"常见 acceptable compromise，强调这个折中能被接受。"},"sources":[["Oxford · compromise","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]},{"id":"g4","title":"这句话在做什么","text":"We reached 把这句话说成结果汇报：评审日期已经谈出了折中。on the review schedule 指明谈妥的是哪件事。自编回应：What date did you agree on?（你们最后商定哪一天？）听者接着确认安排，就能据此更新日程。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"We reached 把这句话说成结果汇报：评审日期已经谈出了折中。","explanation":"on the review schedule 指明谈妥的是哪件事。","example":"We reached ","boundary":"自编回应：What date did you agree on?（你们最后商定哪一天？）听者接着确认安排，就能据此更新日程。"},"sources":[["Oxford · compromise","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：Could we reach a compromise on the delivery schedule?（我们能就交付时间表达成折中吗？）适合双方安排不同、仍愿讨论调整时。随后说明自己能调整哪部分，让“折中”有具体内容，而非只要求对方让步。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：Could we reach a compromise on the delivery schedule?（我们能就交付时间表达成折中吗？）适合双方安排不同、仍愿讨论调整时。","explanation":"随后说明自己能调整哪部分，让“折中”有具体内容，而非只要求对方让步。","example":"Could we reach a compromise on the delivery schedule","boundary":"随后说明自己能调整哪部分，让“折中”有具体内容，而非只要求对方让步。"},"sources":[["Oxford · compromise","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]}]},"p":{"displayGloss":"妥协；折中方案","focused":[{"entry":{"lemma":"compromise","pos":"n.","senses":[{"id":"compromise:current","glossZh":"各方作出部分让步后达成的安排","definitionEn":"an agreement reached when sides give up some of their demands","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"compromise:current","glossZh":"各方作出部分让步后达成的安排","definitionEn":"an agreement reached when sides give up some of their demands","sourceIds":["lex"]}}],"allEntries":[{"lemma":"compromise","pos":"v.","senses":[{"id":"compromise:extra","glossZh":"危及；损害","definitionEn":"put something valuable at risk or reduce its quality","sourceIds":["extra"]}],"source":"有据原创教学转述"}],"contextTakeaway":"双方已就评审排期达成折中安排。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-057\">\u003ch3>compromise · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"compromise-learner-1\">\u003cstrong>1. 各方作出部分让步后达成的协议或折中办法。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：reach a compromise; a compromise between\u003cbr>\u003cspan class=\"en\" lang=\"en\">They reached a compromise over how to share the costs.\u003c/span>\u003cbr>他们就如何分摊费用达成了妥协。\u003c/p>\u003cp data-learner-sense=\"compromise-learner-2\">\u003cstrong>2. 降低部分要求或作出让步，以达成一致。\u003c/strong>\u003cbr>\u003csmall>动词〔不及物〕\u003c/small>\u003cbr>用法：compromise on; compromise with someone\u003cbr>\u003cspan class=\"en\" lang=\"en\">Neither side was willing to compromise on the price.\u003c/span>\u003cbr>双方都不愿在价格上让步。\u003c/p>\u003cp data-learner-sense=\"compromise-learner-3\">\u003cstrong>3. 损害安全、质量、名誉等；使其面临风险。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：compromise safety / quality / security\u003cbr>\u003cspan class=\"en\" lang=\"en\">The shortcut could compromise the safety of the building.\u003c/span>\u003cbr>这种省事做法可能危及建筑安全。\u003c/p>\u003cp data-learner-sense=\"compromise-learner-4\">\u003cstrong>4. 违背原先坚持的原则，或降低自己设定的标准。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：compromise principles; compromise on standards\u003cbr>\u003cspan class=\"en\" lang=\"en\">She refused to compromise her principles for promotion.\u003c/span>\u003cbr>她拒绝为获得晋升而违背自己的原则。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/compromise_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>compromise \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/compromise\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈkɒmpɹəˌmaɪz/ · US /ˈkɑmpɹəˌmaɪz/\u003c/p>\u003cp data-dictionary-sense=\"compromise%1:04:00::\">\u003cstrong>1. 两个极端之间的折中办法\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a middle way between two extremes\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"compromise%1:10:00::\">\u003cstrong>2. 双方各作让步达成的和解或妥协\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an accommodation in which both sides make concessions\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the newly elected congressmen rejected a compromise because they considered it ‘business as usual’\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>compromise \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/compromise\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈkɒmpɹəˌmaɪz/ · US /ˈkɑmpɹəˌmaɪz/\u003c/p>\u003cp data-dictionary-sense=\"compromise%2:32:01::\">\u003cstrong>1. 达成妥协\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make a compromise; arrive at a compromise\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：nobody will get everything he wants: we all must compromise\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"compromise%2:32:00::\">\u003cstrong>2. 通过让步解决\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">settle by concession\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s / Somebody ----s PP\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"compromise%2:32:03::\">\u003cstrong>3. 使面临危险、嫌疑或名誉受损\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">expose or make liable to danger, suspicion, or disrepute\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The nuclear secrets of the state were compromised by the spy\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s something / Something ----s somebody / Something ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"妥协；折中方案","cue":"当前用法","b":"本句说双方已经谈成一个折中安排。比如一方想周一评审，另一方想周五，最后接受周三；重点是各自调整要求后取得一致，而不是争论谁完全获胜。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","compromise 早期指双方共同承诺遵守仲裁者的决定，来历与拉丁语“共同作出承诺”有关。后来它也指双方让步后达成的和解及其结果，不只是某一方单独退让。","https://www.etymonline.com/word/compromise"],["用现代联系帮助理解","可以想成两个人各把要求往中间移一点，找到都能接受的安排。这是理解现代折中义的图像，不表示每次让步必须完全对等，也不表示所有事情都适合折中。","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"],["回到当前句子","本句说双方已经谈成一个折中安排。比如一方想周一评审，另一方想周五，最后接受周三；重点是各自调整要求后取得一致，而不是争论谁完全获胜。","https://www.oxfordlearnersdictionaries.com/definition/english/compromise_1"]]}},{"w":{"id":"V20261012-058","date":"2026-10-12","term":"negotiate","ipa":"nɪˈɡəʊʃieɪt","pos":"v.","meaning":"通过讨论争取双方可接受的条件","chunk":"negotiate a deadline","example":"We may need to negotiate a more realistic deadline.","level":"提升","gloss":"协商；谈判","explanation":"通过讨论争取双方可接受的条件","examples":[{"en":"We may need to negotiate a more realistic deadline.","zh":"我们可能需要协商更实际的截止期限。"},{"en":"They negotiated a longer warranty.","zh":"他们谈妥了更长的保修期。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We may need to negotiate a more realistic deadline.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住 negotiate a deadline，不是单方面把日期改掉，而是把期限带进讨论。和 negotiate with someone 连着记：前者说谈什么，后者说和谁谈；这有助于区分自
