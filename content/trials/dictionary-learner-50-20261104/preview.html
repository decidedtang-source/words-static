参考</a></div></main></div><script>
const cards=[{"w":{"id":"V20261012-001","date":"2026-10-12","term":"scope","ipa":"skəʊp","pos":"n.（不可数）","meaning":"项目包含和不包含的工作范围","chunk":"define the scope","example":"We need to define the scope before estimating the cost.","level":"核心","gloss":"范围","explanation":"项目包含和不包含的工作范围","examples":[{"en":"We need to define the scope before estimating the cost.","zh":"估算成本前，我们需要界定范围。"},{"en":"The scope excludes staff training.","zh":"范围不包括员工培训。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We need to define the scope before estimating the cost.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"先记“画边界”：这次做哪些，哪些先不做。把 define the scope（界定范围）和 out of scope（不在范围内）连起来记。例如，安装设备在范围内，培训暂不包含；这个画框的类比帮助记忆，不是词源。","requirements":{"anchor":"画边界","explanation":"这次做哪些","example":"安装设备在范围内","boundary":"不是词源"},"claimIds":["lexical","connection"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g2","title":"句法与概念","text":"本句可以分成两步：define the scope 是先把工作边界说清楚，before estimating the cost 是再估费用。before 后的 estimating 表示动作，这里做两件事的都是 we。“先后顺序”很重要：不知道要做多少工作，就难以估出相应成本。","requirements":{"anchor":"两步","explanation":"先把工作边界说清楚","example":"before estimating the cost","boundary":"做两件事的都是 we"},"claimIds":["lexical","syntax"],"sourceIds":["lex"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"]]},{"id":"g3","title":"辨析与英文邻居","text":"scope 问“这次包含什么”，objective 问“希望达到什么结果”。以培训项目为例，安排两场培训可写进范围，提高新人操作熟练度可作为目标；目标也可以直接写成要交付的成果。说 in scope / out of scope，是在判断某项工作是否包含其中。","requirements":{"anchor":"scope 问","explanation":"objective 问","example":"以培训项目为例","boundary":"目标也可以直接写成要交付的成果"},"claimIds":["lexical","contrast"],"sourceIds":["lex","contrast"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["Major differences between project scope and objectives","https://www.apm.org.uk/resources/find-a-resource/major-differences-between-project-scope-and-objectives/"]]},{"id":"g4","title":"这句话在做什么","text":"这句话在安排估价前的准备，不是在直接报价格。We need to 表明说话者认为这一步必要，before 把次序说清楚。自编回应：Does the scope include training?（范围包括培训吗？）问清这一项后，就能把相应培训工作算进或排除出估价。","requirements":{"anchor":"安排估价前的准备","explanation":"We need to","example":"Does the scope include training?","boundary":"不是在直接报价格"},"claimIds":["lexical","action"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"对方临时提出一项新任务时，可以先核对范围。自编：Is user training included in the scope?（用户培训包含在范围内吗？）把 user training 换成 installation 或 data migration，就能询问安装或数据迁移是否包含；先问是否包含，再讨论增加任务的安排。","requirements":{"anchor":"临时提出一项新任务","explanation":"先核对范围","example":"Is user training included in the scope?","boundary":"把 user training 换成"},"claimIds":["lexical","use"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]}]},"p":{"displayGloss":"范围","focused":[{"entry":{"lemma":"scope","pos":"n.","senses":[{"id":"scope:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project","sourceIds":["lex","method"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"scope:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project","sourceIds":["lex","method"]}}],"allEntries":[{"lemma":"scope","pos":"名词","senses":[{"id":"scope:opportunity","glossZh":"做某事的机会或发挥余地","definitionEn":"room or opportunity to do something","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"先说清做哪些工作，再估算费用。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-001\">\u003ch3>scope · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"scope-learner-1\">\u003cstrong>1. 某项工作、讨论或权力涉及的范围。\u003c/strong>\u003cbr>\u003csmall>名词〔通常不可数〕\u003c/small>\u003cbr>用法：the scope of; within / beyond the scope\u003cbr>\u003cspan class=\"en\" lang=\"en\">The course covers topics beyond the scope of this book.\u003c/span>\u003cbr>这门课涉及的主题超出了这本书的范围。\u003c/p>\u003cp data-learner-sense=\"scope-learner-2\">\u003cstrong>2. 做某事或发挥能力的机会、空间。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数〕\u003c/small>\u003cbr>用法：scope for something; scope to do something\u003cbr>\u003cspan class=\"en\" lang=\"en\">The role offers scope for creativity.\u003c/span>\u003cbr>这个职位有发挥创造力的空间。\u003c/p>\u003cp data-learner-sense=\"scope-learner-3\">\u003cstrong>3. 仔细查看或全面观察。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，非正式〕\u003c/small>\u003cbr>用法：scope something\u003cbr>\u003cspan class=\"en\" lang=\"en\">She scoped the room before choosing a seat.\u003c/span>\u003cbr>她先仔细看了看房间，然后选了一个座位。\u003c/p>\u003cp data-learner-sense=\"scope-learner-4\">\u003cstrong>4. 开始工作前调查任务的规模、范围和需求。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：scope a project; scope something out\u003cbr>\u003cspan class=\"en\" lang=\"en\">We need to scope the repair work before requesting quotes.\u003c/span>\u003cbr>询价前，我们需要摸清维修工作的范围。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/scope_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/scope_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>scope \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/scope\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"scope%1:07:00::\">\u003cstrong>1. 作用、运作、权力或控制所及的范围\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an area in which something acts or operates or has power or control:\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a piano has a greater range than the human voice\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the ambit of municipal legislation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：within the compass of this article\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：within the scope of an investigation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：outside the reach of the law\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：in the political orbit of a world power\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"scope%1:26:00::\">\u003cstrong>2. 某种情况所处的环境状态或范围\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the state of the environment in which a situation exists\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：you can&#39;t do that in a university setting\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"scope%1:06:02::\">\u003cstrong>3. 放大远处物体影像的望远镜\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a magnifier of images of distant objects\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"scope%1:06:01::\">\u003cstrong>4. 把变化的电学量显示为图像的示波器\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">electronic equipment that provides visual images of varying electrical quantities\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":4},"x":{"short":"范围","cue":"当前用法","b":"把它想成这次工作要覆盖的边界：同样说“做测试”，只测功能还是也测性能，工作量会不同。谈费用前先说明 scope，双方才是在估同一件事。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源：与“目标”有关","scope 的范围义可追溯到意大利语 scopo，再往前与希腊语 skopos 的“目标、注意对象”有关。英语早期用法还包括行动空间。这里有几种相连的用法，不能只按一个古义翻译今天的句子。","https://www.etymonline.com/word/scope"],["现代联系：注意力覆盖多大一片","学习时可以从“眼前要处理什么”联想到“这次覆盖哪些事情”。a wide scope 是涉及得广，outside the scope 是超出所谈范围。这是帮助理解现代用法的联系，不是说 scope 等于眼睛能看见的面积。","https://www.oxfordlearnersdictionaries.com/definition/english/scope_1"],["回到项目：把工作边界说清楚","在 define the scope 里，要明确的是本次工作包括什么、哪些不包括。培训是否包含，会影响需要做的工作；所以原句把界定范围放在估价之前。这是现代项目用法，不是要求记住希腊语才能使用。","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]}},{"w":{"id":"V20261012-002","date":"2026-10-12","term":"objective","ipa":"əbˈdʒektɪv","pos":"n.","meaning":"希望达成的具体目标","chunk":"a clear objective","example":"Our objective is to reduce the time spent on approvals.","level":"核心","gloss":"目标","explanation":"希望达成的具体目标","examples":[{"en":"Our objective is to reduce the time spent on approvals.","zh":"我们的目标是减少审批所用的时间。"},{"en":"Each phase has a measurable objective.","zh":"每个阶段都有可衡量的目标。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Our objective is to reduce the time spent on approvals.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可把 objective 记成工作完成后希望看到的变化，不只是今天做的动作。发出一份表单是行动，减少等待审批的时间才是本句目标。这个联系帮助你从任务清单回到做事的目的。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"可把 objective 记成工作完成后希望看到的变化，不只是今天做的动作。","explanation":"发出一份表单是行动，减少等待审批的时间才是本句目标。","example":"可把 objective 记成工作完成后希望看到的变化，不只是今天做的动作。","boundary":"这个联系帮助你从任务清单回到做事的目的。"},"sources":[["Oxford — objective","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]},{"id":"g2","title":"句法与概念","text":"Our objective 是主语，is 后的 to reduce 说明目标内容。the time spent on approvals 中 spent 修饰 time，意思是花在审批上的时间；不是缩短批准的有效期，也不是减少审批人数。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"Our objective 是主语，is 后的 to reduce 说明目标内容。","explanation":"the time spent on approvals 中 spent 修饰 time，意思是花在审批上的时间；不是缩短批准的有效期，也不是减少审批人数。","example":"Our objective 是主语，is 后的 to reduce 说明目标内容。","boundary":"the time spent on approvals 中 spent 修饰 time，意思是花在审批上的时间；不是缩短批准的有效期，也不是减少审批人数。"},"sources":[["Oxford — objective","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"objective 与 goal 都可以表示目标，前者常见于较正式的工作计划，不必硬分为永远具体与永远宽泛。deliverable 则是交出的成果；表单可以交付，审批效率的改善需要另行观察。","sourceIds":["lexical"],"claimIds":["c4"],"requirements":{"anchor":"objective 与 goal 都可以表示目标，前者常见于较正式的工作计划，不必硬分为永远具体与永远宽泛。","explanation":"deliverable 则是交出的成果；表单可以交付，审批效率的改善需要另行观察。","example":"objective 与 goal 都可以表示目标，前者常见于较正式的工作计划，不必硬分为永远具体与永远宽泛。","boundary":"deliverable 则是交出的成果；表单可以交付，审批效率的改善需要另行观察。"},"sources":[["Oxford — objective","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]},{"id":"g4","title":"这句话在做什么","text":"这句话在给改进讨论定方向。Our objective is 明确说出共同追求的结果，to reduce 指向“减少耗时”。自编回应：How will we measure that time?（我们如何测量这段时间？）先把耗时口径说清楚，才能比较哪种方案有帮助。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"这句话在给改进讨论定方向。","explanation":"Our objective is 明确说出共同追求的结果，to reduce 指向“减少耗时”。","example":"Our objective is 明确说出共同追求的结果，to reduce 指向“减少耗时”。","boundary":"自编回应：How will we measure that time?（我们如何测量这段时间？）先把耗时口径说清楚，才能比较哪种方案有帮助。"},"sources":[["Oxford — objective","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]},{"id":"g5","title":"工作中可以这样说","text":"讨论改进目标时，可以说：Our objective is to cut the review time by one day.（我们的目标是把评审时间缩短一天。自编。）把 one day 换成 two hours，就能表达另一幅度；这是目标，不是已经实现的成绩。","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"讨论改进目标时，可以说：Our objective is to cut the review time by one day.（我们的目标是把评审时间缩短一天。","explanation":"自编。","example":"讨论改进目标时，可以说：Our objective is to cut the review time by one day.（我们的目标是把评审时间缩短一天。","boundary":"）把 one day 换成 two hours，就能表达另一幅度；这是目标，不是已经实现的成绩。"},"sources":[["Oxford — objective","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]}]},"p":{"displayGloss":"目标","focused":[{"entry":{"lemma":"objective","pos":"n.","senses":[{"id":"V20261012-002:current","glossZh":"希望达成的具体目标","definitionEn":"a result that you want to achieve","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-002:current","glossZh":"希望达成的具体目标","definitionEn":"a result that you want to achieve","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"objective","pos":"形容词","senses":[{"id":"V20261012-002:extra","glossZh":"客观的；根据事实而非个人感受的","definitionEn":"based on facts rather than personal feelings","sourceIds":["extra"]}]}],"contextTakeaway":"目标是减少审批耗时。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-002\">\u003ch3>objective · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"objective-learner-1\">\u003cstrong>1. 希望达到的目标。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：an objective; achieve / meet an objective\u003cbr>\u003cspan class=\"en\" lang=\"en\">Her main objective is to become financially independent.\u003c/span>\u003cbr>她的主要目标是实现经济独立。\u003c/p>\u003cp data-learner-sense=\"objective-learner-2\">\u003cstrong>2. 根据事实判断，不让个人感情或偏见左右结论的；客观的。\u003c/strong>\u003cbr>\u003csmall>形容词\u003c/small>\u003cbr>用法：an objective assessment; remain objective\u003cbr>\u003cspan class=\"en\" lang=\"en\">We asked an independent expert for an objective assessment.\u003c/span>\u003cbr>我们请一位独立专家作客观评估。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/objective_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/objective_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/a\">\u003ch3>objective \u003csmall>形容词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/objective\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ɒbˈd͡ʒɛk.tɪv/ · US /əbˈd͡ʒɛk.tɪv/\u003c/p>\u003cp data-dictionary-sense=\"objective%3:00:00::\">\u003cstrong>1. 客观的：不受情绪或个人偏见歪曲，以可观察现象为依据\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">undistorted by emotion or personal bias; based on observable phenomena\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：an objective appraisal\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：objective evidence\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objective%3:01:00::\">\u003cstrong>2. 宾格的：充当或表示动词、某些介词的宾语等\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：grammar\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">serving as or indicating the object of a verb or of certain prepositions and used for certain other purposes\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：objective case\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：accusative endings\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objective%5:00:00:real:00\">\u003cstrong>3. 客观表现的：按事物被感知的样子表达，不掺入个人感情或解释\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">emphasizing or expressing things as perceived without distortion of personal feelings or interpretation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：objective art\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objective%5:00:00:concrete:00\">\u003cstrong>4. 属于对真实事物或事件的直接经验的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">belonging to immediate experience of actual things or events\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：objective benefits\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：an objective example\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：there is no objective evidence of anything of the kind\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>objective \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/objective\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ɒbˈd͡ʒɛk.tɪv/ · US /əbˈd͡ʒɛk.tɪv/\u003c/p>\u003cp data-dictionary-sense=\"objective%1:09:00::\">\u003cstrong>1. 希望达到且认为可以达到的目标\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the goal intended to be attained (and which is believed to be attainable)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the sole object of her trip was to see her children\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"objective%1:06:00::\">\u003cstrong>2. 物镜：望远镜或显微镜中最靠近被观察物体的透镜或透镜组\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the lens or system of lenses in a telescope or microscope that is nearest the object being viewed\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":6},"x":{"short":"目标","cue":"当前用法","b":"objective回答“希望做到什么”。在这句里，重点是让审批少花时间；采用哪张表单、开几次会，都只是可能实现目标的办法。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","objective作名词表示“目标”的用法，与19世纪的军事表达 objective point 有关。它和形容词“客观的”共享词形，但不能把“客观的”直接翻进本句。","https://www.etymonline.com/word/objective"],["帮助理解的现代联系","把目标想成想要到达的点，有助于区分目的和动作：填写表单是动作，缩短审批等待才是本句希望达到的改变。这个画面帮助理解，不是另造词源。","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"],["回到当前用法","objective回答“希望做到什么”。在这句里，重点是让审批少花时间；采用哪张表单、开几次会，都只是可能实现目标的办法。","https://www.oxfordlearnersdictionaries.com/definition/english/objective_1"]]}},{"w":{"id":"V20261012-003","date":"2026-10-12","term":"deliverable","ipa":"dɪˈlɪvərəbl","pos":"n.","meaning":"项目需要交付的成果或文件","chunk":"agree on the deliverables","example":"Please list the deliverables for the first phase.","level":"提升","gloss":"交付成果","explanation":"项目需要交付的成果或文件","examples":[{"en":"Please list the deliverables for the first phase.","zh":"请列出第一阶段的交付成果。"},{"en":"The final deliverable is a test report.","zh":"最终交付成果是一份测试报告。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please list the deliverables for the first phase.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住“交得出、能检查”的成果，而不是只记做过多少事。开三次会通常是活动，交出会议决定形成的方案才可能是 deliverable；具体交什么，还得看项目约定，未必都是纸质文件。","sourceIds": ctionaries.com/definition/english/deliverable_2"]]},{"id":"g5","title":"工作中可以这样说","text":"阶段开始前，可以问：Can we agree on the deliverables for this phase?（我们能商定这一阶段的交付成果吗？自编。）把this phase换成the pilot，便是在确认试点要交什么；接着列具体成果，比只说“完成试点”更清楚。","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"阶段开始前，可以问：Can we agree on the deliverables for this phase?（我们能商定这一阶段的交付成果吗？自编。","explanation":"）把this phase换成the pilot，便是在确认试点要交什么；接着列具体成果，比只说“完成试点”更清楚。","example":"阶段开始前，可以问：Can we agree on the deliverables for this phase?（我们能商定这一阶段的交付成果吗？自编。","boundary":"）把this phase换成the pilot，便是在确认试点要交什么；接着列具体成果，比只说“完成试点”更清楚。"},"sources":[["Oxford — deliverable","https://www.oxfordlearnersdictionaries.com/definition/english/deliverable_2"]]}]},"p":{"displayGloss":"交付成果","focused":[{"entry":{"lemma":"deliverable","pos":"n.","senses":[{"id":"V20261012-003:current","glossZh":"项目需要交付的成果或文件","definitionEn":"an agreed result that a project must provide","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-003:current","glossZh":"项目需要交付的成果或文件","definitionEn":"an agreed result that a project must provide","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"deliverable","pos":"形容词","senses":[{"id":"V20261012-003:extra","glossZh":"可以交付或实现的","definitionEn":"capable of being delivered or achieved","sourceIds":["extra"]}]}],"contextTakeaway":"列的是第一阶段要交出的成果。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-003\">\u003ch3>deliverable · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"deliverable-learner-1\">\u003cstrong>1. 项目或约定中需要完成并提供的成果，如报告、软件或产品。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，常用复数〕\u003c/small>\u003cbr>用法：project deliverables; agree on the deliverables\u003cbr>\u003cspan class=\"en\" lang=\"en\">The final deliverables are a report and a working prototype.\u003c/span>\u003cbr>最终交付成果是一份报告和一个可运行的原型。\u003c/p>\u003cp data-learner-sense=\"deliverable-learner-2\">\u003cstrong>2. 能够运送或交付的。\u003c/strong>\u003cbr>\u003csmall>形容词\u003c/small>\u003cbr>用法：deliverable goods; in a deliverable state\u003cbr>\u003cspan class=\"en\" lang=\"en\">The package is deliverable to this address.\u003c/span>\u003cbr>这个包裹可以投递到这个地址。\u003c/p>\u003cp data-learner-sense=\"deliverable-learner-3\">\u003cstrong>3. 计划、成果等能够实现或完成的。\u003c/strong>\u003cbr>\u003csmall>形容词\u003c/small>\u003cbr>用法：a deliverable plan / result\u003cbr>\u003cspan class=\"en\" lang=\"en\">The team must decide whether the proposed improvements are deliverable.\u003c/span>\u003cbr>团队必须判断提议的改进能否实现。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/deliverable_2\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/deliverable_1\">Oxford 2\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://dictionary.cambridge.org/dictionary/english/deliverable\">Cambridge 3\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/a\">\u003ch3>deliverable \u003csmall>形容词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/deliverable\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /dɪˈlɪvɹəbəɫ/\u003c/p>\u003cp data-dictionary-sense=\"deliverable%3:01:00::\">\u003cstrong>1. 适合交付或已经可以交付的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">suitable for or ready for delivery\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>deliverable \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/deliverable\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /dɪˈlɪvɹəbəɫ/\u003c/p>\u003cp data-dictionary-sense=\"deliverable%1:06:00::\">\u003cstrong>1. 可作为开发成果提供的交付物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something that can be provided as the product of development\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：under this contract the deliverables include both software and hardware\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"交付成果","cue":"当前用法","b":"deliverable把讨论落到“最后交出什么”。写报告、检查数据是活动，完成并应交付的报告才是成果。原句要求列第一阶段的成果清单，方便大家核对。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","deliver这个母词早期有解救、释放等用法，后来也表示交出、移交。deliverable有“可交付的”形容词用法，也用作交付成果的名词；母词历史不能当作项目管理名词的诞生日期。","https://www.etymonline.com/word/deliver"],["帮助理解的现代联系","可以联系 deliver a report：把报告交出来。名词 a deliverable 则给“应交出的成果”起名字；它可以是文件、产品或约定的其他成果，不必都是一份纸质报告。","https://www.oxfordlearnersdictionaries.com/definition/english/deliverable_2"],["回到当前用法","deliverable把讨论落到“最后交出什么”。写报告、检查数据是活动，完成并应交付的报告才是成果。原句要求列第一阶段的成果清单，方便大家核对。","https://www.oxfordlearnersdictionaries.com/definition/english/deliverable_2"]]}},{"w":{"id":"V20261012-004","date":"2026-10-12","term":"milestone","ipa":"ˈmaɪlstəʊn","pos":"n.","meaning":"标志阶段成果达成的重要节点","chunk":"reach a milestone","example":"We reached the first milestone after the review.","level":"核心","gloss":"里程碑","explanation":"标志阶段成果达成的重要节点","examples":[{"en":"We reached the first milestone after the review.","zh":"评审后，我们达成了第一个里程碑。"},{"en":"The pilot launch is our next milestone.","zh":"试点启动是我们的下一个里程碑。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We reached the first milestone after the review.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可以用旅程中的路标帮助记忆：它告诉你走到哪里，而不是替你完成路程。这是类比。本句的 first milestone 表示第一个重要节点，记住 reach a milestone 这个搭配即可。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"可以用旅程中的路标帮助记忆：它告诉你走到哪里，而不是替你完成路程。","explanation":"这是类比。","example":"本句的 first milestone 表示第一个重要节点，记住 reach a milestone 这个搭配即可。","boundary":"本句的 first milestone 表示第一个重要节点，记住 reach a milestone 这个搭配即可。"},"sources":[["Oxford — milestone","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]},{"id":"g2","title":"句法与概念","text":"reached 是过去式，表示说话者报告节点已达成；after the review 说明时间在评审之后。仅凭 after 不能断言评审本身就是节点，也不能推断评审已批准整项项目。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"reached 是过去式，表示说话者报告节点已达成；after the review 说明时间在评审之后。","explanation":"仅凭 after 不能断言评审本身就是节点，也不能推断评审已批准整项项目。","example":"reached 是过去式，表示说话者报告节点已达成；after the review 说明时间在评审之后。","boundary":"仅凭 after 不能断言评审本身就是节点，也不能推断评审已批准整项项目。"},"sources":[["Oxford — milestone","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]},{"id":"g3","title":"辨析与英文邻居","text":"milestone 看阶段进展，deadline 看最晚完成时间。某个节点可以有自己的截止日，但两者不是同一件事。deliverable 是应交成果，节点则可用成果被接受等事件来定义，须按实际计划判断。","sourceIds":["lexical"],"claimIds":["c4"],"requirements":{"anchor":"milestone 看阶段进展，deadline 看最晚完成时间。","explanation":"某个节点可以有自己的截止日，但两者不是同一件事。","example":"milestone 看阶段进展，deadline 看最晚完成时间。","boundary":"deliverable 是应交成果，节点则可用成果被接受等事件来定义，须按实际计划判断。"},"sources":[["Oxford — milestone","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]},{"id":"g4","title":"这句话在做什么","text":"这是一句进度汇报。reached用过去式，报告首个节点已经到达；after the review说明时间位置。自编回应：What is the next milestone?（下一个里程碑是什么？）先确认当前进展，再把注意力转向下一节点。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"这是一句进度汇报。","explanation":"reached用过去式，报告首个节点已经到达；after the review说明时间位置。","example":"reached用过去式，报告首个节点已经到达；after the review说明时间位置。","boundary":"自编回应：What is the next milestone?（下一个里程碑是什么？）先确认当前进展，再把注意力转向下一节点。"},"sources":[["Oxford — milestone","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]},{"id":"g5","title":"工作中可以这样说","text":"汇报预计进展时，可以说：We expect to reach the next milestone in June.（我们预计六月达成下一个里程碑。自编。）expect表明是预测；若改成We reached，就在报告已经发生的进展。","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"汇报预计进展时，可以说：We expect to reach the next milestone in June.（我们预计六月达成下一个里程碑。","explanation":"自编。","example":"汇报预计进展时，可以说：We expect to reach the next milestone in June.（我们预计六月达成下一个里程碑。","boundary":"）expect表明是预测；若改成We reached，就在报告已经发生的进展。"},"sources":[["Oxford — milestone","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]}]},"p":{"displayGloss":"里程碑","focused":[{"entry":{"lemma":"milestone","pos":"n.","senses":[{"id":"V20261012-004:current","glossZh":"标志阶段成果达成的重要节点","definitionEn":"an important point that shows progress in a project","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-004:current","glossZh":"标志阶段成果达成的重要节点","definitionEn":"an important point that shows progress in a project","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"milestone","pos":"名词","senses":[{"id":"V20261012-004:extra","glossZh":"路旁标示距离的里程碑石","definitionEn":"a roadside stone indicating distances","sourceIds":["lexical"]}]}],"contextTakeaway":"首个重要进度节点已经达成。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-004\">\u003ch3>milestone · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"milestone-learner-1\">\u003cstrong>1. 人生、事业或项目发展中的重要事件或阶段。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：reach / mark a milestone; a milestone in\u003cbr>\u003cspan class=\"en\" lang=\"en\">Opening her first shop was a milestone in her career.\u003c/span>\u003cbr>开第一家店是她职业生涯中的一个里程碑。\u003c/p>\u003cp data-learner-sense=\"milestone-learner-2\">\u003cstrong>2. 路旁标明到某地距离的石碑或标志。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a roadside milestone\u003cbr>\u003cspan class=\"en\" lang=\"en\">An old milestone stood beside the road.\u003c/span>\u003cbr>路旁立着一块旧里程碑。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/milestone\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>milestone \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/milestone\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"milestone%1:10:01::\">\u003cstrong>1. 路旁标示距离的里程碑\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">stone post at side of a road to show distances\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"milestone%1:11:00::\">\u003cstrong>2. 人生或项目中的重大事件；里程碑\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a significant event in your life (or in a project)\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"里程碑","cue":"当前用法","b":"milestone突出一个值得标记的重要节点。达到首个milestone，说明项目走到了一处关键位置；后面通常还有工作，所以它不等同于“整个项目完成”。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","milestone由mile和stone构成，早期指沿路设置、标示英里距离的石柱。Etymonline记录这一字面用法；今天它也用于重要阶段或事件，不能把每个现代项目节点都理解成实物路标。","https://www.etymonline.com/word/milestone"],["帮助理解的现代联系","用“走到某个路标”来理解重要进展：它标记走到了哪里，并不等于旅程结束。项目里的试点启动、某阶段完成，都可以被计划设为milestone。","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"],["回到当前用法","milestone突出一个值得标记的重要节点。达到首个milestone，说明项目走到了一处关键位置；后面通常还有工作，所以它不等同于“整个项目完成”。","https://www.oxfordlearnersdictionaries.com/definition/english/milestone"]]}},{"w":{"id":"V20261012-005","date":"2026-10-12","term":"priority","ipa":"praɪˈɒrəti","pos":"n.","meaning":"需要优先处理的事项或优先程度","chunk":"set priorities","example":"We need to set priorities for the remaining work.","level":"核心","gloss":"优先事项；优先级","explanation":"需要优先处理的事项或优先程度","examples":[{"en":"We need to set priorities for the remaining work.","zh":"我们需要为剩余工作设定优先级。"},{"en":"Safety remains our top priority.","zh":"安全仍是我们的首要任务。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We need to set priorities for the remaining work.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 priority 和排队联系起来：时间有限时，哪些事先得到注意和资源？这个记忆画面强调取舍。本句不是说剩余工作都不重要，而是要把先处理什么讲清楚，避免所有事都同时排第一。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"把 priority 和排队联系起来：时间有限时，哪些事先得到注意和资源？这个记忆画面强调取舍。","explanation":"本句不是说剩余工作都不重要，而是要把先处理什么讲清楚，避免所有事都同时排第一。","example":"把 priority 和排队联系起来：时间有限时，哪些事先得到注意和资源？这个记忆画面强调取舍。","boundary":"本句不是说剩余工作都不重要，而是要把先处理什么讲清楚，避免所有事都同时排第一。"},"sources":[["Oxford — priority","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]},{"id":"g2","title":"句法与概念","text":"set priorities 中 priorities 是复数，指为多项工作确定优先安排；for the remaining work 限定比较对象。We need to 提出当前需要的行动，还没有宣布哪项已经获得最高优先级。","sourceIds":["lexical"],"claimIds":["c3"],"requirements":{"anchor":"set priorities 中 priorities 是复数，指为多项工作确定优先安排；for the remaining work 限定比较对象。","explanation":"We need to 提出当前需要的行动，还没有宣布哪项已经获得最高优先级。","example":"set priorities 中 priorities 是复数，指为多项工作确定优先安排；for the remaining work 限定比较对象。","boundary":"We need to 提出当前需要的行动，还没有宣布哪项已经获得最高优先级。"},"sources":[["Oxford — priority","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]},{"id":"g3","title":"辨析与英文邻居","text":"priority 说重要性或优先处理的地位，sequence 说先后步骤。某个检查即使不是最重要的目标，也可能必须先做，才能开始下一步。top priority 比一般的 important 更明确地表达优先取舍。","sourceIds":["lexical"],"claimIds":["c4"],"requirements":{"anchor":"priority 说重要性或优先处理的地位，sequence 说先后步骤。","explanation":"某个检查即使不是最重要的目标，也可能必须先做，才能开始下一步。","example":"priority 说重要性或优先处理的地位，sequence 说先后步骤。","boundary":"top priority 比一般的 important 更明确地表达优先取舍。"},"sources":[["Oxford — priority","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]},{"id":"g4","title":"这句话在做什么","text":"本句在开启优先排序讨论。We need to提出要做的事，remaining work把范围限定为尚未完成的工作。自编回应：Can we put the safety review first?（我们能先做安全评审吗？）回应给出具体选择，大家再讨论理由和影响。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"本句在开启优先排序讨论。","explanation":"We need to提出要做的事，remaining work把范围限定为尚未完成的工作。","example":"We need to提出要做的事，remaining work把范围限定为尚未完成的工作。","boundary":"自编回应：Can we put the safety review first?（我们能先做安全评审吗？）回应给出具体选择，大家再讨论理由和影响。"},"sources":[["Oxford — priority","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]},{"id":"g5","title":"工作中可以这样说","text":"两项任务争用同一人力时，可以问：Which task should take priority this week?（本周哪项任务应该优先？自编。）this week把取舍限定到当前时段；若要说明自己的主张，可接The customer issue should come first.（客户问题应先处理。）","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"两项任务争用同一人力时，可以问：Which task should take priority this week?（本周哪项任务应该优先？自编。","explanation":"）this week把取舍限定到当前时段；若要说明自己的主张，可接The customer issue should come first.（客户问题应先处理。","example":"两项任务争用同一人力时，可以问：Which task should take priority this week?（本周哪项任务应该优先？自编。","boundary":"this week把取舍限定到当前时段；选择的是当前要先处理的任务。"},"sources":[["Oxford — priority","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]}]},"p":{"displayGloss":"优先事项","focused":[{"entry":{"lemma":"priority","pos":"n.","senses":[{"id":"V20261012-005:current","glossZh":"需要先于其他工作处理的重要事项","definitionEn":"something important enough to be dealt with before other work","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-005:current","glossZh":"需要先于其他工作处理的重要事项","definitionEn":"something important enough to be dealt with before other work","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"priority","pos":"不可数名词","senses":[{"id":"V20261012-005:extra","glossZh":"优先地位；先得到处理的资格","definitionEn":"the position of being dealt with before other things","sourceIds":["lexical"]}]}],"contextTakeaway":"要为剩余工作确定优先安排。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-005\">\u003ch3>priority · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"priority-learner-1\">\u003cstrong>1. 因为更重要或紧急而应先处理的事情。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a top priority; set priorities\u003cbr>\u003cspan class=\"en\" lang=\"en\">Finding somewhere safe to stay is our first priority.\u003c/span>\u003cbr>找到安全的住处是我们的首要任务。\u003c/p>\u003cp data-learner-sense=\"priority-learner-2\">\u003cstrong>2. 比其他事项优先获得处理或考虑的地位。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数〕\u003c/small>\u003cbr>用法：give priority to; take priority over\u003cbr>\u003cspan class=\"en\" lang=\"en\">Emergency vehicles have priority over other traffic.\u003c/span>\u003cbr>紧急车辆比其他车辆享有优先通行权。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/priority\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>priority \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/priority\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /pɹaɪˈɒɹɨti/ · US /pɹaɪˈɔɹɪ̈ti/\u003c/p>\u003cp data-dictionary-sense=\"priority%1:26:00::\">\u003cstrong>1. 按重要性或紧迫性确定的优先地位\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">status established in order of importance or urgency\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：… its precedence as the world&#39;s leading manufacturer of pharmaceuticals\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：national independence takes priority over class struggle\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"priority%1:07:00::\">\u003cstrong>2. 时间上的在先、先于其他事物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">preceding in time\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"优先事项","cue":"当前用法","b":"priority用来表达取舍：事情都要做时，哪件先得到时间和资源？set priorities就是把这种优先安排说清楚，而不是把每件事都标为同样紧急。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","priority经法语、拉丁语与prior“较早、在前”相连。早期强调时间或次序在先，后来也强调重要性和先处理的需要；今天的优先事项不一定是最早提出的事项。","https://www.etymonline.com/word/priority"],["帮助理解的现代联系","把它想成分配注意力时的排队顺序：top priority放在最前。这个联系便于记忆，不过真正决定优先级的可能是影响、风险或时限，而不是谁先开口。","https://www.oxfordlearnersdictionaries.com/definition/english/priority"],["回到当前用法","priority用来表达取舍：事情都要做时，哪件先得到时间和资源？set priorities就是把这种优先安排说清楚，而不是把每件事都标为同样紧急。","https://www.oxfordlearnersdictionaries.com/definition/english/priority"]]}},{"w":{"id":"V20261012-006","date":"2026-10-12","term":"constraint","ipa":"kənˈstreɪnt","pos":"n.","meaning":"限制可选方案的条件","chunk":"a re 邻的常见说法。"},"sources":[["Oxford — constraint","https://www.oxfordlearnersdictionaries.com/definition/english/constraint"]]},{"id":"g4","title":"这句话在做什么","text":"说话者在解释安排受什么限制。The main constraint is把主要因素点出来，后面具体到可用评审人数。自编回应：Could we stagger the reviews?（我们可以错开评审时间吗？）回应尝试在人数不变时调整做法，再检查是否可行。","sourceIds":["lexical"],"claimIds":["c5"],"requirements":{"anchor":"说话者在解释安排受什么限制。","explanation":"The main constraint is把主要因素点出来，后面具体到可用评审人数。","example":"The main constraint is把主要因素点出来，后面具体到可用评审人数。","boundary":"自编回应：Could we stagger the reviews?（我们可以错开评审时间吗？）回应尝试在人数不变时调整做法，再检查是否可行。"},"sources":[["Oxford — constraint","https://www.oxfordlearnersdictionaries.com/definition/english/constraint"]]},{"id":"g5","title":"工作中可以这样说","text":"讨论预算边界时，可以说：We need a plan that works within our budget constraints.（我们需要一个在预算限制内可行的计划。自编。）把budget换成space，就在谈空间限制；within强调方案要适应边界。","sourceIds":["lexical"],"claimIds":["c6"],"requirements":{"anchor":"讨论预算边界时，可以说：We need a plan that works within our budget constraints.（我们需要一个在预算限制内可行的计划。","explanation":"自编。","example":"讨论预算边界时，可以说：We need a plan that works within our budget constraints.（我们需要一个在预算限制内可行的计划。","boundary":"）把budget换成space，就在谈空间限制；within强调方案要适应边界。"},"sources":[["Oxford — constraint","https://www.oxfordlearnersdictionaries.com/definition/english/constraint"]]}]},"p":{"displayGloss":"限制条件","focused":[{"entry":{"lemma":"constraint","pos":"n.","senses":[{"id":"V20261012-006:current","glossZh":"限制可选方案的条件","definitionEn":"a condition that limits the available choices","sourceIds":["lexical"]}]},"sense":{"id":"V20261012-006:current","glossZh":"限制可选方案的条件","definitionEn":"a condition that limits the available choices","sourceIds":["lexical"]}}],"allEntries":[{"lemma":"constraint","pos":"不可数名词","senses":[{"id":"V20261012-006:extra","glossZh":"对行为的约束；拘束","definitionEn":"control that restricts how freely someone behaves","sourceIds":["lexical"]}]}],"contextTakeaway":"当前主要限制是可用的评审人数。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-006\">\u003ch3>constraint · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"constraint-learner-1\">\u003cstrong>1. 限制行动或选择的条件、规则或因素。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a constraint on; budget / time constraints\u003cbr>\u003cspan class=\"en\" lang=\"en\">The small room puts a constraint on the number of guests.\u003c/span>\u003cbr>房间小，限制了可邀请的客人数。\u003c/p>\u003cp data-learner-sense=\"constraint-learner-2\">\u003cstrong>2. 受到拘束、无法自然行动或表达的状态。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数，较正式〕\u003c/small>\u003cbr>用法：without constraint\u003cbr>\u003cspan class=\"en\" lang=\"en\">She spoke freely and without constraint.\u003c/span>\u003cbr>她毫无拘束地畅所欲言。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/constraint\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>constraint \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/constraint\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /kənˈstɹeɪnt/\u003c/p>\u003cp data-dictionary-sense=\"constraint%1:26:00::\">\u003cstrong>1. 身体或物体受到限制的状态\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the state of being physically constrained\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：dogs should be kept under restraint\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"constraint%1:06:00::\">\u003cstrong>2. 限制或减缓物体运动的装置\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a device that retards something&#39;s motion\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the car did not have proper restraints fitted\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"constraint%1:04:00::\">\u003cstrong>3. 约束行为；威胁或使用武力来控制他人的思想或行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of constraining; the threat or use of force to control the thoughts or behavior of others\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"限制条件","cue":"当前用法","b":"constraint是方案必须面对的限制条件。原句说可用评审人数限制了安排；即使每个人都很能干，总人数有限也会影响一次能评审多少内容。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","constraint经古法语与拉丁语“绑紧、束在一起”的词有关。英语逐渐用它表示限制和强制；这种历史联系能帮助记住“活动空间受约束”，但现在谈的往往不是实际绳索。","https://www.etymonline.com/word/constraint"],["帮助理解的现代联系","想象计划只能在一个边框里调整。预算、场地、人员数量都可能让某些方案不可行；constraint关注的正是这类限制，而不是单纯令人不快的事情。","https://www.oxfordlearnersdictionaries.com/definition/english/constraint"],["回到当前用法","constraint是方案必须面对的限制条件。原句说可用评审人数限制了安排；即使每个人都很能干，总人数有限也会影响一次能评审多少内容。","https://www.oxfordlearnersdictionaries.com/definition/english/constraint"]]}},{"w":{"id":"V20261012-007","date":"2026-10-12","term":"dependency","ipa":"dɪˈpendənsi","pos":"n.","meaning":"一项工作对另一项工作或条件的依赖","chunk":"identify dependencies","example":"Please identify dependencies before finalizing the schedule.","level":"提升","gloss":"依赖关系","explanation":"一项工作对另一项工作或条件的依赖","examples":[{"en":"Please identify dependencies before finalizing the schedule.","zh":"确定日程前，请识别各项依赖关系。"},{"en":"This dependency could delay testing.","zh":"这项依赖关系可能延误测试。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please identify dependencies before finalizing the schedule.","kind":"existing 可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"依赖关系","cue":"当前用法","b":"项目里的dependency说明一项工作离不开哪个输入或条件。排期不能只加上各任务的时长，还要知道它们怎样相互依赖；这样才看得出可能的等待。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["有记录的历史来源","dependency由dependent一族构成；其更早的拉丁语联系包含“悬挂于、依靠”。英语早期已用它谈某物需要另一物支持；项目中的依赖关系是这种“离不开条件”的现代应用。","https://www.etymonline.com/word/dependent"],["帮助理解的现代联系","可以记成“A能不能做，要看B是否到位”。测试要有可用原型，是一个容易理解的例子；依赖关系并不总是等前一项完全结束，还可能要求同时开始或共同满足条件。","https://www.oxfordlearnersdictionaries.com/definition/english/dependency"],["回到当前用法","项目里的dependency说明一项工作离不开哪个输入或条件。排期不能只加上各任务的时长，还要知道它们怎样相互依赖；这样才看得出可能的等待。","https://www.apm.org.uk/resources/what-is-project-management/what-is-scheduling-in-project-management/"]]}},{"w":{"id":"V20261012-008","date":"2026-10-12","term":"assumption","ipa":"əˈsʌmpʃn","pos":"n.","meaning":"尚未证实但暂时作为规划基础的条件","chunk":"check an assumption","example":"This assumption needs to be checked with the supplier.","level":"核心","gloss":"假设","explanation":"尚未证实但暂时作为规划基础的条件","examples":[{"en":"This assumption needs to be checked with the supplier.","zh":"这项假设需要与供应商核实。"},{"en":"Our estimate rests on that assumption.","zh":"我们的估算基于那项假设。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"This assumption needs to be checked with the supplier.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 assumption 想成计划暂时站着的一块垫板：先借它继续推算，但还要检查稳不稳。这是记忆类比。称它为假设不是说它必然错误，而是提醒人不要把尚未核实的条件当成事实。","sourceIds":["lexical"],"claimIds":["c2"],"requirements":{"anchor":"把 assumption 想成计划暂时站着的一块垫板：先借它继续推算，但还要检查稳不稳。","explanation":"这是记忆类比。","example":"把 assumption 想成计划暂时站着的一块垫板：先借它继续推算，但还要检查稳不稳。","boundary":"称它为假设不是说它必然错误，而是提醒人不要把尚未核实的条件当成事实。"},"sources":[["Oxford — assumption","https://www.oxfordlearnersdictionaries.com/definition/english/assumption"]]},{"id":"g2","title":"句法与概念","text":"This assumption 是被检查的对象，needs to be checked 用被动式突出核实动作；with the supplier 指向核实的沟通对象。句子并未说供应商已经认同，也未指定究竟由谁负责联系。","sourceId
