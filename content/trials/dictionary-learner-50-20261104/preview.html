nitionEn":"the willingness to devote effort and time to something","sourceIds":["lex"]}]}],"contextTakeaway":"这里问的是承诺成立的条件。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-018\">\u003ch3>commitment · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"commitment-learner-1\">\u003cstrong>1. 答应做某事的承诺。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：make a commitment to do; a commitment to something\u003cbr>\u003cspan class=\"en\" lang=\"en\">They made a commitment to keep the service open.\u003c/span>\u003cbr>他们承诺保持这项服务开放。\u003c/p>\u003cp data-learner-sense=\"commitment-learner-2\">\u003cstrong>2. 愿意持续投入时间和努力的热忱、忠诚或专注。\u003c/strong>\u003cbr>\u003csmall>名词〔不可数〕\u003c/small>\u003cbr>用法：commitment to; show commitment\u003cbr>\u003cspan class=\"en\" lang=\"en\">Learning an instrument takes practice and commitment.\u003c/span>\u003cbr>学习乐器需要练习和持续投入。\u003c/p>\u003cp data-learner-sense=\"commitment-learner-3\">\u003cstrong>3. 已经承担、需要投入时间或金钱的义务。\u003c/strong>\u003cbr>\u003csmall>名词〔可数，常用复数〕\u003c/small>\u003cbr>用法：family / work / financial commitments\u003cbr>\u003cspan class=\"en\" lang=\"en\">I cannot travel this week because of family commitments.\u003c/span>\u003cbr>由于家庭事务，我这周无法出行。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/commitment\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>commitment \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/commitment\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"commitment%1:07:01::\">\u003cstrong>1. 真诚而坚定地坚持目标的品质\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the trait of sincere and steadfast fixity of purpose\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a man of energy and commitment\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"commitment%1:04:00::\">\u003cstrong>2. 在思想或情感上使自己投入某项行动的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of binding yourself (intellectually or emotionally) to a course of action\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：his long commitment to public service\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：they felt no loyalty to a losing team\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"commitment%1:04:02::\">\u003cstrong>3. 合同约定的、涉及财务义务的承诺\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an engagement by contract involving financial obligation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：his business commitments took him to London\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"commitment%1:10:00::\">\u003cstrong>4. 作出保证的表述；承诺\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a message that makes a pledge\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"commitment%1:04:01::\">\u003cstrong>5. 将某人正式送往监狱或精神医疗机构等处收容的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the official act of consigning a person to confinement (as in a prison or mental hospital)\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"承诺","cue":"当前用法","b":"对方已经答应了一件事，这里要追问：这个答应是建立在什么条件上的？比如交期是否以材料到齐为前提。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","commitment 由 commit 加名词后缀 -ment 构成。Etymonline 记录的早期意义涉及交付或拘押，后来有保证、承诺以及承担义务的用法；今天的承诺义不能直接当作它最早的含义。","https://www.etymonline.com/word/commitment"],["联系今天的意思","可以把 commit to doing something 与 make a commitment 联系起来：从愿意做，推进到答应承担。这个现代搭配联系用于记忆，不表示每个 commitment 都是一项具体许诺。","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"],["回到本句","这里问的是承诺成立的条件。句中的 confirm 要求核实，conditions 把问题收窄到承诺成立的前提。","https://www.oxfordlearnersdictionaries.com/definition/english/commitment"]]}},{"w":{"id":"V20261012-019","date":"2026-10-12","term":"contingency","ipa":"/kənˈtɪndʒənsi/","pos":"n.","meaning":"可能发生且需要预先准备的意外情况","chunk":"a contingency plan","example":"We need a contingency plan if the reviewer is unavailable.","level":"挑战","gloss":"意外情况","explanation":"可能发生且需要预先准备的意外情况","examples":[{"en":"We need a contingency plan if the reviewer is unavailable.","zh":"如果评审人员无法参与，我们需要应急计划。"},{"en":"The budget covers this contingency.","zh":"预算涵盖了这项意外情况。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"We need a contingency plan if the reviewer is unavailable.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可以用“如果出状况，备用安排怎么办”来记 contingency。词典里的情况是可能发生、往往会带来麻烦的事，不等于已经发生的事故。把 contingency plan 整块记成应急预案，就能接上本句的评审安排。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"可以用“如果出状况，备用安排怎么办”来记 contingency。","explanation":"词典里的情况是可能发生、往往会带来麻烦的事，不等于已经发生的事故。把 contingency plan 整块记成应急预案，就能接上本句的评审安排。","example":"可以用“如果出状况，备用安排怎么办”来记 contingency。词典里的情况是可能发生、往往会带来麻烦的事，不等于已经发生的事故。把 contingency plan 整块记成应急预案，就能接上本句的评审安排。","boundary":"把 contingency plan 整块记成应急预案，就能接上本句的评审安排。"},"sources":[["Oxford Learner’s Dictionaries · contingency","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]},{"id":"g2","title":"句法与概念","text":"contingency 在这里放在 plan 前，限定计划的用途；整组才是“应急计划”。if 引出要预防的情况，is unavailable 表示评审人不能参与。need 表示说话者认为有必要准备，并没有断言那个人一定缺席。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"contingency 在这里放在 plan 前，限定计划的用途；整组才是“应急计划”。","explanation":"if 引出要预防的情况，is unavailable 表示评审人不能参与。need 表示说话者认为有必要准备，并没有断言那个人一定缺席。","example":"We need a contingency plan if the reviewer is unavailable. / 如果评审人员无法参与，我们需要应急计划。","boundary":"need 表示说话者认为有必要准备，并没有断言那个人一定缺席。"},"sources":[["Oxford Learner’s Dictionaries · contingency","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]},{"id":"g3","title":"辨析与英文邻居","text":"contingency 是要防备的可能情况；contingency plan 才是应对安排。backup plan 是易懂的邻居，侧重备选办法。不要把 risk 和 plan 混为一谈：前者讨论不利情况，后者说明发生时如何处理。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"contingency 是要防备的可能情况；contingency plan 才是应对安排。","explanation":"backup plan 是易懂的邻居，侧重备选办法。不要把 risk 和 plan 混为一谈：前者讨论不利情况，后者说明发生时如何处理。","example":"contingency 是要防备的可能情况；contingency plan 才是应对安排。backup plan 是易懂的邻居，侧重备选办法。不要把 risk 和 plan 混为一谈：前者讨论不利情况，后者说明发生时如何处理。","boundary":"不要把 risk 和 plan 混为一谈：前者讨论不利情况，后者说明发生时如何处理。"},"sources":[["Oxford Learner’s Dictionaries · contingency","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]},{"id":"g4","title":"这句话在做什么","text":"if 引出假设，need a contingency plan 把假设转成准备任务。自编接话：I can ask another reviewer to be on standby.（我可以请另一位评审人待命。）接着确认替补是否有时间和权限。计划对应可能的缺席，而不是对缺席原因作解释。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"if 引出假设，need a contingency plan 把假设转成准备任务。","explanation":"接着确认替补是否有时间和权限。计划对应可能的缺席，而不是对缺席原因作解释。","example":"自编接话：I can ask another reviewer to be on standby.（我可以请另一位评审人待命。）","boundary":"接着确认替补是否有时间和权限。计划对应可能的缺席，而不是对缺席原因作解释。"},"sources":[["Oxford Learner’s Dictionaries · contingency","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：What is our contingency plan if the system goes down?（如果系统宕机，我们的应急计划是什么？）上线前检查准备情况时用。把 if 后换成 the shipment is delayed，就改成讨论运输延误。回答应包括备用办法，而不只是重复可能出问题。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"上线前检查准备情况时用。把 if 后换成 the shipment is delayed，就改成讨论运输延误。","explanation":"回答应包括备用办法，而不只是重复可能出问题。","example":"What is our contingency plan if the system goes down? / 如果系统宕机，我们的应急计划是什么？","boundary":"回答应包括备用办法，而不只是重复可能出问题。"},"sources":[["Oxford Learner’s Dictionaries · contingency","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]}]},"p":{"displayGloss":"意外情况","focused":[{"entry":{"lemma":"contingency","pos":"n.","senses":[{"id":"current","glossZh":"可能发生且需要预先准备的意外情况","definitionEn":"a possible future problem that needs preparation","sourceIds":["lex"]},{"id":"additional","glossZh":"备用金；应急款项","definitionEn":"money set aside to meet unexpected expenses","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"可能发生且需要预先准备的意外情况","definitionEn":"a possible future problem that needs preparation","sourceIds":["lex"]}}],"allEntries":[{"lemma":"contingency","pos":"n.","senses":[{"id":"additional","glossZh":"备用金；应急款项","definitionEn":"money set aside to meet unexpected expenses","sourceIds":["lex"]}]}],"contextTakeaway":"评审人缺席是预先准备的可能情况。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-019\">\u003ch3>contingency · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"contingency-learner-1\">\u003cstrong>1. 未来可能发生、需要预作准备的情况，尤其是问题。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：plan for contingencies; a contingency plan / fund\u003cbr>\u003cspan class=\"en\" lang=\"en\">We set aside money for unexpected contingencies.\u003c/span>\u003cbr>我们留了一笔钱，以应付可能出现的意外情况。\u003c/p>\u003cp data-learner-sense=\"contingency-learner-2\">\u003cstrong>2. 为可能增加的支出预留的款项。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：a contingency for additional costs\u003cbr>\u003cspan class=\"en\" lang=\"en\">The budget includes a contingency for repairs.\u003c/span>\u003cbr>预算中包含一笔维修预留款。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/contingency\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>contingency \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/contingency\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /kənˈtɪndʒənsi/\u003c/p>\u003cp data-dictionary-sense=\"contingency%1:11:00::\">\u003cstrong>1. 可能发生的事件、情况或结果\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a possible event or occurrence or result\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"contingency%1:26:00::\">\u003cstrong>2. 取决于某事物的状态；条件依存性\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the state of being contingent on something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"意外情况","cue":"当前用法","b":"不是说评审人已经缺席，而是提前问：如果他来不了，谁来接替？contingency 指可能出现的状况，plan 才是备用办法。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","contingency 由 contingent 加 -cy 构成，历史记录既有事情未定、取决于偶然条件的意思，也有可能发生的事件这一名词义。它不是把已经发生的事故换个正式说法。","https://www.etymonline.com/word/contingency"],["联系今天的意思","把可能状况 contingency 与应对它的 contingency plan 配成一对：评审人可能缺席是状况，找替补才是计划。这里联系的是现代词义和搭配。","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"],["回到本句","评审人缺席是预先准备的可能情况。if 引出假设，need a contingency plan 把假设转成准备任务。","https://www.oxfordlearnersdictionaries.com/definition/english/contingency"]]}},{"w":{"id":"V20261012-020","date":"2026-10-12","term":"trade-off","ipa":"/ˈtreɪd ɒf/","pos":"n.","meaning":"获得一项优势时需要付出的另一项代价","chunk":"a trade-off between speed and cost","example":"There is a trade-off between a faster delivery and a lower cost.","level":"提升","gloss":"取舍；权衡","explanation":"获得一项优势时需要付出的另一项代价","examples":[{"en":"There is a trade-off between a faster delivery and a lower cost.","zh":"更快交付与更低成本之间存在取舍。"},{"en":"Every design involves a trade-off.","zh":"每项设计都涉及取舍。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"There is a trade-off between a faster delivery and a lower cost.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“两项都想要，却不能都拿满”的画面记 trade-off，这是教学类比。重点是取得某个好处时要让出另一项好处。回到本句，速度和成本是同时想优化的两端；并不是所有选择都自动构成这种取舍。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"用“两项都想要，却不能都拿满”的画面记 trade-off，这是教学类比。","explanation":"重点是取得某个好处时要让出另一项好处。回到本句，速度和成本是同时想优化的两端；并不是所有选择都自动构成这种取舍。","example":"用“两项都想要，却不能都拿满”的画面记 trade-off，这是教学类比。重点是取得某个好处时要让出另一项好处。回到本句，速度和成本是同时想优化的两端；并不是所有选择都自动构成这种取舍。","boundary":"回到本句，速度和成本是同时想优化的两端；并不是所有选择都自动构成这种取舍。"},"sources":[["Oxford Learner’s Dictionaries · trade-off","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]},{"id":"g2","title":"句法与概念","text":"There is 引出存在的情况；a trade-off 是名词核心，between A and B 列出两端。faster 与 lower 都在作比较。句子报告两项目标之间的限制，但没有告诉我们最终选哪一端，也没有给出具体价格差。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"There is 引出存在的情况；a trade-off 是名词核心，between A and B 列出两端。","explanation":"faster 与 lower 都在作比较。句子报告两项目标之间的限制，但没有告诉我们最终选哪一端，也没有给出具体价格差。","example":"There is a trade-off between a faster delivery and a lower cost. / 更快交付与更低成本之间存在取舍。","boundary":"句子报告两项目标之间的限制，但没有告诉我们最终选哪一端，也没有给出具体价格差。"},"sources":[["Oxford Learner’s Dictionaries · trade-off","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]},{"id":"g3","title":"辨析与英文邻居","text":"choice 只是选择；trade-off 还指出选择伴随的损失。compromise 可作英文邻居，但本句重点不是双方各让一步，而是快与便宜难以兼得。谈取舍时把两端说全，比单说“有代价”更容易判断。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"choice 只是选择；trade-off 还指出选择伴随的损失。","explanation":"compromise 可作英文邻居，但本句重点不是双方各让一步，而是快与便宜难以兼得。谈取舍时把两端说全，比单说“有代价”更容易判断。","example":"choice 只是选择；trade-off 还指出选择伴随的损失。compromise 可作英文邻居，但本句重点不是双方各让一步，而是快与便宜难以兼得。谈取舍时把两端说全，比单说“有代价”更容易判断。","boundary":"谈取舍时把两端说全，比单说“有代价”更容易判断。"},"sources":[["Oxford Learner’s Dictionaries · trade-off","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]},{"id":"g4","title":"这句话在做什么","text":"There is a trade-off 在提醒团队：这两个好处有冲突，需要比较代价。自编接话：How much extra would faster delivery cost?（更快交付要多花多少钱？）先拿到价格和交期，再选哪一项更重要；原句并没有替大家选速度或低价。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"There is a trade-off 在提醒团队：这两个好处有冲突，需要比较代价。","explanation":"先拿到价格和交期，再选哪一项更重要；原句并没有替大家选速度或低价。","example":"自编接话：How much extra would faster delivery cost?（更快交付要多花多少钱？）","boundary":"先拿到价格和交期，再选哪一项更重要；原句并没有替大家选速度或低价。"},"sources":[["Oxford Learner’s Dictionaries · trade-off","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：What trade-offs are we accepting with this design?（采用这个设计，我们接受了哪些取舍？）评审方案时追问得到什么、放弃什么。把 this design 换成 faster delivery，可讨论加急交付的代价。请对方说出收益和损失两端，再判断是否值得。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"评审方案时追问得到什么、放弃什么。把 this design 换成 faster delivery，可讨论加急交付的代价。","explanation":"请对方说出收益和损失两端，再判断是否值得。","example":"What trade-offs are we accepting with this design? / 采用这个设计，我们接受了哪些取舍？","boundary":"请对方说出收益和损失两端，再判断是否值得。"},"sources":[["Oxford Learner’s Dictionaries · trade-off","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]}]},"p":{"displayGloss":"取舍；权衡","focused":[{"entry":{"lemma":"trade-off","pos":"n.","senses":[{"id":"current","glossZh":"获得一项优势时需要付出的另一项代价","definitionEn":"a situation where gaining one benefit means giving up another","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"获得一项优势时需要付出的另一项代价","definitionEn":"a situation where gaining one benefit means giving up another","sourceIds":["lex"]}}],"allEntries":[{"lemma":"trade off","pos":"v.","senses":[{"id":"additional","glossZh":"牺牲一项以换取另一项","definitionEn":"to give up one benefit in exchange for another","sourceIds":["family"]}]}],"contextTakeaway":"更快交付与更低成本难以同时兼得。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-020\">\u003ch3>trade-off · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"trade-off-learner-1\">\u003cstrong>1. 为了得到一种好处而接受另一种损失或不足的取舍。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a trade-off between A and B; 名词常带连字符\u003cbr>\u003cspan class=\"en\" lang=\"en\">There is a trade-off between a lighter device and a larger battery.\u003c/span>\u003cbr>更轻的设备和更大的电池之间需要取舍。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>trade-off \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/trade-off\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"trade-off%1:04:00::\">\u003cstrong>1. 作为妥协而进行的交换；取舍\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an exchange that occurs as a compromise\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：I faced a tradeoff between eating and buying my medicine\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":1},"x":{"short":"取舍；权衡","cue":"当前用法","b":"把快与便宜放在一起看：如果想更快到货，可能需要加钱；如果坚持低价，可能要等更久。句子说存在这种限制，还没替大家作选择。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","Etymonline 将 trade-off 的名词记录追溯到 1959 年，并指出更早已有 trade off 的交换用法。这里的历史线索是交换与取舍，不是某种具体交易制度的名称。","https://www.etymonline.com/word/trade-off"],["联系今天的意思","可以借交换来记：得到速度，可能要付出更高费用。现在的 trade-off 可以涉及时间、质量或资源，并不要求真的交换货物。","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"],["回到本句","更快交付与更低成本难以同时兼得。There is a trade-off 在提醒团队：这两个好处有冲突，需要比较代价。","https://www.oxfordlearnersdictionaries.com/definition/english/trade-off_2"]]}},{"w":{"id":"V20261012-041","date":"2026-10-12","term":"agenda","ipa":"/əˈdʒendə/","pos":"n.","meaning":"会议准备讨论的事项清单","chunk":"agree on the agenda","example":"Please send the agenda before the meeting.","level":"核心","gloss":"议程","explanation":"会议准备讨论的事项清单","examples":[{"en":"Please send the agenda before the meeting.","zh":"请在会议前发送议程。"},{"en":"Add staffing to tomorrow's agenda.","zh":"把人员配置加入明天的议程。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please send the agenda before the meeting.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想到开会前先看“今天谈哪几件事”，就能记住 agenda 的本句义。清单中的一项可叫 an item on the agenda。它还可以指更广泛的目标，但 meeting 已把这里限定为会议议程，不必猜测隐藏动机。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"想到开会前先看“今天谈哪几件事”，就能记住 agenda 的本句义。","explanation":"清单中的一项可叫 an item on the agenda。它还可以指更广泛的目标，但 meeting 已把这里限定为会议议程，不必猜测隐藏动机。","example":"想到开会前先看“今天谈哪几件事”，就能记住 agenda 的本句义。清单中的一项可叫 an item on the agenda。它还可以指更广泛的目标，但 meeting 已把这里限定为会议议程，不必猜测隐藏动机。","boundary":"它还可以指更广泛的目标，但 meeting 已把这里限定为会议议程，不必猜测隐藏动机。"},"sources":[["Oxford Learner’s Dictionaries · agenda","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]},{"id":"g2","title":"句法与概念","text":"send 的宾语是 the agenda，表示双方能识别的那份议程；before the meeting 修饰发送时间。句子要求先发清单，再开会。它没有指定必须提前几天，所以需要明确截止时间时，应在后续沟通中补上。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"send 的宾语是 the agenda，表示双方能识别的那份议程；before the meeting 修饰发送时间。","explanation":"句子要求先发清单，再开会。它没有指定必须提前几天，所以需要明确截止时间时，应在后续沟通中补上。","example":"Please send the agenda before the meeting. / 请在会议前发送议程。","boundary":"它没有指定必须提前几天，所以需要明确截止时间时，应在后续沟通中补上。"},"sources":[["Oxford Learner’s Dictionaries · agenda","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]},{"id":"g3","title":"辨析与英文邻居","text":"agenda 告诉人们准备讨论什么；schedule 更侧重时间安排。minutes 则记录会议经过或结果。把这三个词放在同一次会议里比较：会前看议程，按时间表进行，会后读纪要，就不容易混用。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"agenda 告诉人们准备讨论什么；schedule 更侧重时间安排。","explanation":"minutes 则记录会议经过或结果。把这三个词放在同一次会议里比较：会前看议程，按时间表进行，会后读纪要，就不容易混用。","example":"agenda 告诉人们准备讨论什么；schedule 更侧重时间安排。minutes 则记录会议经过或结果。把这三个词放在同一次会议里比较：会前看议程，按时间表进行，会后读纪要，就不容易混用。","boundary":"把这三个词放在同一次会议里比较：会前看议程，按时间表进行，会后读纪要，就不容易混用。"},"sources":[["Oxford Learner’s Dictionaries · agenda","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]},{"id":"g4","title":"这句话在做什么","text":"Please send 是具体请求，before the meeting 给出先后顺序，让参会者能提前准备。自编接话：I’ll send the agenda this afternoon.（我今天下午发议程。）回应补上了发送时间；接着按清单准备资料。原句只给出会前这个范围，没有规定提前几天。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Please send 是具体请求，before the meeting 给出先后顺序，让参会者能提前准备。","explanation":"回应补上了发送时间；接着按清单准备资料。原句只给出会前这个范围，没有规定提前几天。","example":"自编接话：I’ll send the agenda this afternoon.（我今天下午发议程。）","boundary":"回应补上了发送时间；接着按清单准备资料。原句只给出会前这个范围，没有规定提前几天。"},"sources":[["Oxford Learner’s Dictionaries · agenda","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Could we add the staffing issue to the agenda?（我们能把人员配置问题加入议程吗？）想在会议正式讨论某个问题时用。把 the staffing issue 换成 the delivery delay，即可请求讨论延期。这是请求加入讨论清单，不是宣布该问题已经解决。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"想在会议正式讨论某个问题时用。把 the staffing issue 换成 the delivery delay，即可请求讨论延期。","explanation":"这是请求加入讨论清单，不是宣布该问题已经解决。","example":"Could we add the staffing issue to the agenda? / 我们能把人员配置问题加入议程吗？","boundary":"这是请求加入讨论清单，不是宣布该问题已经解决。"},"sources":[["Oxford Learner’s Dictionaries · agenda","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]}]},"p":{"displayGloss":"议程","focused":[{"entry":{"lemma":"agenda","pos":"n.","senses":[{"id":"current","glossZh":"会议准备讨论的事项清单","definitionEn":"a list of topics planned for a meeting","sourceIds":["lex"]},{"id":"additional","glossZh":"行动目标；待处理的政策事项","definitionEn":"a set of aims or issues that someone wants to address","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"会议准备讨论的事项清单","definitionEn":"a list of topics planned for a meeting","sourceIds":["lex"]}}],"allEntries":[{"lemma":"agenda","pos":"n.","senses":[{"id":"additional","glossZh":"行动目标；待处理的政策事项","definitionEn":"a set of aims or issues that someone wants to address","sourceIds":["lex"]}]}],"contextTakeaway":"会前发送要讨论的事项清单。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-041\">\u003ch3>agenda · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"agenda-learner-1\">\u003cstrong>1. 会议准备讨论的事项清单。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：on the agenda; set the agenda\u003cbr>\u003cspan class=\"en\" lang=\"en\">The first item on the agenda is the new timetable.\u003c/span>\u003cbr>议程的第一项是新的时间表。\u003c/p>\u003cp data-learner-sense=\"agenda-learner-2\">\u003cstrong>2. 个人或组织想推动的目标和计划。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：a political agenda; a hidden agenda\u003cbr>\u003cspan class=\"en\" lang=\"en\">The group has a clear environmental agenda.\u003c/span>\u003cbr>这个团体有明确的环保目标。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/agenda\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>agenda \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/agenda\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /əˈdʒɛn.də/\u003c/p>\u003cp data-dictionary-sense=\"agenda%1:09:00::\">\u003cstrong>1. 按时间安排需要处理事项的计划\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a temporally organized plan for matters to be attended to\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"agenda%1:10:00::\">\u003cstrong>2. 会议等场合要讨论或处理的事项清单；议程\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a list of matters to be taken up (as at a meeting)\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"议程","cue":"当前用法","b":"这里要的是会前发出的讨论清单。参会者看过清单才能准备资料；agenda 不等于会后记录了什么决定的会议纪要。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","agenda 来自拉丁语 agenda，意为要做的事情，与 agere（做、行动）有关。原词是复数形式，但现代英语可以说 an agenda，不能照搬拉丁语的单复数规则。","https://www.etymonline.com/word/agenda"],["联系今天的意思","要做的事这个历史线索，能帮助记住会议议程：它让人提前知道会议要处理什么。现代 agenda 也能指较长期的目标，不只是一张会议清单。","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"],["回到本句","会前发送要讨论的事项清单。Please send 是具体请求，before the meeting 给出先后顺序，让参会者能提前准备。","https://www.oxfordlearnersdictionaries.com/definition/english/agenda"]]}},{"w":{"id":"V20261012-042","date":"2026-10-12","term":"context","ipa":"/ˈkɒntekst/","pos":"n.","meaning":"理解当前事项所需的背景","chunk":"provide context","example":"Let me provide some context before we discuss the options.","level":"核心","gloss":"背景","explanation":"理解当前事项所需的背景","examples":[{"en":"Let me provide some context before we discuss the options.","zh":"讨论选项前，让我先提供一些背景。"},{"en":"The chart needs more context.","zh":"这张图需要更多背景信息。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Let me provide some context before we discuss the options.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可把 context 想成照片外的环境，这是帮助记忆的类比：单看一个数字可能不明白，知道它产生时的情况才容易理解。这里的背景服务于后面的选项讨论，不是要求把所有历史资料从头讲一遍。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"可把 context 想成照片外的环境，这是帮助记忆的类比：单看一个数字可能不明白，知道它产生时的情况才容易理解。","explanation":"这里的背景服务于后面的选项讨论，不是要求把所有历史资料从头讲一遍。","example":"可把 context 想成照片外的环境，这是帮助记忆的类比：单看一个数字可能不明白，知道它产生时的情况才容易理解。这里的背景服务于后面的选项讨论，不是要求把所有历史资料从头讲一遍。","boundary":"这里的背景服务于后面的选项讨论，不是要求把所有历史资料从头讲一遍。"},"sources":[["Oxford Learner’s Dictionaries · context","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]},{"id":"g2","title":"句法与概念","text":"Let me 后接动词原形 provide，表示说话者要先做一件事；some context 是补充的信息，before 从句标出先后关系。概念上，是先提供共同理解所需的背景，再讨论选项，而非已经替大家选好方案。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"Let me 后接动词原形 provide，表示说话者要先做一件事；some context 是补充的信息，before 从句标出先后关系。","explanation":"概念上，是先提供共同理解所需的背景，再讨论选项，而非已经替大家选好方案。","example":"Let me provide some context before we discuss the options. / 讨论选项前，让我先提供一些背景。","boundary":"概念上，是先提供共同理解所需的背景，再讨论选项，而非已经替大家选好方案。"},"sources":[["Oxford Learner’s Dictionaries · context","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]},{"id":"g3","title":"辨析与英文邻居","text":"background 是本句接近的英文邻居。context 更突出周围情况如何影响理解；detail 则可能只是某个具体细节，不一定解释背景。还可记 in context：把信息放回相关情境后理解，避免孤立解读。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"background 是本句接近的英文邻居。","explanation":"context 更突出周围情况如何影响理解；detail 则可能只是某个具体细节，不一定解释背景。还可记 in context：把信息放回相关情境后理解，避免孤立解读。","example":"background 是本句接近的英文邻居。context 更突出周围情况如何影响理解；detail 则可能只是某个具体细节，不一定解释背景。还可记 in context：把信息放回相关情境后理解，避免孤立解读。","boundary":"还可记 in context：把信息放回相关情境后理解，避免孤立解读。"},"sources":[["Oxford Learner’s Dictionaries · context","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]},{"id":"g4","title":"这句话在做什么","text":"Let me…before… 在安排谈话顺序：先补背景，再谈选项。自编补充：The customer has added two requirements.（客户增加了两项要求。）有了这个背景，再看为什么原方案不够用就容易了；背景应与选项有关，不必讲完所有历史。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Let me…before… 在安排谈话顺序：先补背景，再谈选项。","explanation":"有了这个背景，再看为什么原方案不够用就容易了；背景应与选项有关，不必讲完所有历史。","example":"自编补充：The customer has added two requirements.（客户增加了两项要求。）","boundary":"有了这个背景，再看为什么原方案不够用就容易了；背景应与选项有关，不必讲完所有历史。"},"sources":[["Oxford Learner’s Dictionaries · context","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：For context, the estimate assumes a two-week review.（补充一下背景，这份估算假设评审需要两周。）读者可能误解估算时，先补解读所需的前提。把后半句换成 the price includes installation，就能说明报价背景。只补与当前判断相关的背景，随后回到正在讨论的问题。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"读者可能误解估算时，先补解读所需的前提。把后半句换成 the price includes installation，就能说明报价背景。","explanation":"只补与当前判断相关的背景，随后回到正在讨论的问题。","example":"For context, the estimate assumes a two-week review. / 补充一下背景，这份估算假设评审需要两周。","boundary":"只补与当前判断相关的背景，随后回到正在讨论的问题。"},"sources":[["Oxford Learner’s Dictionaries · context","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]}]},"p":{"displayGloss":"背景","focused":[{"entry":{"lemma":"context","pos":"n.","senses":[{"id":"current","glossZh":"理解当前事项所需的背景","definitionEn":"background circumstances that help explain something","sourceIds":["lex"]},{"id":"additional","glossZh":"上下文；前后文","definitionEn":"the words surrounding an expression that help determine its meaning","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"理解当前事项所需的背景","definitionEn":"background circumstances that help explain something","sourceIds":["lex"]}}],"allEntries":[{"lemma":"context","pos":"n.","senses":[{"id":"additional","glossZh":"上下文；前后文","definitionEn":"the words surrounding an expression that help determine its meaning","sourceIds":["lex"]}]}],"contextTakeaway":"先补背景，再比较选项。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-042\">\u003ch3>context · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"context-learner-1\">\u003cstrong>1. 帮助理解某件事的背景或周围情况。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：in the context of; put something in context\u003cbr>\u003cspan class=\"en\" lang=\"en\">The figures make sense in the context of rising prices.\u003c/span>\u003cbr>考虑到物价上涨的背景，这些数字就容易理解了。\u003c/p>\u003cp data-learner-sense=\"context-learner-2\">\u003cstrong>2. 词语或句子前后的语言内容；上下文。\u003c/strong>\u003cbr>\u003csmall>名词〔可数或不可数〕\u003c/small>\u003cbr>用法：in context; out of context\u003cbr>\u003cspan class=\"en\" lang=\"en\">The quotation is misleading when taken out of context.\u003c/span>\u003cbr>这段引文脱离上下文后会产生误导。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/context\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>context \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/context\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈ kɒn.tɛkst/ · US /ˈ kɑːn.tɛkst/\u003c/p>\u003cp data-dictionary-sense=\"context%1:10:00::\">\u003cstrong>1. 围绕某个语言单位、帮助确定其含义的上下文\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">discourse that surrounds a language unit and helps to determine its interpretation\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"context%1:26:00::\">\u003cstrong>2. 围绕某种情况或事件的事实与环境；背景\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the set of facts or circumstances that surround a situation or event\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the historical context\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"背景","cue":"当前用法","b":"先说明事情是在什么情况下发生的，再比较选项。例如报价变高，可能是需求增加了；没有这个背景，听者容易把它理解成单纯涨价。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","context 来自拉丁语 contextus，与 contexere（编织在一起、连接）有关。英语中既发展出文章整体、前后文的意义，也用于理解事物所需的相关情况。","https://www.etymonline.com/word/context"],["联系今天的意思","像把一句话放回前后文一样，也可以把一个数字放回产生它的条件中看。编织只是记忆联系；工作中的 context 不要求列出所有历史。","https://www.oxfordlearnersdictionaries.com/definition/english/context"],["回到本句","先补背景，再比较选项。Let me…before… 在安排谈话顺序：先补背景，再谈选项。","https://www.oxfordlearnersdictionaries.com/definition/english/context"]]}},{"w":{"id":"V20261012-043","date":"2026-10-12","term":"clarify","ipa":"/ˈklærəfaɪ/","pos":"v.","meaning":"把含糊的意思、范围或要求讲清楚","chunk":"clarify a requirement","example":"Could you clarify what is included in this request?","level":"核心","gloss":"澄清","explanation":"把含糊的意思、范围或要求讲清楚","examples":[{"en":"Could you clarify what is included in this request?","zh":"你能澄清这项请求包含什么吗？"},{"en":"Please clarify the payment terms.","zh":"请澄清付款条件。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Could you clarify what is included in this request?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记 clear 与 clarify 的意义联系：原来模糊的内容，经解释后变清楚。这里的学习重点是“哪里不清楚”，不是要求对方说得越长越好。把 clarify the scope 当作练习搭配，便于想到范围澄清的场景。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"记 clear 与 clarify 的意义联系：原来模糊的内容，经解释后变清楚。","explanation":"这里的学习重点是“哪里不清楚”，不是要求对方说得越长越好。把 clarify the scope 当作练习搭配，便于想到范围澄清的场景。","example":"记 clear 与 clarify 的意义联系：原来模糊的内容，经解释后变清楚。这里的学习重点是“哪里不清楚”，不是要求对方说得越长越好。把 clarify the scope 当作练习搭配，便于想到范围澄清的场景。","boundary":"把 clarify the scope 当作练习搭配，便于想到范围澄清的场景。"},"sources":[["Oxford Learner’s Dictionaries · clarify","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]},{"id":"g2","title":"句法与概念","text":"Could you 构成请求；clarify 后接 what is included in this request，整个从句是要澄清的内容。what 从句保持陈述结构，不再写成疑问句倒装。概念重点是请求范围，尤其哪些项目包含在内。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"Could you 构成请求；clarify 后接 what is included in this request，整个从句是要澄清的内容。","explanation":"what 从句保持陈述结构，不再写成疑问句倒装。概念重点是请求范围，尤其哪些项目包含在内。","example":"Could you clarify what is included in this request? / 你能澄清这项请求包含什么吗？","boundary":"概念重点是请求范围，尤其哪些项目包含在内。"},"sources":[["Oxford Learner’s Dictionaries · clarify","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]},{"id":"g3","title":"辨析与英文邻居","text":"clarify 针对模糊之处；confirm 针对已有信息是否属实或确定；elaborate 则展开更多细节。三者可能出现在同一讨论，但任务不同。若你连范围都不明白，先求澄清比直接要求确认更准确。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"clarify 针对模糊之处；confirm 针对已有信息是否属实或确定；elaborate 则展开更多细节。","explanation":"三者可能出现在同一讨论，但任务不同。若你连范围都不明白，先求澄清比直接要求确认更准确。","example":"clarify 针对模糊之处；confirm 针对已有信息是否属实或确定；elaborate 则展开更多细节。三者可能出现在同一讨论，但任务不同。若你连范围都不明白，先求澄清比直接要求确认更准确。","boundary":"若你连范围都不明白，先求澄清比直接要求确认更准确。"},"sources":[["Oxford Learner’s Dictionaries · clarify","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]},{"id":"g4","title":"这句话在做什么","text":"Could you clarify 把没听懂变成一个具体问题：哪些工作包括在请求里？自编接话：Testing is included, but installation is not.（包含测试，但不包含安装。）对方用一正一反给出边界，你才好估工作量。重点是范围变清楚，不是解释变长。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Could you clarify 把没听懂变成一个具体问题：哪些工作包括在请求里？","explanation":"对方用一正一反给出边界，你才好估工作量。重点是范围变清楚，不是解释变长。","example":"自编接话：Testing is included, but installation is not.（包含测试，但不包含安装。）","boundary":"对方用一正一反给出边界，你才好估工作量。重点是范围变清楚，不是解释变长。"},"sources":[["Oxford Learner’s Dictionaries · clarify","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Could you clarify whether training is included?（你能说明培训是否包含在内吗？）报价边界不清时用。把 training 换成 installation 或 maintenance，聚焦另一项服务。回答包含与否后，若仍需知道时长或次数，再具体追问。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"报价边界不清时用。把 training 换成 installation 或 maintenance，聚焦另一项服务。","explanation":"回答包含与否后，若仍需知道时长或次数，再具体追问。","example":"Could you clarify whether training is included? / 你能说明培训是否包含在内吗？","boundary":"回答包含与否后，若仍需知道时长或次数，再具体追问。"},"sources":[["Oxford Learner’s Dictionaries · clarify","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]}]},"p":{"displayGloss":"澄清","focused":[{"entry":{"lemma":"clarify","pos":"v.","senses":[{"id":"current","glossZh":"把含糊的意思、范围或要求讲清楚","definitionEn":"to make a meaning or issue easier to understand","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"把含糊的意思、范围或要求讲清楚","definitionEn":"to make a meaning or issue easier to understand","sourceIds":["lex"]}}],"allEntries":[{"lemma":"clarification","pos":"n.","senses":[{"id":"additional","glossZh":"澄清；使意思清楚的说明","definitionEn":"an explanation that removes uncertainty or confusion","sourceIds":["family"]}]}],"contextTakeaway":"请对方说清请求包含哪些内容。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-043\">\u003ch3>clarify · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"clarify-learner-1\">\u003cstrong>1. 把不清楚的事情解释得更明确、更容易理解。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：clarify something; clarify what / whether\u003cbr>\u003cspan class=\"en\" lang=\"en\">Could you clarify whether visitors need tickets?\u003c/span>\u003cbr>你能说明访客是否需要门票吗？\u003c/p>\u003cp data-learner-sense=\"clarify-learner-2\">\u003cstrong>2. 去除液体中的杂质，使其澄清。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，烹饪等〕\u003c/small>\u003cbr>用法：clarify butter / stock\u003cbr>\u003cspan class=\"en\" lang=\"en\">The cook clarified the butter before using it.\u003c/span>\u003cbr>厨师使用黄油前先将其澄清处理。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/clarify\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.collinsdictionary.com/dictionary/english/clarify\">词典 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>clarify \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/clarify\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /ˈklæɹɪfaɪ/\u003c/p>\u003cp>词形〔来源列出〕：clarified\u003c/p>\u003cp data-dictionary-sense=\"clarify%2:32:00::\">\u003cstrong>1. 使清楚、使更容易理解；澄清\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make clear and (more) comprehensible\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：clarify the mystery surrounding her death\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"clarify%2:30:02::\">\u003cstrong>2. 通过加热等方法去除杂质或固体，使液体澄清\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：cooking / cookery / preparation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make clear by removing impurities or solids, as by heating\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：clarify the butter\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：clarify beer\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"澄清","cue":"当前用法","b":"对方提出了请求，但你还不清楚它包含哪些工作。clarify 在这里要求补清范围：例如是否只含测试，还是也含安装。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","clarify 经法语与后期拉丁语 clarificare 相连，含使清楚、明亮的意义。历史中既有使液体澄清的用法，也有让意思易懂的用法；不能把现代含义硬说成某个单一故事。","https://www.etymonline.com/word/clarify"],["联系今天的意思","把 clear（清楚）与 clarify（讲清楚）联系起来即可：原来不知道包括什么，经解释后范围清楚了。帮助记忆的重点是消除模糊，而不是增加篇幅。","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"],["回到本句","请对方说清请求包含哪些内容。Could you clarify 把没听懂变成一个具体问题：哪些工作包括在请求里？","https://www.oxfordlearnersdictionaries.com/definition/english/clarify"]]}},{"w":{"id":"V20261012-044","date":"2026-10-12","term":"confirm","ipa":"/kənˈfɜːm/","pos":"v.","meaning":"确认信息、安排或双方理解是否成立","chunk":"confirm the owner","example":"Please confirm who will own the next action.","level":"核心","gloss":"确认","explanation":"确认信息、安排或双方理解是否成立","examples":[{"en":"Please confirm who will own the next action.","zh":"请确认谁将负责下一项行动。"},{"en":"Confirm the quantity before ordering.","zh":"下单前确认数量。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please confirm who will own the next action.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"可用“暂定信息旁边打一个核对勾”的画面记 confirm，这是教学类比。勾表示核实后的确定，不是凭空创造事实。本句要核对责任归属；词典中它也能用于确定会议安排，但这里不是确认会议时间。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"可用“暂定信息旁边打一个核对勾”的画面记 confirm，这是教学类比。","explanation":"勾表示核实后的确定，不是凭空创造事实。本句要核对责任归属；词典中它也能用于确定会议安排，但这里不是确认会议时间。","example":"可用“暂定信息旁边打一个核对勾”的画面记 confirm，这是教学类比。勾表示核实后的确定，不是凭空创造事实。本句要核对责任归属；词典中它也能用于确定会议安排，但这里不是确认会议时间。","boundary":"本句要核对责任归属；词典中它也能用于确定会议安排，但这里不是确认会议时间。"},"sources":[["Oxford Learner’s Dictionaries · confirm","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]},{"id":"g2","title":"句法与概念","text":"confirm 的宾语是 who will own the next action 这个从句，who 在从句中作主语；own 在工作语境中表示承担责任。句子要确定谁负责下一步，不是询问某个物品属于谁，也没有直接指定负责人。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"confirm 的宾语是 who will own the next action 这个从句，who 在从句中作主语；own 在工作语境中表示承担责任。","explanation":"句子要确定谁负责下一步，不是询问某个物品属于谁，也没有直接指定负责人。","example":"Please confirm who will own the next action. / 请确认谁将负责下一项行动。","boundary":"句子要确定谁负责下一步，不是询问某个物品属于谁，也没有直接指定负责人。"},"sources":[["Oxford Learner’s Dictionaries · confirm","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]},{"id":"g3","title":"辨析与英文邻居","text":"clarify 是讲清不懂的内容，confirm 是核定信息；approve 表示批准，两者不能一律互换。确认谁负责不自动等于批准其方案。常用邻居是 confirm the details，把需要核实的具体细节列出来。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"clarify 是讲清不懂的内容，confirm 是核定信息；approve 表示批准，两者不能一律互换。","explanation":"确认谁负责不自动等于批准其方案。常用邻居是 confirm the details，把需要核实的具体细节列出来。","example":"clarify 是讲清不懂的内容，confirm 是核定信息；approve 表示批准，两者不能一律互换。确认谁负责不自动等于批准其方案。常用邻居是 confirm the details，把需要核实的具体细节列出来。","boundary":"常用邻居是 confirm the details，把需要核实的具体细节列出来。"},"sources":[["Oxford Learner’s Dictionaries · confirm","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]},{"id":"g4","title":"这句话在做什么","text":"Please confirm 要对方给出确定的信息；who 将问题定位到行动负责人。自编接话：Maya will take responsibility for the review.（Maya 将负责评审。）下一步在行动清单写明姓名与任务，必要时补期限。确认负责人和批准他的方案是两件事。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Please confirm 要对方给出确定的信息；who 将问题定位到行动负责人。","explanation":"下一步在行动清单写明姓名与任务，必要时补期限。确认负责人和批准他的方案是两件事。","example":"自编接话：Maya will take responsibility for the review.（Maya 将负责评审。）","boundary":"下一步在行动清单写明姓名与任务，必要时补期限。确认负责人和批准他的方案是两件事。"},"sources":[["Oxford Learner’s Dictionaries · confirm","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Please confirm the quantity before we place the order.（请在我们下单前确认数量。）已有数量、需要核实后再操作时用。把 the quantity 换成 the delivery address，就能核对地址。若还没有拟定数量，应先讨论要多少，而不是假装已有可确认的答案。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"已有数量、需要核实后再操作时用。把 the quantity 换成 the delivery address，就能核对地址。","explanation":"若还没有拟定数量，应先讨论要多少，而不是假装已有可确认的答案。","example":"Please confirm the quantity before we place the order. / 请在我们下单前确认数量。","boundary":"若还没有拟定数量，应先讨论要多少，而不是假装已有可确认的答案。"},"sources":[["Oxford Learner’s Dictionaries · confirm","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]}]},"p":{"displayGloss":"确认","focused":[{"entry":{"lemma":"confirm","pos":"v.","senses":[{"id":"current","glossZh":"确认信息、安排或双方理解是否成立","definitionEn":"to establish or state that something is certain","sourceIds":["lex"]},{"id":"additional","glossZh":"确定；使安排正式生效","definitionEn":"to make an arrangement definite or official","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"确认信息、安排或双方理解是否成立","definitionEn":"to establish or state that something is certain","sourceIds":["lex"]}}],"allEntries":[{"lemma":"confirm","pos":"v.","senses":[{"id":"additional","glossZh":"确定；使安排正式生效","definitionEn":"to make an arrangement definite or official","sourceIds":["lex"]}]}],"contextTakeaway":"把下一项行动的负责人确认下来。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-044\">\u003ch3>confirm · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"confirm-learner-1\">\u003cstrong>1. 用证据证明某事属实，或使原有判断更确定。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：confirm a suspicion; confirm that\u003cbr>\u003cspan class=\"en\" lang=\"en\">The test confirmed that the water was safe.\u003c/span>\u003cbr>检测证实水是安全的。\u003c/p>\u003cp data-learner-sense=\"confirm-learner-2\">\u003cstrong>2. 确认安排、预订或信息，使其明确或确定下来。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：confirm a booking; confirm the details\u003cbr>\u003cspan class=\"en\" lang=\"en\">Please confirm the number of guests by Thursday.\u003c/span>\u003cbr>请在周四前确认来宾人数。\u003c/p>\u003cp data-learner-sense=\"confirm-learner-3\">\u003cstrong>3. 正式批准任命或认可某人的职位。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：confirm an appointment; confirm someone in a post\u003cbr>\u003cspan class=\"en\" lang=\"en\">The committee confirmed her appointment as director.\u003c/span>\u003cbr>委员会正式批准了她的主任任命。\u003c/p>\u003cp data-learner-sense=\"confirm-learner-4\">\u003cstrong>4. 为某人施行坚振礼。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，通常被动，宗教〕\u003c/small>\u003cbr>用法：be confirmed\u003cbr>\u003cspan class=\"en\" lang=\"en\">He was confirmed at the local church.\u003c/span>\u003cbr>他在当地教堂接受了坚振礼。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/confirm\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>confirm \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/confirm\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /kənˈfɜːm/ · US /kənˈfɝm/\u003c/p>\u003cp data-dictionary-sense=\"confirm%2:31:00::\">\u003cstrong>1. 用新证据或事实确立、加强或证实\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">establish or strengthen as with new evidence or facts\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：his story confirmed my doubts\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The evidence supports the defendant\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s that CLAUSE / Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"confirm%2:32:00::\">\u003cstrong>2. 加强，使更加坚定\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">strengthen or make more firm\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They confirm that there was a traffic accident\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The witnesses confirmed the victim&#39;s account\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s that CLAUSE / Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"confirm%2:30:00::\">\u003cstrong>3. 使更加稳固\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make more firm\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Confirm thy soul in self-control!\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"confirm%2:41:01::\">\u003cstrong>4. 支持某人担任某个职位；确认任命\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">support a person for a position\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The Senate confirmed the President&#39;s candidate for Secretary of Defense\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s something / Something ----s somebody / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"confirm%2:41:00::\">\u003cstrong>5. 为某人施行坚振礼\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：religion / faith / organized religion\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">administer the rite of confirmation to\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the children were confirmed in their mother&#39;s faith\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"确认","cue":"当前用法","b":"现在需要一个明确的人名：下一步到底谁负责？请对方核实或确定这个归属，好让行动事项有人接手。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","confirm 经法语来自拉丁语 confirmare，意思与使坚固、使确定有关，其中 firmus 有坚实的意思。英语后来用于核实信息，也用于使安排确定下来。","https://www.etymonline.com/word/confirm"],["联系今天的意思","用 firm（稳固）帮助记住信息由待核实走向确定。但确认消息和批准提案是不同任务，不能因为有 confirm 就推断完成了审批。","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"],["回到本句","把下一项行动的负责人确认下来。Please confirm 要对方给出确定的信息；who 将问题定位到行动负责人。","https://www.oxfordlearnersdictionaries.com/definition/english/confirm"]]}},{"w":{"id":"V20261012-045","date":"2026-10-12","term":"specify","ipa":"/ˈspesɪfaɪ/","pos":"v.","meaning":"明确写出或说出具体要求","chunk":"specify the conditions","example":"Please specify the conditions for accepting this proposal.","level":"提升","gloss":"明确说明","explanation":"明确写出或说出具体要求","examples":[{"en":"Please specify the conditions for accepting this proposal.","zh":"请明确说明接受此提案的条件。"},{"en":"The contract specifies delivery dates.","zh":"合同明确规定交货日期。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please specify the conditions for accepting this proposal.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“把空白栏填到别人不必猜”的画面记 specify，这是记忆类比。核心是明确而具体，例如说明日期、数量或条件。它不是单纯多说几句；本句需要能辨认的接受条件，重复“条件合适”仍不够具体。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"用“把空白栏填到别人不必猜”的画面记 specify，这是记忆类比。","explanation":"核心是明确而具体，例如说明日期、数量或条件。它不是单纯多说几句；本句需要能辨认的接受条件，重复“条件合适”仍不够具体。","example":"用“把空白栏填到别人不必猜”的画面记 specify，这是记忆类比。核心是明确而具体，例如说明日期、数量或条件。它不是单纯多说几句；本句需要能辨认的接受条件，重复“条件合适”仍不够具体。","boundary":"它不是单纯多说几句；本句需要能辨认的接受条件，重复“条件合适”仍不够具体。"},"sources":[["Oxford Learner’s Dictionaries · specify","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]},{"id":"g2","title":"句法与概念","text":"specify 后直接接 the conditions；for accepting this proposal 修饰 conditions，其中 accepting 是介词 for 后的动名词。整句要说明接受提案所需的条件，不是命令对方现在就接受，也不表示条件已经满足。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"specify 后直接接 the conditions；for accepting this proposal 修饰 conditions，其中 accepting 是介词 for 后的动名词。","explanation":"整句要说明接受提案所需的条件，不是命令对方现在就接受，也不表示条件已经满足。","example":"Please specify the conditions for accepting this proposal. / 请明确说明接受此提案的条件。","boundary":"整句要说明接受提案所需的条件，不是命令对方现在就接受，也不表示条件已经满足。"},"sources":[["Oxford Learner’s Dictionaries · specify","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]},{"id":"g3","title":"辨析与英文邻居","text":"say 是广义的说，specify 强调说得确切；clarify 侧重解决不清楚的地方。若对方只说“尽快”，可请其 specify a date，把日期明确下来。词语差别在信息精度，不在说话长度或音量。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"say 是广义的说，specify 强调说得确切；clarify 侧重解决不清楚的地方。","explanation":"若对方只说“尽快”，可请其 specify a date，把日期明确下来。词语差别在信息精度，不在说话长度或音量。","example":"say 是广义的说，specify 强调说得确切；clarify 侧重解决不清楚的地方。若对方只说“尽快”，可请其 specify a date，把日期明确下来。词语差别在信息精度，不在说话长度或音量。","boundary":"词语差别在信息精度，不在说话长度或音量。"},"sources":[["Oxford Learner’s Dictionaries · specify","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]},{"id":"g4","title":"这句话在做什么","text":"specify 要求填补可执行的信息；conditions 指接受提案前需要满足的条件。自编接话：We need a revised price and a delivery date.（我们需要修订后的价格和交货日期。）接下来补齐这两项供对方判断。回答条件后仍需要检查是否满足，不等于提案已经被接受。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"specify 要求填补可执行的信息；conditions 指接受提案前需要满足的条件。","explanation":"接下来补齐这两项供对方判断。回答条件后仍需要检查是否满足，不等于提案已经被接受。","example":"自编接话：We need a revised price and a delivery date.（我们需要修订后的价格和交货日期。）","boundary":"接下来补齐这两项供对方判断。回答条件后仍需要检查是否满足，不等于提案已经被接受。"},"sources":[["Oxford Learner’s Dictionaries · specify","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Please specify the required file format.（请明确说明所需的文件格式。）交付要求不足以执行时用。把 file format 换成 dimensions，就改为索取具体尺寸。PDF 或 XLSX 这类明确答案才填补了要求；一句正常格式仍可能不够。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"交付要求不足以执行时用。把 file format 换成 dimensions，就改为索取具体尺寸。","explanation":"PDF 或 XLSX 这类明确答案才填补了要求；一句正常格式仍可能不够。","example":"Please specify the required file format. / 请明确说明所需的文件格式。","boundary":"PDF 或 XLSX 这类明确答案才填补了要求；一句正常格式仍可能不够。"},"sources":[["Oxford Learner’s Dictionaries · specify","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]}]},"p":{"displayGloss":"明确说明","focused":[{"entry":{"lemma":"specify","pos":"v.","senses":[{"id":"current","glossZh":"明确写出或说出具体要求","definitionEn":"to state something precisely and explicitly","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"明确写出或说出具体要求","definitionEn":"to state something precisely and explicitly","sourceIds":["lex"]}}],"allEntries":[{"lemma":"specification","pos":"n.","senses":[{"id":"additional","glossZh":"规格说明；具体要求","definitionEn":"a detailed statement of how something must be designed or made","sourceIds":["family"]}]}],"contextTakeaway":"把接受提案的条件具体列出来。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-045\">\u003ch3>specify · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"specify-learner-1\">\u003cstrong>1. 明确、具体地说明或规定内容。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：specify something; specify that / how / whether\u003cbr>\u003cspan class=\"en\" lang=\"en\">The form asks you to specify which days you are available.\u003c/span>\u003cbr>表格要求你具体说明哪些天有空。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/specify\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>specify \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/specify\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈspɛs.ɪ.faɪ/ · US /ˈspɛs.əˌfaɪ/\u003c/p>\u003cp>词形〔来源列出〕：specified\u003c/p>\u003cp data-dictionary-sense=\"specify%2:32:03::\">\u003cstrong>1. 在合同或协议中明确规定条件、要求或条款\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">specify as a condition or requirement in a contract or agreement; make an express demand or provision in an agreement\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The will stipulates that she can live in the house for the rest of her life\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The contract stipulates the dates of the payments\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s / Somebody ----s that CLAUSE / Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:32:02::\">\u003cstrong>2. 明确决定或确定\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">decide upon or fix definitely\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：fix the variables\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：specify the parameters\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:42:00::\">\u003cstrong>3. 确定某事物的本质特征\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">determine the essential quality of\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:32:00::\">\u003cstrong>4. 具体说明\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">be specific about\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They specify that there was a traffic accident\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Could you please specify your criticism of my paper?\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s that CLAUSE / Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:31:02::\">\u003cstrong>5. 清楚界定\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">define clearly\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：I cannot narrow down the rules for this game\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Somebody ----s something PP\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:31:00::\">\u003cstrong>6. 拟定用途或指定归宿\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">design or destine\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：She was intended to become the director\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody to INFINITIVE\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"specify%2:31:05::\">\u003cstrong>7. 为特定目的选定某物或某人\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">select something or someone for a specific purpose\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The teacher assigned him to lead his classmates in the exercise\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody PP / Somebody ----s something PP\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":7},"x":{"short":"明确说明","cue":"当前用法","b":"不要只说条件合适就接受。specify 要求把条件逐项说清楚，例如需要什么价格、日期或文件，才能判断是否满足要求。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","specify 经法语来自后期拉丁语 specificare，历史意义涉及明确说出、特别指出。它与 specific 的意义联系有助记忆，不需要把词尾臆解成一个独立英语词。","https://www.etymonline.com/word/specify"],["联系今天的意思","把 specific（具体的）与 specify（具体说出来）配着记。说尽快仍需要猜，说周五下午五点前则给出了能执行的信息。","https://www.oxfordlearnersdictionaries.com/definition/english/specify"],["回到本句","把接受提案的条件具体列出来。specify 要求填补可执行的信息；conditions 指接受提案前需要满足的条件。","https://www.oxfordlearnersdictionaries.com/definition/english/specify"]]}},{"w":{"id":"V20261012-046","date":"2026-10-12","term":"elaborate","ipa":"/ɪˈlæbəreɪt/","pos":"v.","meaning":"对已经说出的观点进一步详细说明","chunk":"elaborate on a point","example":"Could you elaborate on the concern about timing?","level":"提升","gloss":"详细说明","explanation":"对已经说出的观点进一步详细说明","examples":[{"en":"Could you elaborate on the concern about timing?","zh":"你能详细说明对时间安排的担忧吗？"},{"en":"Could you elaborate on that risk?","zh":"你能详细说明那项风险吗？","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Could you elaborate on the concern about timing?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 elaborate on 和“把刚才那一点展开”一起记。通常已有一个观点，现在需要细节或解释来理解它。这里已有 concern，所以不是另起新话题；也不是 elaborate 作形容词时的“复杂精细”的意思。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"把 elaborate on 和“把刚才那一点展开”一起记。","explanation":"通常已有一个观点，现在需要细节或解释来理解它。这里已有 concern，所以不是另起新话题；也不是 elaborate 作形容词时的“复杂精细”的意思。","example":"把 elaborate on 和“把刚才那一点展开”一起记。通常已有一个观点，现在需要细节或解释来理解它。这里已有 concern，所以不是另起新话题；也不是 elaborate 作形容词时的“复杂精细”的意思。","boundary":"这里已有 concern，所以不是另起新话题；也不是 elaborate 作形容词时的“复杂精细”的意思。"},"sources":[["Oxford Learner’s Dictionaries · elaborate","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]},{"id":"g2","title":"句法与概念","text":"本句用 elaborate on，on 后接 the concern；about timing 再限定是哪方面的担忧。读成“详细说明／关于时间安排的担忧”，不要把 on 和 about 都直接连到动词上。请求的目标是补充既有观点。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"本句用 elaborate on，on 后接 the concern；about timing 再限定是哪方面的担忧。","explanation":"读成“详细说明／关于时间安排的担忧”，不要把 on 和 about 都直接连到动词上。请求的目标是补充既有观点。","example":"Could you elaborate on the concern about timing? / 你能详细说明对时间安排的担忧吗？","boundary":"请求的目标是补充既有观点。"},"sources":[["Oxford Learner’s Dictionaries · elaborate","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]},{"id":"g3","title":"辨析与英文邻居","text":"clarify 可以用简单说法消除含糊；elaborate 往往增加解释或细节。expand on 是接近的英文邻居，常用于继续展开一个观点。细节增加后仍应回答原问题，不能因为说得更多就认为已经解释清楚。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"clarify 可以用简单说法消除含糊；elaborate 往往增加解释或细节。","explanation":"expand on 是接近的英文邻居，常用于继续展开一个观点。细节增加后仍应回答原问题，不能因为说得更多就认为已经解释清楚。","example":"clarify 可以用简单说法消除含糊；elaborate 往往增加解释或细节。expand on 是接近的英文邻居，常用于继续展开一个观点。细节增加后仍应回答原问题，不能因为说得更多就认为已经解释清楚。","boundary":"细节增加后仍应回答原问题，不能因为说得更多就认为已经解释清楚。"},"sources":[["Oxford Learner’s Dictionaries · elaborate","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]},{"id":"g4","title":"这句话在做什么","text":"Could you elaborate 表示已经听到时间方面的担心，现在需要理解具体影响。自编接话：The review may take three extra days, leaving less time for testing.（评审可能多用三天，测试时间就会减少。）这给出了耗时和后果，后续才好讨论调整哪一步。多说无关细节没有完成这个请求。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Could you elaborate 表示已经听到时间方面的担心，现在需要理解具体影响。","explanation":"这给出了耗时和后果，后续才好讨论调整哪一步。多说无关细节没有完成这个请求。","example":"自编接话：The review may take three extra days, leaving less time for testing.（评审可能多用三天，测试时间就会减少。）","boundary":"这给出了耗时和后果，后续才好讨论调整哪一步。多说无关细节没有完成这个请求。"},"sources":[["Oxford Learner’s Dictionaries · elaborate","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Could you elaborate on how the delay affects testing?（你能详细说明延误怎样影响测试吗？）知道问题名称、却不清楚后果时用。把 how 后改成 the change affects costs，就追问成本影响。细节应围绕提问的影响展开，不需要从项目起点全部重讲。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"知道问题名称、却不清楚后果时用。把 how 后改成 the change affects costs，就追问成本影响。","explanation":"细节应围绕提问的影响展开，不需要从项目起点全部重讲。","example":"Could you elaborate on how the delay affects testing? / 你能详细说明延误怎样影响测试吗？","boundary":"细节应围绕提问的影响展开，不需要从项目起点全部重讲。"},"sources":[["Oxford Learner’s Dictionaries · elaborate","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]}]},"p":{"displayGloss":"详细说明","focused":[{"entry":{"lemma":"elaborate","pos":"v.","senses":[{"id":"current","glossZh":"对已经说出的观点进一步详细说明","definitionEn":"to add details to something already said","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"对已经说出的观点进一步详细说明","definitionEn":"to add details to something already said","sourceIds":["lex"]}}],"allEntries":[{"lemma":"elaborate","pos":"adj.","senses":[{"id":"additional","glossZh":"精心制作的；复杂详尽的","definitionEn":"carefully developed and containing many details","sourceIds":["family"]}]}],"contextTakeaway":"请把时间安排方面的担忧展开说明。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-046\">\u003ch3>elaborate · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"elaborate-learner-1\">\u003cstrong>1. 进一步详细说明，使已有信息更充分。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：elaborate on / upon something; 动词末尾读/reɪt/\u003cbr>\u003cspan class=\"en\" lang=\"en\">Could you elaborate on your reasons for leaving?\u003c/span>\u003cbr>你能详细说明离开的原因吗？\u003c/p>\u003cp data-learner-sense=\"elaborate-learner-2\">\u003cstrong>2. 细节丰富、结构复杂或精心制作的。\u003c/strong>\u003cbr>\u003csmall>形容词〔通常用于名词前〕\u003c/small>\u003cbr>用法：an elaborate design / plan; 形容词末尾读/rət/\u003cbr>\u003cspan class=\"en\" lang=\"en\">The ceiling has an elaborate floral design.\u003c/span>\u003cbr>天花板上有精细复杂的花卉图案。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/a\">\u003ch3>elaborate \u003csmall>形容词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/elaborate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%5:00:00:fancy:00\">\u003cstrong>1. 复杂且细节丰富的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">marked by complexity and richness of detail\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：an elaborate lace pattern\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%5:00:00:careful:00\">\u003cstrong>2. 精心构思或实施、细致入微的\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">developed or executed with care and in minute detail\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：a detailed plan\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the elaborate register of the inhabitants prevented tax evasion 〔John Buchan〕\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：the carefully elaborated theme\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>elaborate \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/elaborate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%2:32:00::\">\u003cstrong>1. 为叙述或想法增加细节、阐明含义并作深入论述，通常见于书面表达\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">add details, as to an account or idea; clarify the meaning of and discourse in a learned way, usually in writing\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They elaborate that there was a traffic accident\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：She elaborated on the main ideas in her dissertation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s / Somebody ----s PP / Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%2:36:00::\">\u003cstrong>2. 从基本元素或来源加工成更成熟的产物\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">produce from basic elements or sources; change into a more developed product\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The bee elaborates honey\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%2:30:00::\">\u003cstrong>3. 使更复杂、更精细或更丰富\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make more complex, intricate, or richer\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：refine a design or pattern\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"elaborate%2:30:01::\">\u003cstrong>4. 详细制订或推敲\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">work out in detail\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：elaborate a plan\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":6},"x":{"short":"详细说明","cue":"当前用法","b":"已经知道对方担心时间安排，现在请他把担心展开：是哪一步耗时长，会影响什么？这里需要相关细节，而不是重复一句时间有问题。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["词源线索","elaborate 与拉丁语 elaborare（付出劳动、精心做成）有关。英语动词有展开、详细说明的用法；形容词有复杂精细的用法，两者在现代英语中读音不同。","https://www.etymonline.com/word/elaborate"],["联系今天的意思","从认真展开细节联想到 elaborate on a point，可以帮助记忆动词义。这是现代教学联系，不是说解释越复杂就越好。","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"],["回到本句","请把时间安排方面的担忧展开说明。Could you elaborate 表示已经听到时间方面的担心，现在需要理解具体影响。","https://www.oxfordlearnersdictionaries.com/definition/english/elaborate_2"]]}},{"w":{"id":"V20261012-047","date":"2026-10-12","term":"summarize","ipa":"/ˈsʌməraɪz/","pos":"v.","meaning":"概括重点而不是重复全部细节","chunk":"summarize the discussion","example":"Let me summarize the decisions and remaining questions.","level":"核心","gloss":"概括","explanation":"概括重点而不是重复全部细节","examples":[{"en":"Let me summarize the decisions and remaining questions.","zh":"让我概括各项决定和剩余问题。"},{"en":"Summarize the findings in one paragraph.","zh":"用一段话概括调查结果。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Let me summarize the decisions and remaining questions.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“留下骨架，省去枝节”的画面记 summarize，这是教学类比。骨架是关键事实和观点，不是随意删短。这里要保留两类内容：已经决定的事与还没回答的问题，才能让听者掌握讨论落点。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"用“留下骨架，省去枝节”的画面记 summarize，这是教学类比。","explanation":"骨架是关键事实和观点，不是随意删短。这里要保留两类内容：已经决定的事与还没回答的问题，才能让听者掌握讨论落点。","example":"用“留下骨架，省去枝节”的画面记 summarize，这是教学类比。骨架是关键事实和观点，不是随意删短。这里要保留两类内容：已经决定的事与还没回答的问题，才能让听者掌握讨论落点。","boundary":"这里要保留两类内容：已经决定的事与还没回答的问题，才能让听者掌握讨论落点。"},"sources":[["Oxford Learner’s Dictionaries · summarize","https://www.oxfordlearnersdictionaries.com/definition/english/summarize"]]},{"id":"g2","title":"句法与概念","text":"Let me summarize 表示说话者准备进行概括；decisions 和 remaining questions 是并列宾语。remaining 修饰仍留下的问题。句法把已决与未决内容放在同一回顾动作里，概念上仍需分清它们的不同状态。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"Let me summarize 表示说话者准备进行概括；decisions 和 remaining questions 是并列宾语。","explanation":"remaining 修饰仍留下的问题。句法把已决与未决内容放在同一回顾动作里，概念上仍需分清它们的不同状态。","example":"Let me summarize the decisions and remaining questions. / 让我概括各项决定和剩余问题。","boundary":"句法把已决与未决内容放在同一回顾动作里，概念上仍需分清它们的不同状态。"},"sources":[["Oxford Learner’s Dictionaries · summarize","https://www.oxfordlearnersdictionaries.com/definition/english/summarize"]]},{"id":"g3","title":"辨析与英文邻居","text":"repeat 是重复，可能一字不改；summarize 要筛出重点并缩短。recap 与它接近，但常突出回顾此前讲过的内容。不要把尚未解决的问题省略掉，否则短了，却可能把讨论误报成全部完成。","sourceIds":["lex"],"claimIds":["lexical","g3"],"requirements":{"anchor":"repeat 是重复，可能一字不改；summarize 要筛出重点并缩短。","explanation":"recap 与它接近，但常突出回顾此前讲过的内容。不要把尚未解决的问题省略掉，否则短了，却可能把讨论误报成全部完成。","example":"repeat 是重复，可能一字不改；summarize 要筛出重点并缩短。recap 与它接近，但常突出回顾此前讲过的内容。不要把尚未解决的问题省略掉，否则短了，却可能把讨论误报成全部完成。","boundary":"不要把尚未解决的问题省略掉，否则短了，却可能把讨论误报成全部完成。"},"sources":[["Oxford Learner’s Dictionaries · summarize","https://www.oxfordlearnersdictionaries.com/definition/english/summarize"]]},{"id":"g4","title":"这句话在做什么","text":"Let me summarize 是收束讨论的提示；decisions and remaining questions 要求把已决与未决都交代清楚。自编概括：The supplier is agreed; the budget is still open.（供应商已确定，预算还未定。）听者可立即纠正漏项或误解。总结不能把待讨论的问题写成已经作出的决定。","sourceIds":["lex"],"claimIds":["lexical","g4"],"requirements":{"anchor":"Let me summarize 是收束讨论的提示；decisions and remaining questions 要求把已决与未决都交代清楚。","explanation":"听者可立即纠正漏项或误解。总结不能把待讨论的问题写成已经作出的决定。","example":"自编概括：The supplier is agreed; the budget is still open.（供应商已确定，预算还未定。）","boundary":"听者可立即纠正漏项或误解。总结不能把待讨论的问题写成已经作出的决定。"},"sources":[["Oxford Learner’s Dictionaries · summarize","https://www.oxfordlearnersdictionaries.com/definition/english/summarize"]]},{"id":"g5","title":"工作中可以这样说","text":"自编表达：Could you summarize the findings in three points?（你能用三个要点概括调查结果吗？）材料很长、需要先把握重点时用。把 three points 换成 one paragraph，指定不同呈现长度。三个要点是这次请求的格式，不是 summarize 的固定规则；重要发现仍须保留。","sourceIds":["lex"],"claimIds":["lexical","g5"],"requirements":{"anchor":"材料很长、需要先把握重点时用。把 three points 换成 one paragraph，指定不同呈现长度。","explanation":"三个要点是这次请求的格式，不是 summarize 的固定规则；重要发现仍须保留。","example":"Could you summarize the findings in three points? / 你能用三个要点概括调查结果吗？","boundary":"三个要点是这次请求的格式，不是 summarize 的固定规则；重要发现仍须保留。"},"sources":[["Oxford Learner’s Dictionaries · summarize","https://www.oxfordlearnersdictionaries.com/definition/english/summarize"]]}]},"p":{"displayGloss":"概括","focused":[{"entry":{"lemma":"summarize","pos":"v.","senses":[{"id":"current","glossZh":"概括重点而不是重复全部细节","definitionEn":"to present the main points briefly and clearly","sourceIds":["lex"]}]},"sense":{"id":"current","glossZh":"概括重点而不是重复全部细节","definitionEn":"to present the main points briefly and clearly","sourceIds":["lex"]}}],"allEntries":[{"lemma":"summary","pos":"n.","senses":[{"id":"additional","glossZh":"摘要；概要","definitionEn":"a short account of the main information or arguments","sourceIds":["family"]}]}],"contextTakeaway":"把决定与未决问题分别概括。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-047\">\u003ch3>summarize · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"summarize-learner-1\">\u003cstrong>1. 用较少的话概括最重要的内容。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：summarize the findings; 英式也写summarise\u003cbr>\u003cspan class=\"en\" lang=\"en\">Could you summarize the story in three sentences?\u003c/span>\u003cbr>你能用三句话概括这个故事吗？\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/summarize\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>summarize \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/summarize\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blan },{"w":{"id":"V20261012-048","date":"2026-10-12","term":"recap","ipa":"/ˈriːkæp/","pos":"v.","meaning":"简短回顾已经讨论或发生的内容","chunk":"recap the main points","example":"Could you recap the main points for the new team member?","level":"提升","gloss":"简要回顾","explanation":"简短回顾已经讨论或发生的内容","examples":[{"en":"Could you recap the main points for the new team member?","zh":"你能为新成员简要回顾要点吗？"},{"en":"Let's recap yesterday's decisions.","zh":"我们来简要回顾昨天的决定。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Could you recap the main points for the new team member?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"想象有人刚加入讨论，需要把前面的关键内容再过一遍，这就是本句 recap 的记忆场景。它强调回顾要点，不是从头逐句重播。把 recap the main points 整块记住，比只记“重复”更能掌握取舍。","sourceIds":["lex"],"claimIds":["lexical","g1"],"requirements":{"anchor":"想象有人刚加入讨论，需要把前面的关键内容再过一遍，这就是本句 recap 的记忆场景。","explanation":"它强调回顾要点，不是从头逐句重播。把 recap the main points 整块记住，比只记“重复”更能掌握取舍。","example":"想象有人刚加入讨论，需要把前面的关键内容再过一遍，这就是本句 recap 的记忆场景。它强调回顾要点，不是从头逐句重播。把 recap the main points 整块记住，比只记“重复”更能掌握取舍。","boundary":"把 recap the main points 整块记住，比只记“重复”更能掌握取舍。"},"sources":[["Oxford Learner’s Dictionaries · recap","https://www.oxfordlearnersdictionaries.com/definition/english/recap_1"]]},{"id":"g2","title":"句法与概念","text":"Could you 后接动词 recap，the main points 是宾语；for the new team member 表明回顾给谁听。把这句话分成“请回顾什么／为谁回顾”，就容易看出内容选择应以新成员需要跟上讨论为准。回顾重点即可，不必逐句重播。","sourceIds":["lex"],"claimIds":["lexical","g2"],"requirements":{"anchor":"Could you 后接动词 recap，the main points 是宾语；for the new team member 表明回顾给谁听。","explanation":"把这句话分成“请回顾什么／为谁回顾”，就容易看出内容选择应以新成员需要跟上讨论为准。回顾重点即可，不必逐句重播。","example":"Could you recap the main points for the new team member? / 你能为新成员简要回顾要点吗？","boundary":"回顾重点即可，不必逐句重播。"},"sources":[["Oxford Learner’s Dictionaries · recap","https://www.oxfordlearnersdictionaries.com/definition/english/recap_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"summarize 也概括重点，recap 更突出再次带过先前内容；两者可有重叠，不必硬分口语与书面语。review 范围更广
