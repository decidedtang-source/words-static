"自编工作表达：Can we negotiate a deadline that allows time for testing?（我们能协商一个留出测试时间的期限吗？）适合提出调整要求时，说明调整要满足的具体条件；对方可据此讨论时间，而不必猜测为何需要延期。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：Can we negotiate a deadline that allows time for testing?（我们能协商一个留出测试时间的期限吗？）适合提出调整要求时，说明调整要满足的具体条件；","explanation":"对方可据此讨论时间，而不必猜测为何需要延期。","example":"Can we negotiate a deadline that allows time for testing","boundary":"对方可据此讨论时间，而不必猜测为何需要延期。"},"sources":[["Oxford · negotiate","https://www.oxfordlearnersdictionaries.com/definition/english/negotiate"]]}]},"p":{"displayGloss":"协商；谈判","focused":[{"entry":{"lemma":"negotiate","pos":"v.","senses":[{"id":"negotiate:current","glossZh":"与另一方讨论条件以争取达成协议","definitionEn":"discuss terms with another party to seek an agreement","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"negotiate:current","glossZh":"与另一方讨论条件以争取达成协议","definitionEn":"discuss terms with another party to seek an agreement","sourceIds":["lex"]}}],"allEntries":[{"lemma":"negotiate","pos":"v.","senses":[{"id":"negotiate:extra","glossZh":"设法通过困难路段或障碍","definitionEn":"manage to get past a difficult obstacle or route","sourceIds":["lex"]}],"source":"有据原创教学转述"}],"contextTakeaway":"可能需要通过协商争取更实际的期限。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-058\">\u003ch3>negotiate · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"negotiate-learner-1\">\u003cstrong>1. 通过讨论争取就条件或安排达成协议。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：negotiate with someone over something; negotiate a deal\u003cbr>\u003cspan class=\"en\" lang=\"en\">They are negotiating with the landlord over the rent.\u003c/span>\u003cbr>他们正在与房东商谈租金。\u003c/p>\u003cp data-learner-sense=\"negotiate-learner-2\">\u003cstrong>2. 成功通过或越过难走的路段、障碍等。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：negotiate a bend / obstacle\u003cbr>\u003cspan class=\"en\" lang=\"en\">The driver carefully negotiated the narrow bend.\u003c/span>\u003cbr>司机小心地驶过狭窄的弯道。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/negotiate\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>negotiate \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/negotiate\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /nəˈɡəʊ.ʃi.eɪt/ · US /nəˈɡoʊ.ʃi.eɪt/\u003c/p>\u003cp data-dictionary-sense=\"negotiate%2:32:00::\">\u003cstrong>1. 讨论某项安排的条件；谈判\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">discuss the terms of an arrangement\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：Sam and Sue negotiate\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：Sam wants to negotiate with Sue\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：They negotiated the sale of the house\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"negotiate%2:38:00::\">\u003cstrong>2. 成功通过、绕过或越过\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">succeed in passing through, around, or over\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The hiker negociated the high mountain pass\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"协商；谈判","cue":"当前用法","b":"negotiate a deadline 是把截止时间拿来协商，争取一个双方可接受的安排。你可以说明现日期哪里不现实，再讨论能否延后或调整条件；它比单纯告知日期多了协商这一步。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","negotiate 的来历与拉丁语 negotiari“处理事务、做生意”有关；更早的 negotium 是事务，字面构成为“非闲暇”。这说明历史背景，不意味着现代 negotiate 可译为一切忙碌活动。","https://www.etymonline.com/word/negotiate"],["用现代联系帮助理解","做生意或处理安排时，双方常要拿条件来回讨论。可以借这一过程记 negotiate：不是单方面宣布要求，而是讨论能接受什么。词源提供联系，实际用法仍要看谈的对象。","https://www.oxfordlearnersdictionaries.com/definition/english/negotiate"],["回到当前句子","negotiate a deadline 是把截止时间拿来协商，争取一个双方可接受的安排。你可以说明现日期哪里不现实，再讨论能否延后或调整条件；它比单纯告知日期多了协商这一步。","https://www.oxfordlearnersdictionaries.com/definition/english/negotiate"]]}},{"w":{"id":"V20261012-059","date":"2026-10-12","term":"conclude","ipa":"kənˈkluːd","pos":"v.","meaning":"结束讨论或从讨论中得出结论","chunk":"conclude a meeting","example":"Let's conclude the meeting by confirming the next steps.","level":"提升","gloss":"结束；得出结论","explanation":"结束讨论或从讨论中得出结论","examples":[{"en":"Let's conclude the meeting by confirming the next steps.","zh":"我们以确认后续步骤来结束会议吧。"},{"en":"We concluded that repairs were necessary.","zh":"我们得出结论，维修是必要的。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Let's conclude the meeting by confirming the next steps.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 conclude the meeting 记成“给会议收尾”，再联系 conclude that repairs are necessary（得出需要维修的结论）。同一个词可以结束活动，也可以表达判断；看后面的宾语或 that 从句来分清。","sourceIds":["lex"],"claimIds":["lexical","connection"],"requirements":{"anchor":"把 conclude the meeting 记成“给会议收尾”，再联系 conclude that repairs are necessary（得出需要维修的结论）。","explanation":"同一个词可以结束活动，也可以表达判断；","example":"conclude the meeting ","boundary":"看后面的宾语或 that 从句来分清。"},"sources":[["Oxford · conclude","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]},{"id":"g2","title":"句法与概念","text":"Let's 提议共同做一件事，conclude 的对象是 the meeting；by confirming 指结束时采用的方式。确认后续步骤是收尾动作，并非已经确认完毕；读懂 by 后的动作，就知道散会前还要做什么。","sourceIds":["lex"],"claimIds":["syntax"],"requirements":{"anchor":"Let's 提议共同做一件事，conclude 的对象是 the meeting；","explanation":"by confirming 指结束时采用的方式。","example":"Let's ","boundary":"读懂 by 后的动作，就知道散会前还要做什么。"},"sources":[["Oxford · conclude","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]},{"id":"g3","title":"辨析与英文邻居","text":"conclude the meeting 和 end the meeting 都是结束会议，conclude 较正式；summarize 则是概括要点，未必表示活动已经结束。例如先 summarize the discussion，再 conclude the meeting。结尾可以包含总结，也可以只是确认安排。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"conclude the meeting 和 end the meeting 都是结束会议，conclude 较正式；","explanation":"summarize 则是概括要点，未必表示活动已经结束。","example":"conclude the meeting ","boundary":"结尾可以包含总结，也可以只是确认安排。"},"sources":[["Oxford · conclude","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]},{"id":"g4","title":"这句话在做什么","text":"Let’s 是提出共同安排，conclude 让会议进入结束阶段，by confirming 又指定最后要做的动作。自编回应：The next step is to inspect the unit on Tuesday.（下一步是周二检查设备。）回应补出具体行动，让结束不只是说一句“散会”。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"Let’s 是提出共同安排，conclude 让会议进入结束阶段，by confirming 又指定最后要做的动作。","explanation":"自编回应：The next step is to inspect the unit on Tuesday.（下一步是周二检查设备。","example":"Let’s ","boundary":"）回应补出具体行动，让结束不只是说一句“散会”。"},"sources":[["Oxford · conclude","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：I'd like to conclude by summarising the remaining questions.（我想通过概括尚未解决的问题来结束。）适合报告或讨论到尾声、但部分问题仍需追踪时；能结束交流，却不把“结束”误说成所有问题都已解决。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：I'd like to conclude by summarising the remaining questions.（我想通过概括尚未解决的问题来结束。","explanation":"）适合报告或讨论到尾声、但部分问题仍需追踪时；","example":"I'd like to conclude by summarising the remaining questions","boundary":"能结束交流，却不把“结束”误说成所有问题都已解决。"},"sources":[["Oxford · conclude","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]}]},"p":{"displayGloss":"结束；得出结论","focused":[{"entry":{"lemma":"conclude","pos":"v.","senses":[{"id":"conclude:current","glossZh":"使会议、讲话或讨论结束","definitionEn":"bring a meeting, speech, or discussion to an end","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"conclude:current","glossZh":"使会议、讲话或讨论结束","definitionEn":"bring a meeting, speech, or discussion to an end","sourceIds":["lex"]}}],"allEntries":[{"lemma":"conclude","pos":"v.","senses":[{"id":"conclude:extra","glossZh":"根据证据得出结论","definitionEn":"form a judgment from available evidence","sourceIds":["lex"]}],"source":"有据原创教学转述"}],"contextTakeaway":"以确认后续步骤作为结束会议的最后动作。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-059\">\u003ch3>conclude · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"conclude-learner-1\">\u003cstrong>1. 根据事实或推理得出结论。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，此义通常不用进行时〕\u003c/small>\u003cbr>用法：conclude that; conclude from\u003cbr>\u003cspan class=\"en\" lang=\"en\">We concluded from the tracks that an animal had entered.\u003c/span>\u003cbr>我们根据足迹判断有动物进来过。\u003c/p>\u003cp data-learner-sense=\"conclude-learner-2\">\u003cstrong>2. 结束或使结束某项活动。\u003c/strong>\u003cbr>\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cbr>用法：conclude a meeting; conclude with / by\u003cbr>\u003cspan class=\"en\" lang=\"en\">The concert concluded with a short encore.\u003c/span>\u003cbr>音乐会以一段简短的返场演出结束。\u003c/p>\u003cp data-learner-sense=\"conclude-learner-3\">\u003cstrong>3. 经过协商正式达成协议或交易。\u003c/strong>\u003cbr>\u003csmall>动词〔及物，正式〕\u003c/small>\u003cbr>用法：conclude an agreement / deal\u003cbr>\u003cspan class=\"en\" lang=\"en\">The two firms concluded a licensing agreement.\u003c/span>\u003cbr>两家公司达成了一项许可协议。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/conclude\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>conclude \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/conclude\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：源未分口音 /kən.ˈkluːd/\u003c/p>\u003cp data-dictionary-sense=\"conclude%2:31:00::\">\u003cstrong>1. 通过推理作出判断、得出结论\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">decide by reasoning; draw or come to a conclusion\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：They conclude that there was a traffic accident\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：We reasoned that it was cheaper to rent than to buy a house\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s that CLAUSE\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"conclude%2:31:01::\">\u003cstrong>2. 使结束\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">bring to a close\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The committee concluded the meeting\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"conclude%2:32:01::\">\u003cstrong>3. 讨论或审议后得出结论\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">reach a conclusion after a discussion or deliberation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s that CLAUSE / Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"conclude%2:42:02::\">\u003cstrong>4. 结束、告终\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">come to a close\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The concert closed with a nocturne by Chopin\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something ----s / Something is ----ing PP\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"conclude%2:32:06::\">\u003cstrong>5. 就某事达成协议\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">reach agreement on\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：They concluded an economic agreement\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：We concluded a cease-fire\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"结束；得出结论","cue":"当前用法","b":"本句的 conclude 是结束会议：宾语 the meeting 是一项活动，by confirming the next steps 说明结束时要做的动作。判断当前义要结合这些内容，而不是单看有没有 that 从句。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","conclude 来自拉丁语 concludere，与“关闭、围住”有关。英语很早就有结束以及经推理得出结论的用法；两种现代义都存在，不能见到 conclude 就一律译成“总结”。","https://www.etymonline.com/word/conclude"],["用现代联系帮助理解","可以把一次讨论想成一段需要有结尾的过程。conclude the meeting 是使会议结束；conclude that… 则把思考收束为一个判断。这个对照帮助选义，不是把所有历史用法排成一条推导线。","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"],["回到当前句子","本句的 conclude 是结束会议。后面的 by confirming the next steps 说明怎样结束：先把下一步说清楚，再散会。这里没有 that 从句，所以不是在说“得出某个结论”。","https://www.oxfordlearnersdictionaries.com/definition/english/conclude"]]}},{"w":{"id":"V20261012-060","date":"2026-10-12","term":"document","ipa":"ˈdɒkjument","pos":"v.","meaning":"把决定、事实或过程正式记录下来","chunk":"document a decision","example":"Please document the decision and the reason behind it.","level":"核心","gloss":"记录","explanation":"把决定、事实或过程正式记录下来","examples":[{"en":"Please document the decision and the reason behind it.","zh":"请记录决定及其背后的理由。"},{"en":"Document every approved design change.","zh":"记录每项获批的设计变更。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Please document the decision and the reason behind it.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 a document（一份文件）与 document a decision（记录一个决定）连起来记。前者是留下的材料，后者是留下记录的动作。本句是动词，用“记录下来”比直接背“文件”更合适。","sourceIds":["lex"],"claimIds":["lexical","connection"],"requirements":{"anchor":"把 a document（一份文件）与 document a decision（记录一个决定）连起来记。","explanation":"前者是留下的材料，后者是留下记录的动作。","example":"a document","boundary":"本句是动词，用“记录下来”比直接背“文件”更合适。"},"sources":[["Oxford · document","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]},{"id":"g2","title":"句法与概念","text":"Please document 是祈使句，document 后的两个并列对象是 the decision 和 the reason behind it。it 指 decision；behind 在这里表达理由关系。遗漏后半部分，就只留下“做什么”，没有留下“为什么这样做”。","sourceIds":["lex"],"claimIds":["syntax"],"requirements":{"anchor":"Please document 是祈使句，document 后的两个并列对象是 the decision 和 the reason behind it。","explanation":"it 指 decision；","example":"Please document ","boundary":"遗漏后半部分，就只留下“做什么”，没有留下“为什么这样做”。"},"sources":[["Oxford · document","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]},{"id":"g3","title":"辨析与英文邻居","text":"discuss a decision 是讨论决定，document a decision 是留下记录。比如会中已经谈清楚，却还没写入纪要，discussion 完成了，documentation 可能还没完成。常用 document the reasons，记录理由，让后来的人能理解当时依据。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"discuss a decision 是讨论决定，document a decision 是留下记录。","explanation":"比如会中已经谈清楚，却还没写入纪要，discussion 完成了，documentation 可能还没完成。","example":"discuss a decision ","boundary":"常用 document the reasons，记录理由，让后来的人能理解当时依据。"},"sources":[["Oxford · document","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]},{"id":"g4","title":"这句话在做什么","text":"Please document 提出记录任务，and 把记录对象扩成两项：决定，以及背后的理由。自编回应：I’ll add both to the meeting notes.（我会把两项都补进会议记录。）这样明确了保存位置，也回应了本句要求的两部分。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"Please document 提出记录任务，and 把记录对象扩成两项：决定，以及背后的理由。","explanation":"自编回应：I’ll add both to the meeting notes.（我会把两项都补进会议记录。","example":"Please document ","boundary":"）这样明确了保存位置，也回应了本句要求的两部分。"},"sources":[["Oxford · document","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：Please document any changes to the agreed process.（请记录对已议定流程的任何改动。）适合流程执行中发生变化、需要之后核对时。它要求留下改动记录，不表示改动因此自动获批；审批仍是另一项动作。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：Please document any changes to the agreed process.（请记录对已议定流程的任何改动。","explanation":"）适合流程执行中发生变化、需要之后核对时。","example":"Please document any changes to the agreed process","boundary":"审批仍是另一项动作。"},"sources":[["Oxford · document","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]}]},"p":{"displayGloss":"记录","focused":[{"entry":{"lemma":"document","pos":"v.","senses":[{"id":"document:current","glossZh":"把信息、事件或过程记录下来","definitionEn":"make a record of information, events, or a process","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"document:current","glossZh":"把信息、事件或过程记录下来","definitionEn":"make a record of information, events, or a process","sourceIds":["lex"]}}],"allEntries":[{"lemma":"document","pos":"n.","senses":[{"id":"document:extra","glossZh":"文件；保存信息的书面或电子材料","definitionEn":"a written or electronic item that holds information","sourceIds":["extra"]}],"source":"有据原创教学转述"}],"contextTakeaway":"不仅记录决定，也记录作出决定的理由。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-060\">\u003ch3>document · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"document-learner-1\">\u003cstrong>1. 记录信息的纸质文件或电子文档。\u003c/strong>\u003cbr>\u003csmall>名词〔可数〕\u003c/small>\u003cbr>用法：an official document; save a document\u003cbr>\u003cspan class=\"en\" lang=\"en\">Please bring a document showing your address.\u003c/span>\u003cbr>请带一份能证明你住址的文件。\u003c/p>\u003cp data-learner-sense=\"document-learner-2\">\u003cstrong>2. 用文字、照片等详细记录，或提供文献证据。\u003c/strong>\u003cbr>\u003csmall>动词〔及物〕\u003c/small>\u003cbr>用法：document a process / event; be well documented\u003cbr>\u003cspan class=\"en\" lang=\"en\">The photographs document the changes in the neighbourhood.\u003c/span>\u003cbr>这些照片记录了街区的变化。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/document_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/document_2\">Oxford 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>document \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/document\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈdɒkjʊmənt/ · US /ˈdɑkjʊmənt/\u003c/p>\u003cp data-dictionary-sense=\"document%1:10:00::\">\u003cstrong>1. 提供信息，尤其是正式信息的书面文件\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">writing that provides information (especially information of an official nature)\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"document%1:06:00::\">\u003cstrong>2. 用符号标记表现人的思想的任何材料\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">anything serving as a representation of a person&#39;s thinking by means of symbolic marks\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"document%1:21:00::\">\u003cstrong>3. 关于所有权或义务的书面凭证\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a written account of ownership or obligation\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"document%1:10:01::\">\u003cstrong>4. 计算机：包含文本及可能的格式指令、使用七位ASCII字符的文件（此为源词典的特定定义）\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>领域：computer science / computing\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">(computer science) a computer file that contains text (and possibly formatting instructions) using seven-bit ASCII characters\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>document \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/document\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˈdɒkjʊmənt/ · US /ˈdɑkjʊmənt/\u003c/p>\u003cp data-dictionary-sense=\"document%2:32:00::\">\u003cstrong>1. 详细记录\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">record in detail\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The parents documented every step of their child&#39;s development\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"document%2:31:00::\">\u003cstrong>2. 用参考资料支持或提供文献依据\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">support or supply with references\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Can you document your claims?\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":6},"x":{"short":"记录","cue":"当前用法","b":"这里的 document 是动词，要求把决定和理由记录下来。只写“同意修改”还不够，本句还希望读者以后知道为什么改；核心是留下可追溯内容，而不是把文件排得漂亮。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","document 与拉丁语 documentum 有关，早期含例证、教导、证明等意义。英语后来用名词指提供信息或证据的文件，也用动词表示用材料记录或证明。今天的动词不要求一定写在纸上。","https://www.etymonline.com/word/document"],["用现代联系帮助理解","名词 a document 是一份记录材料，动词 document 是把事情留下可查的记录。可以想成把一次口头决定变成以后能查到的内容；形式可能是文字，也可以是照片等材料。","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"],["回到当前句子","这里的 document 是动词，要求把决定和理由记录下来。只写“同意修改”还不够，本句还希望读者以后知道为什么改；核心是留下可追溯内容，而不是把文件排得漂亮。","https://www.oxfordlearnersdictionaries.com/definition/english/document_2"]]}},{"w":{"id":"V20261012-061","date":"2026-10-12","term":"follow up","ipa":"ˈfɒləʊ ʌp","pos":"短语动词","meaning":"在初次沟通后继续跟进","chunk":"follow up on an action","example":"I'll follow up on the open action tomorrow.","level":"核心","gloss":"跟进","explanation":"在初次沟通后继续跟进","examples":[{"en":"I'll follow up on the open action tomorrow.","zh":"我明天会跟进这项未结行动。"},{"en":"Please follow up with the inspector.","zh":"请向检查员跟进。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"I'll follow up on the open action tomorrow.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把它记成“上次之后，再做下一步”，重点在前后两次行动有关联。follow up on an action 是跟进事项；不要把 up 拆成“向上”。动词写 follow up，作后续事项或修饰语时常见 follow-up。","sourceIds":["lex","grammar"],"claimIds":["lexical","connection"],"requirements":{"anchor":"把它记成“上次之后，再做下一步”，重点在前后两次行动有关联。","explanation":"follow up on an action 是跟进事项；","example":"follow up on an action ","boundary":"动词写 follow up，作后续事项或修饰语时常见 follow-up。"},"sources":[["Oxford · follow up","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g2","title":"句法与概念","text":"I'll 是 I will，表示这里承担下一次行动；follow up on 后接 the open action，tomorrow 指跟进时间。open 在这项工作语境中表示尚未结清，整句承诺的是明天跟进，并非保证明天完成该事项。","sourceIds":["lex","grammar"],"claimIds":["syntax"],"requirements":{"anchor":"I'll 是 I will，表示这里承担下一次行动；","explanation":"follow up on 后接 the open action，tomorrow 指跟进时间。","example":"I'll ","boundary":"open 在这项工作语境中表示尚未结清，整句承诺的是明天跟进，并非保证明天完成该事项。"},"sources":[["Oxford · follow up","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"check 可以是任何一次检查，follow up 更突出接着此前的事往下做。例如第一次检查报告是 check；会后再追问尚未关闭的问题，可以说 follow up。follow up on 后接事项，follow up with 后面常接要联系的人。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"check 可以是任何一次检查，follow up 更突出接着此前的事往下做。","explanation":"例如第一次检查报告是 check；","example":"check ","boundary":"follow up on 后接事项，follow up with 后面常接要联系的人。"},"sources":[["Oxford · follow up","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"]]},{"id":"g4","title":"这句话在做什么","text":"I’ll 把这句话变成承诺，on the open action 指定跟进哪件事，tomorrow 给出时间。自编回应：Please let me know if it is still open.（如果还没关闭，请告诉我。）接下来就有一个需要回报的结果，而不只是泛泛地说会再看看。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"I’ll 把这句话变成承诺，on the open action 指定跟进哪件事，tomorrow 给出时间。","explanation":"自编回应：Please let me know if it is still open.（如果还没关闭，请告诉我。","example":"I’ll ","boundary":"）接下来就有一个需要回报的结果，而不只是泛泛地说会再看看。"},"sources":[["Oxford · follow up","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：I'll follow up on the missing information this afternoon.（今天下午我会跟进缺失的信息。）适合已经提出资料需求、需要继续确认时；给出对象和时间，避免只说 I'll follow up 而让听者不清楚跟进哪件事。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：I'll follow up on the missing information this afternoon.（今天下午我会跟进缺失的信息。","explanation":"）适合已经提出资料需求、需要继续确认时；","example":"I'll follow up on the missing information this afternoon","boundary":"给出对象和时间，避免只说 I'll follow up 而让听者不清楚跟进哪件事。"},"sources":[["Oxford · follow up","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"]]}]},"p":{"displayGloss":"跟进","focused":[{"entry":{"lemma":"follow up","pos":"短语动词","senses":[{"id":"follow-up:current","glossZh":"对已经开始的事项继续采取行动或查问","definitionEn":"take further action on something already started","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"follow-up:current","glossZh":"对已经开始的事项继续采取行动或查问","definitionEn":"take further action on something already started","sourceIds":["lex"]}},{"entry":{"lemma":"follow","pos":"v. · 组词联系","senses":[{"id":"follow:component","glossZh":"跟随；在后面继续；整体短语义见上","definitionEn":"go or come after someone or something","sourceIds":["component"]}],"source":"组成词基础义，不机械推出整体义"},"sense":{"id":"follow:component","glossZh":"跟随；在后面继续；整体短语义见上","definitionEn":"go or come after someone or something","sourceIds":["component"]}}],"allEntries":[{"lemma":"follow-up","pos":"adj.","senses":[{"id":"follow-up:extra","glossZh":"后续的；用于继续了解或处理的","definitionEn":"done later to continue or check earlier work","sourceIds":["extra"]}],"source":"有据原创教学转述"}],"contextTakeaway":"明天继续跟进尚未结清的行动事项。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-061\">\u003ch3>follow up · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"follow-up-learner-1\">\u003cstrong>1. 对先前开始的事继续采取行动、了解进展或深入调查。\u003c/strong>\u003cbr>\u003csmall>短语动词\u003c/small>\u003cbr>用法：follow up on something; follow something up\u003cbr>\u003cspan class=\"en\" lang=\"en\">The reporter followed up on the anonymous tip.\u003c/span>\u003cbr>记者继续调查了那条匿名线索。\u003c/p>\u003cp data-learner-sense=\"follow-up-learner-2\">\u003cstrong>2. 接着做另一件事，以进一步发挥前一行动的效果。\u003c/strong>\u003cbr>\u003csmall>短语动词\u003c/small>\u003cbr>用法：follow something up with something\u003cbr>\u003cspan class=\"en\" lang=\"en\">She followed up the phone call with an email.\u003c/span>\u003cbr>打完电话后，她又发了一封邮件。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1\">Oxford 1\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://dictionary.cambridge.org/dictionary/english/follow-up\">Cambridge 2\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>follow up \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/follow%20up\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"follow_up%2:30:00::\">\u003cstrong>1. 追踪进行到结束，或使之取得成功结果\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">pursue to a conclusion or bring to a successful issue\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Did he go through with the treatment?\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：He implemented a new economic plan\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：She followed up his recommendations with a written proposal\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"follow_up%2:30:01::\">\u003cstrong>2. 通过后续行动提高成效或成功程度\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">increase the effectiveness or success of by further action\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The doctor followed up the surgery with radiation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":2},"x":{"short":"跟进","cue":"当前用法","b":"follow up 是对已经提出或开始的事情继续处理。本句的 open action 是尚未完成的行动项，明天要继续查它的进展；只是发起第一次联系，通常还谈不上这层“后续”。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","follow 来自古英语，已有跟随、伴随等意思；后来也表示时间上接在后面。这里考证的是 follow 这个组成词，不把它的年代当作 follow up 这一工作表达的起源时间。","https://www.etymonline.com/word/follow"],["用现代联系帮助理解","一件事做过之后，再接着问进展、补资料或采取下一步，就是容易理解的 follow up 图像。重点是前面已经有事情可接续，不是毫无前情地重新开一个话题。","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"],["回到当前句子","follow up 是对已经提出或开始的事情继续处理。本句的 open action 是尚未完成的行动项，明天要继续查它的进展；只是发起第一次联系，通常还谈不上这层“后续”。","https://www.oxfordlearnersdictionaries.com/definition/english/follow-up_1"]]}},{"w":{"id":"V20261012-062","date":"2026-10-12","term":"bring up","ipa":"brɪŋ ʌp","pos":"短语动词","meaning":"在讨论中提出一个话题","chunk":"bring up an issue","example":"I'd like to bring up one issue before we finish.","level":"核心","gloss":"提出话题","explanation":"在讨论中提出一个话题","examples":[{"en":"I'd like to bring up one issue before we finish.","zh":"结束前，我想提出一个问题。"},{"en":"She brought up the staffing shortage.","zh":"她提出了人员短缺问题。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"I'd like to bring up one issue before we finish.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"把 bring up an issue 连成一块，记住它负责让话题进入对话。可用“把问题放到桌面上”作学习联想，但并非历史词源。issue 提醒这里是谈话义，不是 bring someone up 的养育义。","sourceIds":["lex","grammar"],"claimIds":["lexical","connection"],"requirements":{"anchor":"把 bring up an issue 连成一块，记住它负责让话题进入对话。","explanation":"可用“把问题放到桌面上”作学习联想，但并非历史词源。","example":"bring up an issue ","boundary":"issue 提醒这里是谈话义，不是 bring someone up 的养育义。"},"sources":[["Oxford · bring up","https://www.oxfordlearnersdictionaries.com/definition/english/bring-up"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g2","title":"句法与概念","text":"I'd like to 后接 bring up，表示想做什么；one issue 是所提对象，before we finish 给出时机。可分结构中，用代词时说 bring it up。这里在申请或预告一个发言点，还没有讲出问题的具体内容。","sourceIds":["lex","grammar"],"claimIds":["syntax"],"requirements":{"anchor":"I'd like to 后接 bring up，表示想做什么；","explanation":"one issue 是所提对象，before we finish 给出时机。","example":"I'd like to ","boundary":"这里在申请或预告一个发言点，还没有讲出问题的具体内容。"},"sources":[["Oxford · bring up","https://www.oxfordlearnersdictionaries.com/definition/english/bring-up"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"bring up 侧重把话题引入，discuss 侧重已经围绕它展开交流。你可以先 bring up a staffing issue，再 discuss possible solutions。若只是要指出现有方案里的一处细节，point out 往往更直接。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"bring up 侧重把话题引入，discuss 侧重已经围绕它展开交流。","explanation":"你可以先 bring up a staffing issue，再 discuss possible solutions。","example":"bring up ","boundary":"若只是要指出现有方案里的一处细节，point out 往往更直接。"},"sources":[["Oxford · bring up","https://www.oxfordlearnersdictionaries.com/definition/english/bring-up"]]},{"id":"g4","title":"这句话在做什么","text":"I’d like to 先表达想说一件事，before we finish 说明希望现在留一点时间。自编回应：Sure—what’s the issue?（可以，是什么问题？）这给对方发言入口；如果时间不足，也可以先确认议题再约后续讨论。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"I’d like to 先表达想说一件事，before we finish 说明希望现在留一点时间。","explanation":"自编回应：Sure—what’s the issue?（可以，是什么问题？）这给对方发言入口；","example":"I’d like to ","boundary":"如果时间不足，也可以先确认议题再约后续讨论。"},"sources":[["Oxford · bring up","https://www.oxfordlearnersdictionaries.com/definition/english/bring-up"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：Could we bring up the staffing issue at the next meeting?（我们能在下次会议提出人员配置问题吗？）适合安排讨论时机。先点明主题和会议，不必在邀请讨论的这一句里塞进全部论据，让对方先确认议程。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：Could we bring up the staffing issue at the next meeting?（我们能在下次会议提出人员配置问题吗？）适合安排讨论时机。","explanation":"先点明主题和会议，不必在邀请讨论的这一句里塞进全部论据，让对方先确认议程。","example":"Could we bring up the staffing issue at the next meeting","boundary":"先点明主题和会议，不必在邀请讨论的这一句里塞进全部论据，让对方先确认议程。"},"sources":[["Oxford · bring up","https://www.oxfordlearnersdictionaries.com/definition/english/bring-up"]]}]},"p":{"displayGloss":"提出话题","focused":[{"entry":{"lemma":"bring up","pos":"短语动词","senses":[{"id":"bring-up:current","glossZh":"在交谈中提出某个话题","definitionEn":"introduce a subject into a conversation","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"bring-up:current","glossZh":"在交谈中提出某个话题","definitionEn":"introduce a subject into a conversation","sourceIds":["lex"]}},{"entry":{"lemma":"bring","pos":"v. · 组词联系","senses":[{"id":"bring:component","glossZh":"带来；带到某个地方；整体短语义见上","definitionEn":"come with someone or something to a place","sourceIds":["component"]}],"source":"组成词基础义，不机械推出整体义"},"sense":{"id":"bring:component","glossZh":"带来；带到某个地方；整体短语义见上","definitionEn":"come with someone or something to a place","sourceIds":["component"]}}],"allEntries":[{"lemma":"bring up","pos":"短语动词","senses":[{"id":"bring-up:extra","glossZh":"抚养；养育孩子","definitionEn":"care for a child while they grow up","sourceIds":["lex"]}],"source":"有据原创教学转述"}],"contextTakeaway":"结束前想再提出一个问题。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-062\">\u003ch3>bring up · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"bring-up-learner-1\">\u003cstrong>1. 提出话题或问题供讨论。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：bring something up; bring it up\u003cbr>\u003cspan class=\"en\" lang=\"en\">Please bring this question up at the next meeting.\u003c/span>\u003cbr>请在下次会议上提出这个问题。\u003c/p>\u003cp data-learner-sense=\"bring-up-learner-2\">\u003cstrong>2. 抚养、养育孩子。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：bring someone up; be brought up to do\u003cbr>\u003cspan class=\"en\" lang=\"en\">Her grandparents brought her up.\u003c/span>\u003cbr>她由祖父母抚养长大。\u003c/p>\u003cp data-learner-sense=\"bring-up-learner-3\">\u003cstrong>3. 呕出食物等。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：bring something up\u003cbr>\u003cspan class=\"en\" lang=\"en\">The child brought up most of his dinner.\u003c/span>\u003cbr>孩子把晚饭大部分都吐了出来。\u003c/p>\u003cp data-learner-sense=\"bring-up-learner-4\">\u003cstrong>4. 使信息或页面出现在屏幕上。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开，计算机〕\u003c/small>\u003cbr>用法：bring up a page / menu\u003cbr>\u003cspan class=\"en\" lang=\"en\">Click the icon to bring up the settings menu.\u003c/span>\u003cbr>点击图标打开设置菜单。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/bring-up\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>bring up \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/bring%20up\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:36:00::\">\u003cstrong>1. 召来使之行动，或使之出现，常有如凭魔法召出的意味\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">summon into action or bring into existence, often as if by magic\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：raise the specter of unemployment\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he conjured wild birds in the air\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：call down the spirits from the mountain\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:41:00::\">\u003cstrong>2. 抚养孩子直至成年\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">look after a child until it is an adult\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：raise a family\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：bring up children\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:41:01::\">\u003cstrong>3. 从较低职位或级别提拔\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">promote from a lower position or rank\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：This player was brought up to the major league\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:38:00::\">\u003cstrong>4. 从较低位置抬高\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">raise from a lower to a higher position\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词条例句：The men bring up the chairs\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Raise your hands\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：Lift a load\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s somebody PP / Somebody ----s something / Somebody ----s something PP / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:38:02::\">\u003cstrong>5. 使突然停下\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">cause to come to a sudden stop\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：The noise brought her up in shock\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:32:06::\">\u003cstrong>6. 提出以供考虑或讨论\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">put forward for consideration or discussion\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：raise the question of promotions\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：bring up an unpleasant topic\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s something / Something ----s somebody / Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"bring_up%2:32:00::\">\u003cstrong>7. 提到、提及\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make reference to\u003c/span>\ cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">perform in a perfunctory way, as for a first rehearsal\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003carticle data-dictionary-entry=\"wiktionary-walk-through/v\">\u003ch3>walk through \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en.wiktionary.org/w/index.php?title=walk_through&amp;oldid=90044525\">Wiktionary contributors · revision 90044525\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词形〔来源列出〕：walks through · walking through · walked through\u003c/p>\u003cp data-dictionary-sense=\"wikt-walk-through-90044525-1\">\u003cstrong>1. 向某人一步一步讲解某件事\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>idiomatic · transitive\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">To explain (something) to (someone), step by step.\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词典例句：On my first day at work, the secretary walked me through the process of using the photocopier.\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"wikt-walk-through-90044525-2\">\u003cstrong>2. 粗略排练、简单演练\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>idiomatic · transitive\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">To rehearse (something) casually.\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"wikt-walk-through-90044525-3\">\u003cstrong>3. 轻松地或敷衍地完成某事\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan>idiomatic · transitive\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">To perform (something) with ease or perfunctorily.\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"wikt-walk-through-90044525-4\">\u003cstrong>4. 字面组合用法，分别参见walk和through；走着穿过\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">Used other than figuratively or idiomatically: see walk, through.\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":5},"x":{"short":"逐步讲解","cue":"当前用法","b":"walk someone through something 是带着对方一步一步了解过程。本句要求对方把修订后的计划讲一遍，重点是让听者跟上各步骤，而不只是说计划已经改好了。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","walk 的“步行”用法在中古英语已有记录，更早相关形式的意义并不完全等于今天的走路。这里仅说明组成词背景；不能据此编出 walk someone through 某一年从走路变成讲解的故事。","https://www.etymonline.com/word/walk"],["用现代联系帮助理解","可以想成你陪一个人沿流程走一遍：不是只指终点，而是一路说明每一步。through 给出从头到尾经过的图像；在工作表达里，实际动作是讲解或演示，不必真的走路。","https://www.oxfordlearnersdictionaries.com/definition/english/walk-through_1"],["回到当前句子","walk someone through something 是带着对方一步一步了解过程。本句要求对方把修订后的计划讲一遍，重点是让听者跟上各步骤，而不只是说计划已经改好了。","https://www.oxfordlearnersdictionaries.com/definition/english/walk-through_1"]]}},{"w":{"id":"V20261012-064","date":"2026-10-12","term":"point out","ipa":"pɔɪnt aʊt","pos":"短语动词","meaning":"指出容易被忽略的事实或问题","chunk":"point out a difference","example":"Let me point out one difference between the two options.","level":"核心","gloss":"指出","explanation":"指出容易被忽略的事实或问题","examples":[{"en":"Let me point out one difference between the two options.","zh":"让我指出两个方案间的一处差异。"},{"en":"He pointed out a missing signature.","zh":"他指出少了一个签名。","kind":"existing_public_learning_example"}]},"a":{"context":{"text":"Let me point out one difference between the two options.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“你看这里”帮助记住 point out 的提醒功能，动作未必真的用手指。搭配 point out a difference，把注意力放在信息上；它不等于只说 point，后者单独使用容易让人想到指向位置。","sourceIds":["lex","grammar"],"claimIds":["lexical","connection"],"requirements":{"anchor":"用“你看这里”帮助记住 point out 的提醒功能，动作未必真的用手指。","explanation":"搭配 point out a difference，把注意力放在信息上；","example":"point out ","boundary":"它不等于只说 point，后者单独使用容易让人想到指向位置。"},"sources":[["Oxford · point out","https://www.oxfordlearnersdictionaries.com/definition/english/point-out"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g2","title":"句法与概念","text":"Let me point out 是引出自己要说明的内容；one difference 是对象，between the two options 限定比较双方。point out 也可接 that 从句。整句只预告指出一处不同，差异是什么还要看随后的说明。","sourceIds":["lex","grammar"],"claimIds":["syntax"],"requirements":{"anchor":"Let me point out 是引出自己要说明的内容；","explanation":"one difference 是对象，between the two options 限定比较双方。","example":"Let me point out ","boundary":"整句只预告指出一处不同，差异是什么还要看随后的说明。"},"sources":[["Oxford · point out","https://www.oxfordlearnersdictionaries.com/definition/english/point-out"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"mention 可以只是顺带提到，point out 更突出“请注意这一点”。比如顺便提及有两个选项是 mention；明确指出两者保修期不同，就适合 point out。point out that… 后面还能接完整事实。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"mention 可以只是顺带提到，point out 更突出“请注意这一点”。","explanation":"比如顺便提及有两个选项是 mention；","example":"mention ","boundary":"point out that… 后面还能接完整事实。"},"sources":[["Oxford · point out","https://www.oxfordlearnersdictionaries.com/definition/english/point-out"]]},{"id":"g4","title":"这句话在做什么","text":"Let me 为接下来的说明取得发言空间，one difference 限定这次要指出的内容。自编回应：Which difference should we focus on?（我们该重点看哪一点区别？）说话者随后就应给出具体差异，让选择有依据。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"Let me 为接下来的说明取得发言空间，one difference 限定这次要指出的内容。","explanation":"自编回应：Which difference should we focus on?（我们该重点看哪一点区别？）说话者随后就应给出具体差异，让选择有依据。","example":"Let me ","boundary":"自编回应：Which difference should we focus on?（我们该重点看哪一点区别？）说话者随后就应给出具体差异，让选择有依据。"},"sources":[["Oxford · point out","https://www.oxfordlearnersdictionaries.com/definition/english/point-out"]]},{"id":"g5","title":"工作中可以这样说","text":"自编工作表达：I'd like to point out that the quote excludes shipping.（我想提醒一下，报价不含运费。）适合发现讨论遗漏重要条件时。先指出可核对的信息，再讨论影响；这句本身没有责怪报价方，也没有决定是否接受报价。","sourceIds":["lex"],"claimIds":["transfer"],"requirements":{"anchor":"自编工作表达：I'd like to point out that the quote excludes shipping.（我想提醒一下，报价不含运费。","explanation":"）适合发现讨论遗漏重要条件时。","example":"I'd like to point out that the quote excludes shipping","boundary":"这句本身没有责怪报价方，也没有决定是否接受报价。"},"sources":[["Oxford · point out","https://www.oxfordlearnersdictionaries.com/definition/english/point-out"]]}]},"p":{"displayGloss":"指出","focused":[{"entry":{"lemma":"point out","pos":"短语动词","senses":[{"id":"point-out:current","glossZh":"提醒别人注意某条信息或细节","definitionEn":"draw someone's attention to information or a detail","sourceIds":["lex"]}],"source":"有据原创教学转述"},"sense":{"id":"point-out:current","glossZh":"提醒别人注意某条信息或细节","definitionEn":"draw someone's attention to information or a detail","sourceIds":["lex"]}},{"entry":{"lemma":"point","pos":"v. · 组词联系","senses":[{"id":"point:component","glossZh":"指向；示意某人看哪里；整体短语义见上","definitionEn":"direct a finger or object towards something to show it","sourceIds":["component"]}],"source":"组成词基础义，不机械推出整体义"},"sense":{"id":"point:component","glossZh":"指向；示意某人看哪里；整体短语义见上","definitionEn":"direct a finger or object towards something to show it","sourceIds":["component"]}}],"allEntries":[{"lemma":"point out","pos":"短语动词","senses":[{"id":"point-out:extra","glossZh":"指出某人或某物的位置供辨认","definitionEn":"show which person or object is meant by indicating it","sourceIds":["lex"]}],"source":"有据原创教学转述"}],"contextTakeaway":"将注意力引向两个方案之间的一处差异。","dictionaryHtml":"\u003carticle data-learner-dictionary=\"V20261012-064\">\u003ch3>point out · 常用义与用法\u003c/h3>\u003cp class=\"source\">根据学习词典核对整理；释义为本项目中文概述，例句及译文为自编。下方保留许可来源的英语原文。\u003c/p>\u003cp data-learner-sense=\"point-out-learner-1\">\u003cstrong>1. 向别人说明某个事实或问题，提醒其注意。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：point something out to someone; point out that; point it out\u003cbr>\u003cspan class=\"en\" lang=\"en\">She pointed out that the dates on the form were wrong.\u003c/span>\u003cbr>她指出表格上的日期有误。\u003c/p>\u003cp data-learner-sense=\"point-out-learner-2\">\u003cstrong>2. 用手指等指出某人或某物所在的位置。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：point someone/something out\u003cbr>\u003cspan class=\"en\" lang=\"en\">He pointed out his house on the hillside.\u003c/span>\u003cbr>他指了指山坡上的自家房子。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/point-out\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>point out \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/point%20out\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"point_out%2:32:01::\">\u003cstrong>1. 对某事作口头或书面评论\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make or write a comment on\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he commented the paper of his colleague\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"point_out%2:32:03::\">\u003cstrong>2. 仔细而清楚地指出\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">point out carefully and clear 决定信息方向，少看一个 cannot，就会把风险判断完全读反。","sourceIds":["lex","grammar"],"claimIds":["lexical","connection"],"requirements":{"anchor":"把 rule out 和“从可能清单里划掉”联系起来，这是记忆类比。","explanation":"再反过来记 cannot rule out：现在还不能划掉。","example":"rule out ","boundary":"否定词决定信息方向，少看一个 cannot，就会把风险判断完全读反。"},"sources":[["Oxford · rule out","https://www.oxfordlearnersdictionaries.com/definition/english/rule-out"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g2","title":"句法与概念","text":"cannot 否定 rule out，a delay 是不能排除的情况，at this stage 限定为现阶段。句子保留延误的可能性，却没有提供概率；因此不能换成“很可能延误”或“肯定延误”，两者都比原句更强。","sourceIds":["lex","grammar"],"claimIds":["syntax"],"requirements":{"anchor":"cannot 否定 rule out，a delay 是不能排除的情况，at this stage 限定为现阶段。","explanation":"句子保留延误的可能性，却没有提供概率；","example":"cannot ","boundary":"因此不能换成“很可能延误”或“肯定延误”，两者都比原句更强。"},"sources":[["Oxford · rule out","https://www.oxfordlearnersdictionaries.com/definition/english/rule-out"],["British Council · Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"unlikely 是可能性低，ruled out 是已被排除，两者力度不同。比如某种故障很少见，可以说 unlikely；证据确认不是它，才可以 rule it out。cannot rule out 也不同于 expect：前者保留可能，后者表示预期。","sourceIds":["lex"],"claimIds":["contrast"],"requirements":{"anchor":"unlikely 是可能性低，ruled out 是已被排除，两者力度不同。","explanation":"比如某种故障很少见，可以说 unlikely；","example":"unlikely ","boundary":"cannot rule out 也不同于 expect：前者保留可能，后者表示预期。"},"sources":[["Oxford · rule out","https://www.oxfordlearnersdictionaries.com/definition/english/rule-out"]]},{"id":"g4","title":"这句话在做什么","text":"cannot 与 at this stage 一起限定了判断：以目前信息，还不能排除延误。自编回应：What do we need to check before updating the schedule?（更新排期前还要核查什么？）这把保留风险转成核查行动，而不是直接宣布延期。","sourceIds":["lex"],"claimIds":["pragmatics"],"requirements":{"anchor":"cannot 与 at this stage 一起限定了判断：以目前信息，还不能排除延误。","explanation":"自编回应：What do we need to check before updating the schedule?（更新排期前 003c/p>\u003cp data-learner-sense=\"rule-out-learner-1\">\u003cstrong>1. 排除某种可能、选择或人选，不再考虑。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：rule something/someone out; rule out doing\u003cbr>\u003cspan class=\"en\" lang=\"en\">The doctor ruled out an infection.\u003c/span>\u003cbr>医生排除了感染的可能。\u003c/p>\u003cp data-learner-sense=\"rule-out-learner-2\">\u003cstrong>2. 使某种行动或结果不可能发生。\u003c/strong>\u003cbr>\u003csmall>短语动词〔可分开〕\u003c/small>\u003cbr>用法：rule out the possibility of; rule someone out of\u003cbr>\u003cspan class=\"en\" lang=\"en\">The injury ruled him out of the final.\u003c/span>\u003cbr>伤病使他无法参加决赛。\u003c/p>\u003cp class=\"source\">查阅来源：\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://www.oxfordlearnersdictionaries.com/definition/english/rule-out\">Oxford 1\u003c/a>\u003c/p>\u003c/article>\u003ch3>来源词典原文\u003c/h3>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>rule out \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/rule%20out\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp data-dictionary-sense=\"rule_out%2:42:00::\">\u003cstrong>1. 使不可能，尤其是事先排除可能性\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">make impossible, especially beforehand\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"rule_out%2:33:00::\">\u003cstrong>2. 通过司法判断或依照规则决定纳入或排除\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">include or exclude by determining judicially or in agreement with rules\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"rule_out%2:31:00::\">\u003cstrong>3. 不再考虑，或从竞赛中排除\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">dismiss from consideration or a contest\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：John was ruled out as a possible suspect because he had a strong alibi\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：This possibility can be eliminated from our consideration\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody / Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>","dictionaryCount":3},"x":{"short":"排除","cue":"当前用法","b":"cannot rule out 表示现在还不能排除一种可能。本句保留“可能延误”这个风险，但没有说延误一定发生或概率很高；它提醒大家别过早把风险当作不存在。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[["历史来源与边界","rule 的来历与拉丁语 regula 有关，既涉及直尺，也涉及准则。英语的 rule 又有裁定、决定等用法；这些是组成词的历史，不能直接当作 rule out 排除义的完整起源证明。","https://www.etymonline.com/word/rule"],["用现代联系帮助理解","可以把候选解释想成一张清单：rule out 是把某项排除，不再把它当可行解释或可能选项。这个清单只是学习图像，不是说英语历史上一定先有划掉清单的动作。","https://www.oxfordlearnersdictionaries.com/definition/english/rule-out"],["回到当前句子","cannot rule out 表示现在还不能排除一种可能。本句保留“可能延误”这个风险，但没有说延误一定发生或概率很高；它提醒大家别过早把风险当作不存在。","https://www.oxfordlearnersdictionaries.com/definition/english/rule-out"]]}},{"w":{"id":"V20261012-066","date":"2026-10-12","term":"hold off","ipa":"həʊld ɒf","pos":"短语动词","meaning":"暂缓行动，等待更合适的条件","chunk":"hold off on a decision","example":"Let's hold off on the decision until we have the results.","level":"提升","gloss":"暂缓","explanation":"暂缓行动，等待更合适的条件","examples":[{"en":"Let's hold off on the decision until we have the results.","zh":"等拿到结果后，我们再作决定吧。"},{"en":"Hold off on hiring until June.","zh":
