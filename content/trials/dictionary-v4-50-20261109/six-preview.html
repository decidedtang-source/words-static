<script>const cards=[{"cardId":"V20261012-015","term":"ownership","kind":"original50","writer":"v4-author","word":{"id":"V20261012-015","date":"2026-10-12","term":"ownership","ipa":"ˈəʊnəʃɪp","pos":"n.","meaning":"对事项负责并推动到结果的责任归属","chunk":"take ownership","example":"Who will take ownership of this open item?","level":"核心","gloss":"责任归属","explanation":"对事项负责并推动到结果的责任归属","examples":[{"en":"Who will take ownership of this open item?","zh":"谁来负责推进这项未结事项？"},{"en":"Clear ownership prevents duplicated work.","zh":"明确责任归属可避免重复工作。","kind":"existing_public_learning_example"}]},"context":{"text":"Who will take ownership of this open item?","kind":"existing_public_learning_example"},"dictionary":{"cardId":"V20261012-015","term":"ownership","writer":"v4-author","sources":["https://www.oxfordlearnersdictionaries.com/definition/english/ownership"],"scope":"Common learner meanings and usage, with separately preserved full licensed source entries; not an exhaustive dictionary merger","senses":[{"id":"ownership-learner-1","pos":"名词〔不可数〕","meaning":"拥有某项财产或事物的状态或权利。","usage":"ownership of; transfer ownership","example":{"en":"Ownership of the building changed last year.","zh":"这栋楼的所有权去年发生了变更。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]},{"id":"ownership-learner-2","pos":"名词〔不可数，工作用语〕","meaning":"对某项工作或问题承担责任并主动推动处理。","usage":"take ownership of","example":{"en":"The new manager took ownership of the unresolved complaints.","zh":"新经理接手负责处理尚未解决的投诉。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]}],"contextSenseId":"ownership-learner-2","context":"Who will take ownership of this open item?","bridgeText":"ownership 首先指某物归谁所有。工作中的 take ownership 借用“把它当作自己负责的事”这一联系：接手者主动跟进结果，而不只是完成别人交办的一步。因此询问谁 take ownership，是找负责推进的人，不是转让财产权。"},"bridge":{"text":"ownership 首先指某物归谁所有。工作中的 take ownership 借用“把它当作自己负责的事”这一联系：接手者主动跟进结果，而不只是完成别人交办的一步。因此询问谁 take ownership，是找负责推进的人，不是转让财产权。","mode":"semantic","reason":"基础概念与当前用法存在明确现代联系。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"成组记 take ownership of a task（主动负责）与 transfer ownership of a house（转让所有权）。遇到 of 后的对象，先判断谈的是任务还是财产；这是搭配检索线索。","sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]},{"id":"g2","title":"句法与概念","text":"Who will take ownership of this open item? 中 Who 是主语，will take 是谓语，of this open item 说明负责的对象。open item 是尚待处理的事项，不是“打开的物品”；will 在这里问接下来的安排。","sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]},{"id":"g3","title":"辨析与英文邻居","text":"responsibility 可以是分配给某人的职责；take ownership 常突出主动跟进。accountability 强调需要说明结果、接受追问。三者可能落在同一个人身上，词本身不决定组织的权限或责任矩阵。","sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]},{"id":"g4","title":"这句话在做什么","text":"这句问话要求把待办落实到负责人。只回答“有人在看”仍没有明确谁接手；可回应：I’ll take it and report back on Friday. 这是可行回应，不是原句已经承诺了周五交付。","sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]},{"id":"g5","title":"工作中可以这样说","text":"主动接手可说：I’ll take ownership of the follow-up and update you tomorrow.（我来负责后续，明天向你更新。）将 follow-up 换成 customer complaint；如果还缺权限，可补：I’ll need approval before making changes.","sources":[["Oxford — ownership","https://www.oxfordlearnersdictionaries.com/definition/english/ownership"]]}],"scenario":"例如质量与物流都参与处理一次退货：可以由一人负责汇总进度，检验与运输仍交给相应同事。接手后应问清自己能决定什么、何时需升级处理；主动负责并不自动获得全部审批权限。","exploration":[["有记录的历史来源","ownership由owner与表示状态或身份的-ship组成，早期指作为所有者的状态或权利。工作中“接下责任”的现代用法与所有权有关联，但并不表示你拥有这项工作的法律产权。","https://www.etymonline.com/word/ownership"]],"contextTakeaway":"要明确谁跟进这项未结事项。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"ownership-learner-1\">\u003csmall>名词〔不可数〕\u003c/small>\u003cp>\u003cstrong>拥有某项财产或事物的状态或权利。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>ownership of; transfer ownership\u003c/p>\u003cp lang=\"en\">Ownership of the building changed last year.\u003c/p>\u003cp>这栋楼的所有权去年发生了变更。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/ownership\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"ownership-learner-2\">\u003csmall>名词〔不可数，工作用语〕\u003c/small>\u003cp>\u003cstrong>对某项工作或问题承担责任并主动推动处理。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>take ownership of\u003c/p>\u003cp lang=\"en\">The new manager took ownership of the unresolved complaints.\u003c/p>\u003cp>新经理接手负责处理尚未解决的投诉。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/ownership\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails data-source-inventory>\u003csummary>完整来源词典与收录范围\u003c/summary>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>ownership \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/ownership\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：US /ˈoʊnɚʃɪp/ · GB /ˈəʊnəʃɪp/\u003c/p>\u003cp data-dictionary-sense=\"ownership%1:21:00::\">\u003cstrong>1. 所有人与所拥有物之间的关系，包含转让占有的权利；所有权\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the relation of an owner to the thing possessed; possession with the right to transfer possession to others\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"ownership%1:04:00::\">\u003cstrong>2. 拥有并控制财产的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of having and controlling property\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"ownership%1:26:00::\">\u003cstrong>3. 身为所有人的状态或事实\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the state or fact of being an owner\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>\u003c/details>\u003c/section>"},{"cardId":"V20261012-049","term":"align","kind":"original50","writer":"v4-author","word":{"id":"V20261012-049","date":"2026-10-12","term":"align","ipa":"/əˈlaɪn/","pos":"v.","meaning":"使目标、理解或安排彼此一致","chunk":"align on priorities","example":"We need to align on priorities before assigning the work.","level":"提升","gloss":"使一致；协调","explanation":"使目标、理解或安排彼此一致","examples":[{"en":"We need to align on priorities before assigning the work.","zh":"分配工作前，我们需要就优先级达成一致。"},{"en":"Align the forecast with actual orders.","zh":"使预测与实际订单相符。","kind":"existing_public_learning_example"}]},"context":{"text":"We need to align on priorities before assigning the work.","kind":"existing_public_learning_example"},"dictionary":{"cardId":"V20261012-049","term":"align","writer":"v4-author","sources":["https://www.oxfordlearnersdictionaries.com/definition/english/align","https://www.oxfordlearnersdictionaries.com/definition/english/align-yourself-with"],"scope":"Common learner meanings and usage, with separately preserved full licensed source entries; not an exhaustive dictionary merger","senses":[{"id":"align-learner-1","pos":"动词〔及物或不及物〕","meaning":"排成直线，或调整到正确的相对位置。","usage":"align A with B; align the wheels","example":{"en":"Align the edge of the paper with the guide.","zh":"把纸的边缘与导向标记对齐。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/align"]},{"id":"align-learner-2","pos":"动词〔及物或不及物〕","meaning":"使目标、做法等相互一致或协调。","usage":"align something with; be aligned with; align on a topic〔工作交流〕","example":{"en":"The course content is aligned with the exam requirements.","zh":"课程内容与考试要求相一致。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/align"]},{"id":"align-learner-3","pos":"动词","meaning":"公开支持某一群体或立场，与其站在一起。","usage":"align oneself with","example":{"en":"He refused to align himself with either faction.","zh":"他拒绝加入任何一派。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/align-yourself-with"]}],"contextSenseId":"align-learner-2","context":"We need to align on priorities before assigning the work.","bridgeText":"把物体 align，是让它们的位置或方向对得上。用于目标与行动时，共同点是彼此协调，而非各朝一个方向。因此 align on priorities 是对优先顺序形成共同理解，不要求大家在所有问题上意见完全相同。"},"bridge":{"text":"把物体 align，是让它们的位置或方向对得上。用于目标与行动时，共同点是彼此协调，而非各朝一个方向。因此 align on priorities 是对优先顺序形成共同理解，不要求大家在所有问题上意见完全相同。","mode":"semantic","reason":"基础概念与当前用法存在明确现代联系。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"把 align with（与……协调）和 align on（就……达成一致）分开记：with 后常接参照对象，on 后接讨论事项。检索线索是“与谁/什么一致”和“就什么一致”。","sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g2","title":"句法与概念","text":"We need to align on priorities 中 align 不带直接宾语，on priorities 指要协调的事项；before assigning the work 给出分工前的步骤。对比 align our plans with the budget，此处 our plans 是被调整的对象。","sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g3","title":"辨析与英文邻居","text":"agree 常用于同意某个判断或方案；align 强调目标、理解或行动相协调；coordinate 强调安排彼此配合。团队可能 agree that testing matters，却仍需要 coordinate the test schedule；并非说过 agree 就完成了安排。","sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g4","title":"这句话在做什么","text":"We need to 把协调优先级提出为分工的前提。它可能是在发现分歧后要求讨论，但句子本身不证明已经争执。可回应：Do we agree that testing comes first? 用一个具体次序检验是否已有共同理解。","sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]},{"id":"g5","title":"工作中可以这样说","text":"分工前可说：Could we align on the next steps before we proceed?（继续前，我们能否就下一步达成一致？）把 next steps 换成 priorities；若是校准方案与预算的关系，则说 We need to align the plan with the budget.","sources":[["Oxford Learner’s Dictionaries · align","https://www.oxfordlearnersdictionaries.com/definition/english/align"]]}],"scenario":"例如两人都说“质量优先”，一人准备补测试，另一人准备改设计。会议可以把优先顺序写成明确行动，再核对所需资源。共同口号未必足以指导分工；场景中的办法是教学建议，不是 align 一词自带的管理规则。","exploration":[["词源线索","align 来自法语表示排成一线的词形，词根与 ligne、拉丁语 linea（线）有关。实体对齐是历史线索，工作上的目标一致则需要依据现代用法理解。","https://www.etymonline.com/word/align"]],"contextTakeaway":"先统一优先级，再分配工作。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"align-learner-1\">\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cp>\u003cstrong>排成直线，或调整到正确的相对位置。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>align A with B; align the wheels\u003c/p>\u003cp lang=\"en\">Align the edge of the paper with the guide.\u003c/p>\u003cp>把纸的边缘与导向标记对齐。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/align\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"align-learner-2\">\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cp>\u003cstrong>使目标、做法等相互一致或协调。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>align something with; be aligned with; align on a topic〔工作交流〕\u003c/p>\u003cp lang=\"en\">The course content is aligned with the exam requirements.\u003c/p>\u003cp>课程内容与考试要求相一致。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/align\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"align-learner-3\">\u003csmall>动词\u003c/small>\u003cp>\u003cstrong>公开支持某一群体或立场，与其站在一起。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>align oneself with\u003c/p>\u003cp lang=\"en\">He refused to align himself with either faction.\u003c/p>\u003cp>他拒绝加入任何一派。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/align-yourself-with\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails data-source-inventory>\u003csummary>完整来源词典与收录范围\u003c/summary>\u003carticle data-dictionary-entry=\"oewn-2025/v\">\u003ch3>align \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/align\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /əˈlaɪn/\u003c/p>\u003cp data-dictionary-sense=\"align%2:30:00::\">\u003cstrong>1. 排成一直线，或调整成平行、笔直的状态\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">place in a line or arrange so as to be parallel or straight\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the car with the curb\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the sheets of paper on the table\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:42:00::\">\u003cstrong>2. 与某事物相适应或相吻合\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">be or come into adjustment with\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Something is ----ing PP\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:31:00::\">\u003cstrong>3. 使自己与某个群体或思想方式站在一起\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">align oneself with a group or a way of thinking\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s somebody\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"align%2:30:01::\">\u003cstrong>4. 使部件或部分达到适当的协调关系\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">bring (components or parts) into proper or desirable coordination correlation\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：align the wheels of my car\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：ordinate similar parts\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">源句型〔----为动词占位〕：Somebody ----s something\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>\u003c/details>\u003c/section>"},{"cardId":"V20261012-053","term":"reservation","kind":"original50","writer":"v4-author","word":{"id":"V20261012-053","date":"2026-10-12","term":"reservation","ipa":"/ˌrezəˈveɪʃn/","pos":"n.","meaning":"尚未消除的保留意见或疑虑","chunk":"have reservations about","example":"I have reservations about committing before the review.","level":"提升","gloss":"保留意见；疑虑","explanation":"尚未消除的保留意见或疑虑","examples":[{"en":"I have reservations about committing before the review.","zh":"在评审前作出承诺，我有保留意见。"},{"en":"She expressed reservations about the estimate.","zh":"她对估算表达了疑虑。","kind":"existing_public_learning_example"}]},"context":{"text":"I have reservations about committing before the review.","kind":"existing_public_learning_example"},"dictionary":{"cardId":"V20261012-053","term":"reservation","writer":"v4-author","sources":["https://www.oxfordlearnersdictionaries.com/definition/english/reservation"],"scope":"Common learner meanings and usage, with separately preserved full licensed source entries; not an exhaustive dictionary merger","senses":[{"id":"reservation-learner-1","pos":"名词〔可数〕","meaning":"为住宿、座位等提前作出的预订。","usage":"make / cancel a reservation","example":{"en":"I made a reservation for two at seven o’clock.","zh":"我预订了七点的两人位。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]},{"id":"reservation-learner-2","pos":"名词〔可数或不可数；可数时通常用复数〕","meaning":"使人不能完全接受某事的疑虑或保留意见。","usage":"have reservations about; without reservation","example":{"en":"She has reservations about moving so far away.","zh":"她对搬到那么远的地方有所顾虑。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]},{"id":"reservation-learner-3","pos":"名词〔可数，美国用法〕","meaning":"美国为原住民保留的地区。","usage":"a reservation; a Native American reservation","example":{"en":"The museum explains the history of the reservation.","zh":"博物馆介绍了这片原住民保留地的历史。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/reservation"],"extended":true}],"contextSenseId":"reservation-learner-2","context":"I have reservations about committing before the review.","bridgeText":"reserve 有保留、留存的意思。对方案 have reservations，可以理解为仍保留疑虑，尚未把赞同全部给出去。这帮助理解“有保留”，不等于把订座的意思搬进会议：说话者未必反对，但有一些问题妨碍他完全接受。"},"bridge":{"text":"reserve 有保留、留存的意思。对方案 have reservations，可以理解为仍保留疑虑，尚未把赞同全部给出去。这帮助理解“有保留”，不等于把订座的意思搬进会议：说话者未必反对，但有一些问题妨碍他完全接受。","mode":"semantic","reason":"基础概念与当前用法存在明确现代联系。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"记 have reservations about 加担心的对象；再用 without reservation（毫无保留地）形成对照。预订则常用 make a reservation，动词搭配和单复数能帮助迅速辨义。","sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g2","title":"句法与概念","text":"I have reservations about committing before the review. 中 about 后接 committing 这个动名词；before the review 修饰作出承诺的时间。顾虑指向“评审前承诺”这件事，句子没有说明承诺的具体内容。","sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g3","title":"辨析与英文邻居","text":"concern 可以泛指担心或关切；reservation 侧重不能完全接受的保留意见；objection 更直接提出反对理由。表达的强弱仍取决于上下文，reservations 不能自动当作最终赞成。","sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g4","title":"这句话在做什么","text":"这句表达了对承诺时点的顾虑，可能希望先讨论问题，但不证明说话者已停止承诺。可问：What would you need to see before committing?（承诺前你需要看到什么？）这样把保留意见转成可澄清的条件，而不是直接把人归为反对方。","sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]},{"id":"g5","title":"工作中可以这样说","text":"需要保留意见可说：I support the direction, but I have reservations about the timeline.（我支持这个方向，但对时间安排有顾虑。）把 timeline 换成 cost estimate；确实完全认可时才说 I support it without reservation.","sources":[["Oxford Learner’s Dictionaries · reservation","https://www.oxfordlearnersdictionaries.com/definition/english/reservation"]]}],"scenario":"例如同事支持采购方向，却担心交期承诺没有依据。可以先确认担心的是哪项证据，并约定拿到交期确认后再讨论承诺。保留意见并不说明顾虑一定合理，也不能代替补充事实。","exploration":[["词源线索","reservation 的词源与拉丁语 reservare（留住、保留）相连。保留条件或疑虑与预订都是历史中记录的用法，不能把疑虑义说成由酒店预订直接产生。","https://www.etymonline.com/word/reservation"]],"contextTakeaway":"对评审前承诺仍有疑虑。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"reservation-learner-1\">\u003csmall>名词〔可数〕\u003c/small>\u003cp>\u003cstrong>为住宿、座位等提前作出的预订。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>make / cancel a reservation\u003c/p>\u003cp lang=\"en\">I made a reservation for two at seven o’clock.\u003c/p>\u003cp>我预订了七点的两人位。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/reservation\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"reservation-learner-2\">\u003csmall>名词〔可数或不可数；可数时通常用复数〕\u003c/small>\u003cp>\u003cstrong>使人不能完全接受某事的疑虑或保留意见。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>have reservations about; without reservation\u003c/p>\u003cp lang=\"en\">She has reservations about moving so far away.\u003c/p>\u003cp>她对搬到那么远的地方有所顾虑。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/reservation\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails>\u003csummary>更多常用及专业义（1）\u003c/summary>\u003carticle data-learner-sense=\"reservation-learner-3\">\u003csmall>名词〔可数，美国用法〕\u003c/small>\u003cp>\u003cstrong>美国为原住民保留的地区。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a reservation; a Native American reservation\u003c/p>\u003cp lang=\"en\">The museum explains the history of the reservation.\u003c/p>\u003cp>博物馆介绍了这片原住民保留地的历史。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/reservation\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003c/details>\u003cdetails data-source-inventory>\u003csummary>完整来源词典与收录范围\u003c/summary>\u003carticle data-dictionary-entry=\"oewn-2025/n\">\u003ch3>reservation \u003csmall>名词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en-word.net/lemma/reservation\">Open English WordNet 2025／Princeton WordNet\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词典发音：GB /ˌɹɛzəˈveɪʃən/ · US /ˌɹɛzɚˈveɪʃən/\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:15:00::\">\u003cstrong>1. 划作特定用途的地区；保留地\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a district that is reserved for particular purpose\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:10:00::\">\u003cstrong>2. 限制某项主张适用范围的声明；保留条款\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">a statement that limits or restricts some claim\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：he recommended her without any reservations\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:09:00::\">\u003cstrong>3. 使人无法全心接受某事、尚未说出的疑虑\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">an unstated doubt that prevents you from accepting something wholeheartedly\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:04:01::\">\u003cstrong>4. 预订位置、旅程或人员服务的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of reserving (a place or passage) or engaging the services of (a person or group)\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">同义词集例句〔未必使用本词〕：wondered who had made the booking\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:10:01::\">\u003cstrong>5. 保证预先安排住宿等事项的书面记录或承诺\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the written record or promise of an arrangement by which accommodations are secured in advance\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:09:01::\">\u003cstrong>6. 事先订妥的住宿、机位等\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">something reserved in advance (as a hotel accommodation or a seat on a plane etc.)\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"reservation%1:04:00::\">\u003cstrong>7. 为将来某个场合保留或留出某物的行为\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">the act of keeping back or setting aside for some future occasion\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>\u003c/details>\u003c/section>"},{"cardId":"V20261012-067","term":"work around","kind":"original50","writer":"v4-author","word":{"id":"V20261012-067","date":"2026-10-12","term":"work around","ipa":"wɜːk əˈraʊnd","pos":"短语动词","meaning":"在限制仍存在时找到可行做法","chunk":"work around a constraint","example":"Can we work around this constraint without changing the scope?","level":"提升","gloss":"设法绕过障碍","explanation":"在限制仍存在时找到可行做法","examples":[{"en":"Can we work around this constraint without changing the scope?","zh":"我们能在不改范围的情况下应对这项限制吗？"},{"en":"We worked around the storage limitation.","zh":"我们设法绕开存储限制，让工作继续进行。","kind":"existing_public_learning_example"}]},"context":{"text":"Can we work around this constraint without changing the scope?","kind":"existing_public_learning_example"},"dictionary":{"cardId":"V20261012-067","term":"work around","writer":"v4-author","sources":["https://www.oxfordlearnersdictionaries.com/definition/english/work-around"],"scope":"Common learner meanings and usage, with separately preserved full licensed source entries; not an exhaustive dictionary merger","senses":[{"id":"work-around-learner-1","pos":"短语动词","meaning":"在障碍仍存在时改变做法，使事情能够继续。","usage":"work around a problem / limitation; 名词workaround通常连写","example":{"en":"We worked around the road closure by taking a different route.","zh":"道路封闭后，我们改走另一条路。","kind":"authored_example"},"sourceUrls":["https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]}],"contextSenseId":"work-around-learner-1","context":"Can we work around this constraint without changing the scope?","bridgeText":"around 可以表示从旁边绕过障碍。work around a problem 也把问题当成限制路径的障碍：改变做法，从另一条路继续，而不是把障碍本身消除。因此原句问的是能否绕开限制，不能据此说限制已经解决。"},"bridge":{"text":"around 可以表示从旁边绕过障碍。work around a problem 也把问题当成限制路径的障碍：改变做法，从另一条路继续，而不是把障碍本身消除。因此原句问的是能否绕开限制，不能据此说限制已经解决。","mode":"semantic","reason":"基础概念与当前用法存在明确现代联系。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"把动词 work around a limitation 与名词 a workaround 成对记。前者说“怎样做”，后者给替代办法命名；workaround 通常连写，不要把名词直接放进 can 后当动词。","sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g2","title":"句法与概念","text":"Can we work around this constraint without changing the scope? 中 constraint 接在 around 后；without 后用 changing，表示继续工作时要满足“不改变范围”的条件。问题同时检查办法和边界。","sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"],["Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"solve a problem 通常表示解决问题本身；work around it 表示避开限制以便继续；ignore it 则只是不理会。绕行可能可用，也可能代价更高，需要检验，不能把 workaround 等同于可靠的最终修复。","sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g4","title":"这句话在做什么","text":"Can we 邀请提出办法，并把范围不变作为约束。可先问：Which part of the process is blocked?（流程的哪一部分受阻？）再核对替代做法是否仍交付约定成果。这是在共同检查可行性，不是原句已批准某个办法。","sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g5","title":"工作中可以这样说","text":"系统暂时受限时可说：We can work around the upload limit by splitting the file.（我们可以把文件拆开，绕过上传限制。）by 后替换为可验证的做法；需要彻底修复时说 We still need to fix the underlying issue.","sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]}],"scenario":"例如报表接口暂时故障，团队改用获准的手工导出流程。继续工作前仍需核对权限、字段是否完整以及何时恢复接口；替代流程不能自动被当作最终修复，也不是可以绕过必要控制的许可。","exploration":[["历史范围：先分清词与短语","work 是古英语传下来的动词，与做事、制作和运作有关。不过，work 的历史不能直接证明 work around 这个短语何时出现；这次不编造整词组的起源年代。","https://www.etymonline.com/word/work"]],"contextTakeaway":"寻找不改范围、仍能应对限制的办法。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"work-around-learner-1\">\u003csmall>短语动词\u003c/small>\u003cp>\u003cstrong>在障碍仍存在时改变做法，使事情能够继续。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>work around a problem / limitation; 名词workaround通常连写\u003c/p>\u003cp lang=\"en\">We worked around the road closure by taking a different route.\u003c/p>\u003cp>道路封闭后，我们改走另一条路。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.oxfordlearnersdictionaries.com/definition/english/work-around\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails data-source-inventory>\u003csummary>完整来源词典与收录范围\u003c/summary>\u003carticle data-dictionary-entry=\"wiktionary-work-around/v\">\u003ch3>work around \u003csmall>动词\u003c/small>\u003c/h3>\u003cp class=\"source\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://en.wiktionary.org/w/index.php?title=work_around&amp;oldid=92736210\">Wiktionary contributors · revision 92736210\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0\u003c/a> · \u003ca href=\"SOURCE-NOTICE.html\" target=\"_blank\" rel=\"noopener\">来源、范围与版权声明\u003c/a>\u003c/p>\u003cp>词形〔来源列出〕：works around · working around · worked around\u003c/p>\u003cp>变体：work round\u003c/p>\u003cp data-dictionary-sense=\"wikt-work-around-92736210-1\">\u003cstrong>1. 字面组合用法，分别参见work和around；例句中指在拐角附近的鱼店工作\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">Used other than figuratively or idiomatically: see work, around.\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词典例句：He works around the corner in the fish shop.\u003c/span>\u003c/p>\u003cp data-dictionary-sense=\"wikt-work-around-92736210-2\">\u003cstrong>2. 绕过问题或障碍，另找办法继续进行\u003c/strong>\u003cbr>\u003csmall>本项目中文译释\u003c/small>\u003cbr>\u003cspan class=\"en\" lang=\"en\">To bypass or circumvent (a problem or obstacle).\u003c/span>\u003cbr>\u003cspan class=\"en\" lang=\"en\">词典例句：If we can&#39;t fix this problem, we&#39;ll just have to work around it.\u003c/span>\u003c/p>\u003c/article>\u003cp class=\"source\">以上为所标版本中该词的全部义项，不因前面已展示当前义而删减源义项；并非所有词典的合并全集。源中未提供的例句、标签或用法不补造。英语释义保留源文本；中文是项目译释。WordNet义项按同义词集划分，可能含较少用义和近似义，例句可能使用同组其他词。\u003c/p>\u003c/details>\u003c/section>"},{"cardId":"V20261029-005","term":"working definition","kind":"supplemental-demo","writer":"v4-author","word":{"id":"V20261029-005","date":"2026-10-29","term":"working definition","ipa":"ˈwɝː.kɪŋ ˌdef.ɪˈnɪʃ.ən","pos":"noun phrase","meaning":"供当前团队一致使用、以后仍可修订的定义","chunk":"agree on a working definition","example":"Let us agree on a working definition of a critical defect.","level":"核心","gloss":"暂定定义","explanation":"供当前团队一致使用、以后仍可修订的定义","examples":[{"en":"Let us agree on a working definition of a critical defect.","zh":"我们先就重大缺陷的暂定定义达成一致。"},{"en":"Our working definition may change after the pilot.","zh":"我们的暂定定义可能在试点后改变。"}]},"context":{"text":"Let us agree on a working definition of a critical defect.","kind":"generated_example"},"dictionary":{"cardId":"V20261029-005","term":"working definition","sources":["https://dictionary.cambridge.org/dictionary/english/working","https://dictionary.cambridge.org/dictionary/english/definition","https://www.collinsdictionary.com/dictionary/english/working"],"context":"Let us agree on a working definition of a critical defect.","contextSenseId":"working definition-0","senses":[{"id":"working definition-0","pos":"名词短语〔可数〕","meaning":"当前采用、可继续修订的定义。","usage":"a working definition of something","example":{"en":"We adopted a working definition of fairness for the study.","zh":"研究中我们采用了一个暂定的公平定义。","kind":"authored_example"},"sourceUrls":["https://www.collinsdictionary.com/dictionary/english/working"]},{"id":"working-definition-component-0","pos":"working：形容词","meaning":"与工作有关的。","usage":"working hours / conditions","extended":true,"example":{"en":"The team discussed working hours.","zh":"团队讨论了工作时间。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/working"]},{"id":"working-definition-component-1","pos":"working：形容词","meaning":"正常运作的。","usage":"in working order; a working model","extended":true,"example":{"en":"The old radio is still in working order.","zh":"那台旧收音机仍能正常使用。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/working"]},{"id":"working-definition-component-2","pos":"working：形容词","meaning":"足够实际使用的。","usage":"a working knowledge of","extended":true,"example":{"en":"She has a working knowledge of Spanish.","zh":"她的西班牙语知识足以应付实际需要。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/working"]},{"id":"working-definition-component-3","pos":"working：形容词","meaning":"暂供当前工作采用、可继续修改的。","usage":"a working hypothesis / title","extended":true,"example":{"en":"The article still has a working title.","zh":"这篇文章仍用着暂定标题。","kind":"authored_example"},"sourceUrls":["https://www.collinsdictionary.com/dictionary/english/working"]},{"id":"working-definition-component-4","pos":"definition：名词〔可数〕","meaning":"词语或概念含义的说明。","usage":"a definition of","extended":true,"example":{"en":"The book gives a clear definition of energy.","zh":"书中给出了能量的清晰定义。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/definition"]},{"id":"working-definition-component-5","pos":"definition：名词〔不可数〕","meaning":"影像、声音等的清晰程度。","usage":"high definition; lack definition","extended":true,"example":{"en":"The image lacks definition.","zh":"这幅图像不够清晰。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/definition"]}],"bridgeText":"working 在这里强调可供当前工作使用。定义一旦足够支持讨论，就可以先作为共同起点，但仍能随新信息修订。因此 working definition 是“目前拿来用的定义”：它有实际用途和暂定性质，不是正在工作的定义，也不是随便猜一个说法。","writer":"v4-author"},"bridge":{"text":"working 在这里强调可供当前工作使用。定义一旦足够支持讨论，就可以先作为共同起点，但仍能随新信息修订。因此 working definition 是“目前拿来用的定义”：它有实际用途和暂定性质，不是正在工作的定义，也不是随便猜一个说法。","mode":"semantic","reason":"基础概念与当前用法存在明确现代联系。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"把 working definition 与 working hypothesis（工作假设）成对记：两者都能作为当前工作的依据。记搭配 agree on a working definition of X，检索时替换 X 即可，不必重新逐字翻译。","sources":[["用法依据：Collins · working","https://www.collinsdictionary.com/dictionary/english/working"]]},{"id":"g2","title":"句法与概念","text":"Let us agree on a working definition of a critical defect. 中 agree on 后接共同采用的内容，of a critical defect 说明要定义的对象。working 修饰 definition；critical 修饰 defect，两个修饰层次不能混在一起。","sources":[["结构依据：加拿大语言指南 · agree 的搭配","https://our-languages.canada.ca/en/writing-tips-plus/agree-on-agree-to-agree-with"],["语体依据：Oxford · let","https://www.oxfordlearnersdictionaries.com/definition/english/let_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"working definition 侧重当前可用而仍可修订；final definition 强调已定稿；operational definition 强调怎样识别或测量对象。一个定义可以同时是 working 和 operational，这不是互斥分类。","sources":[["Operational definition · APA Dictionary","https://dictionary.apa.org/operational-definition"]]},{"id":"g4","title":"这句话在做什么","text":"Let us agree on 是邀请共同确定判断标准，而不是直接宣布标准已有共识。可回应：Would a defect that stops production count as critical? 通过边界案例确认各人会不会把同一种情况归入同一类。","sources":[["概念依据：DePaul · 定义如何影响讨论范围","https://condor.depaul.edu/~tcole/Research_Methods/conceptu.htm"],["对话教法参考：BBC · Making suggestions","https://downloads.bbc.co.uk/worldservice/learningenglish/howto/suggesting.pdf"]]},{"id":"g5","title":"工作中可以这样说","text":"启动讨论可说：For now, let’s use this as our working definition of success.（目前先用它作为成功的暂定定义。）将 success 换成 readiness；若出现新证据，可接 We can revise it after the pilot.","sources":[["句型与回应：VOA · Making and Responding to Suggestions","https://learningenglish.voanews.com/a/making-and-responding-to-suggestions/4266045.html"],["句型依据：BBC · Making suggestions","https://downloads.bbc.co.uk/worldservice/learningenglish/howto/suggesting.pdf"]]}],"scenario":"例如讨论“严重缺陷”时，一人按停线判断，另一人按返工成本判断。先拿两个边界案例试用同一定义，再记录争议案例，试用结束后决定是否修订。这里的案例是教学假设，定义仍需团队明确同意。","exploration":[["有记录的历史用法","Etymonline 将 working 追溯到 work 的分词形容词用法；表示理论等“可作为开展工作的依据”的义项，至少在1849年已有记录。这是该义项的记录时间，不是 working definition 词组的诞生日期。","https://www.etymonline.com/word/working"]],"contextTakeaway":"先统一“什么算重大缺陷”，再按同一标准讨论。working definition 表明这套定义目前先用；Let us agree on… 是邀请大家一起把标准定下来。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"working definition-0\">\u003csmall>名词短语〔可数〕\u003c/small>\u003cp>\u003cstrong>当前采用、可继续修订的定义。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a working definition of something\u003c/p>\u003cp lang=\"en\">We adopted a working definition of fairness for the study.\u003c/p>\u003cp>研究中我们采用了一个暂定的公平定义。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.collinsdictionary.com/dictionary/english/working\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails>\u003csummary>更多常用及专业义（6）\u003c/summary>\u003carticle data-learner-sense=\"working-definition-component-0\">\u003csmall>working：形容词\u003c/small>\u003cp>\u003cstrong>与工作有关的。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>working hours / conditions\u003c/p>\u003cp lang=\"en\">The team discussed working hours.\u003c/p>\u003cp>团队讨论了工作时间。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/working\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"working-definition-component-1\">\u003csmall>working：形容词\u003c/small>\u003cp>\u003cstrong>正常运作的。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>in working order; a working model\u003c/p>\u003cp lang=\"en\">The old radio is still in working order.\u003c/p>\u003cp>那台旧收音机仍能正常使用。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/working\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"working-definition-component-2\">\u003csmall>working：形容词\u003c/small>\u003cp>\u003cstrong>足够实际使用的。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a working knowledge of\u003c/p>\u003cp lang=\"en\">She has a working knowledge of Spanish.\u003c/p>\u003cp>她的西班牙语知识足以应付实际需要。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/working\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"working-definition-component-3\">\u003csmall>working：形容词\u003c/small>\u003cp>\u003cstrong>暂供当前工作采用、可继续修改的。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a working hypothesis / title\u003c/p>\u003cp lang=\"en\">The article still has a working title.\u003c/p>\u003cp>这篇文章仍用着暂定标题。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://www.collinsdictionary.com/dictionary/english/working\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"working-definition-component-4\">\u003csmall>definition：名词〔可数〕\u003c/small>\u003cp>\u003cstrong>词语或概念含义的说明。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a definition of\u003c/p>\u003cp lang=\"en\">The book gives a clear definition of energy.\u003c/p>\u003cp>书中给出了能量的清晰定义。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/definition\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"working-definition-component-5\">\u003csmall>definition：名词〔不可数〕\u003c/small>\u003cp>\u003cstrong>影像、声音等的清晰程度。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>high definition; lack definition\u003c/p>\u003cp lang=\"en\">The image lacks definition.\u003c/p>\u003cp>这幅图像不够清晰。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/definition\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003c/details>\u003cdetails data-source-inventory>\u003csummary>完整来源词典与收录范围\u003c/summary>\u003cp>本补充示范为原创学习释义，未另行收录完整许可词典原文。逐义来源见上方，不宣称穷尽所有词典。\u003c/p>\u003c/details>\u003c/section>"},{"cardId":"WS20261031-001","term":"shift","kind":"supplemental-demo","writer":"v4-author","word":{"id":"WS20261031-001","date":"2026-10-31","term":"shift","ipa":"ʃɪft","pos":"noun","meaning":"本句指下一班次：供应商需要在下一班开始前拿到作业指导书。","chunk":"next shift","example":"The supplier needs a work instruction before the next shift.","level":"unspecified","gloss":"班次；一段当班时间","explanation":"本句指下一班次：供应商需要在下一班开始前拿到作业指导书。","examples":[{"en":"The supplier needs a work instruction before the next shift.","zh":"供应商需要在下一班开始前拿到作业指导书。"},{"en":"Please confirm the work instruction before the next shift.","zh":"请在下一班前确认作业指导书。"}],"exampleKinds":["generated_example","generated_example"]},"context":{"text":"The supplier needs a work instruction before the next shift.","kind":"generated_example"},"dictionary":{"cardId":"WS20261031-001","term":"shift","sources":["https://dictionary.cambridge.org/dictionary/english/shift"],"context":"The supplier needs a work instruction before the next shift.","contextSenseId":"shift-2","senses":[{"id":"shift-0","pos":"动词〔及物或不及物〕","meaning":"移动；转移；改变位置、方向或关注点。","usage":"shift something to; shift from A to B","example":{"en":"She shifted the chair closer to the table.","zh":"她把椅子移近桌子。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"]},{"id":"shift-1","pos":"名词〔可数〕","meaning":"位置、方向或状态的变化。","usage":"a shift in; a shift towards","example":{"en":"There has been a shift in public opinion.","zh":"公众意见发生了变化。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"]},{"id":"shift-2","pos":"名词〔可数〕","meaning":"轮班的一段工作时间，或该班的工作人员。","usage":"work a shift; the day / night shift","example":{"en":"The night shift starts at ten.","zh":"夜班十点开始。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"]},{"id":"shift-3","pos":"动词〔及物或不及物，美式〕","meaning":"换挡。","usage":"shift gears; shift into second","example":{"en":"Shift into second before the bend.","zh":"入弯前换到二挡。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"],"extended":true},{"id":"shift-4","pos":"动词〔及物，英式非正式〕","meaning":"移除；设法卖掉。","usage":"shift a stain; shift stock","example":{"en":"The shop cut prices to shift old stock.","zh":"商店降价以卖掉旧库存。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"],"extended":true},{"id":"shift-5","pos":"名词〔可数〕","meaning":"宽松直筒连衣裙。","usage":"a shift dress","example":{"en":"She wore a simple cotton shift.","zh":"她穿了一条简单的棉质直筒裙。","kind":"authored_example"},"sourceUrls":["https://dictionary.cambridge.org/dictionary/english/shift"],"extended":true}],"bridgeText":"shift 常表示从一个位置或状态转到另一个。轮班也可以借“工作由这一批接到下一批”来理解，shift 便指排定的一段班次或该班人员。这只是现代记忆联系，不证明词源顺序；before the next shift 在本句把下一班开始当作时间界点。","writer":"v4-author"},"bridge":{"text":"shift 常表示从一个位置或状态转到另一个。轮班也可以借“工作由这一批接到下一批”来理解，shift 便指排定的一段班次或该班人员。这只是现代记忆联系，不证明词源顺序；before the next shift 在本句把下一班开始当作时间界点。","mode":"lexicalized","reason":"轮班义单独学习；变化联系只作记忆提示，不声称历史推导。"},"groups":[{"id":"g1","title":"先记住，再联系","text":"记 on the night shift（上夜班）、start a shift（开始一班）和 change shifts（换班）。用 on 搭配所在班次，用 before 提示下一班开始前；不要把每个 shift 都翻成“变化”。","sources":[]},{"id":"g2","title":"句法与概念","text":"The supplier needs a work instruction before the next shift. 中 needs 的宾语是 a work instruction，before the next shift 是时间短语。本句说下一班之前需要有作业指导书；不是说指导书只能在该班使用。","sources":[]},{"id":"g3","title":"辨析与英文邻居","text":"shift 是排定的工作时段，也能指当班人员；schedule 是整体时间安排；handover 是交接过程。a shift change 是换班，a handover 可发生在换班时，也可发生在项目换负责人时。","sources":[]},{"id":"g4","title":"这句话在做什么","text":"needs 把指导书作为待满足的需求，before 给出时限。可追问：When does the next shift start? 然后确认谁提供文件；原句没有说明班次的具体时间，也没有指定由听者编写。","sources":[["爱尔兰 HSE · 轮班工作说明","https://healthservice.hse.ie/staff/health-and-safety/night-and-shift-workers/"]]},{"id":"g5","title":"工作中可以这样说","text":"交接前可说：Please send the updated instructions before the night shift starts.（请在夜班开始前发送更新后的说明。）换成 morning shift 就能调整时点；若问值班人员，用 Who is on the next shift?","sources":[]}],"scenario":"例如夜班22:00开始，供应商还需要提前培训操作员。仅在21:59发出文件未必来得及使用；可以进一步确认最晚接收时间。before the next shift 给出了班次界点，但没有自动涵盖接收、培训和确认所需的时间。","exploration":[["早期有“划分、安排”的意思","shift 可追溯到古英语 sciftan，包含划分、分配、安排等含义；后来也出现改变、替换和移动等用法。它不是最初就只表示现代中文的“转移”。","https://www.etymonline.com/word/shift"],["“班次”义如何出现","Etymonline 记录“工作时段”义在1809年已有用例，早期用于矿业，并提出轮换马匹的旧义或相关日耳曼语词可能有影响。历史路径不能确定成一条单线。","https://www.etymonline.com/word/shift"]],"contextTakeaway":"供应商需要在下一班开始之前拿到作业指导书。before the next shift 给出了截止点，但具体是几点，要看排班表。","dictionaryHtml":"\u003csection class=\"dictionary\">\u003ch2>词典 · 常用义与用法\u003c/h2>\u003carticle data-learner-sense=\"shift-0\">\u003csmall>动词〔及物或不及物〕\u003c/small>\u003cp>\u003cstrong>移动；转移；改变位置、方向或关注点。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>shift something to; shift from A to B\u003c/p>\u003cp lang=\"en\">She shifted the chair closer to the table.\u003c/p>\u003cp>她把椅子移近桌子。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/shift\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"shift-1\">\u003csmall>名词〔可数〕\u003c/small>\u003cp>\u003cstrong>位置、方向或状态的变化。\u003c/strong>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>a shift in; a shift towards\u003c/p>\u003cp lang=\"en\">There has been a shift in public opinion.\u003c/p>\u003cp>公众意见发生了变化。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/shift\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003carticle data-learner-sense=\"shift-2\">\u003csmall>名词〔可数〕\u003c/small>\u003cp>\u003cstrong>轮班的一段工作时间，或该班的工作人员。\u003c/strong> \u003cspan class=\"current\">当前用法\u003c/span>\u003c/p>\u003cdetails class=\"sense-details\">\u003csummary>用法、例句与来源\u003c/summary>\u003cp>work a shift; the day / night shift\u003c/p>\u003cp lang=\"en\">The night shift starts at ten.\u003c/p>\u003cp>夜班十点开始。\u003c/p>\u003cp class=\"source\">原创中文概述及自编例句 · \u003ca href=\"https://dictionary.cambridge.org/dictionary/english/shift\" target=\"_blank\" rel=\"noopener\">核对来源 1\u003c/a>\u003c/p>\u003c/details>\u003c/article>\u003cdetails>\u003csummary>更多常用及专业义（3）\u003c/summary>\u003carticle data-learner-sense=\"shift-3\">\u003csmall>动词〔及物或不及物，美式〕\u003c/small>\u003cp>\u003cstrong
