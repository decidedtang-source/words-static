solid #e6ebe2;min-width:0}.group:last-child{grid-column:1/-1}.num{font-size:12px;color:#85957e;margin-right:8px}.group p{font-size:15px;line-height:1.8}.examples{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 25px}.example{border-left:2px solid #b6c5a8;padding:5px 14px}.example p{font-size:15px}.example .zh{font-size:13px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid #e0e6da;padding-top:16px}.bottom small{color:#77836f;font-size:12px}.status{font-size:13px;min-height:22px;color:#526f4d}textarea{width:100%;min-height:100px;max-width:100%;font-size:14px}.mobile-select{display:none;max-width:180px}.footer{font-size:12px;color:#7c8877;margin-top:18px}.section-heading,.bridge{scroll-margin-top:16px}@media(max-width:760px){header{padding:12px 16px}.layout{display:block;padding:0 10px 28px}aside{display:none}.mobile-select{display:block}.draft{display:none}.sheet{padding:20px 17px}.entry-top{display:block}h1{font-size:29px}.entry-top .copy{margin-top:13px}.gloss{font-size:25px;margin-top:18px}.sense{grid-template-columns:1fr;gap:3px}.pos{display:inline;margin-left:8px}.context{padding:11px 12px}.bridge{padding:15px}.groups,.examples{grid-template-columns:1fr}.group:last-child{grid-column:auto}.group p{font-size:16px}.bottom{align-items:start;flex-direction:column}.section-heading span{display:none}.bridge-head{gap:8px}.switch{padding:7px 10px}.entry-top .copy button{font-size:13px}.footer{padding:0 5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><header><div class="brand">工作英语 <span class="draft"> / 阅读原型 · 新增讲解待审核</span></div><select class="mobile-select" aria-label="切换词条"></select></header><div class="layout"><aside><p>预览词条 · 05</p><nav></nav><p>词典 → 理解 → 运用</p></aside><main><div class="sheet" id="entry"></div><div class="footer">设计预览，不写入学习记录。词典及五区沿用 V3 候选；新增词义联系为原创教学草稿。<a href="https://memodocs.maimemo.com/docs/AXhuwXpfFibceakKPpdc6VbVnFc" target="_blank" rel="noopener">设计参考</a></div></main></div><script>
const cards=[{"w":{"id":"V20261012-001","date":"2026-10-12","term":"scope","ipa":"skoʊp","pos":"n.","meaning":"项目包含和不包含的工作范围","chunk":"define the scope","example":"We need to define the scope before estimating the cost.","level":"核心","gloss":"范围","explanation":"项目包含和不包含的工作范围","examples":[{"en":"We need to define the scope before estimating the cost.","zh":"估算成本前，我们需要界定范围。"},{"en":"The scope excludes staff training.","zh":"范围不包括员工培训。"}]},"a":{"context":{"text":"We need to define the scope before estimating the cost.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"先记“画边界”：这次做哪些，哪些先不做。把 define the scope（界定范围）和 out of scope（不在范围内）连起来记。例如，安装设备在范围内，培训暂不包含；这个画框的类比帮助记忆，不是词源。","requirements":{"anchor":"画边界","explanation":"这次做哪些","example":"安装设备在范围内","boundary":"不是词源"},"claimIds":["lexical","connection"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g2","title":"句法与概念","text":"本句可以分成两步：define the scope 是先把工作边界说清楚，before estimating the cost 是再估费用。before 后的 estimating 表示动作，这里做两件事的都是 we。“先后顺序”很重要：不知道要做多少工作，就难以估出相应成本。","requirements":{"anchor":"两步","explanation":"先把工作边界说清楚","example":"before estimating the cost","boundary":"做两件事的都是 we"},"claimIds":["lexical","syntax"],"sourceIds":["lex"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"]]},{"id":"g3","title":"辨析与英文邻居","text":"scope 问“这次包含什么”，objective 问“希望达到什么结果”。以培训项目为例，安排两场培训可写进范围，提高新人操作熟练度可作为目标；目标也可以直接写成要交付的成果。说 in scope / out of scope，是在判断某项工作是否包含其中。","requirements":{"anchor":"scope 问","explanation":"objective 问","example":"以培训项目为例","boundary":"目标也可以直接写成要交付的成果"},"claimIds":["lexical","contrast"],"sourceIds":["lex","contrast"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["Major differences between project scope and objectives","https://www.apm.org.uk/resources/find-a-resource/major-differences-between-project-scope-and-objectives/"]]},{"id":"g4","title":"这句话在做什么","text":"这句话在安排估价前的准备，不是在直接报价格。We need to 表明说话者认为这一步必要，before 把次序说清楚。自编回应：Does the scope include training?（范围包括培训吗？）问清这一项后，就能把相应培训工作算进或排除出估价。","requirements":{"anchor":"安排估价前的准备","explanation":"We need to","example":"Does the scope include training?","boundary":"不是在直接报价格"},"claimIds":["lexical","action"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]},{"id":"g5","title":"工作中可以这样说","text":"对方临时提出一项新任务时，可以先核对范围。自编：Is user training included in the scope?（用户培训包含在范围内吗？）把 user training 换成 installation 或 data migration，就能询问安装或数据迁移是否包含；先问是否包含，再讨论增加任务的安排。","requirements":{"anchor":"临时提出一项新任务","explanation":"先核对范围","example":"Is user training included in the scope?","boundary":"把 user training 换成"},"claimIds":["lexical","use"],"sourceIds":["lex","method"],"sources":[["scope — Cambridge Dictionary","https://dictionary.cambridge.org/dictionary/english/scope?topic=analysing-and-evaluating"],["What is scope management?","https://www.apm.org.uk/resources/what-is-project-management/what-is-scope-management/"]]}]},"p":{"displayGloss":"范围","focused":[{"entry":{"lemma":"scope","pos":"n.","senses":[{"id":"scope:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project","sourceIds":["lex","method"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"scope:current","glossZh":"项目包含和不包含的工作范围","definitionEn":"the work and results included in a project","sourceIds":["lex","method"]}}],"allEntries":[{"lemma":"scope","pos":"名词","senses":[{"id":"scope:opportunity","glossZh":"做某事的机会或发挥余地","definitionEn":"room or opportunity to do something","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"先说清做哪些工作，再估算费用。"},"x":{"short":"范围","cue":"当前用法","b":"把它想成这次工作要覆盖的边界：同样说“做测试”，只测功能还是也测性能，工作量会不同。谈费用前先说明 scope，双方才是在估同一件事。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[]}},{"w":{"id":"V20261012-016","date":"2026-10-12","term":"accountable","ipa":"əˈkaʊn.t̬ə.bəl","pos":"adj.","meaning":"需要对最终结果作出解释并承担责任的","chunk":"accountable for the outcome","example":"One person must be accountable for the final decision.","level":"提升","gloss":"须对结果负责的","explanation":"需要对最终结果作出解释并承担责任的","examples":[{"en":"One person must be accountable for the final decision.","zh":"必须有一个人对最终决定负责。"},{"en":"The director is accountable for quality.","zh":"总监须对质量负责。"}]},"a":{"context":{"text":"One person must be accountable for the final decision.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"先记“要负责，也要说得清”。联系 account for 在“解释原因”这个用法：能说明为什么这样做，就容易记起 accountable 的交代责任。它不是 account 的“银行账户”义；这个联系用于记忆，不是历史词源解释。","requirements":{"anchor":"要负责，也要说得清","explanation":"解释原因","example":"account for","boundary":"不是历史词源解释"},"claimIds":["lexical","connection"],"sourceIds":["lex"],"sources":[["Cambridge Business English Dictionary — accountable","https://assets.cambridge.org/97805211/22504/excerpt/9780521122504_excerpt.pdf"]]},{"id":"g2","title":"句法与概念","text":"be accountable for 后面说“对什么负责”：本句是 the final decision，最终决定。若写 accountable to the manager，则是“向谁交代”。must be 把它说成要求，One person 则要求本次明确一个人；换成别的团队，负责人安排要看实际制度。","requirements":{"anchor":"be accountable for","explanation":"对什么负责","example":"accountable to the manager","boundary":"本次明确一个人"},"claimIds":["lexical","syntax"],"sourceIds":["lex"],"sources":[["Cambridge Business English Dictionary — accountable","https://assets.cambridge.org/97805211/22504/excerpt/9780521122504_excerpt.pdf"]]},{"id":"g3","title":"辨析与英文邻居","text":"responsible for 和 accountable for 都可以谈责任，不能简单分成“干活的人”和“背锅的人”。假设你负责报告，responsible for the report 可以说明这是你的职责；accountable for the report 更把重点放在你需要说明报告及其问题。常见 hold someone accountable，就是要求某人承担并交代责任。","requirements":{"anchor":"都可以谈责任","explanation":"更把重点放在","example":"假设你负责报告","boundary":"不能简单分成"},"claimIds":["lexical","contrast"],"sourceIds":["lex","contrast"],"sources":[["Cambridge Business English Dictionary — accountable","https://assets.cambridge.org/97805211/22504/excerpt/9780521122504_excerpt.pdf"],["responsible — Synonyms","https://ahdictionary.com/word/search.html?q=responsible"]]},{"id":"g4","title":"这句话在做什么","text":"本句在要求明确最终决定由谁负责。must 表明这不是随意建议，One person 把责任人范围收紧，但句子还没指名。自编回应：Who will be accountable for that decision?（谁来对那个决定负责？）下一步是确认具体的人，而不是继续泛泛地说“团队负责”。","requirements":{"anchor":"要求明确最终决定由谁负责","explanation":"must 表明","example":"Who will be accountable for that decision?","boundary":"句子还没指名"},"claimIds":["lexical","action"],"sourceIds":["lex"],"sources":[["Cambridge Business English Dictionary — accountable","https://assets.cambridge.org/97805211/22504/excerpt/9780521122504_excerpt.pdf"]]},{"id":"g5","title":"工作中可以这样说","text":"交接工作、需要确认汇报关系时可以这样问。自编：Who am I accountable to for this project?（这个项目我需要向谁负责？）to 后接人，for 后接负责的事项；可以把 this project 换成 the budget，询问预算工作应向谁交代。","requirements":{"anchor":"交接工作","explanation":"to 后接人","example":"Who am I accountable to for this project?","boundary":"for 后接负责的事项"},"claimIds":["lexical","use"],"sourceIds":["lex","lesson"],"sources":[["Cambridge Business English Dictionary — accountable","https://assets.cambridge.org/97805211/22504/excerpt/9780521122504_excerpt.pdf"],["Accountability, Responsibility, Liability","https://learningenglish.voanews.com/a/accountability-responsibility-liability/7955472.html"]]}]},"p":{"displayGloss":"须对结果负责的","focused":[{"entry":{"lemma":"accountable","pos":"adj.","senses":[{"id":"accountable:current","glossZh":"需要对最终结果作出解释并承担责任的","definitionEn":"responsible for an action or result and required to explain it","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"accountable:current","glossZh":"需要对最终结果作出解释并承担责任的","definitionEn":"responsible for an action or result and required to explain it","sourceIds":["lex"]}}],"allEntries":[{"lemma":"accountability","pos":"同族名词","senses":[{"id":"accountability:responsibility","glossZh":"需要承担责任并说明所作所为的状态或制度","definitionEn":"responsibility that includes explaining actions and results","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"最终决定需要有明确的负责者。"},"x":{"short":"须对结果负责的","cue":"当前用法","b":"重点不只是“有人做了”，而是“谁需要交代这个决定及其理由”。别人问起为何这样决定时，被指定 accountable 的人要能说明。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[]}},{"w":{"id":"V20261012-055","date":"2026-10-12","term":"proposal","ipa":"prəˈpoʊ.zəl","pos":"n.","meaning":"供他人讨论或批准的建议方案","chunk":"review a proposal","example":"Please review the proposal before tomorrow's discussion.","level":"核心","gloss":"提案；建议方案","explanation":"供他人讨论或批准的建议方案","examples":[{"en":"Please review the proposal before tomorrow's discussion.","zh":"请在明天讨论前审阅提案。"},{"en":"The proposal includes a training budget.","zh":"提案包含培训预算。"}]},"a":{"context":{"text":"Please review the proposal before tomorrow's discussion.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记住“把方案摆到桌上，让别人考虑”。propose 是提出，proposal 是提出的建议或方案；工作中连着记 review a proposal（审阅提案）。摆到桌上的东西还要讨论，所以 proposal 本身不表示大家已经同意。","requirements":{"anchor":"把方案摆到桌上","explanation":"让别人考虑","example":"review a proposal","boundary":"不表示大家已经同意"},"claimIds":["lexical","connection"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g2","title":"句法与概念","text":"Please review the proposal 是“请审阅这份方案”，review 是要做的动作，the proposal 是对象。before tomorrow’s discussion 给出时间要求：审阅应在明天讨论前完成。读这句时抓“做什么＋什么时候”，就不会只看到 proposal 而漏掉会前准备。","requirements":{"anchor":"做什么＋什么时候","explanation":"审阅应在明天讨论前完成","example":"Please review the proposal","boundary":"漏掉会前准备"},"claimIds":["lexical","syntax"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g3","title":"辨析与英文邻居","text":"proposal 与 suggestion 都能表示建议。比如“改在周五开会”可以是一条 suggestion；把调整后的会议安排及理由整理给大家考虑，就常称 a proposal。区别是这里 proposal 更让人想到可审阅的方案，不是 suggestion 一定随意或 proposal 必须写成长文。常见搭配：submit a proposal（提交方案）。","requirements":{"anchor":"都能表示建议","explanation":"更让人想到可审阅的方案","example":"改在周五开会","boundary":"proposal 必须写成长文"},"claimIds":["lexical","contrast"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g4","title":"这句话在做什么","text":"明天要讨论这份方案，说话者希望大家先看过再来。Please review 是请对方审阅，before tomorrow’s discussion 把时间要求说清楚；这句话是在安排会前准备。自编回应：I’ll read it tonight and bring my questions tomorrow.（我今晚看，明天带着问题来。）这样既接下任务，也说明准备如何完成。","requirements":{"anchor":"明天要讨论这份方案","explanation":"安排会前准备","example":"I’ll read it tonight and bring my questions tomorrow.","boundary":"自编回应"},"claimIds":["lexical","action"],"sourceIds":["lex"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"]]},{"id":"g5","title":"工作中可以这样说","text":"方案只有做法、没有理由时，可以请对方补充依据。自编：Could you add the reasons for this change to the proposal?（你能把这次改动的理由补进方案吗？）需要费用信息时，把 the reasons for this change 换成 the estimated cost；明确缺哪项信息，别人更容易补齐。","requirements":{"anchor":"方案只有做法、没有理由","explanation":"请对方补充依据","example":"Could you add the reasons for this change to the proposal?","boundary":"把 the reasons for this change 换成"},"claimIds":["lexical","use"],"sourceIds":["lex","lesson"],"sources":[["proposal — Collins COBUILD","https://www.collinsdictionary.com/us/dictionary/english/proposal"],["Complete Advanced — Writing Part 2: A proposal","https://www.cambridge.org/sites/default/files/media/documents/Complete%20Advanced%203rd%20Ed%20Unit%205%20Sample.pdf"]]}]},"p":{"displayGloss":"提案；建议方案","focused":[{"entry":{"lemma":"proposal","pos":"n.","senses":[{"id":"proposal:current","glossZh":"供他人考虑的建议或方案","definitionEn":"an idea or plan offered for others to consider","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"proposal:current","glossZh":"供他人考虑的建议或方案","definitionEn":"an idea or plan offered for others to consider","sourceIds":["lex"]}}],"allEntries":[{"lemma":"proposal","pos":"名词","senses":[{"id":"proposal:marriage","glossZh":"求婚；提出结婚的请求","definitionEn":"a request asking someone to marry you","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"}],"contextTakeaway":"提案还在讨论阶段，审阅不等于批准。"},"x":{"short":"提案；建议方案","cue":"当前用法","b":"在工作讨论里，proposal 是拿出来请别人考虑的方案。它通常不只说“我有个想法”，还会说明准备做什么、为什么值得做，让别人有内容可以审阅和讨论。","quote":"","source":"原创教学转述；当前义、拆词义及讲解依据见本页来源与本批研究记录。","url":"research.md","c":[]}},{"w":{"id":"V20261012-067","date":"2026-10-12","term":"work around","ipa":"ˌwɝːk əˈraʊnd","pos":"短语动词","meaning":"在限制仍存在时找到可行做法","chunk":"work around a constraint","example":"Can we work around this constraint without changing the scope?","level":"提升","gloss":"设法绕过障碍","explanation":"在限制仍存在时找到可行做法","examples":[{"en":"Can we work around this constraint without changing the scope?","zh":"我们能在不改范围的情况下应对这项限制吗？"},{"en":"We worked around the storage limitation.","zh":"我们设法克服了存储限制。"}]},"a":{"context":{"text":"Can we work around this constraint without changing the scope?","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"用“路障没搬走，先换条路”来记。work around a problem 是设法绕开问题，a workaround 是那个变通办法：一个说动作，一个给办法起名字。路障只是帮助理解的类比，不是在说每次都要真的绕路。","requirements":{"anchor":"路障没搬走，先换条路","explanation":"一个说动作","example":"a workaround","boundary":"只是帮助理解的类比"},"claimIds":["lexical","connection"],"sourceIds":["lex"],"sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g2","title":"句法与概念","text":"Can we work around this constraint? 问“我们能找到变通办法吗？”without changing the scope 又加了一道条件：工作范围不能变。work around 要连起来理解，后面接要应对的限制；不能把 around 单独译成“在周围”，否则整句会变成在限制旁边工作。","requirements":{"anchor":"Can we work around this constraint?","explanation":"工作范围不能变","example":"without changing the scope","boundary":"不能把 around 单独译成"},"claimIds":["lexical","syntax"],"sourceIds":["lex","grammar"],"sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"],["Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"solve a problem 着眼于把问题解决；work around a problem 着眼于避开影响、让事情继续。自编对照：软件导出功能坏了，复制数据到别的工具继续做，是 workaround；修好导出功能，才是在解决这个故障。两种做法可以先后使用，并不互相排斥。","requirements":{"anchor":"solve a problem","explanation":"避开影响、让事情继续","example":"软件导出功能坏了","boundary":"并不互相排斥"},"claimIds":["lexical","contrast"],"sourceIds":["lex"],"sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g4","title":"这句话在做什么","text":"本句是在邀请大家找“范围不变”的可行办法。Can we 留出一起讨论的空间，without changing the scope 则把条件说清楚。自编回应：Could we split the work into smaller batches?（可以把工作分成更小批次吗？）这先提出一个候选做法，接下来再核对它是否满足那项限制。","requirements":{"anchor":"邀请大家找","explanation":"Can we 留出","example":"Could we split the work into smaller batches?","boundary":"候选做法"},"claimIds":["lexical","action"],"sourceIds":["lex"],"sources":[["work around — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/work-around"]]},{"id":"g5","title":"工作中可以这样说","text":"发送文件碰到单个文件大小限制时，可以说明具体的变通办法。自编：We could work around the file-size limit by sending separate files.（我们可以试着分开文件发送，来绕开大小限制。）by 后的 sending 说明怎么做；could 适合提出待尝试的办法，已经确认可行时可用 can。","requirements":{"anchor":"单个文件大小限制","explanation":"by 后的 sending","example":"We could work around the file-size limit by sending separate files.","boundary":"could 适合提出待尝试的办法"},"clai  a supplier.","kind":"existing_public_learning_example"},"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"借天平记：把好处和代价放上去比较。weigh 可以说称重量，也可以说衡量事情；weigh up the options 就把这种衡量用在几个选择上。这个图像是记忆联系，不是词源结论；真正要比较的可能是价格、时间或风险。","requirements":{"anchor":"借天平记","explanation":"把好处和代价放上去比较","example":"weigh up the options","boundary":"不是词源结论"},"claimIds":["lexical","connection"],"sourceIds":["lex"],"sources":[["weigh — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/weigh"]]},{"id":"g2","title":"句法与概念","text":"weigh up the options 是先比较选项，before choosing a supplier 是后选供应商。need to 表示说话者认为比较是必要步骤。up 在这里属于短语，不是“往上”；也可以说 weigh the options up，用 them 代替 options 时说 weigh them up。","requirements":{"anchor":"先比较选项","explanation":"before choosing a supplier","example":"weigh them up","boundary":"不是“往上”"},"claimIds":["lexical","syntax"],"sourceIds":["lex","grammar"],"sources":[["weigh — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/weigh"],["Phrasal verbs","https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/phrasal-verbs"]]},{"id":"g3","title":"辨析与英文邻居","text":"consider the options 是考虑选项；weigh up the options 更突出把利弊拿来衡量。例如甲便宜但慢，乙贵但快：weigh up 提醒我们比较两种得失。choose 则是作出选择。常见 weigh the benefits against the costs，是把收益与成本放在一起比较。","requirements":{"anchor":"consider the options","explanation":"更突出把利弊拿来衡量","example":"甲便宜但慢，乙贵但快","boundary":"choose 则是作出选择"},"claimIds":["lexical","contrast"],"sourceIds":["lex"],"sources":[["weigh — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/weigh"]]},{"id":"g4","title":"这句话在做什么","text":"这句话在提出一个选择前的步骤：先比，再定。We need to 明确提出要求，before choosing 把选择放在比较之后。自编回应：Let’s compare cost, quality and lead time first.（我们先比较成本、质量和交期吧。）回应把“权衡”落实成可讨论的标准；这些标准是例子，原句并没有列出它们。","requirements":{"anchor":"先比，再定","explanation":"before choosing","example":"Let’s compare cost, quality and lead time first.","boundary":"原句并没有列出它们"},"claimIds":["lexical","action"],"sourceIds":["lex"],"sources":[["weigh — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/weigh"]]},{"id":"g5","title":"工作中可以这样说","text":"需要说明一项改动是否值得做时，可以把两面的因素说出来。自编：We need to weigh the time saved against the extra cost.（我们需要权衡节省的时间和额外成本。）weigh A against B 是把两者放在一起衡量；可把两项换成 benefits 和 risks，用于收益与风险的讨论。","requirements":{"anchor":"改动是否值得做","explanation":"把两面的因素说出来","example":"We need to weigh the time saved against the extra cost.","boundary":"weigh A against B"},"claimIds":["lexical","use"],"sourceIds":["lex"],"sources":[["weigh — Oxford Advanced Learner’s Dictionary","https://www.oxfordlearnersdictionaries.com/definition/english/weigh"]]}]},"p":{"displayGloss":"权衡","focused":[{"entry":{"lemma":"weigh up","pos":"短语动词","senses":[{"id":"weigh-up:current","glossZh":"在决定前仔细比较选择及其利弊","definitionEn":"consider choices or their advantages and disadvantages carefully","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"weigh-up:current","glossZh":"在决定前仔细比较选择及其利弊","definitionEn":"consider choices or their advantages and disadvantages carefully","sourceIds":["lex"]}},{"entry":{"lemma":"weigh","pos":"动词 · 本句相关义","senses":[{"id":"weigh:consider","glossZh":"仔细考虑；衡量（up 与它构成当前表达，不译成“向上”）","definitionEn":"think carefully about something in preparation for a decision","sourceIds":["lex","grammar"]}],"source":"已核对来源的原创教学转述"},"sense":{"id":"weigh:consider","glossZh":"仔细考虑；衡量（up 与它构成当前表达，不译成“向上”）","definitionEn":"think carefully about something in preparation for a decision","sourceIds":["lex","grammar"]}}],"allEntries":[{"lemma":"weigh","pos":"动词","senses":[{"id":"weigh:measure","glossZh":"称重量；测出某人或某物有多重","definitionEn":"measure the weight of a person or thing","sourceIds":["lex"]}],"source":"已核对来源的原创教学转述"},{"lemma":"weigh somebody up","pos":"短语动词","senses":[{"id":"weigh-up:person","glossZh":"通过观察或交谈来判断一个人","definitionEn":"form a judgment of someone through observation or conv function render(){const {w,a,p,x}=cards[index];root.innerHTML='<div class="entry-top"><div><h1>'+esc(w.term)+'</h1><div class="meta">'+esc(w.pos||'词组')+(w.ipa?' · /'+esc(w.ipa)+'/':'')+'</div></div>'+copies()+'</div><p class="gloss">'+esc(p.displayGloss)+'</p><div class="chunk">'+(w.chunk?'常用搭配　'+esc(w.chunk):'整句学习 · 以当前语境为准')+'</div><div class="senses">'+p.focused.map(({entry,sense})=>'<div class="sense"><div class="word">'+esc(entry.lemma)+'<span class="pos">'+esc(pos[entry.pos]||entry.pos)+'</span></div><div><strong>'+esc(sense.glossZh)+'</strong><p class="en" lang="en">'+esc(sense.definitionEn)+'</p></div></div>').join('')+'</div><section class="bridge"><div class="bridge-head"><h2>词义与用法</h2><button id="depth" class="switch" aria-controls="bridge-content" aria-pressed="false">深入词义</button></div><div id="bridge-content"></div></section><div class="context"><div class="label">本句先记 · 自编学习例句</div><p class="sentence" lang="en">'+esc(a.context.text)+'</p><p class="zh">'+esc(w.examples?.find(e=>e.en===a.context.text)?.zh||'')+'</p><p class="takeaway">'+esc(p.contextTakeaway)+'</p></div><details><summary>更多词典义项 · '+p.allEntries.reduce((n,e)=>n+e.senses.length,0)+' 个已选义项</summary>'+p.allEntries.map(e=>'<article><h3>'+esc(e.lemma)+' <small>'+esc(pos[e.pos]||e.pos)+'</small></h3>'+e.senses.map(s=>'<p><strong>'+esc(s.glossZh)+'</strong><br><span class="en">'+esc(s.definitionEn)+'</span></p>').join('')+'</article>').join('')+'<p class="source">已核验的相关义项；中英文为原创教学转述，不是完整词典或词典原文。<a target="_blank" rel="noopener" href="research.md">本批来源与范围</a></p></details><div class="section-heading"><h2>读懂语境，再学会使用</h2><span>我们的 01—05 全流程解析</span></div><section class="groups">'+a.displayGroups.map((g,i)=>'<article class="group" data-group="'+esc(g.id)+'"><h3><span class="num">0'+(i+1)+'</span>'+esc(g.title)+'</h3><p>'+esc(g.text)+'</p>'+(g.sources||[]).map(([label,url])=>'<div class="source"><a target="_blank" rel="noopener" href="'+esc(url)+'">'+esc(label)+' ↗</a></div>').join('')+'</article>').join('')+'</section><div class="section-heading"><h2>学习例句</h2></div><div class="examples">'+(w.examples||[]).filter(e=>e.en!==a.context.text).map(e=>'<article class="example"><p lang="en">'+esc(e.en)+'</p><p class="zh">'+esc(e.zh)+'</p></article>').join('')+'</div><div class="bottom"><small>想继续深入？复制到你已有的 ChatGPT 项目。</small>'+copies()+'</div><div class="status" role="status"></div>';bridge();document.querySelector('#depth').onclick=()=>{deep=!deep;bridge()};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const text=(b.dataset.copy==='deep'?'【深析】':'')+w.term;try{await navigator.clipboard.writeText(text);document.querySelector('.status').textContent='已复制'}catch{const status=document.querySelector('.status');status.textContent='请手工复制：';const area=document.createElement('textarea');area.value=text;area.readOnly=true;area.setAttribute('aria-label','手工复制文本');status.append(area);area.focus();area.select();}});document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));document.querySelector('select').value=index;}
function choose(i){index=Number(i);deep=false;render();window.scrollTo(0,0)}cards.forEach(({w},i)=>{const name=w.term.length>55?'条件式排程句':w.term;const b=document.createElement('button');b.textContent=name;b.onclick=()=>choose(i);document.querySelector('nav').append(b);const o=document.createElement('option');o.value=i;o.textContent=name;document.querySelector('select').append(o)});document.querySelector('select').onchange=e=>choose(e.target.value);render();
