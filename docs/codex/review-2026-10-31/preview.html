<script id="preview-data" type="application/json">{"schema": "planning-preview-v1", "status": "PREVIEW_ONLY", "baselineMain": "cfa2ecc19fddf2fac7508c642f8580b1b5a85838", "source": {"name": "Open English Wordnet 2025", "url": "https://en-word.net/", "license": "CC BY 4.0 + Princeton WordNet notice", "snapshotId": "oewn:2025:094517cfd433d7f9", "sha256": "a78e8615e519ed24c9af58482159230f49c558be89104d8d511f3c7939ec5eb0", "changes": "Selected source senses; independently reviewed Chinese teaching summaries added; not official Chinese dictionary text."}, "notice": "所有中文释义、简析、教学词形和例句标签为本项目编辑内容。无真实客户记录。未核音标不补写。选义不是频率排名。全部内容仅供 Owner 审阅，不是生产候选放行。", "cases": [{"id": "A", "target": "shift", "context": "The supplier needs a work instruction before the next shift.", "meaning": "本句指下一班次：供应商需要在下一班开始前拿到作业指导书。", "cardId": null, "groups": [{"id": "g1", "title": "先记住，再联系", "text": "本句先记 shift＝班次。另一常见名词义是“变化”，动词可表示移动或转移。可用“换班时段／方向变化”帮助区分，但这只是记忆联系，不是词源解释。"}, {"id": "g2", "title": "句法与概念", "text": "before the next shift 是时间介词短语，shift 是名词，next 限定下一班。needs 表达需求；句中没有给出具体时刻，也没有说明指导书已经获批。"}, {"id": "g3", "title": "辨析与英文邻居", "text": "shift 指班次，handover 偏重交接活动，changeover 偏重转换或换线，不宜互换。work instruction、operator readiness、handover 可帮助讨论指导书和人员准备，均为教学关联。"}, {"id": "g4", "title": "这句话在做什么", "text": "在假设的生产准备沟通中，这句话把需求绑定到一个时间边界。可追问哪一班、谁提供哪版指导书；这些是可选澄清方向，不是句子隐含的正式责任指派。"}, {"id": "g5", "title": "工作中可以这样说", "text": "Please confirm the work instruction before the next shift.（请在下一班前确认作业指导书。）这是自编学习例句；confirm 在此仍需语境说明确认版本、内容还是批准状态。"}], "morphology": "shift → shifts；shifted；shifting（项目教学词形，非本包所附音标或词源证据）。", "gap": "本预览完整显示当前词典包的 shift 名词与动词共 4 个已选义项；并非 OEWN 全部义项或频率排序。", "contextKind": "generated_example", "shareClass": "public", "pronunciation": null, "dictionaryEntries": [{"id": "223a739affd6ab021c0688656fd61bb89d6992400de4386f8aecdf90c9dd7785", "lemma": "shift", "pos": "n", "sourceEntryId": "entries-s.json/shift/n", "release": "2025", "senses": [{"id": "shift%1:11:01::", "definitionEn": "a qualitative change", "glossZh": "性质上的变化", "sourceExamples": []}, {"id": "shift%1:28:00::", "definitionEn": "the time period during which you are at work", "glossZh": "班次；一段当班时间", "sourceExamples": []}], "source": "Open English Wordnet 2025"}, {"id": "5b738a6ecd447e24f561ed817d84b8fdfc53db54c659f6167e69a22fabbe9d1e", "lemma": "shift", "pos": "v", "sourceEntryId": "entries-s.json/shift/v", "release": "2025", "senses": [{"id": "shift%2:38:00::", "definitionEn": "change place or direction", "glossZh": "移动；改变位置或方向", "sourceExamples": ["Shift one's position"]}, {"id": "shift%2:30:03::", "definitionEn": "move from one setting or context to another", "glossZh": "转移到另一场景或语境", "sourceExamples": ["shift the emphasis", "shift one's attention"]}], "source": "Open English Wordnet 2025"}], "stageEvidence": {"Dictionary": {"refs": ["dictionaryEntries", "gap"]}, "Memory": {"refs": ["groups/g1"]}, "Semantic Connection": {"refs": ["groups/g1"]}, "Syntax": {"refs": ["groups/g2"]}, "Concept": {"refs": ["groups/g2"]}, "Contrast": {"refs": ["groups/g3"]}, "Language Game": {"refs": ["groups/g4"]}, "English Neighbors": {"refs": ["groups/g3"]}, "Pragmatic Action": {"refs": ["groups/g4"]}, "Workplace Use": {"refs": ["groups/g5"]}}, "copyOriginal": "shift", "copyDeep": "【深析】shift\n学习例句：The supplier needs a work instruction before the next shift.\n来源：项目自编教学例句", "releaseEligibility": "PREVIEW_ONLY_REQUIRES_OWNER_AND_RELEASE_GATES"}, {"id": "B", "target": "working definition", "context": "Let us agree on a working definition of a critical defect.", "meaning": "先约定一个可用于当前讨论和判断的“严重缺陷”定义；它可以是暂定的。", "cardId": "V20261029-005", "groups": [{"id": "g1", "title": "先记住，再联系", "text": "working definition 可记为“当前先拿来用的定义”。working 有实用、暂作依据、运转正常和用于某项活动等义；在这里与 definition 组合，不等于任何 working 都是 temporary。"}, {"id": "g2", "title": "句法与概念", "text": "working 是修饰 definition 的形容词；of a critical defect 说明要定义什么。Let us agree on… 是共同约定的提议，不是“大家已经同意”的报告。"}, {"id": "g3", "title": "辨析与英文邻居", "text": "tentative 强调暂未定案；formal 强调正式形式或地位；final 强调最终确定。working 强调当前可据以工作，几者并非总互斥。criteria、defect classification、working hypothesis、revision 可用于继续界定判据。"}, {"id": "g4", "title": "这句话在做什么", "text": "在假设的质量讨论中，说话人希望先建立共同判断基础，再推进讨论。可问边界案例与何时修订；不能由一句提议推导出客户批准、正式生效或组织授权。"}, {"id": "g5", "title": "工作中可以这样说", "text": "For now, use this working definition when classifying defects.（目前先按这个工作定义分类缺陷。）自编例句；for now 明示阶段性，后续是否修订仍需另说。"}], "morphology": "definition → definitions；working 在本词组中按形容词解读，不按进行时动词解读。", "gap": "完整显示现有包中 working 4 义、definition 2 义；组合解释是项目简析，不冒充整条词典定义。", "contextKind": "generated_example", "shareClass": "public", "pronunciation": null, "dictionaryEntries": [{"id": "9fd40d3b3c8a2a28b1acbe3770accd14ba29dd0fb1c17f4b952bb3440946c5f7", "lemma": "definition", "pos": "n", "sourceEntryId": "entries-d.json/definition/n", "release": "2025", "senses": [{"id": "definition%1:10:00::", "definitionEn": "a concise explanation of the meaning of a word or phrase or symbol", "glossZh": "定义；对词语或符号意义的简要说明", "sourceExamples": []}, {"id": "definition%1:07:00::", "definitionEn": "clarity of outline", "glossZh": "轮廓的清晰度", "sourceExamples": ["exercise had given his muscles superior definition"]}], "source": "Open English Wordnet 2025"}, {"id": "b81aa348e22416a20b9978db1fa709bbdeee49a62e6dd3118fe79f5d48b0d076", "lemma": "working", "pos": "a", "sourceEntryId": "entries-w.json/working/a", "release": "2025", "senses": [{"id": "working%5:00:00:practical:00", "definitionEn": "adequate for practical use; especially sufficient in strength or numbers to accomplish something", "glossZh": "实用的；足以用于实际工作的", "sourceExamples": ["the party has a working majority in the House", "a working knowledge of Spanish"]}, {"id": "working%5:00:00:impermanent:00", "definitionEn": "adopted as a temporary basis for further work", "glossZh": "暂定用作进一步工作基础的", "sourceExamples": ["a working draft", "a working hypothesis"]}, {"id": "working%5:00:00:functioning:00", "definitionEn": "(of e.g. a machine) performing or capable of performing", "glossZh": "正常运转的；能工作的", "sourceExample
