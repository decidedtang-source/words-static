const cards=[{"w":{"id":"V20261029-005","date":"2026-10-29","term":"working definition","ipa":"ˈwɝː.kɪŋ ˌdef.ɪˈnɪʃ.ən","pos":"noun phrase","meaning":"供当前团队一致使用、以后仍可修订的定义","chunk":"agree on a working definition","example":"Let us agree on a working definition of a critical defect.","level":"核心","gloss":"暂定定义","explanation":"供当前团队一致使用、以后仍可修订的定义","examples":[{"en":"Let us agree on a working definition of a critical defect.","zh":"我们先就重大缺陷的暂定定义达成一致。"},{"en":"Our working definition may change after the pilot.","zh":"我们的暂定定义可能在试点后改变。"}]},"a":{"cardId":"V20261029-005","contentRevision":2,"targetText":"working definition","context":{"text":"Let us agree on a working definition of a critical defect.","kind":"generated_example"},"memoryGloss":"先约定一个可用于当前讨论和判断的“严重缺陷”定义；它可以是暂定的。","dictionaryEntryIds":["9fd40d3b3c8a2a28b1acbe3770accd14ba29dd0fb1c17f4b952bb3440946c5f7","b81aa348e22416a20b9978db1fa709bbdeee49a62e6dd3118fe79f5d48b0d076"],"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"先把它想成“现在拿来用的定义”。写文章时，可以先取一个 working title，写完再决定是否换标题；讨论问题时，也可以先采用一个 working definition，遇到边界情况再完善。两者的共同点是：先有一个可用的起点，不必等到最终定稿才开始。这里的联系依据 Collins 的 working 用法作中文改写。","sources":[["用法依据：Collins · working","https://www.collinsdictionary.com/dictionary/english/working"]]},{"id":"g2","title":"句法与概念","text":"Let us agree on / a working definition / of a critical defect：我们来商定 / 一个当前采用的定义 / 说明什么算重大缺陷。agree on 后面是大家要共同确定的内容；of a critical defect 说明定义的对象。句子的重点是“先商定标准”，而不是“同意这个缺陷很严重”。日常讨论也可说 Let’s agree on…；完整的 Let us… 较正式。","sources":[["结构依据：加拿大语言指南 · agree 的搭配","https://our-languages.canada.ca/en/writing-tips-plus/agree-on-agree-to-agree-with"],["语体依据：Oxford · let","https://www.oxfordlearnersdictionaries.com/definition/english/let_1"]]},{"id":"g3","title":"辨析与英文邻居","text":"同一份定义，说 tentative，是强调“还未确定”；说 working，是强调“目前先采用”；说 final，是强调“已经定稿”。所以，还没定稿的定义，也可以作为今天讨论的 working definition。另一个实用区别：agree with you 是“赞同你的看法”，agree on a definition 是“就定义达成一致”。常用搭配还包括 apply the definition（按定义判断）和 revise the definition（修订定义）。以上是依据词义和搭配整理的教学对照。","sources":[["词义依据：Collins · tentative","https://www.collinsdictionary.com/us/dictionary/english/tentative"],["词义依据：Cambridge · final","https://dictionary.cambridge.org/dictionary/english/final"],["搭配对照：加拿大语言指南","https://our-languages.canada.ca/en/writing-tips-plus/agree-on-agree-to-agree-with"]]},{"id":"g4","title":"这句话在做什么","text":"这句话是在把讨论拉回共同标准。假设两人都说“重大缺陷”，却对严重外观问题是否算在内意见不同。先逐个争论案例，可能越谈越乱；先商定定义，才知道争议在哪里。自编对话：A: Let’s agree on a working definition first.（我们先商定一个当前采用的定义。）B: Should it include serious cosmetic defects?（要把严重外观缺陷算进去吗？）A: Let’s discuss that before we review the cases.（看案例前，我们先讨论这一点。）这里 A 发出提议，B 提出边界问题，A 将它纳入讨论；共同标准还在协商中。","sources":[["概念依据：DePaul · 定义如何影响讨论范围","https://condor.depaul.edu/~tcole/Research_Methods/conceptu.htm"],["对话教法参考：BBC · Making suggestions","https://downloads.bbc.co.uk/worldservice/learningenglish/howto/suggesting.pdf"]]},{"id":"g5","title":"工作中可以这样说","text":"想提出一个可讨论的方案：How about using this as our working definition?（我们先把这个作为当前采用的定义，怎么样？）想先检查定义是否合适：Could we test it against a few cases first?（我们能否先拿几个案例检验一下？）第二句没有直接拒绝，而是提出下一步。两句均为自编工作表达，借鉴 BBC、VOA 将建议与回应一起教的方法。句型可记为 How about + -ing，以及 Could we + 动词原形。","sources":[["句型与回应：VOA · Making and Responding to Suggestions","https://learningenglish.voanews.com/a/making-and-responding-to-suggestions/4266045.html"],["句型依据：BBC · Making suggestions","https://downloads.bbc.co.uk/worldservice/learningenglish/howto/suggesting.pdf"]]}],"stageEvidence":{"dictionary":{"refs":["dictionaryEntryIds","dictionaryEntryIds"],"applicability":"APPLICABLE"},"memory":{"refs":["g1"],"applicability":"APPLICABLE"},"semanticConnection":{"refs":["g1"],"applicability":"APPLICABLE"},"syntax":{"refs":["g2"],"applicability":"APPLICABLE"},"concept":{"refs":["g2"],"applicability":"APPLICABLE"},"contrast":{"refs":["g3"],"applicability":"APPLICABLE"},"languageGame":{"refs":["g4"],"applicability":"APPLICABLE"},"englishNeighbors":{"refs":["g3"],"applicability":"APPLICABLE"},"pragmaticAction":{"refs":["g4"]," s Dictionaries · working，第5义"}},{"w":{"id":"WS20261031-001","date":"2026-10-31","term":"shift","ipa":"","pos":"noun","meaning":"本句指下一班次：供应商需要在下一班开始前拿到作业指导书。","chunk":"next shift","example":"The supplier needs a work instruction before the next shift.","level":"unspecified","gloss":"班次；一段当班时间","explanation":"本句指下一班次：供应商需要在下一班开始前拿到作业指导书。","examples":[{"en":"The supplier needs a work instruction before the next shift.","zh":"供应商需要在下一班开始前拿到作业指导书。"},{"en":"Please confirm the work instruction before the next shift.","zh":"请在下一班前确认作业指导书。"}],"exampleKinds":["generated_example","generated_example"]},"a":{"cardId":"WS20261031-001","contentRevision":2,"targetText":"shift","context":{"text":"The supplier needs a work instruction before the next shift.","kind":"generated_example"},"memoryGloss":"本句指下一班次：供应商需要在下一班开始前拿到作业指导书。","dictionaryEntryIds":["223a739affd6ab021c0688656fd61bb89d6992400de4386f8aecdf90c9dd7785","5b738a6ecd447e24f561ed817d84b8fdfc53db54c659f6167e69a22fabbe9d1e"],"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记忆抓手：轮到你工作的那一班。时间义：My shift ends at two.（我这班两点结束。）人员义：The next shift is waiting outside.（下一班的人正在外面等。）均为自编例句。"},{"id":"g2","title":"句法与概念","text":"句法：The supplier 是主语；needs a work instruction 表示“需要一份作业指导书”；before the next shift 补充“在下一班之前”。概念：shift 是可数名词，可说 a shift、two shifts。本句把一个工作需求与排班时间连接起来。"},{"id":"g3","title":"辨析与英文邻居","text":"辨析：shift 是“哪一班”；handover 是“上一班向下一班交接信息或工作”的过程。上八小时班，不等于交接八小时。英文邻居：day shift（白班）、night shift（夜班）、work shifts（轮班工作）。另一个义项 a shift in priorities 指“优先事项的变化”，不能套用班次义。"},{"id":"g4","title":"这句话在做什么","text":"真实工作材料〔转述〕：爱尔兰 HSE 用“不同组人员接力做同一项工作”解释 shift work，并列举早班、晚班、夜班和轮换班。这个接力画面说明了为什么 next shift 有明确的时间边界。回到本句〔自编场景〕，说话人希望指导书在下一组开始工作前到位；可追问：Who needs the instruction, and by what time?（谁需要这份指导书，最晚几点？）","sources":[["爱尔兰 HSE · 轮班工作说明","https://healthservice.hse.ie/staff/health-and-safety/night-and-shift-workers/"]]},{"id":"g5","title":"工作中可以这样说","text":"工作表达〔自编〕：Please send the updated work instruction before the next shift starts at 2 m":"outcome framing","ipa":"ˈaʊt.kʌm ˈfreɪ.mɪŋ","pos":"noun phrase","meaning":"用结果和影响组织问题或建议的表达方式","chunk":"improve outcome framing","example":"Better outcome framing will help management see why the change matters.","level":"提升","gloss":"结果导向表述","explanation":"用结果和影响组织问题或建议的表达方式","examples":[{"en":"Better outcome framing will help management see why the change matters.","zh":"更好的结果导向表述能帮助管理层理解变更意义。"},{"en":"Outcome framing links the repair to safer operation.","zh":"结果导向表述将维修与更安全运行关联。"}]},"a":{"cardId":"V20261029-006","contentRevision":2,"targetText":"outcome framing","context":{"text":"Better outcome framing will help management see why the change matters.","kind":"generated_example"},"memoryGloss":"从预期结果的角度组织说明，让管理层看出变更为何重要。","dictionaryEntryIds":["2e8444cdf2c29dcdc710d010435b2d5bc060c809a65b31979baac8e34c143602","4ac923b3215f4cc9fde1a69740df725edbdbc3cca17a17f996c27540178a35ff","93042d54aa456527b0958f4ada07717fb2b93231b37e23049f10bf1706e45379","f2f6f733f036bb3b2d57c0b34299fa8e8cfdff48329f928b307555f6f6ef43cc"],"displayGroups":[{"id":"g1","title":"先记住，再联系","text":"记忆抓手：问一句“做完以后，谁会有什么改善？”例如“上线新表单”是在说做什么，“让客户更快提交申请”是在说期望的结果。例子为自编。"},{"id":"g2","title":"句法与概念","text":"句法：Better outcome framing 是主语，核心词是 framing；outcome 限定围绕什么来表达。help management see… 表示“帮助管理层看明白……”；why the change matters 是“为什么这项变更重要”。概念：讲清预期结果，与已经测得结果，是两回事。"},{"id":"g3","title":"辨析与英文邻居","text":"辨析：description 说明是什么、做什么；framing 关注从哪个角度表达；outcome measurement 则是测量结果。英文邻居：expected outcome（预期结果）、frame the proposal around…（围绕……组织提案）、measure the impact（衡量影响）。这些表达分别用于提出目标、组织说明和检查效果。"},{"id":"g4","title":"这句话在做什么","text":"真实文章〔转述〕：NN/g 用企业网站举例：制作白皮书和演示视频是产出，客户从中获得所需知识才是希望实现的结果。先问客户要知道什么，才能判断该做什么内容。这支持“从结果来组织说明”的思路，但不是 outcome framing 的整词词典定义。回到本句〔自编场景〕，说话人建议把管理层的注意力从变更动作引向预期价值；可追问：What will improve for the user?（用户会得到什么改善？）","sources":[["Nielsen Norman Group · 从成果出发的设计","https://www.nngroup.com/articles/outcomes-vs-features/"]]},{"id":"g5","title":"工作中可以这样说","text":"工作表达〔自编〕：Frame the proposal around the expected outcome: detecting defects before assembly.（围绕预期结果来组织提案：在装配前发现缺陷。）再接：We will check whether this reduces rework.（我们会检查这是否减少返工。）前一句讲目的，后一句讲如何验证。"}],"stageEvidence":{"dictionary":{"refs":["dictionaryEntryIds","dictionaryEntryIds"],"applicability":"APPLICABLE"},"memory":{"refs":["g1"],"applicability":"APPLICABLE"},"semanticConnection":{"refs":["g1"],"applicability":"APPLICABLE"},"syntax":{"refs":["g2"],"applicability":"APPLICABLE"},"concept":{"refs":["g2"],"applicability":"APPLICABLE"},"contrast":{"refs":["g3"],"applicability":"APPLICABLE"},"languageGame":{"refs":["g4"],"applicability":"APPLICABLE"},"englishNeighbors":{"refs":["g3"],"applicability":"APPLICABLE"},"pragmaticAction":{"refs":["g4"],"applicability":"APPLICABLE"},"workplaceUse":{"refs":["g5"],"applicability":"APPLICABLE"}},"coverage":{"dictionaryStatus":"REVIEWED_SELECTED_SENSES","analysisStatus":"REVIEWED","copyStatus":"READY","scope":"完整显示当前 frame n./v.、framing n.、outcome n. 的 7 个已选义项。framing 的词典“计划细节拟定”义不是本句全部含义；语境组织之义由 frame 的相关义及组合分析说明。","morphology":"frame → frames / framed / framing；-ing 形式的句法功能由所在句子决定。"},"copyPayload":{"displayText":"outcome framing","context":{"text":"Better outcome framing will help management see why the change matters.","kind":"generated_example"},"sourceLabel":"项目自编教学例句","shareClass":"public"},"presentation":{"version":1,"displayGloss":"结果框定；从结果角度组织问题的表达","glossKind":"compositional","contextTakeaway":"这里的 framing 是动词 frame（以某种方式组织、表述）的名词化 -ing 形式，指表达方式；下方以词根动词义作为组合依据，不冒充直接匹配的 framing 名词词条。目的是帮助管理层看见变更的意义，不是宣称变更已经有效。","contextSenseRefs":[{"entryId":"f2f6f733f036bb3b2d57c0b34299fa8e8cfdff48329f928b307555f6f6ef43cc","senseId":"outcome%1:11:00::","role":"component"},{"entryId":"93042d54aa456527b0958f4ada07717fb2b93231b37e23049f10bf1706e45379","senseId":"frame%2:32:00::","role":"component"}]}},"p":{"status":"reviewed","displayGloss":"结果框定；从结果角度组织问题的表达","glossKind":"compositional","contextTakeaway":"把“准备改什么”进一步讲成“这样改预计有什么用”，管理层才更容易理解变更的意义。原句说的是表达方式的改善，以及它预计能起到的帮助。","focused":[{"en
